<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Class Live beta</title>
<link rel="stylesheet" href="/beta/inter.css">
<style>
/* Layout idea: narrow icon rail on the left, one wide feed of nested, collapsible topics on the right. */
:root{
  --ink:#1D1D1F; --mut:#4A4A50; --line:#D2D2D7; --line2:#B8B8C0; --bg:#F5F5F7; --bar1:#E1E1E6; --bar2:#F5F5F7; --card:#FFFFFF;
  --rail:#FFFFFF; --railText:#1D1D1F; --railOn:#E3EEFF; --acc:#0A5BD8; --onacc:#FFFFFF; --lnk:#0A5BD8; --pill:#E3EEFF; --pillT:#14253F;
  --tint:#E3EEFF; --tintink:#14253F; --danger:#8C1D18; --bgg:none; --bar1g:none; --railg:none;
  --font:'Inter AeroLab',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--font);font-size:18px;line-height:1.5;color:var(--ink);background-color:var(--bg);background-image:var(--bgg);background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--lnk);outline-offset:2px}
.rail :focus-visible{outline-color:var(--railText)}
select:disabled{opacity:.6}
h1{margin:0;font-size:34px;line-height:1.2}

.mock{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:#1D1D1F;color:#fff}
.mock .lbl{font-weight:700}
.mock .note{color:#D2D2D7}
.seg{display:flex;gap:8px}
.seg button,.mock .reset{min-height:44px;padding:0 18px;border-radius:10px;border:1px solid #8E8E93;background:#2C2C2E;color:#fff}
.seg button[aria-pressed="true"]{background:#fff;color:#1D1D1F;border-color:#fff;font-weight:700}

.app{display:flex;align-items:stretch;flex:1}
#root{display:flex;flex-direction:column;min-height:100vh}
.rail{width:140px;flex:none;background-color:var(--rail);background-image:var(--railg);color:var(--railText);border-right:1px solid var(--line2);padding:12px 8px;display:flex;flex-direction:column;gap:6px;position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto}
.rail .brand{font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.ri{min-height:64px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;background:transparent;text-align:center;line-height:1.25;padding:4px}
.ri:hover{background:color-mix(in srgb,var(--railOn) 55%,transparent)}
.ri.on{background:var(--railOn);color:var(--railText);font-weight:700}
.rail .grow{flex:1}
.me{display:flex;flex-direction:column;align-items:center;gap:4px}
.av{width:56px;height:56px;border-radius:28px;background:var(--railOn);display:flex;align-items:center;justify-content:center;color:var(--railText)}
.signout{min-height:44px;border:1px solid var(--railText);border-radius:10px;background:transparent;color:var(--railText)}
.trail{width:220px}
.ti{min-height:48px;text-align:left;padding:0 16px;border-radius:10px;border:0;background:transparent;font-size:20px}
.ti:hover{background:#F0F0F4}
.ti.on{background:var(--tint);color:var(--tintink);font-weight:700}
.tlabel{font-weight:700;color:var(--mut);margin:12px 0 0 16px}

.main{flex:1;min-width:0;padding:28px 40px}
.wrap{max-width:1020px}
.headrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.callout{background:var(--tint);color:var(--tintink);border-radius:10px;padding:14px 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:8px}
.sec{margin-top:24px}
.sechead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.sechead h2{margin:0;font-size:28px;line-height:1.2}
.node{margin-bottom:12px}
.bar{display:flex;align-items:center;gap:8px;min-height:46px;padding-right:8px;border:1px solid var(--line2);border-radius:10px;background-color:var(--bar1);background-image:var(--bar1g)}
.bar.o{border-radius:10px 10px 0 0}
.tog{display:flex;align-items:center;gap:12px;flex:1;min-width:0;min-height:44px;padding:0 20px;background:none;border:0;border-radius:10px;text-align:left;font-size:24px;font-weight:700}
.nm{flex:1;min-width:0}
.ct{font-size:18px;font-weight:400;color:var(--mut)}
.b1b{padding:0 0 0 25px}
.hdr{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;min-height:50px;padding:0 20px;border-bottom:1px solid var(--line);font-size:20px;font-weight:600;background:var(--card)}
.hdr.dim{background:var(--bar2)}
.row.ind{padding-left:45px}
.n1>.bar{position:relative;z-index:60}
.n2>.bar{position:relative;z-index:50}
.n1>.bar.o{border-radius:10px;margin-bottom:12px}
.n2 .bar{background:var(--bar2);border-color:var(--line);min-height:48px}
.n2 .tog{min-height:48px;font-size:20px;font-weight:600;padding:0 16px}
.n2 .bar.o{border-radius:10px}
.rows{margin:0 0 12px 0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.rows>:last-child{border-bottom:0}
.dim>.bar{border-style:dashed}
.row{display:flex;align-items:center;flex-wrap:wrap;gap:8px 16px;min-height:50px;padding:0 20px;border-bottom:1px solid var(--line)}
.ico{width:36px;height:36px;flex:none;border-radius:10px;background:var(--pill);color:var(--pillT);display:flex;align-items:center;justify-content:center}
.grip{width:30px;height:36px;flex:none;border:0;border-radius:8px;background:none;color:var(--mut);cursor:grab;padding:0;display:flex;align-items:center;justify-content:center}
.grip:hover{background:var(--bar1)}
.bar .grip{margin-left:6px}
.row.ind .grip{margin-left:-25px}
.hdr .btn{font-weight:400;font-size:18px}
.dnd-before{box-shadow:inset 0 4px 0 var(--acc)}
.dnd-after{box-shadow:inset 0 -4px 0 var(--acc)}
.dnd-into{outline:3px solid var(--acc);outline-offset:-3px}
.dragging{opacity:.45}
.collapse-all .b1b{display:none}
.tred{grid-column:1/-1;background:var(--bar2);border:1px solid var(--line2);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:14px}
.role{display:flex;flex-direction:column;gap:6px}
.sws{display:flex;flex-wrap:wrap;gap:6px}
.sw{width:36px;height:36px;border-radius:8px;border:1px solid var(--mut);padding:0}
.sw[aria-pressed="true"]{outline:3px solid var(--lnk);outline-offset:2px}
.chk{font-weight:700}
.chk.bad{color:var(--danger)}
.link{background:none;border:0;padding:0;color:var(--lnk);text-decoration:underline;font-size:16px;text-align:left}
.det{color:var(--mut);font-size:16px}
.grow{flex:1}
.badge{padding:2px 12px;border-radius:12px;background:#FFE9B8;color:#4A3300}
.btn{min-height:44px;padding:0 18px;border:1px solid var(--mut);border-radius:10px;background:var(--card);color:var(--ink)}
.btn:hover{background:var(--bar1)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--onacc);font-weight:700}
.btn.pri:hover{background:var(--acc);filter:brightness(.9)}
.btn.on{background:var(--pill);border-color:var(--lnk);color:var(--pillT);font-weight:700}
.btn.danger{border-color:var(--danger);color:var(--danger)}
.btn.quiet{border:0;background:none;color:var(--lnk);text-decoration:underline;padding:0 8px}
.btnrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.addrow{margin-top:4px}
.notes{background:var(--bar2);border-bottom:1px solid var(--line);padding:20px 20px 20px 140px;display:flex;flex-direction:column;gap:12px}
.notecard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.notecard .txt{flex:1 1 100%}
.b{font-weight:700}
.right{display:flex;justify-content:flex-end}
.ed{background:var(--bar2);border:1px solid var(--line2);border-radius:10px;padding:16px;margin:8px 0;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
label{font-weight:700}
input,select,textarea{min-height:48px;padding:8px 14px;border:1px solid var(--mut);border-radius:10px;background:var(--card);width:100%}
textarea{min-height:96px;resize:vertical}
.warn{color:var(--danger);font-weight:700}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.dlg{background:var(--card);border-radius:14px;padding:28px;max-width:580px;width:100%;display:flex;flex-direction:column;gap:14px;max-height:90vh;overflow:auto}
.dlg h2{margin:0;font-size:26px}
.dlg ol{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:8px}
.ph{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px;max-width:720px;display:flex;flex-direction:column;gap:16px;margin-top:16px}

@media (max-width:760px){
  .main{padding:20px 16px}
  .rail{width:96px}
  .rail .brand{display:none}
  .trail{width:150px}
  .fields{grid-template-columns:1fr}
  .notes{padding:16px}
  .tog{font-size:20px}
}

.dim>.bar{background:var(--bg);border-style:dashed}
.dim .tog,.dim .link,.dim .nm,.dim .ct,.dim .det{color:var(--mut)}
.dim .link{text-decoration:line-through}
.row.dim{background:var(--bar2)}
.sec.dim .sechead h2{color:#5F5F68}
.tcards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
.tcard{display:flex;flex-direction:column;gap:8px;text-align:left;padding:12px;border:2px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink)}
.tcard[aria-pressed="true"]{border-color:var(--lnk);box-shadow:0 0 0 2px var(--lnk)}
.tw{display:flex;flex-direction:column;gap:8px}
.tw>.btn{align-self:flex-start}
.tcard .tn{font-weight:700;font-size:20px}
.tcard .tsel{font-size:16px;font-weight:700;color:var(--pillT);background:var(--pill);border-radius:10px;padding:0 10px;margin-left:8px}
.tprev{display:flex;height:84px;border:1px solid rgba(128,128,128,.5);border-radius:8px;overflow:hidden}
.tprev .tr{width:34px;flex:none}
.tprev .tm{flex:1;padding:8px;display:flex;flex-direction:column;gap:6px}
.tprev .tb1{height:20px;border:1px solid;border-radius:5px}
.tprev .tb2{height:20px;border:1px solid;border-radius:5px;margin-left:14px;display:flex;align-items:center;padding:0 6px}
.tprev .tb2 i{width:26px;height:8px;border-radius:4px;display:block}
@media (max-width:760px){.tcards{grid-template-columns:1fr}}
.tbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:10px 16px;background:#1D1D1F;color:#fff}
.tbar .lbl{font-weight:700}
.tbar .note{color:#D2D2D7}
.tbar a{color:#fff}
.tbar .btn{background:#2C2C2E;border-color:#8E8E93;color:#fff}
.tbar .btn.on{background:#fff;color:#1D1D1F;border-color:#fff}
.signin{max-width:440px;margin:12vh auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:32px;display:flex;flex-direction:column;gap:16px}
.signin h1{font-size:30px}
.err{color:var(--danger);font-weight:700}
.stage{position:fixed;inset:0;background:#111;z-index:30;display:flex;flex-direction:column}
.stage .top{display:flex;align-items:center;gap:16px;padding:10px 16px;background:#1D1D1F;color:#fff}
.stage .top .btn{background:#fff}
.stage iframe,.stage video{flex:1;width:100%;border:0;background:#000;min-height:0}
.empty{background:#fff;border:1px solid var(--line);border-radius:14px;padding:28px;max-width:720px;display:flex;flex-direction:column;gap:16px}
.sr{position:absolute;left:-9999px}
</style>
</head>
<body>
<div id="root"></div>
<script>
(function(){
'use strict';
var TYPE={sim:'Sim',video:'Video',lesson:'Lesson',practice:'Practice',exit:'Exit ticket',doc:'Document',header:'Header'};
var PILL={sim:'p-sim',video:'p-lesson',lesson:'p-lesson',practice:'p-practice',exit:'p-exit',doc:'p-practice'};
var ADD_TYPES=['sim','video','doc','practice','header'];
/* Practice activities: topic, then [key, name, page and section]. Keys are lowercase letters and digits so the server keeps them. */
var PRACTICE=[
 ['Periodic Table',[['ptsym','Element symbols','periodic.html#view=sym'],['ptgp','Group and period','periodic.html#view=gp'],['ptfam','Families','periodic.html#view=fam'],['ptcat','Metals, nonmetals, metalloids','periodic.html#view=cat'],['ptblk','Blocks','periodic.html#view=blk']]],
 ['Ionic compounds',[['charges','Ionic charges','ionic.html#go=charges'],['nfid','Polyatomic ions','ionic.html#go=nf_id'],['build','Building binary compounds','ionic.html#go=build'],
   ['scf2n','Naming single-charge compounds: formula to name','ionic.html#go=sc_f2n'],['scn2f','Naming single-charge compounds: name to formula','ionic.html#go=sc_n2f'],
   ['mvf2n','Naming multi-charge compounds: formula to name','ionic.html#go=mv_f2n'],['mvn2f','Naming multi-charge compounds: name to formula','ionic.html#go=mv_n2f'],
   ['polyf2n','Naming polyatomic compounds: formula to name','ionic.html#go=poly_f2n'],['polyn2f','Naming polyatomic compounds: name to formula','ionic.html#go=poly_n2f']]],
 ['Balancing',[]],
 ['Moles',[['mol1b','Counting atoms: beginner','moles.html#go=mol_1b'],['mol1a','Counting atoms: advanced','moles.html#go=mol_1a'],['mol2','Molar mass','moles.html#go=mol_2'],['mol3','Moles and grams','moles.html#go=mol_3']]]
];
(function(){
  var L=['Beginner','Intermediate','Advanced'],B=PRACTICE[2][1];
  [['syn','Synthesis'],['sr','Single replacement'],['dr','Double replacement']].forEach(function(r){L.forEach(function(l,i){B.push(['bal'+r[0]+(i+1),'Balancing '+r[1].toLowerCase()+': '+l.toLowerCase(),'balance.html#go=bal_'+r[0]+(i+1)]);});});
  [['pp','Single replacement from formulas'],['pdr','Double replacement from formulas'],['pn','Single replacement from names'],['pdn','Double replacement from names']].forEach(function(r){['Beginner','Advanced'].forEach(function(l,i){B.push(['bal'+r[0]+(i+1),'Predicting products, '+r[1].toLowerCase()+': '+l.toLowerCase(),'balance.html#go=bal_'+r[0]+(i+1)]);});});
})();
var PRACTICE_BY={};PRACTICE.forEach(function(g){g[1].forEach(function(x){PRACTICE_BY[x[0]]={id:x[0],name:x[1],href:'/practice/'+x[2],topic:g[0]};});});

var RAIL=[
  ['feed','Feed','<path d="M5 7h18M5 14h18M5 21h18"/>'],
  ['assigned','Assigned','<path d="M4 8l3 3 4-5M4 20l3 3 4-5M15 9h9M15 21h9"/>'],
  ['practice','Practice','<path d="M5 23l1-6L19 4l5 5-13 13z"/>'],
  ['exit','Exit tickets','<path d="M10 5H5v18h5M13 14h11M19 9l5 5-5 5"/>'],
  ['progress','Progress','<path d="M6 23V13M14 23V5M22 23v-7"/>'],
  ['chat','Class chat','<path d="M4 6h20v13H12l-5 5v-5H4z"/>']
];
var LABELS={assigned:'Assigned',practice:'Practice',exit:'Exit tickets',progress:'Progress',chat:'Class chat',settings:'Settings'};

function store(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function rnd(n){var a=new Uint8Array(n||8);crypto.getRandomValues(a);return Array.prototype.map.call(a,function(b){return 'abcdefghijkmnpqrstuvwxyz23456789'[b%32];}).join('');}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function tri(o){return o?'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5l5 6 5-6z" fill="currentColor"/></svg>':'<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3l6 5-6 5z" fill="currentColor"/></svg>';}
var TYPE_ICON={
 sim:'<path d="M9 3h6M10 3v6L5 19a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 19l-5-10V3"/><path d="M7.5 15h9"/>',
 video:'<rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9l5 3-5 3z"/>',
 doc:'<path d="M6 3h8l5 5v13H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>',
 link:'<path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/>',
 lesson:'<path d="M4 5a2 2 0 0 1 2-2h13v16H6a2 2 0 0 0-2 2z"/><path d="M4 19V5"/>',
 practice:'<path d="M4 20l1-4L16 5a2 2 0 0 1 3 3L8 19z"/>',
 exit:'<path d="M14 4h5v16h-5"/><path d="M10 8l-4 4 4 4M6 12h10"/>'};
var TYPE_NAME={sim:'Simulation',video:'Video',doc:'Document',link:'Link',lesson:'Lesson',practice:'Practice',exit:'Exit ticket'};
function typeIcon(it){
  var k=it.type==='doc'&&it.url?'link':it.type,nm=TYPE_NAME[k]||k;
  return '<span class="ico" role="img" aria-label="'+esc(nm)+'" title="'+esc(nm)+'"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+(TYPE_ICON[k]||TYPE_ICON.doc)+'</svg></span>';
}
var GRIP='<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><circle cx="6" cy="4" r="1.6"/><circle cx="12" cy="4" r="1.6"/><circle cx="6" cy="9" r="1.6"/><circle cx="12" cy="9" r="1.6"/><circle cx="6" cy="14" r="1.6"/><circle cx="12" cy="14" r="1.6"/></svg>';
function gripBtn(id,what){return '<button class="grip" id="gr-'+id+'" data-grip="'+id+'" aria-label="Move '+esc(what)+'. Drag it, or press the up or down arrow key." title="Drag to move">'+GRIP+'</button>';}
function icon(p){return '<svg width="28" height="28" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+p+'</svg>';}

  return c;
}

  var rlE=gradEnd(t.rail,t.acc,0.28,[t.railText]);
  return {bg:'linear-gradient(165deg,'+t.bg+' 0%,'+bgE+' 100%)',topic:'linear-gradient(90deg,'+t.topic+' 0%,'+tpE+' 100%)',rail:'linear-gradient(180deg,'+t.rail+' 0%,'+rlE+' 100%)'};
}

  var o=Object.assign({},base,e);
  var best=function(bg){var b='#FFFFFF',bc=0;['#FFFFFF','#111111',e.text].forEach(function(c){var k=contrast(c,bg);if(k>bc){bc=k;b=c;}});return b;};

  o.tline=mixHex(e.topic,e.text,0.35);o.line=mixHex(e.card,e.text,0.2);o.sub=mixHex(e.bg,e.topic,0.5);

function groupKey(t){return t.id.split('-')[0];}
function paletteFor(t){
  var g=groupKey(t),seen={},list=[];
  THEMES.forEach(function(x){if(groupKey(x)!==g)return;['bg','rail','railOn','topic','tline','sub','card','line','text','muted','acc','pill','pillT','railText','onacc'].forEach(function(k){var c=x[k].toUpperCase();if(!seen[c]){seen[c]=1;list.push(c);}});});
  (EXTRA_PAL[g]||[]).forEach(function(c){if(!seen[c]){seen[c]=1;list.push(c);}});
  list.sort(function(a,b){return lum(b)-lum(a);});

  var lnk=[t.acc,t.pillT,t.tline,t.text].filter(function(c){return contrast(c,t.card)>=4.5&&contrast(c,t.bg)>=4.5;})[0]||t.text;

  var v={ink:t.text,mut:t.muted,line:t.line,line2:t.tline,bg:t.bg,bar1:t.topic,bar2:t.sub,card:t.card,rail:t.rail,railText:t.railText,railOn:t.railOn,acc:t.acc,onacc:t.onacc,lnk:lnk,pill:t.pill,pillT:t.pillT,tint:t.pill,tintink:t.pillT,danger:dark?'#FF9C94':'#8C1D18'};

var tt=store('cl_token'), stoken=store('cl_stoken');
var S={mode:'loading',teacher:false,view:'student',rail:'feed',tree:[],rev:0,open:{},notes:{},notesOpen:{},noteErr:{},editor:null,confirm:null,modal:null,focus:null,lib:{sim:[],video:[],doc:[],practice:Object.keys(PRACTICE_BY).map(function(k){return PRACTICE_BY[k];})},libOk:false,saveMsg:'',signErr:'',stage:null};

function api(path,opt){
  opt=opt||{};opt.headers=Object.assign({},opt.headers||{});
  if(tt)opt.headers['x-token']=tt;
  if(opt.body&&!opt.headers['content-type'])opt.headers['content-type']='application/json';
  return fetch(path,opt).then(function(r){return r.json().catch(function(){return {};}).then(function(d){if(!r.ok){var e=new Error(d.error||('Error '+r.status));e.status=r.status;throw e;}return d;});});
}
function saveOpen(){store('cl_beta_open',JSON.stringify(S.open));}

/* ---------- loading ---------- */
function loadFeed(){
  return api('/api/feed').then(function(r){S.tree=r.tree||[];S.rev=r.rev||0;S.teacher=!!r.teacher;if(!S.teacher&&tt){tt=null;store('cl_token',null);}});
}
function loadNotes(){
  if(!stoken)return Promise.resolve();
  return api('/api/mynotes?stoken='+encodeURIComponent(stoken)).then(function(r){S.notes=r.notes||{};}).catch(function(e){if(e.status===401){stoken=null;store('cl_stoken',null);}});
}
function loadThemeEdits(){
  return api('/api/themes').then(function(r){THEME_EDITS=r.edits||{};themeId=applyTheme(themeId);}).catch(function(){});
}
function loadTheme(){
  if(!stoken||S.teacher)return Promise.resolve();
  return api('/api/mytheme?stoken='+encodeURIComponent(stoken)).then(function(r){
    if(r.theme&&themeById(r.theme).id===r.theme){themeId=applyTheme(r.theme);store('cl_beta_theme',themeId);}
  }).catch(function(){});
}
function loadLib(){
  if(!S.teacher)return Promise.resolve();
  return Promise.all([api('/api/sims').catch(function(){return [];}),api('/api/videos').catch(function(){return {videos:[]};}),api('/api/docs').catch(function(){return {docs:[]};})]).then(function(a){
    S.lib.sim=(Array.isArray(a[0])?a[0]:[]).map(function(x){return {id:x.id,name:x.name};});
    S.lib.video=((a[1]&&a[1].videos)||[]).map(function(x){return {id:x.id,name:x.name};});
    S.lib.doc=((a[2]&&a[2].docs)||[]).map(function(x){return {id:x.id,name:x.name};});
    S.libOk=true;
  });
}
function start(){
  loadFeed().then(function(){return Promise.all([loadNotes(),loadLib(),loadThemeEdits().then(loadTheme)]);}).then(function(){
    if(S.teacher){S.mode='app';S.view='teacher';}
    else if(stoken){S.mode='app';}
    else S.mode='signin';
    render();
  }).catch(function(){S.mode='error';render();});
}

/* ---------- saving the feed (teacher) ---------- */
var inflight=false,dirty=false;
function persist(){
  if(!S.teacher)return;
  if(inflight){dirty=true;return;}
  inflight=true;setSaveMsg('Saving…');
  api('/api/feed',{method:'PUT',body:JSON.stringify({tree:S.tree})}).then(function(r){S.rev=r.rev;setSaveMsg('Saved. Students see this now.');}).catch(function(e){
    setSaveMsg('Could not save: '+e.message+'. Your last change is not on the student page yet.');
    if(e.status===401){tt=null;store('cl_token',null);}
  }).then(function(){inflight=false;if(dirty){dirty=false;persist();}});
}
function setSaveMsg(m){S.saveMsg=m;var e=document.getElementById('savemsg');if(e)e.textContent=m;}

/* ---------- tree helpers ---------- */
function locate(id){
  for(var j=0;j<S.tree.length;j++){var t=S.tree[j];
    if(t.id===id)return {node:t,kind:'topic',arr:S.tree,idx:j};
    for(var m=0;m<t.items.length;m++){var x=t.items[m];
      if(x.id===id)return {node:x,kind:'item',arr:t.items,idx:m};}}
  return null;
}

/* ---------- render ---------- */
var root=document.getElementById('root');
var reduce=window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;
var pendingIn=null,busy=false;
function slide(el,dir,done){
  var kids=el?Array.prototype.slice.call(el.children):[];
  if(!el||reduce||!kids.length){if(done)done();return;}
  var n=kids.length,H=el.offsetHeight,inn=dir==='in',opt={duration:250,easing:inn?'ease-out':'ease-in',fill:'both'};
  var b=el.previousElementSibling,reach=(b&&b.classList.contains('bar')?b.offsetHeight:56)+14;
  el.style.position='relative';el.style.overflow='visible';
  el.style.clipPath='inset(-'+reach+'px -12px -4000px -12px)';
  kids.forEach(function(c,i){
    c.style.position='relative';c.style.zIndex=String(n-i);
    var d=c.offsetTop+c.offsetHeight+12,up={transform:'translateY(-'+d+'px)'},dn={transform:'none'};
    c.animate(inn?[up,dn]:[dn,up],opt);
  });
  var an=el.animate(inn?[{height:'0px'},{height:H+'px'}]:[{height:H+'px'},{height:'0px'}],opt);
  an.onfinish=function(){
    el.style.position='';el.style.overflow='';el.style.clipPath='';
    if(inn)kids.forEach(function(c){c.style.position='';c.style.zIndex='';});
    if(done)done();
  };
}
function render(){
  var y=window.scrollY;
  if(S.mode==='loading'){root.innerHTML='<div class="signin"><h1>Class Live beta</h1><div>Loading…</div></div>';return;}
  if(S.mode==='error'){root.innerHTML='<div class="signin"><h1>Class Live beta</h1><div class="err" role="alert">The page could not load. Check your connection and refresh.</div></div>';return;}
  if(S.mode==='signin'){root.innerHTML=signInHtml();var c=document.getElementById('code');if(c)c.focus();return;}
  var t=S.teacher&&S.view==='teacher';
  var main=S.rail==='feed'?feedPage(t):S.rail==='settings'?settingsPage():S.rail==='practice'?practicePage():placeholder();
  root.innerHTML=bar()+'<div class="app">'+rail()+'<main class="main">'+main+'</main></div>'+modalHtml()+stageHtml();
  window.scrollTo(0,y);
  root.querySelectorAll('[data-dnd]').forEach(function(el){el.setAttribute('draggable','true');});
  if(pendingIn){slide(root.querySelector('[data-panel="'+pendingIn+'"]'),'in');pendingIn=null;}
  if(S.focus){var el=document.getElementById(S.focus);if(el)el.focus();S.focus=null;}
  saveOpen();
}
function val(id){var e=document.getElementById(id);return e?e.value:'';}
function snapshotForm(){
  if(document.getElementById('f-title')){var ty=document.getElementById('f-type');return {type:ty?ty.value:'',ref:val('f-choose'),title:val('f-title'),detail:val('f-detail'),url:val('f-url').trim()};}
  if(document.getElementById('f-name'))return {name:val('f-name')};
  return null;
}
function fieldsErr(v,strict){
  if(!v.title.trim())return 'Give it a title.';
  if(v.type==='header')return '';
  if(v.type==='doc'){
    if(v.url){if(!/^https:\/\/[^\s"'<>]+$/i.test(v.url))return 'The link has to start with https:// and have no spaces.';return '';}
    if(!(S.lib.doc||[]).some(function(z){return z.id===v.ref;}))return 'Upload a file, choose one, or paste a link.';
    return '';
  }
  if(strict&&!(S.lib[v.type]||[]).some(function(z){return z.id===v.ref;}))return 'Choose which one to add. Upload it on the teacher page first if the list is empty.';
  return '';
}
function applyFields(node,v){
  node.type=v.type;node.title=v.title.trim();
  if(v.type==='header'){delete node.detail;delete node.ref;delete node.url;return;}
  node.detail=v.detail.trim();
  if(v.type==='doc'){if(v.url){node.url=v.url;delete node.ref;}else{node.ref=v.ref;delete node.url;}return;}
  delete node.url;
  if((S.lib[v.type]||[]).some(function(z){return z.id===v.ref;}))node.ref=v.ref;
}

/* ---------- actions ---------- */
function act(a,id,x){
  var l,E=S.editor,changed=false;
  switch(a){
    case 'view':S.view=x;S.rail='feed';S.editor=null;S.modal=null;S.confirm=null;break;
    case 'rail':S.rail=x;S.editor=null;S.confirm=null;S.themeEd=null;break;
    case 'signout':
      api('/api/slogout',{method:'POST',body:JSON.stringify({token:stoken})}).catch(function(){}).then(function(){stoken=null;store('cl_stoken',null);store('cl_beta_name',null);S.notes={};S.mode='signin';render();});
      return;
    case 'tog':
      if(busy)return;
      if(S.open[id]){
        var pe=root.querySelector('[data-panel="'+id+'"]');
        if(pe&&!reduce){busy=true;slide(pe,'out',function(){busy=false;S.open[id]=false;S.focus='tog-'+id;render();});return;}
        S.open[id]=false;
      }else{S.open[id]=true;pendingIn=id;}
      S.focus='tog-'+id;break;
    case 'theme':
      themeId=applyTheme(id);store('cl_beta_theme',themeId);S.focus='th-'+themeId;
      if(stoken&&!S.teacher)api('/api/mytheme',{method:'POST',body:JSON.stringify({stoken:stoken,theme:themeId})}).catch(function(){});
      break;
    case 'tedit':{
      var bt=themeById(id),et=eff(bt);
      S.themeEd={id:id,roles:{bg:et.bg,rail:et.rail,topic:et.topic,card:et.card,acc:et.acc,text:et.text},err:''};S.focus='te-'+id;break;}
    case 'pickc':if(S.themeEd){S.themeEd.roles[id]=x;S.themeEd.err='';}break;
    case 'tcancel':S.focus=S.themeEd?'te-'+S.themeEd.id:null;S.themeEd=null;break;
    case 'tsave':case 'treset':{
      var TE=S.themeEd;if(!TE)return;
      var prev=THEME_EDITS[TE.id];
      if(a==='treset')delete THEME_EDITS[TE.id];else THEME_EDITS[TE.id]=Object.assign({},TE.roles);
      api('/api/themes',{method:'PUT',body:JSON.stringify({edits:THEME_EDITS})}).then(function(rr){
        THEME_EDITS=rr.edits||{};themeId=applyTheme(themeId);S.focus='te-'+TE.id;S.themeEd=null;render();
      }).catch(function(er){if(prev)THEME_EDITS[TE.id]=prev;else delete THEME_EDITS[TE.id];TE.err='Could not save: '+er.message;render();});
      return;}
    case 'notes':S.notesOpen[id]=!S.notesOpen[id];S.focus=S.notesOpen[id]?'nt-'+id:null;break;
    case 'saveNote':{
      var tx=val('nt-'+id).trim();if(!tx)return;
      S.noteErr[id]='';
      api('/api/mynotes',{method:'POST',body:JSON.stringify({stoken:stoken,op:'add',item:id,text:tx})}).then(function(r){S.notes=r.notes;S.focus='nt-'+id;render();}).catch(function(e){S.noteErr[id]=e.message;render();});
      return;}
    case 'delNote':
      api('/api/mynotes',{method:'POST',body:JSON.stringify({stoken:stoken,op:'del',item:id,id:x})}).then(function(r){S.notes=r.notes;render();}).catch(function(e){S.noteErr[id]=e.message;render();});
      return;
    case 'open':{
      l=locate(id);if(!l)return;
      var it=l.node;
      if((it.type==='sim'||it.type==='video')&&it.ref){S.stage={type:it.type,ref:it.ref,title:it.title};S.focus='stage-back';}
      else{S.modal={id:id};S.focus='dlg-close';}
      break;}
    case 'closeStage':S.stage=null;break;
    case 'closeModal':S.modal=null;break;
    case 'closeBg':return;
    case 'edit':{
      l=locate(id);S.confirm=null;
      S.editor={mode:'edit',id:id,v:null,err:''};
      S.focus=l.kind==='item'?'f-title':'f-name';break;}
    case 'cancel':{var back=E&&E.mode==='edit'?'ed-'+E.id:null;S.editor=null;S.confirm=null;S.focus=back;break;}
    case 'saveEdit':{
      l=locate(E.id);var v=snapshotForm();
      if(l.kind==='item'){
        if(!v.type)v.type=l.node.type;
        var er=fieldsErr(v,false);
        if(er){E.v=v;E.err=er;S.focus='f-title';break;}
        applyFields(l.node,v);
      }else{
        if(!v.name.trim()){E.v=v;E.err='Give it a name.';S.focus='f-name';break;}
        l.node.name=v.name.trim();
      }
      changed=true;S.focus='ed-'+E.id;S.editor=null;S.confirm=null;break;}
    case 'add':S.editor={mode:'add',parent:id,pk:x,v:null,err:''};S.confirm=null;S.focus=x==='topic'?'f-title':'f-name';break;
    case 'saveAdd':{
      var v2=snapshotForm(),arr,node,nid=rnd(8);
      if(E.pk==='topic'){
        var er2=fieldsErr(v2,true);
        if(er2){E.v=v2;E.err=er2;S.focus='f-title';break;}
        node={id:nid,visible:true};applyFields(node,v2);
        l=locate(E.parent);arr=l.node.items;S.open[E.parent]=true;
      }else{
        if(!v2.name.trim()){E.v=v2;E.err='Give it a name.';S.focus='f-name';break;}
        node={id:nid,name:v2.name.trim(),visible:true,items:[]};
        arr=S.tree;S.open[nid]=true;
      }
      arr.push(node);
      changed=true;S.editor=null;break;}
    case 'up':case 'down':{
      l=locate(id);var j=l.idx+(a==='up'?-1:1);
      if(j>=0&&j<l.arr.length){var tmp=l.arr[l.idx];l.arr[l.idx]=l.arr[j];l.arr[j]=tmp;changed=true;}
      S.focus='ed-'+id;S.editor=null;break;}
    case 'vis':l=locate(id);l.node.visible=l.node.visible===false;changed=true;S.focus='ed-'+id;S.editor=null;break;
    case 'del':S.confirm=id;break;
    case 'delNo':S.confirm=null;break;
    case 'delYes':l=locate(id);l.arr.splice(l.idx,1);changed=true;S.editor=null;S.confirm=null;break;
  }
  if(changed)persist();
  render();
}

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-a]');
  if(!b)return;
  if(b.dataset.a==='closeBg'){if(e.target===b){S.modal=null;render();}return;}
  act(b.dataset.a,b.dataset.id,b.dataset.x);
});
document.addEventListener('submit',function(e){
  if(e.target.id!=='signform')return;
  e.preventDefault();
  var code=val('code').trim().toLowerCase();
  if(!code)return;
  var sid=store('cl_sid');if(!sid){sid=rnd(12);store('cl_sid',sid);}
  S.signErr='';
  api('/api/slogin',{method:'POST',body:JSON.stringify({code:code,sid:sid})}).then(function(r){
    stoken=r.token;store('cl_stoken',stoken);store('cl_beta_name',code);
    return Promise.all([loadNotes(),loadThemeEdits().then(loadTheme)]);
  }).then(function(){S.mode='app';render();}).catch(function(err){S.signErr=err.message;render();});
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-type'){
    var f=firstOf(t.value),de=document.getElementById('f-detail');
    S.editor.v={type:t.value,ref:f?f.id:'',url:'',title:f&&t.value!=='header'?f.name:'',detail:de?de.value:''};
    S.focus='f-type';render();
  }else if(t.id==='f-choose'){
    var item=(S.lib[val('f-type')]||[]).filter(function(z){return z.id===t.value;})[0],ti=document.getElementById('f-title');
    if(item&&ti)ti.value=item.name;
  }else if(t.id==='f-file'){
    var file=t.files&&t.files[0];if(!file)return;
    var E=S.editor,snap=snapshotForm()||{};if(!E)return;
    if(!snap.type)snap.type='doc';
    snap.up='Uploading '+file.name+'…';E.v=snap;E.err='';render();
    api('/api/docs',{method:'POST',headers:{'x-name':encodeURIComponent(file.name),'content-type':'application/octet-stream'},body:file}).then(function(d){
      S.lib.doc.unshift({id:d.id,name:d.name});
      var v=E.v||snap;v.ref=d.id;v.url='';v.up='Uploaded '+d.name+'.';if(!String(v.title||'').trim())v.title=docName(d.name);
      E.v=v;E.err='';render();
    }).catch(function(err){E.v.up='';E.err=err.message;render();});
  }
});
/* ---------- rearranging (teacher): drag the grip, or use the arrow keys on it ---------- */
var dragId=null,dragKind=null,gripDown=null;
function dndTarget(e){
  var el=e.target.closest&&e.target.closest('[data-dnd],[data-empty]');
  if(!el||el.dataset.dnd===dragId)return null;
  if(el.hasAttribute('data-empty'))return dragKind==='entry'?{el:el,type:'empty',topic:el.dataset.empty}:null;
  var r=el.getBoundingClientRect(),after=e.clientY>r.top+r.height/2,kind=el.dataset.kind;
  if(dragKind==='topic')return kind==='topic'?{el:el,type:after?'after':'before',id:el.dataset.dnd}:null;
  if(kind==='topic')return {el:el,type:'into',id:el.dataset.dnd};
  return {el:el,type:after?'after':'before',id:el.dataset.dnd};
}
function dndClear(){document.querySelectorAll('.dnd-before,.dnd-after,.dnd-into').forEach(function(x){x.classList.remove('dnd-before','dnd-after','dnd-into');});}
function dndFinish(){document.body.classList.remove('collapse-all');dndClear();document.querySelectorAll('.dragging').forEach(function(x){x.classList.remove('dragging');});dragId=null;dragKind=null;gripDown=null;}
document.addEventListener('mousedown',function(e){var g=e.target.closest&&e.target.closest('.grip');gripDown=g?g.dataset.grip:null;});
document.addEventListener('dragstart',function(e){
  var el=e.target.closest&&e.target.closest('[data-dnd]');
  if(!el||!gripDown||el.dataset.dnd!==gripDown){if(el)e.preventDefault();return;}
  dragId=el.dataset.dnd;dragKind=el.dataset.kind;
  e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',dragId);
  el.classList.add('dragging');
  if(dragKind==='topic')setTimeout(function(){document.body.classList.add('collapse-all');},0);
});
document.addEventListener('dragover',function(e){
  if(!dragId)return;
  dndClear();
  var t=dndTarget(e);
  if(e.clientY<90)window.scrollBy(0,-18);else if(e.clientY>window.innerHeight-90)window.scrollBy(0,18);
  if(!t)return;
  e.preventDefault();e.dataTransfer.dropEffect='move';
  t.el.classList.add(t.type==='before'?'dnd-before':t.type==='after'?'dnd-after':'dnd-into');
});
document.addEventListener('drop',function(e){
  if(!dragId)return;
  var id=dragId,kind=dragKind,t=dndTarget(e);
  e.preventDefault();dndFinish();
  if(!t)return;
  var src=locate(id);if(!src)return;
  var node=src.arr.splice(src.idx,1)[0],l;
  if(kind==='topic'){l=locate(t.id);S.tree.splice(l.idx+(t.type==='after'?1:0),0,node);}
  else if(t.type==='into'){l=locate(t.id);l.node.items.unshift(node);S.open[t.id]=true;}
  else if(t.type==='empty'){l=locate(t.topic);l.node.items.push(node);S.open[t.topic]=true;}
  else{l=locate(t.id);l.arr.splice(l.idx+(t.type==='after'?1:0),0,node);}
  S.editor=null;S.confirm=null;S.focus='gr-'+id;persist();render();
});
document.addEventListener('dragend',dndFinish);
document.addEventListener('keydown',function(e){
  var g=e.target.closest&&e.target.closest('.grip');
  if(!g||(e.key!=='ArrowUp'&&e.key!=='ArrowDown'))return;
  e.preventDefault();
  var id=g.dataset.grip,l=locate(id);if(!l)return;
  var j=l.idx+(e.key==='ArrowUp'?-1:1);
  if(j<0||j>=l.arr.length)return;
  var tmp=l.arr[l.idx];l.arr[l.idx]=l.arr[j];l.arr[j]=tmp;
  S.editor=null;S.focus='gr-'+id;persist();render();
});
document.addEventListener('keydown',function(e){
  if(e.key!=='Escape')return;
  if(S.stage){S.stage=null;render();}
  else if(S.modal){S.modal=null;render();}
  else if(S.editor){S.editor=null;S.confirm=null;render();}
});
// students pick up the teacher's latest changes when they come back to the tab
document.addEventListener('visibilitychange',function(){
  if(document.hidden||S.mode!=='app'||S.teacher||S.stage)return;
  api('/api/feed').then(function(r){if(r.rev!==S.rev){S.tree=r.tree||[];S.rev=r.rev;render();}}).catch(function(){});
});

render();
start();
})();
</script>
