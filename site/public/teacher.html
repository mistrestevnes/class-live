<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Live · Teacher</title>
<link rel="stylesheet" href="app.css?v=13">
<style>
  /* teacher-only layout */
  .t-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; }
  .t-cols { flex: 1; min-height: 0; display: grid; grid-template-columns: 300px 1fr; gap: 12px; padding: 0 12px 4px; }
  .t-side, .t-body { min-height: 0; overflow: auto; }
  .t-side { padding: 14px; }
  .t-body > .aero-panel + .aero-panel, .t-body > .aero-bar + .aero-panel, .t-body > * + * { margin-top: 12px; }
  .t-pages { list-style: none; margin: 0 0 12px; padding: 0; display: grid; grid-template-columns: minmax(0, 1fr); gap: 6px; }
  .t-pages button {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left; border-radius: var(--aero-radius-sm);
    padding: 8px 12px; font-weight: 500;
  }
  .t-pages button .t-num { flex: none; width: 30px; height: 30px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: var(--aero-select); color: var(--aero-ink); font-weight: 700; text-shadow: none; }
  .t-pages button .t-label { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-pages button.locked { color: var(--aero-ink-muted); }
  .t-pages .t-count { flex: none; font-size: .85rem; padding: 2px 10px; color: var(--aero-ink); text-shadow: none; background: #FFFFFF; }
  .t-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .t-row.end { justify-content: flex-end; }
  .t-small { min-height: 40px; padding: 4px 14px; font-size: .95rem; }
  .t-block { padding: 14px 18px; }
  .t-block-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
  .t-block-head h3 { margin: 0; flex: 1; }
  .t-hint { color: var(--aero-ink-muted); font-size: .9rem; margin: 6px 0 0; }
  .t-opt { display: flex; gap: 10px; align-items: center; margin-bottom: 8px; }
  .t-opt input { flex: 1; }
  .t-thumb { max-width: 260px; max-height: 160px; border-radius: var(--aero-radius-sm); border: 1px solid var(--aero-line); display: block; margin-bottom: 10px; }
  .t-lessons { display: grid; gap: 10px; }
  .t-lesson { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 12px 16px; border: 1px solid var(--aero-line); border-radius: var(--aero-radius-sm); background: #FFFFFF; }
  .t-lesson .t-ltitle { flex: 1; min-width: 200px; font-weight: 600; font-size: 1.1rem; }
  .t-home { max-width: 1000px; margin: 0 auto; width: 100%; padding: 0 12px; overflow: auto; }
  .t-home > * + * { margin-top: 12px; }
  .t-title-input { flex: 1; min-width: 200px; font-size: 1.2rem !important; }
  #liveView .t-cols.with-who { grid-template-columns: 280px 1fr 300px; }
  .t-who { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; }
  .t-who li { padding: 8px 10px; border-radius: var(--aero-radius-sm); border: 1px solid var(--aero-line); background: #FFFFFF; color: var(--aero-ink); }
  .t-who li.away { background: #F8EDCB; border-color: var(--aero-gold); }
  .t-who li.gone { color: var(--aero-ink-muted); }
  .t-who .t-who-name { font-weight: 700; font-size: 18px; }
  .t-who .t-who-now { font-size: 18px; }
  .t-who .t-who-sum { font-family: Helvetica, Arial, sans-serif; font-size: 18px; color: var(--aero-ink-muted); }
  .t-who-count { font-size: 18px; font-weight: 700; color: var(--aero-ink); }
  .t-roll { list-style: none; margin: 10px 0 0; padding: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 6px 14px; }
  .t-roll li { display: flex; align-items: center; gap: 10px; font-size: 18px; color: var(--aero-ink); padding: 4px 0; }
  .t-roll li::before { content: ""; flex: none; width: 14px; height: 14px; border-radius: 50%; background: #FFFFFF; border: 2px solid var(--aero-line); }
  .t-roll li.on::before { background: var(--aero-jade); border-color: var(--aero-jade); }
  .t-roll li:not(.on) { color: var(--aero-ink-muted); }
  .t-roll li.grp { grid-column: 1 / -1; font-family: Helvetica, Arial, sans-serif; font-weight: 700; padding-top: 10px; }
  .t-roll li.grp::before { display: none; }
  .t-pick { display: grid; gap: 12px; max-width: 560px; }
  .t-pick h2 { margin: 0 0 4px; }
  .t-pick button { min-height: 60px; font-size: 1.2rem; }
  .t-part { margin-bottom: 12px; }
  .t-prep { padding: 14px 18px; }
  .t-prep .t-prepq { display: flex; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--aero-line); }
  .t-prep .t-prepq:first-of-type { border-top: 0; }
  .t-pq { border: 1px solid var(--aero-line); border-radius: var(--aero-radius-sm); padding: 12px 14px; margin-bottom: 12px; background: #FFFFFF; color: var(--aero-ink); }
  .t-pq .t-block-head { margin-bottom: 8px; }
  .t-media { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .t-media select { font-size: 18px; max-width: 260px; }
  .t-notesbox { margin-top: 18px; }
  .t-notesbox h3 { margin: 0 0 6px; }
  .t-notesbox select { width: 100%; font-size: 18px; margin-bottom: 6px; }
  .t-notesbox textarea { width: 100%; font-size: 18px; min-height: 180px; resize: vertical; }
  .t-ask { padding: 16px 20px; }
  .t-ask h3 { margin: 0 0 8px; }
  .t-ask textarea { width: 100%; font-size: 20px; }
  .t-ask .t-ask-prompt { font-size: 22px; margin-bottom: 10px; }
  .t-ask .t-ask-time { font-size: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .t-ask .t-row { margin-top: 10px; }
  .t-ask input[type=number] { width: 90px; font-size: 20px; }
  .t-answers { list-style: none; margin: 12px 0 0; padding: 0; display: grid; gap: 8px; max-height: 50vh; overflow: auto; }
  .t-answers li { background: #FFFFFF; border: 1px solid var(--aero-line); border-radius: var(--aero-radius-sm); padding: 10px 14px; color: var(--aero-ink); font-size: 19px; white-space: pre-wrap; }
  .t-answers .t-who-name { font-family: Helvetica, Arial, sans-serif; font-size: 18px; color: var(--aero-ink-muted); display: block; margin-bottom: 4px; white-space: normal; }
  #lvPause[aria-pressed="true"] { background: var(--aero-gold); color: var(--aero-ink); text-shadow: none; }
  .t-qs { list-style: none; margin: 6px 0 0; padding: 0; display: grid; gap: 4px; }
  .t-qs button { width: 100%; text-align: left; font-size: 18px; padding: 8px 10px; display: block; white-space: normal; }
  .t-qs button[aria-pressed="true"] { outline: 3px solid var(--aero-jade); }
  .t-qs .t-q-when { display: block; font-family: Helvetica, Arial, sans-serif; font-size: 18px; color: var(--aero-ink-muted); }
  .t-answers li { display: flex; gap: 12px; align-items: flex-start; }
  .t-answers .t-ans-text { flex: 1; }
  .t-answers li.shown { border-color: var(--aero-jade); box-shadow: 0 0 0 2px var(--aero-jade); }
  .t-answers button { flex: none; min-width: 84px; }
  .t-unlock { min-height: 64px !important; font-size: 1.25rem !important; padding: 10px 34px !important; }
  .t-addbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .t-login { max-width: 520px; margin: 10vh auto 0; }
  .t-login form { display: grid; gap: 12px; }
  .st-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin: 16px 0; }
  .st-grid textarea { width: 100%; min-height: 300px; font-size: 18px; }
  .st-grid input[type=text] { width: 100%; font-size: 20px; }
  .st-card { display: grid; gap: 10px; }
  .st-msg { font-weight: 600; min-height: 1.4em; margin: 10px 0 0; }
  #printArea { display: none; }
  @media print {
    body > *:not(#printArea) { display: none !important; }
    #printArea { display: block; }
    body { background: #fff !important; }
    .slip { page-break-after: always; break-after: page; padding-top: 1in; text-align: center;
            color: #000; font-family: Helvetica, Arial, sans-serif; }
    .slip:last-child { page-break-after: auto; break-after: auto; }
    .slip .who { font-size: 20pt; font-weight: 700; margin-bottom: 0.25in; }
    .slip .lab { font-size: 18pt; }
    .slip .code { font-size: 26pt; font-weight: 700; letter-spacing: 0.04em; margin: 0.05in 0 0.25in; }
    .slip .how { font-size: 13pt; }
    .slip .cls { font-size: 11pt; margin-top: 0.2in; color: #444; }
  }
  @media (max-width: 860px) { .t-cols { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); } .t-side { max-height: 32vh; } }
</style>

<body>

<!-- sign in -->
<section id="loginView" hidden>
  <div class="aero-panel t-login">
    <h1 id="loginTitle">Teacher sign in</h1>
    <p id="loginHelp" class="aero-muted"></p>
    <form id="loginForm">
      <label class="cl-field" id="resetKeyRow" hidden><span>Reset key</span><input type="password" id="resetKey" autocomplete="off"></label>
      <label class="cl-field"><span id="userLabel">Username</span><input type="text" id="user" name="username" autocomplete="username" autocapitalize="off"></label>
      <label class="cl-field"><span id="passLabel">Passcode</span><input type="password" id="pass" name="password" autocomplete="current-password"></label>
      <label class="cl-field" id="pass2Row" hidden><span>Type the passcode again</span><input type="password" id="pass2" autocomplete="new-password"></label>
      <span class="aero-chip aero-chip-warn cl-error" id="loginErr"></span>
      <button class="aero-btn-primary" id="loginBtn">Sign in</button>
      <button type="button" id="loginSwitch"></button>
    </form>
  </div>
</section>

<!-- change username / passcode -->
<section id="accountView" hidden>
  <div class="aero-panel t-login">
    <h1>Username and passcode</h1>
    <form id="acctForm">
      <label class="cl-field"><span>Current passcode</span><input type="password" id="acctCur" autocomplete="current-password"></label>
      <label class="cl-field"><span>Username</span><input type="text" id="acctUser" name="username" autocomplete="username" autocapitalize="off"></label>
      <label class="cl-field"><span>New passcode (leave blank to keep the current one)</span><input type="password" id="acctPass" name="password" autocomplete="new-password"></label>
      <label class="cl-field"><span>Type the new passcode again</span><input type="password" id="acctPass2" autocomplete="new-password"></label>
      <span class="aero-chip aero-chip-warn cl-error" id="acctErr"></span>
      <button class="aero-btn-primary" id="acctSave">Save</button>
      <button type="button" id="acctCancel">Back to lessons</button>
    </form>
  </div>
</section>

<!-- students: login codes, name file, printing -->
<section id="studentsView" class="t-wrap" hidden>
  <header class="cl-top aero-header">
    <button id="stBack">◀ Lessons</button>
    <h1 class="cl-title">Students</h1>
    <span class="cl-grow"></span>
    <button class="t-small" id="stSignOut">Sign out all students</button>
    <button class="aero-btn-primary" id="stSave">Save</button>
  </header>
  <div class="t-home">
    <div class="aero-panel">
      <p>One login code per line, like 504cloud. Only codes are saved on the server. Names never leave this computer.</p>
      <div class="t-row">
        <button id="stOpenNames">Open name file</button>
        <button id="stForget" hidden>Remove names from this computer</button>
        <span id="stNamesNote" class="aero-muted"></span>
      </div>
      <p class="st-msg" id="stMsg" role="status"></p>
    </div>
    <div class="st-grid" id="stClasses"></div>
    <div class="t-row"><button id="stAdd">+ Add a class</button></div>
  </div>
</section>
<div id="printArea"></div>

<!-- lessons list -->
<section id="homeView" class="t-wrap" hidden>
  <header class="cl-top aero-header">
    <h1 class="cl-title">Class Live · Lessons</h1>
    <span class="cl-grow"></span>
    <span class="aero-chip" id="studentUrl"></span>
    <button class="t-small" id="recBtn">Record a replay</button>
    <button class="t-small" id="studentsBtn">Students</button>
    <button class="t-small" id="accountBtn">Username &amp; passcode</button>
    <button class="t-small" id="signOutBtn">Sign out</button>
  </header>
  <div class="t-home">
    <div class="aero-panel" id="liveCard" hidden></div>
    <div class="aero-panel" id="homeWho" hidden>
      <div class="t-row"><h2 style="margin:0;flex:1">Students</h2><span id="homeWhoNote" class="t-who-count"></span></div>
      <ul class="t-roll" id="homeWhoList"></ul>
    </div>
    <div class="aero-panel">
      <div class="t-row" style="margin-bottom:12px">
        <h2 style="margin:0;flex:1">Your lessons</h2>
        <button class="aero-btn-primary" id="newLesson">+ New lesson</button>
      </div>
      <div class="t-lessons" id="lessonList"></div>
    </div>
  </div>
</section>

<!-- lesson designer -->
<section id="editView" class="t-wrap" hidden>
  <header class="cl-top aero-header">
    <button id="edBack">◀ Lessons</button>
    <input type="text" id="edTitle" class="t-title-input" aria-label="Lesson title">
    <span class="aero-chip" id="saveState">Saved</span>
    <button id="edModeEdit" aria-pressed="true">Edit</button>
    <button id="edModePreview" aria-pressed="false">Preview</button>
    <button class="aero-btn-primary" id="edStart">Start with class</button>
  </header>
  <div class="t-cols">
    <aside class="aero-panel t-side">
      <h3>Pages</h3>
      <ul class="t-pages" id="edPages"></ul>
      <div class="t-row">
        <button class="t-small" id="pgAdd">+ Page</button>
        <button class="t-small" id="pgUp" aria-label="Move page up">▲</button>
        <button class="t-small" id="pgDown" aria-label="Move page down">▼</button>
        <button class="t-small" id="pgDup">Copy</button>
        <button class="t-small" id="pgDel">Delete</button>
      </div>
      <div id="edNotesSlot"></div>
    </aside>
    <div class="t-body" id="edBody"></div>
  </div>
</section>

<!-- teaching live -->
<section id="liveView" class="t-wrap" hidden>
  <header class="cl-top aero-header">
    <h1 class="cl-title" id="lvTitle"></h1>
    <span class="cl-grow"></span>
    <span class="aero-chip" id="lvStudents"></span>
    <span class="aero-chip cl-status" id="lvStatus"></span>
    <button class="t-small" id="lvEdit">Edit lesson</button>
    <button class="t-small" id="lvHome">Lessons</button>
    <button class="t-small" id="lvEnd">End class</button>
  </header>
  <div class="t-cols">
    <aside class="aero-panel t-side">
      <h3>Pages</h3>
      <ul class="t-pages" id="lvPages"></ul>
      <p class="t-hint" id="lvUrlHint"></p>
      <h3 style="margin-top:18px">Questions</h3>
      <ul class="t-qs" id="lvQs"></ul>
      <div id="lvNotesSlot"></div>
    </aside>
    <div class="t-body">
      <div class="aero-panel t-sq" id="lvSq" hidden></div>
      <div class="aero-panel t-prep" id="lvPrep" hidden></div>
      <div class="aero-panel t-ask" id="lvAsk" hidden></div>
      <div class="aero-bar" id="lvPollBar" hidden></div>
      <div class="aero-panel" id="lvPage"></div>
    </div>
    <aside class="aero-panel t-side" id="lvWho" hidden>
      <h3>Students</h3>
      <p class="t-hint" id="lvWhoNote"></p>
      <ul class="t-who" id="lvWhoList"></ul>
    </aside>
  </div>
  <footer class="cl-bottom aero-bar">
    <button id="lvRelock" class="t-small">Re-lock last page</button>
    <span class="aero-muted" id="lvUnlockNote"></span>
    <span class="cl-grow"></span>
    <button id="lvAskBtn" class="t-small">Ask a question</button>
    <button id="lvPause" class="t-small">Pause students</button>
    <button id="lvUnlock" class="aero-btn-primary t-unlock">Unlock next page ▶</button>
  </footer>
</section>

<script src="common.js?v=13"></script>
<script>
const $ = (id) => document.getElementById(id);
let token = store("cl_token");
let link = null;
let tstate = null;          // latest teacher state from the server
let tstateAt = 0;           // when it arrived (for ticking away timers)
let lvSelected = 0;         // page the teacher is looking at while live
let lvLastUnlocked = -1;
let lvSession = null;

const authHeaders = (extra = {}) => ({ "x-token": token || "", ...extra });
const tapi = (path, opts = {}) => api(path, { ...opts, headers: authHeaders(opts.headers) }).catch((e) => {
  if (e.status === 401 && token) { token = null; store("cl_token", null); route(); }
  throw e;
});

const VIEWS = ["loginView", "homeView", "editView", "liveView", "accountView", "studentsView"];
function show(v) { for (const id of VIEWS) $(id).hidden = id !== v; }

$("recBtn").onclick = () => { location.href = "/recorder"; };
$("studentUrl").textContent = "Students go to: " + location.host;

// ---------------------------------------------------------------- routing
async function route() {
  if (!token) return showLogin();
  ensureLink();
  const h = location.hash;
  const m = h.match(/^#\/edit\/([a-z0-9]+)/);
  if (m) return openEditor(m[1]);
  if (h === "#/live") return showLive();
  if (h === "#/account") return showAccount();
  if (h === "#/students") return showStudents();
  return showHome();
}
window.addEventListener("hashchange", route);

// ---------------------------------------------------------------- sign in
// mode: "login", "setup" (first visit) or "reset" (forgot passcode)
async function showLogin(mode) {
  show("loginView");
  if (!mode) {
    let setup = true;
    try { setup = (await api("/api/auth-status")).setup; } catch {}
    mode = setup ? "login" : "setup";
  }
  const text = {
    setup: ["Create your teacher sign-in", "This is the first time the teacher page has been opened. Choose a username and a passcode students won't guess. Let your iPad save them when it offers.", "Save and sign in"],
    login: ["Teacher sign in", "", "Sign in"],
    reset: ["Reset your sign-in", "Enter the reset key you set in Terminal (see SETUP.txt), then choose a new username and passcode. Other devices will be signed out.", "Reset and sign in"],
  }[mode];
  $("loginTitle").textContent = text[0];
  $("loginHelp").textContent = text[1];
  $("loginHelp").hidden = !text[1];
  $("loginBtn").textContent = text[2];
  $("resetKeyRow").hidden = mode !== "reset";
  $("pass2Row").hidden = mode === "login";
  $("passLabel").textContent = mode === "login" ? "Passcode" : "New passcode";
  $("pass").autocomplete = mode === "login" ? "current-password" : "new-password";
  $("loginSwitch").hidden = mode === "setup";
  $("loginSwitch").textContent = mode === "reset" ? "Back to sign in" : "Forgot passcode?";
  $("loginSwitch").onclick = () => { $("loginErr").textContent = ""; showLogin(mode === "reset" ? "login" : "reset"); };
  $("loginErr").textContent = "";
  $("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    $("loginErr").textContent = "";
    const username = $("user").value.trim();
    const passcode = $("pass").value;
    if (mode !== "login" && passcode !== $("pass2").value) { $("loginErr").textContent = "The two passcodes don't match."; return; }
    $("loginBtn").disabled = true;
    try {
      const r = await api("/api/" + mode, {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ username, passcode, resetKey: $("resetKey").value }),
      });
      token = r.token;
      store("cl_token", token);
      $("pass").value = $("pass2").value = $("resetKey").value = "";
      route();
    } catch (err) {
      $("loginErr").textContent = err.message;
    } finally {
      $("loginBtn").disabled = false;
    }
  };
  (mode === "reset" ? $("resetKey") : $("user").value ? $("pass") : $("user")).focus();
}

// ---------------------------------------------------------------- account
$("accountBtn").onclick = () => (location.hash = "#/account");
$("studentsBtn").onclick = () => (location.hash = "#/students");
$("acctCancel").onclick = () => (location.hash = "#/");
$("signOutBtn").onclick = () => {
  token = null;
  store("cl_token", null);
  location.reload();
};

async function showAccount() {
  show("accountView");
  $("acctErr").textContent = "";
  $("acctCur").value = $("acctPass").value = $("acctPass2").value = "";
  try { $("acctUser").value = (await tapi("/api/account")).username; } catch {}
  $("acctCur").focus();
}

$("acctForm").onsubmit = async (e) => {
  e.preventDefault();
  $("acctErr").textContent = "";
  if ($("acctPass").value !== $("acctPass2").value) { $("acctErr").textContent = "The two new passcodes don't match."; return; }
  $("acctSave").disabled = true;
  try {
    await tapi("/api/account", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ currentPasscode: $("acctCur").value, username: $("acctUser").value.trim(), passcode: $("acctPass").value }),
    });
    alert("Saved. Use the new username and passcode next time you sign in.");
    location.hash = "#/";
  } catch (err) {
    $("acctErr").textContent = err.message;
  } finally {
    $("acctSave").disabled = false;
  }
};

// ---------------------------------------------------------------- live connection
function ensureLink() {
  if (link) return;
  link = new Link({
    wsUrl: () => (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?role=teacher&token=" + encodeURIComponent(token),
    poll: () => tapi("/api/t"),
    post: (msg) => tapi("/api/t", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(msg) }),
    onMessage: (m) => onTState(m.t === "tstate" ? m.state : m),
    onMode: (mode) => {
      const s = $("lvStatus");
      s.className = "aero-chip cl-status " + mode + (mode === "offline" || mode === "connecting" ? " aero-chip-warn" : "");
      s.textContent = { live: "Live", polling: "Checking every 2 s", connecting: "Connecting…", offline: "Reconnecting…" }[mode];
    },
  });
  link.start();
  // keep the student count fresh
  setInterval(() => { if (link.ws && link.ws.readyState === 1) link.ws.send(JSON.stringify({ t: "refresh" })); }, 4000);
}

function onTState(s) {
  if (!s || !("presence" in s)) return;
  tstate = s;
  tstateAt = Date.now();
  if (!$("homeView").hidden) { renderLiveCard(); renderHomeWho(); }
  if (!$("liveView").hidden) renderLive();
}

// ---------------------------------------------------------------- lessons list
async function showHome() {
  show("homeView");
  renderLiveCard();
  renderHomeWho();
  const list = $("lessonList");
  list.replaceChildren(el("p", { class: "aero-muted", text: "Loading…" }));
  let lessons = [];
  try { lessons = await tapi("/api/lessons"); } catch (e) { list.replaceChildren(el("p", { text: e.message })); return; }
  if (!lessons.length) {
    list.replaceChildren(el("p", { class: "aero-muted", text: "No lessons yet. Tap “New lesson” to make one." }));
    return;
  }
  list.replaceChildren(...lessons.map((l) => el("div", { class: "t-lesson" },
    el("span", { class: "t-ltitle", text: l.title }),
    el("span", { class: "aero-muted", text: l.pages + (l.pages === 1 ? " page" : " pages") }),
    el("button", { class: "t-small", text: "Edit", onclick: () => (location.hash = "#/edit/" + l.id) }),
    el("button", { class: "t-small", text: "Copy", onclick: () => copyLesson(l.id) }),
    el("button", { class: "t-small", text: "Delete", onclick: () => deleteLesson(l) }),
    el("button", { class: "t-small aero-btn-primary", text: "Start with class", onclick: () => startLesson(l.id) }),
  )));
}

// Before class: everyone on the class list, and whether they're signed in with the page open.
// Only on a computer with the name file, so the iPad never shows it.
function renderHomeWho() {
  const has = tstate && Object.keys(names).length;
  $("homeWho").hidden = !has;
  if (!has) return;
  const rows = (tstate.students || []).filter((x) => x.cls).map((x) => ({ ...x, name: shortName(names[x.code]) || x.code }));
  rows.sort((a, b) => a.cls.localeCompare(b.cls) || a.name.localeCompare(b.name));
  const n = rows.filter((x) => x.connected).length;
  $("homeWhoNote").textContent = n + " of " + rows.length + " signed in";
  const blocks = new Set(rows.map((x) => x.cls));
  const out = [];
  let last = null;
  for (const x of rows) {
    if (blocks.size > 1 && x.cls !== last) {
      const inB = rows.filter((y) => y.cls === x.cls);
      out.push(el("li", { class: "grp", text: x.cls + " · " + inB.filter((y) => y.connected).length + " of " + inB.length + " signed in" }));
      last = x.cls;
    }
    out.push(el("li", { class: x.connected ? "on" : "", title: x.code, text: x.name }));
  }
  $("homeWhoList").replaceChildren(...out);
}

function renderLiveCard() {
  const card = $("liveCard");
  const live = tstate && tstate.live && tstate.lesson;
  card.hidden = !live;
  if (!live) return;
  const p = tstate.presence;
  card.replaceChildren(el("div", { class: "t-row" },
    el("div", { style: "flex:1;min-width:240px" },
      el("h2", { style: "margin:0", text: "Class running: " + tstate.lesson.title + (tstate.live.periodName ? " · " + tstate.live.periodName : "") }),
      el("span", { class: "aero-muted", text: p.count + (p.count === 1 ? " student connected" : " students connected") })),
    el("button", { class: "aero-btn-primary", text: "Go to class", onclick: () => (location.hash = "#/live") }),
    el("button", { text: "End class", onclick: endClass }),
  ));
}

$("newLesson").onclick = async () => {
  const id = randomId(10);
  const lesson = { title: "New lesson", pages: [newPage()] };
  await tapi("/api/lessons/" + id, { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(lesson) });
  location.hash = "#/edit/" + id;
};

async function copyLesson(id) {
  const l = await tapi("/api/lessons/" + id);
  const copy = { title: l.title + " (copy)", pages: l.pages.map((p) => ({ ...JSON.parse(JSON.stringify(p)), id: randomId(8) })) };
  await tapi("/api/lessons/" + randomId(10), { method: "PUT", headers: { "content-type": "application/json" }, body: JSON.stringify(copy) });
  showHome();
}

async function deleteLesson(l) {
  if (!confirm("Delete “" + l.title + "”? This can't be undone.")) return;
  try { await tapi("/api/lessons/" + l.id, { method: "DELETE" }); } catch (e) { alert(e.message); }
  showHome();
}

// Each block is started on its own. With more than one block on the class list, ask which.
async function pickBlock() {
  let periods = [];
  try { periods = (await tapi("/api/roster")).periods || []; } catch {}
  if (!periods.length) return { id: null };
  if (periods.length === 1) return { id: periods[0].id };
  return new Promise((resolve) => {
    const done = (v) => { ov.remove(); resolve(v); };
    const ov = el("div", { class: "cl-cover", role: "dialog", "aria-label": "Which class" },
      el("section", { class: "aero-panel cl-cover-box t-pick" },
        el("h2", { text: "Which class are you starting?" }),
        ...periods.map((p) => el("button", { class: "aero-btn-primary", text: p.name + " · " + p.students.length + " students", onclick: () => done({ id: p.id }) })),
        el("button", { text: "Cancel", onclick: () => done(null) })));
    document.body.append(ov);
  });
}

async function startLesson(id) {
  if (tstate && tstate.live) {
    const who = tstate.live.periodName ? tstate.live.periodName + " is in a class right now. " : "";
    const same = tstate.live.lessonId === id;
    const ok = confirm(who + (same
      ? "Start this lesson fresh for a new class? The running class ends, pages lock again, and the current votes are cleared."
      : "Start this one instead? The running class ends and its votes are cleared."));
    if (!ok) return;
  }
  const pick = await pickBlock();
  if (!pick) return;
  if (edSaveTimer) saveNow(); await saveChain;
  lvSession = null;
  await link.send({ t: "start", lessonId: id, periodId: pick.id });
  location.hash = "#/live";
}

async function endClass() {
  if (!confirm("End class? Students go back to the waiting screen and votes are cleared.")) return;
  await link.send({ t: "end" });
  location.hash = "#/";
}

// ---------------------------------------------------------------- lesson designer
let ed = null;              // lesson being edited
let edPage = 0;
let edPreview = false;
let edSaveTimer = null;

function newPage() { return { id: randomId(8), name: "", blocks: [{ type: "heading", text: "" }, { type: "text", text: "" }] }; }

function pageLabel(p, i) {
  if (p.name) return p.name;
  const h = (p.blocks || []).find((b) => (b.type === "heading" || b.type === "text") && b.text && b.text.trim());
  if (h) return h.text.trim().split("\n")[0].slice(0, 60);
  const poll = (p.blocks || []).find((b) => b.type === "poll");
  if (poll) return "Poll: " + (poll.question || "").slice(0, 50);
  return "Page " + (i + 1);
}

async function openEditor(id) {
  show("editView");
  if (!ed || ed.id !== id) {
    try { ed = await tapi("/api/lessons/" + id); } catch (e) { alert(e.message); location.hash = "#/"; return; }
    edPage = 0;
  }
  $("edNotesSlot").append(notesBox);
  if (notes.lesson !== id) notesShow(id);
  $("edTitle").value = ed.title;
  setSave("Saved");
  renderEditor();
}

function setSave(text) { $("saveState").textContent = text; $("saveState").classList.toggle("aero-chip-warn", /n't/.test(text)); }

function changed() {
  setSave("Saving…");
  clearTimeout(edSaveTimer);
  edSaveTimer = setTimeout(saveNow, 700);
}

// saves run one at a time, in order, so an older save can never overwrite a newer one
let saveChain = Promise.resolve();
function saveNow() {
  clearTimeout(edSaveTimer);
  edSaveTimer = null;
  if (!ed) return saveChain;
  const id = ed.id;
  const body = JSON.stringify(ed);
  saveChain = saveChain.then(async () => {
    try {
      await tapi("/api/lessons/" + id, { method: "PUT", headers: { "content-type": "application/json" }, body });
      if (!edSaveTimer) setSave("Saved");
    } catch (e) {
      setSave("Couldn't save. Retrying…");
      if (!edSaveTimer) edSaveTimer = setTimeout(saveNow, 3000);
    }
  });
  return saveChain;
}
window.addEventListener("beforeunload", (e) => { if (edSaveTimer) { saveNow(); e.preventDefault(); } });

$("edTitle").oninput = () => { ed.title = $("edTitle").value; changed(); };
$("edBack").onclick = async () => { if (edSaveTimer) saveNow(); await saveChain; ed = null; location.hash = "#/"; };
$("edStart").onclick = () => startLesson(ed.id);
$("edModeEdit").onclick = () => { edPreview = false; renderEditor(); };
$("edModePreview").onclick = () => { edPreview = true; renderEditor(); };

$("pgAdd").onclick = () => { ed.pages.splice(edPage + 1, 0, newPage()); edPage++; changed(); renderEditor(); };
$("pgDup").onclick = () => {
  const copy = JSON.parse(JSON.stringify(ed.pages[edPage])); copy.id = randomId(8);
  ed.pages.splice(edPage + 1, 0, copy); edPage++; changed(); renderEditor();
};
$("pgDel").onclick = () => {
  if (ed.pages.length === 1) { alert("A lesson needs at least one page."); return; }
  if (!confirm("Delete page " + (edPage + 1) + "?")) return;
  ed.pages.splice(edPage, 1); edPage = Math.min(edPage, ed.pages.length - 1); changed(); renderEditor();
};
$("pgUp").onclick = () => movePage(-1);
$("pgDown").onclick = () => movePage(1);
function movePage(d) {
  const j = edPage + d;
  if (j < 0 || j >= ed.pages.length) return;
  [ed.pages[edPage], ed.pages[j]] = [ed.pages[j], ed.pages[edPage]];
  edPage = j; changed(); renderEditor();
}

function renderEditor() {
  $("edModeEdit").setAttribute("aria-pressed", String(!edPreview));
  $("edModePreview").setAttribute("aria-pressed", String(edPreview));
  $("edPages").replaceChildren(...ed.pages.map((p, i) => el("li", {},
    el("button", { "aria-pressed": i === edPage ? "true" : "false", onclick: () => { edPage = i; renderEditor(); } },
      el("span", { class: "t-num", text: i + 1 }),
      el("span", { class: "t-label", text: pageLabel(p, i) })))));
  $("pgUp").disabled = edPage === 0;
  $("pgDown").disabled = edPage === ed.pages.length - 1;

  const body = $("edBody");
  const page = ed.pages[edPage];
  if (edPreview) {
    body.replaceChildren(
      el("div", { class: "aero-bar" }, el("span", { text: "Preview of page " + (edPage + 1) + " as students will see it." })),
      el("div", { class: "aero-panel" }, renderPage(page, { preview: true })));
    return;
  }

  const blocks = page.blocks || (page.blocks = []);
  const hasPoll = blocks.some((b) => b.type === "poll");
  const items = [];
  items.push(el("div", { class: "aero-panel t-block" },
    el("label", { class: "cl-field", style: "margin:0" },
      el("span", { text: "Page name (only you see this)" }),
      el("input", { type: "text", value: page.name || "", placeholder: pageLabel({ blocks }, edPage),
        oninput: (e) => { page.name = e.target.value; changed(); refreshPageLabels(); } }))));
  blocks.forEach((b, i) => items.push(blockEditor(page, b, i)));
  items.push(el("div", { class: "aero-bar t-addbar" },
    el("span", { text: "Add:" }),
    ...[["heading", "Heading"], ["text", "Text"], ["image", "Image"], ["poll", "Poll"], ["sim", "Sim"]].map(([type, label]) =>
      el("button", { class: "t-small", text: "+ " + label, disabled: type === "poll" && hasPoll,
        title: type === "poll" && hasPoll ? "One poll per page" : "",
        onclick: () => { blocks.push(newBlock(type)); changed(); renderEditor(); } }))));
  items.push(questionsPanel(page));
  body.replaceChildren(...items);
}

// ---------- questions prepared for a page: sent from the class view with one click
function newPrepared() {
  return { id: randomId(6), parts: [{ prompt: "", min: Number(store("cl_askMin")) || 2, imageId: "", sim: "" }] };
}

// a picture or an animation (an uploaded .html file) that goes with one part of a question
function partMedia(p) {
  const status = el("span", { class: "aero-muted" });
  const pic = el("input", { type: "file", accept: "image/*", hidden: true, onchange: async () => {
    const f = pic.files[0]; if (!f) return;
    status.textContent = "Uploading…";
    try { p.imageId = await uploadImage(f); p.sim = ""; changed(); renderEditor(); } catch (e) { status.textContent = e.message; }
  } });
  const anim = el("input", { type: "file", accept: ".html,.htm,text/html", hidden: true, onchange: async () => {
    const f = anim.files[0]; if (!f) return;
    status.textContent = "Uploading…";
    try { const r = await uploadSim(f, null); p.sim = "/sim/" + r.id; p.imageId = ""; changed(); renderEditor(); } catch (e) { status.textContent = e.message; }
  } });
  const pick = el("select", { "aria-label": "Animation", onchange: (e) => { p.sim = e.target.value ? "/sim/" + e.target.value : ""; if (p.sim) p.imageId = ""; changed(); renderEditor(); } },
    el("option", { value: "", text: "Loading…" }));
  loadSims().then((list) => {
    pick.replaceChildren(el("option", { value: "", text: "No animation" }), ...list.map((x) => el("option", { value: x.id, text: "Animation: " + x.name })));
    pick.value = p.sim ? p.sim.replace("/sim/", "") : "";
  });
  return el("div", { class: "t-media" },
    p.imageId ? el("img", { class: "t-thumb", src: "/img/" + p.imageId, alt: "" }) : null,
    el("button", { class: "t-small", text: p.imageId ? "Replace picture" : "Add a picture", onclick: () => pic.click() }),
    p.imageId ? el("button", { class: "t-small", text: "Remove picture", onclick: () => { p.imageId = ""; changed(); renderEditor(); } }) : null,
    pick,
    el("button", { class: "t-small", text: "Upload animation file", onclick: () => anim.click() }),
    status, pic, anim);
}

function questionsPanel(page) {
  const qs = page.questions || [];
  const panel = el("div", { class: "aero-panel t-block" }, el("div", { class: "t-block-head" }, el("h3", { text: "Questions for this page" })));
  if (!qs.length) panel.append(el("p", { class: "t-hint", text: "Questions you add here show up in the class view when you are on this page, ready to send with one click." }));
  qs.forEach((q, qi) => {
    const move = (d) => { const j = qi + d; [qs[j], qs[qi]] = [qs[qi], qs[j]]; changed(); renderEditor(); };
    const box = el("div", { class: "t-pq" }, el("div", { class: "t-block-head" },
      el("h3", { text: "Question " + (qi + 1) }),
      el("button", { class: "t-small", text: "▲", "aria-label": "Move up", disabled: qi === 0, onclick: () => move(-1) }),
      el("button", { class: "t-small", text: "▼", "aria-label": "Move down", disabled: qi === qs.length - 1, onclick: () => move(1) }),
      el("button", { class: "t-small", text: "Remove", onclick: () => { if (!confirm("Remove question " + (qi + 1) + "?")) return; qs.splice(qi, 1); changed(); renderEditor(); } })));
    const own = q.mode === "student";
    const earlier = qs.slice(0, qi).filter((x) => x.mode === "student");
    box.append(el("div", { class: "t-row", style: "margin:6px 0" },
      el("label", { class: "t-row" }, el("span", { text: "How it starts" }),
        el("select", { "aria-label": "How it starts", onchange: (e) => {
          q.mode = e.target.value === "own" ? "student" : "";
          if (q.mode && !q.trigger) q.trigger = { type: "sim", event: "" };
          changed(); renderEditor(); } },
          el("option", { value: "teacher", text: "I send it", selected: !own }),
          el("option", { value: "own", text: "Starts on its own", selected: own })))));
    if (own) {
      q.trigger ||= { type: "sim", event: "" };
      box.append(el("div", { class: "t-row", style: "margin:6px 0" },
        el("select", { "aria-label": "What starts it", onchange: (e) => {
          const v = e.target.value;
          q.trigger = v === "sim" ? { type: "sim", event: "" } : { type: "after", afterId: v, delay: 3 };
          changed(); renderEditor(); } },
          el("option", { value: "sim", text: "When the sim reports an event", selected: q.trigger.type === "sim" }),
          ...earlier.map((x) => el("option", { value: x.id, text: "After question " + (qs.indexOf(x) + 1) + " is submitted", selected: q.trigger.type === "after" && q.trigger.afterId === x.id }))),
        q.trigger.type === "sim"
          ? el("input", { type: "text", style: "width:200px", value: q.trigger.event || "", placeholder: "Event name, like dataSubmitted", "aria-label": "Sim event name",
              oninput: (e) => { q.trigger.event = e.target.value.trim(); changed(); } })
          : el("label", { class: "t-row" },
              el("input", { type: "number", min: "0", max: "600", step: "1", style: "width:80px", value: q.trigger.delay ?? 3, "aria-label": "Seconds to wait",
                oninput: (e) => { q.trigger.delay = Number(e.target.value) || 0; changed(); } }),
              el("span", { text: "seconds later" }))));
      box.append(el("div", { class: "t-row", style: "margin:6px 0" },
        el("label", { class: "t-row" }, el("span", { text: "When the last part is submitted, tell the sim" }),
          el("input", { type: "text", style: "width:200px", value: q.command || "", placeholder: "Command name (optional)", "aria-label": "Sim command",
            oninput: (e) => { q.command = e.target.value.trim(); changed(); } }))));
    }
    q.parts.forEach((p, pi) => box.append(el("div", { class: "t-part" },
      q.parts.length > 1 ? el("div", { class: "t-hint", text: "Part " + (pi + 1) }) : null,
      el("textarea", { rows: 2, style: "width:100%", value: p.prompt || "", placeholder: "Type the question", oninput: (e) => { p.prompt = e.target.value; changed(); } }),
      el("div", { class: "t-row", style: "margin:6px 0" },
        own ? null : el("label", { class: "t-row" },
          el("input", { type: "number", min: "0.5", max: "60", step: "0.5", style: "width:90px", value: p.min || 2, "aria-label": "Minutes",
            oninput: (e) => { p.min = e.target.value; changed(); } }),
          el("span", { text: "minutes" })),
        q.parts.length > 1 ? el("button", { class: "t-small", text: "Remove part", onclick: () => { q.parts.splice(pi, 1); changed(); renderEditor(); } }) : null),
      partMedia(p))));
    box.append(el("div", { class: "t-row" },
      el("button", { class: "t-small", text: "Add a part", disabled: q.parts.length >= 8,
        onclick: () => { q.parts.push({ prompt: "", min: q.parts[q.parts.length - 1].min || 2, imageId: "", sim: "" }); changed(); renderEditor(); } }),
      (() => {
        const b = el("button", { class: "t-small", "aria-pressed": String(!q.noSim) });
        const label = () => { b.textContent = "Students can use the sim while answering: " + (q.noSim ? "Off" : "On"); b.setAttribute("aria-pressed", String(!q.noSim)); };
        label();
        b.onclick = () => { q.noSim = !q.noSim; changed(); label(); };
        return b;
      })()));
    panel.append(box);
  });
  panel.append(el("div", { class: "t-row" }, el("button", { class: "t-small", text: "+ Add a question",
    onclick: () => { (page.questions ||= []).push(newPrepared()); changed(); renderEditor(); } })));
  return panel;
}

function refreshPageLabels() {
  const labels = $("edPages").querySelectorAll(".t-label");
  ed.pages.forEach((p, i) => { if (labels[i]) labels[i].textContent = pageLabel(p, i); });
}

function newBlock(type) {
  if (type === "poll") return { type, question: "", options: ["", ""] };
  if (type === "image") return { type, imageId: "", caption: "", size: "medium" };
  if (type === "sim") return { type, url: "", height: "tall" };
  return { type, text: "" };
}

const BLOCK_NAMES = { heading: "Heading", text: "Text", image: "Image", poll: "Poll", sim: "Sim" };

function blockEditor(page, b, i) {
  const blocks = page.blocks;
  const set = (k) => (e) => { b[k] = e.target.value; changed(); refreshPageLabels(); };
  const head = el("div", { class: "t-block-head" },
    el("h3", { text: BLOCK_NAMES[b.type] || b.type }),
    el("button", { class: "t-small", text: "▲", "aria-label": "Move up", disabled: i === 0,
      onclick: () => { [blocks[i - 1], blocks[i]] = [blocks[i], blocks[i - 1]]; changed(); renderEditor(); } }),
    el("button", { class: "t-small", text: "▼", "aria-label": "Move down", disabled: i === blocks.length - 1,
      onclick: () => { [blocks[i + 1], blocks[i]] = [blocks[i], blocks[i + 1]]; changed(); renderEditor(); } }),
    el("button", { class: "t-small", text: "Remove",
      onclick: () => { if (!confirm("Remove this " + (BLOCK_NAMES[b.type] || "block").toLowerCase() + "?")) return; blocks.splice(i, 1); changed(); renderEditor(); } }));
  const box = el("div", { class: "aero-panel t-block" }, head);

  if (b.type === "heading") {
    box.append(el("input", { type: "text", value: b.text || "", style: "width:100%", placeholder: "Heading", oninput: set("text") }));
  } else if (b.type === "text") {
    box.append(el("textarea", { rows: 6, style: "width:100%", value: b.text || "", placeholder: "Type here…", oninput: set("text") }),
      el("p", { class: "t-hint", text: "Blank line = new paragraph · start a line with - for a bullet · **bold** · v_f for subscript · m/s^2 for superscript" }));
  } else if (b.type === "poll") {
    box.append(el("label", { class: "cl-field" }, el("span", { text: "Question" }),
      el("textarea", { rows: 2, value: b.question || "", oninput: set("question") })));
    const opts = el("div");
    const drawOpts = () => {
      opts.replaceChildren(...b.options.map((o, j) => el("div", { class: "t-opt" },
        el("span", { class: "cl-letter", text: LETTERS[j] }),
        el("input", { type: "text", value: o, placeholder: "Answer choice", oninput: (e) => { b.options[j] = e.target.value; changed(); } }),
        el("button", { class: "t-small", text: "✕", "aria-label": "Remove choice", disabled: b.options.length <= 2,
          onclick: () => { b.options.splice(j, 1); changed(); drawOpts(); } }))),
        el("button", { class: "t-small", text: "+ Add choice", disabled: b.options.length >= 8,
          onclick: () => { b.options.push(""); changed(); drawOpts(); opts.querySelectorAll("input")[b.options.length - 1].focus(); } }));
    };
    drawOpts();
    box.append(opts, el("p", { class: "t-hint", text: "Results stay hidden until you show them. Showing results also closes voting." }));
  } else if (b.type === "image") {
    const status = el("span", { class: "aero-muted" });
    const file = el("input", { type: "file", accept: "image/*", hidden: true, onchange: async () => {
      const f = file.files[0]; if (!f) return;
      status.textContent = "Uploading…";
      try { b.imageId = await uploadImage(f); changed(); renderEditor(); }
      catch (e) { status.textContent = e.message; }
    } });
    if (b.imageId) box.append(el("img", { class: "t-thumb", src: "/img/" + b.imageId, alt: "" }));
    box.append(el("div", { class: "t-row", style: "margin-bottom:10px" },
      el("button", { class: "t-small", text: b.imageId ? "Replace image" : "Choose image", onclick: () => file.click() }), status, file));

// shrink big photos so they upload fast and load quickly on Chromebooks
async function uploadImage(file) {
  let blob = file;
  if (!(file.type === "image/gif" && file.size < 1.5e6)) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't an image I can read.")); i.src = URL.createObjectURL(file);
    });
    const scale = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const g = c.getContext("2d");
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.88));
  }
  const r = await tapi("/api/images", { method: "POST", headers: { "content-type": blob.type }, body: blob });
  return r.id;
}

      .map(([code, v]) => ({ code, name: named ? shortName(names[code]) || code : "", text: v.text }))
      .sort((x, y) => x.name.localeCompare(y.name) || 0)
      .map((x) => {
        const on = shown.includes(x.code);
        return el("li", { class: on ? "shown" : "" },
          el("div", { class: "t-ans-text" }, x.name ? el("span", { class: "t-who-name", text: x.name }) : null, x.text),
          live ? el("button", { class: on ? "aero-btn-primary" : "", text: on ? "Showing" : "Show", "aria-pressed": on ? "true" : "false",
            onclick: () => link.send({ t: "show", qid: q.id, code: x.code, on: !on }) }) : null);
      })));
}

// the Questions list: every question asked, newest first; click to see its answers again
function renderQs() {
  const qs = (tstate && tstate.qs) || [];
  const a = tstate && tstate.live && tstate.live.ask;
  const key = qs.map((q) => q.id).join() + "|" + (viewQ ? viewQ.id : "") + "|" + (a ? a.id : "");
  if ($("lvQs")._key === key) return;
  $("lvQs")._key = key;
  $("lvQs").replaceChildren(...(qs.length ? qs.slice(0, 40).map((q) => el("li", {}, el("button", {
    "aria-pressed": (viewQ ? viewQ.id === q.id : a && a.id === q.id) ? "true" : "false",
    onclick: () => openSaved(q.id),
  },
    el("span", { text: (q.parts > 1 ? "Part " + q.part + "/" + q.parts + ": " : "") + (q.prompt.length > 70 ? q.prompt.slice(0, 68) + "…" : q.prompt) }),
    el("span", { class: "t-q-when", text: (a && a.id === q.id ? "Running now · " : "") + (q.block ? q.block + " · " : "") + new Date(q.startedAt).toLocaleDateString([], { weekday: "short", month: "short", day: "numeric" }) }))))
    : [el("li", { class: "t-hint", text: "Questions you ask show up here." })]));
}
async function openSaved(id) {
  const a = tstate.live && tstate.live.ask;
  askDraft = null;
  if (a && a.id === id) { viewQ = null; return renderAsk(); }
  try { viewQ = { id, answers: await tapi("/api/answers?q=" + encodeURIComponent(id)) }; } catch { return; }
  renderAsk();
}
function downloadAnswers(q, answers) {
  const c = (v) => '"' + String(v).replace(/"/g, '""') + '"';
  const rows = [["Name", "Code", "Answer"].map(c).join(",")];
  for (const [code, v] of Object.entries(answers)) rows.push([names[code] || "", code, v.text].map(c).join(","));
  const blob = new Blob(["Question: " + q.prompt.replace(/\s+/g, " ") + "\n" + rows.join("\n")], { type: "text/csv" });
  const u = URL.createObjectURL(blob);
  el("a", { href: u, download: "answers-" + new Date(q.startedAt).toISOString().slice(0, 10) + ".csv" }).click();
  setTimeout(() => URL.revokeObjectURL(u), 5000);
}
setInterval(() => { if (!$("liveView").hidden && tstate && tstate.live && tstate.live.ask) renderAsk(); }, 500);

// ---------- my notes: private, always showing beside the pages. One set for each lesson in each block;
// never sent to students or the TV. The same box moves between the lesson editor and the class view.
const notes = { lesson: null, period: "", periods: null, key: null, timer: null, ids: null };
const notesSelect = el("select", { "aria-label": "Notes for which class", onchange: () => { store("cl_notesBlock", notesSelect.value); notesShow(notes.lesson, notesSelect.value); } });
const notesText = el("textarea", { "aria-label": "My notes", disabled: true, placeholder: "Notes for you only. Students and the TV never see these.",
  oninput: () => { if (!notes.key) return; notesState.textContent = "Saving…"; clearTimeout(notes.timer); notes.timer = setTimeout(notesSave, 700); } });
const notesState = el("p", { class: "t-hint", style: "margin:4px 0 0" });
const notesBox = el("div", { class: "t-notesbox" }, el("h3", { text: "My notes" }), notesSelect, notesText, notesState);

async function notesLoadPeriods() {
  if (notes.periods) return;
  try { notes.periods = (await tapi("/api/roster")).periods || []; } catch { notes.periods = []; }
  notesSelect.replaceChildren(...(notes.periods.length ? notes.periods.map((p) => el("option", { value: p.id, text: p.name }))
    : [el("option", { value: "", text: "All classes" })]));
}
async function notesSave() {
  clearTimeout(notes.timer); notes.timer = null;
  if (!notes.key || !notes.ids) return;
  try {
    await tapi("/api/notes", { method: "PUT", headers: { "content-type": "application/json" },
      body: JSON.stringify({ lesson: notes.ids.lesson, period: notes.ids.period, text: notesText.value }) });
    if (!notes.timer) notesState.textContent = "Saved";
  } catch { notesState.textContent = "Couldn't save. Retrying…"; notes.timer = setTimeout(notesSave, 3000); }
}
// Show the notes for a lesson. period: a block to switch to, or leave out for the one used last.
async function notesShow(lessonId, period) {
  if (notes.timer) await notesSave();
  notes.lesson = lessonId; notes.key = null;
  notesText.disabled = true; notesText.value = "";
  await notesLoadPeriods();
  const ids = (notes.periods || []).map((p) => p.id);
  let pd = period !== undefined && period !== "" && ids.includes(period) ? period : store("cl_notesBlock");
  if (!ids.includes(pd)) pd = ids[0] || "";
  notesSelect.value = pd;
  if (period) store("cl_notesBlock", pd);
  notes.period = pd;
  const mine = lessonId;
  notesState.textContent = "Loading…";
  try {
    const r = await tapi("/api/notes?lesson=" + encodeURIComponent(lessonId) + "&period=" + encodeURIComponent(pd));
    if (notes.lesson !== mine || notes.period !== pd) return; // switched again while loading
    notesText.value = r.text || "";
    notes.ids = { lesson: lessonId, period: pd };
    notes.key = lessonId + ":" + pd;
    notesText.disabled = false;
    notesState.textContent = "Saved";
  } catch { notesState.textContent = "Couldn't load your notes."; }
}

// ---------- uploaded sims
let simsCache = null;
async function loadSims() {
  if (!simsCache) { try { simsCache = await tapi("/api/sims"); } catch { return []; } }
  return simsCache;
}
async function uploadSim(file, id) {
  if (file.size > 1_900_000) throw new Error("That file is too large (the limit is about 1.8 MB).");
  const headers = { "content-type": "text/html" };
  if (!id) headers["x-name"] = encodeURIComponent(file.name);
  const r = await tapi(id ? "/api/sims/" + id : "/api/sims", { method: id ? "PUT" : "POST", headers, body: file });
  simsCache = null;
  return r;
}

// ---------- live student list: only on a computer that has the name file, so the iPad/TV never shows it
function mmss(ms) { const t = Math.round(ms / 1000); return Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0"); }
// students of the block that is running (everyone, if the class was started without a block)
function blockStudents() {
  const L = tstate && tstate.live;
  const all = (tstate && tstate.students) || [];
  return L && L.periodName ? all.filter((x) => x.cls === L.periodName) : all;
}
function renderWho() {
  const show = !!(tstate && tstate.live && Object.keys(names).length);
  $("lvWho").hidden = !show;
  document.querySelector("#liveView .t-cols").classList.toggle("with-who", show);
  if (!show) return;
  const since = Date.now() - tstateAt;
  const rows = blockStudents().map((x) => ({ ...x, ms: x.ms + (x.away ? since : 0), name: shortName(names[x.code]) || x.code }));
  rows.sort((a, b) => (b.away - a.away) || (a.connected - b.connected) || (b.ms - a.ms) || a.name.localeCompare(b.name));
  const nAway = rows.filter((x) => x.away).length;
  const nOn = rows.filter((x) => x.connected).length;
  $("lvWhoNote").textContent = nOn + " of " + rows.length + " signed in" + (nAway ? " · " + nAway + " away now" : "");
  $("lvWhoList").replaceChildren(...rows.map((x) => el("li", { class: x.away ? "away" : x.connected ? "" : "gone" },
    el("div", { class: "t-who-name", text: x.name }),
    el("div", { class: "t-who-now", text: x.away ? "Away now" : x.connected ? "Here · page " + (x.page + 1) : "Not signed in" }),
    x.count ? el("div", { class: "t-who-sum", text: "Left " + x.count + (x.count === 1 ? " time" : " times") + " · " + mmss(x.ms) + " away" }) : null)));
}
setInterval(() => { if (!$("liveView").hidden && tstate && (tstate.students || []).some((x) => x.away)) renderWho(); }, 1000);

route();
// ---------------------------------------------------------------- students
// The server holds login codes only. Names come from a file on this computer
// and are kept in this browser alone; they are never sent anywhere.
const CODE_RE = /^\d{3}[a-z]{4,5}$/;
let names = {};
try { names = JSON.parse(localStorage.getItem("cl_names") || "{}") || {}; } catch { names = {}; }
let stDraft = [];

function shortName(full) {
  const parts = String(full || "").trim().split(/\s+/);
  if (!parts[0]) return "";
  return parts.length > 1 ? parts[0] + " " + parts[parts.length - 1][0].toUpperCase() + "." : parts[0];
}
function readNameFile(text) {
  const out = {};
  for (const line of text.split(/\r?\n/)) {
    const cells = line.split(",").map((c) => c.replace(/^\s*"|"\s*$/g, "").trim());
    const i = cells.findIndex((c) => CODE_RE.test(c.toLowerCase()));
    if (i < 0) continue;
    const who = cells.slice(i + 1).filter(Boolean).join(" ");
    if (who) out[cells[i].toLowerCase()] = who;
  }
  return out;
}
function stMsg(t) { $("stMsg").textContent = t || ""; }
function drawNamesNote() {
  const n = Object.keys(names).length;
  $("stNamesNote").textContent = n ? n + " names loaded on this computer." : "No names loaded. Printed pages will show codes only.";
  $("stForget").hidden = !n;
}
async function showStudents() {
  show("studentsView");
  stMsg(""); drawNamesNote();
  try {
    const r = await tapi("/api/roster");
    stDraft = r.periods.map((p) => ({ id: p.id, name: p.name, text: p.students.map((s) => s.code || "").filter(Boolean).join("\n"), count: p.students.length }));
  } catch (e) { stMsg(e.message); stDraft = []; }
  if (!stDraft.length) stDraft.push({ name: "", text: "", count: 0 });
  drawClasses();
}
function drawClasses() {
  $("stClasses").replaceChildren(...stDraft.map((p, i) => el("div", { class: "aero-panel st-card" },
    el("input", { type: "text", value: p.name, placeholder: "Class name, like 5th Block", "aria-label": "Class name", oninput: (e) => (p.name = e.target.value) }),
    el("textarea", { value: p.text, placeholder: "Login codes, one per line", "aria-label": "Login codes", oninput: (e) => (p.text = e.target.value) }),
    el("div", { class: "aero-muted", text: p.count + (p.count === 1 ? " student saved" : " students saved") }),
    el("div", { class: "t-row" },
      el("button", { class: "aero-btn-primary", text: "Print logins", onclick: () => printLogins(p) }),
      el("button", { text: "Remove this class", onclick: () => { stDraft.splice(i, 1); drawClasses(); stMsg("Click Save to remove it for good."); } })))));
}
function printLogins(p) {
  const codes = p.text.split("\n").map((c) => c.toLowerCase().replace(/\s+/g, "")).filter(Boolean);
  if (!codes.length) return stMsg("This class has no codes to print.");
  $("printArea").replaceChildren(...codes.map((c) => el("section", { class: "slip" },
    el("div", { class: "lab", text: (shortName(names[c]) ? shortName(names[c]) + ", your" : "Your") + " login code is:" }),
    el("div", { class: "code", text: c }),
    el("div", { class: "how", text: "Go to " + location.host + " and type your code." }),
    el("div", { class: "cls", text: p.name }))));
  print();
}
$("stBack").onclick = () => (location.hash = "#/");
$("stAdd").onclick = () => { stDraft.push({ name: "", text: "", count: 0 }); drawClasses(); };
$("stSave").onclick = async () => {
  stMsg("Saving…");
  try {
    await tapi("/api/roster", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ periods: stDraft.map((p) => ({ id: p.id, name: p.name, codes: p.text.split("\n") })) }) });
    await showStudents();
    stMsg("Saved.");
  } catch (e) { stMsg(e.message); }
};
$("stSignOut").onclick = async () => {
  if (!confirm("Sign out every student? They will need to type their code again.")) return;
  try { await tapi("/api/signout-all", { method: "POST" }); stMsg("All students are signed out."); } catch (e) { stMsg(e.message); }
};
$("stOpenNames").onclick = () => {
  const inp = el("input", { type: "file", accept: ".csv,text/csv" });
  inp.onchange = async () => {
    const f = inp.files[0]; if (!f) return;
    const got = readNameFile(await f.text());
    const n = Object.keys(got).length;
    if (!n) return stMsg("No codes with names were found. The file needs the code, then the first name, then the last name or initial.");
    names = { ...names, ...got }; // adds to the names already here; a code in this file replaces its old name
    try { localStorage.setItem("cl_names", JSON.stringify(names)); } catch {}
    drawNamesNote(); stMsg(n + " names added. " + Object.keys(names).length + " in all on this computer.");
  };
  inp.click();
};
$("stForget").onclick = () => {
  names = {}; try { localStorage.removeItem("cl_names"); } catch {}
  drawNamesNote(); stMsg("Names removed from this computer.");
};
</script>
</body>
