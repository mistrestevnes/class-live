<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Live</title>
<link rel="stylesheet" href="app.css?v=10">
<link rel="stylesheet" href="aerolab.css?v=6">
</head>
<body>
  <header class="cl-top aero-header">
    <h1 class="cl-title" id="title">Class Live</h1>
    <span class="cl-grow"></span>
    <span class="aero-chip" id="pageNum" hidden></span>
    <span class="aero-chip cl-status connecting" id="status">Connecting…</span>
  </header>

  <div class="cl-mid">
  <main class="cl-main">
    <div class="cl-center">
      <form class="aero-panel cl-message" id="login" hidden>
        <h1>Sign in</h1>
        <label class="cl-field"><span>Your code</span>
          <input type="text" id="code" autocomplete="off" autocapitalize="off" spellcheck="false" maxlength="12"></label>
        <button class="aero-btn-primary" id="signIn">Sign in</button>
        <p id="loginErr" class="cl-login-err" role="alert"></p>
      </form>
      <section class="aero-panel cl-message" id="waiting" hidden>
        <h1>Waiting for your teacher</h1>
        <p class="aero-muted">Keep this page open. It will change on its own when class starts.</p>
      </section>
      <section class="aero-panel" id="pageBox" hidden></section>
    </div>
  </main>
  <!-- questions that start on their own: they sit beside the sim, so the sim stays in use -->
  <aside class="aero-panel cl-sp" id="sp" hidden>
    <div class="cl-ask-top"><span class="cl-ask-label" id="spLabel">Question</span><button id="spMin" aria-label="Hide the question">Hide</button></div>
    <div class="cl-ask-prompt" id="spPrompt"></div>
    <div id="spMedia" hidden></div>
    <textarea id="spText" rows="6" aria-label="Your answer"></textarea>
    <div class="cl-ask-foot"><span id="spNote" class="aero-muted"></span><button class="aero-btn-primary" id="spSubmit">Submit</button></div>
  </aside>
  </div>

  <footer class="cl-bottom aero-bar" id="nav" hidden>
    <button id="back">◀ Back</button>
    <span id="navNote" class="aero-muted"></span>
    <button id="fs" hidden>⛶ Fullscreen</button>
    <button id="next" class="aero-btn-primary">Next ▶</button>
  </footer>

  <!-- covers the page when the teacher pauses or asks a question -->
  <div class="cl-cover" id="cover" hidden>
    <section class="aero-panel cl-cover-box" id="pausedBox" hidden>
      <h1>Paused</h1>
      <p>Eyes on your teacher.</p>
    </section>
    <section class="aero-panel cl-cover-box" id="showBox" hidden>
      <div class="cl-ask-label">Class answers</div>
      <div class="cl-ask-prompt" id="showPrompt"></div>
      <div class="cl-cards" id="showCards"></div>
    </section>
    <section class="aero-panel cl-cover-box" id="askBox" hidden>
      <div class="cl-ask-top"><span class="cl-ask-label" id="askLabel">Question</span><span class="cl-ask-time" id="askTime"></span></div>
      <div class="cl-ask-prompt" id="askPrompt"></div>
      <div id="askMedia" hidden></div>
      <textarea id="askText" rows="6" aria-label="Your answer"></textarea>
      <div class="cl-ask-foot"><span id="askNote" class="aero-muted"></span><button id="askToSim" hidden>Go back to the sim</button><button class="aero-btn-primary" id="askSubmit">Submit</button></div>
    </section>
  </div>

  <button class="aero-btn-primary cl-sptab" id="spTab" hidden>Show the question</button>

  <!-- when the teacher lets students use the sim while answering -->
  <div class="aero-panel cl-askback" id="askBack" hidden>
    <span id="askBackTime" class="cl-ask-time"></span>
    <button class="aero-btn-primary" id="askBackBtn">Back to the question</button>
  </div>

<script src="common.js?v=10"></script>
<script>
let sid = store("cl_sid");
if (!sid) { sid = randomId(12); store("cl_sid", sid); }

let stoken = store("cl_stoken");
const tok = () => (stoken ? "&stoken=" + encodeURIComponent(stoken) : "");
let state = { live: false };
let page = 0;              // which unlocked page this student is looking at
let sessionId = null;
let lastUnlocked = -1;
let pulse = false;

const $ = (id) => document.getElementById(id);

const link = new Link({
  wsUrl: () => (location.protocol === "https:" ? "wss://" : "ws://") + location.host + "/ws?role=student&sid=" + sid + "&page=" + page + tok(),
  poll: () => api("/api/s?sid=" + sid + "&page=" + page + tok()),
  post: (msg) => api("/api/s", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ sid, stoken, msg: { ...msg, page } }) }),
  pollMs: 3000,
  onMessage: (m) => { if (m.t === "state") apply(m.state); else if (m.t !== "tstate" && "live" in m) apply(m); },
  onMode: showMode,
});

// Tell the server when this tab is hidden (another tab or app) and when it comes back.
function reportAway() { if (stoken) link.send({ t: "away", away: document.hidden }); }
document.addEventListener("visibilitychange", reportAway);

function showMode(mode) {
  if (mode === "live" || mode === "polling") setTimeout(reportAway, 0); // catch up after reconnecting
  const s = $("status");
  s.className = "aero-chip cl-status " + mode + (mode === "offline" || mode === "connecting" ? " aero-chip-warn" : "");
  s.textContent = { live: "Connected", polling: "Connected", connecting: "Connecting…", offline: "Reconnecting…" }[mode];
}

function apply(s) {
  if (stoken && s.signedIn === false) return signOut(); // code removed or signed out by the teacher
  const prevUnlocked = lastUnlocked;
  state = s;
  if (typeof s.now === "number") clockSkew = s.now - Date.now();
  applyCover();
  renderSp();
  if (!s.live) {
    sessionId = null; lastUnlocked = -1;
    render();
    return;
  }
  if (s.sessionId !== sessionId) {
    // new class session: jump to the newest unlocked page
    sessionId = s.sessionId;
    page = s.unlocked;
    pulse = false;
    reportPage();
  } else if (s.unlocked > prevUnlocked && prevUnlocked >= 0 && page === prevUnlocked) {
    page = s.unlocked; // teacher just unlocked the next page: students on the newest page move along with it
    pulse = false;
    spKey = null;
    reportPage();
  }
  lastUnlocked = s.unlocked;
  if (page > s.unlocked) { page = s.unlocked; reportPage(); }
  render();
}

function reportPage() {
  if (link.ws && link.ws.readyState === 1) link.ws.send(JSON.stringify({ t: "page", page }));
  // when polling, the page number rides along with each check
}

function go(delta) {
  const n = page + delta;
  if (n < 0 || n > state.unlocked) return;
  page = n;
  if (delta > 0) pulse = false;
  reportPage();
  spKey = null;
  render();
  renderSp();
  document.querySelector(".cl-main").scrollTop = 0;
}
$("back").onclick = () => go(-1);
$("next").onclick = () => go(1);

function render() {
  $("login").hidden = true;
  const live = state.live && state.pages && state.pages.length;
  $("waiting").hidden = !!live;
  $("pageBox").hidden = !live;
  $("nav").hidden = !live;
  $("pageNum").hidden = !live;
  $("title").textContent = live ? state.title : "Class Live";
  document.title = live ? state.title : "Class Live";
  if (!live) return;

  const pg = state.pages[page];
  const box = $("pageBox");
  const hasPoll = (pg.blocks || []).some((b) => b.type === "poll");
  const closed = !!state.closed[pg.id];
  const mine = state.myVotes[pg.id];
  const opts = {
    myChoice: mine,
    closed,
    onVote: (choice) => {
      state.myVotes[pg.id] = choice; // show the choice right away
      render();
      link.send({ t: "vote", pageId: pg.id, choice });
    },
  };
  mountPage(box, pg, opts, hasPoll ? (poll) => poll.append(el("p", {
    class: "cl-note",
    text: closed ? (mine === undefined ? "Voting is closed." : "Voting is closed. Your answer was " + LETTERS[mine] + ".")
      : mine === undefined ? "Tap an answer." : "Your answer is saved. You can change it until your teacher closes voting.",
  })) : null);
  const onlySim = (pg.blocks || []).length === 1 && pg.blocks[0].type === "sim";
  box.style.padding = onlySim ? "10px" : "";
  // pages with a sim use the full screen width
  box.parentElement.style.maxWidth = (pg.blocks || []).some((b) => b.type === "sim") ? "none" : "";

  // fullscreen: the page's sim, or else its first image
  const fsTarget = box.querySelector(".cl-sim") || box.querySelector(".cl-figure");
  const fsGo = fsTarget && (fsTarget.requestFullscreen || fsTarget.webkitRequestFullscreen);
  $("fs").hidden = !fsGo;
  $("fs").onclick = () => { try { fsGo.call(fsTarget); } catch {} };

  $("pageNum").textContent = "Page " + (page + 1);
  $("back").disabled = page === 0;
  const canNext = page < state.unlocked;
  const atEnd = page >= state.total - 1;
  $("next").disabled = !canNext;
  $("next").classList.toggle("cl-pulse", canNext && pulse);
  $("navNote").textContent = canNext ? "" : atEnd ? "This is the last page." : "Wait for your teacher to unlock the next page.";
}

// ---------- pause and pushed questions
let clockSkew = 0;          // server time minus this computer's time
let askId = null, askDirty = false, askTimer = null, askSaveTimer = null, wasFrozen = false;
let askMin = false;         // the student stepped back to the sim (only when the teacher allows it)
let askEditing = false;     // the student is changing an answer they already submitted
const serverNow = () => Date.now() + clockSkew;
const clock = (sec) => Math.floor(sec / 60) + ":" + String(sec % 60).padStart(2, "0");

// Sims that know Class Live freeze when they get {classlive:"pause"} and carry on with {classlive:"resume"}.
function tellSims(cmd) {
  for (const f of document.querySelectorAll(".cl-sim iframe")) { try { f.contentWindow.postMessage({ classlive: cmd }, "*"); } catch {} }
}

// a picture or an animation that goes with a question
function setMedia(box, a) {
  box.replaceChildren();
  if (a.imageId) box.append(el("img", { src: "/img/" + a.imageId, alt: "" }));
  else if (a.sim) box.append(el("iframe", { src: a.sim, title: "Animation", allow: "autoplay; fullscreen" }));
  box.hidden = !box.firstChild;
}

function applyCover() {
  const live = !!state.live;
  const a = live ? state.ask : null;
  const sh = live ? state.show : null;
  const paused = live && (!!state.paused || !!state.qpaused);
  if (!a || a.id !== askId) { askMin = false; askEditing = false; }
  const askUp = !!a && !askMin;
  const frozen = paused || askUp || !!sh;
  $("cover").hidden = !frozen;
  $("pausedBox").hidden = !paused || askUp || !!sh;
  $("showBox").hidden = !sh;
  $("askBox").hidden = !askUp || !!sh; // answers on display take the middle; the question comes back after
  $("askBack").hidden = !(a && askMin && !frozen);
  if (sh) {
    $("showPrompt").replaceChildren(formatText(sh.prompt));
    $("showCards").replaceChildren(...sh.answers.map((t) => el("div", { class: "cl-card", text: t })));
  }
  if (frozen && document.fullscreenElement) { try { document.exitFullscreen(); } catch {} }
  if (frozen !== wasFrozen) { tellSims(frozen ? "pause" : "resume"); wasFrozen = frozen; }
  if (!a) {
    if (askId && askDirty) saveAsk(); // paused or closed while typing: keep what they wrote
    askId = null; clearInterval(askTimer); askTimer = null; return;
  }
  $("askToSim").hidden = !a.allowSim;
  $("askLabel").textContent = a.parts > 1 ? "Question · part " + a.part + " of " + a.parts : "Question";
  if (a.id !== askId) {
    askId = a.id; askDirty = false;
    $("askPrompt").replaceChildren(formatText(a.prompt));
    setMedia($("askMedia"), a);
    $("askText").value = a.mine || "";
    $("askText").disabled = false;
    $("askNote").textContent = "";
    if (askUp) setTimeout(() => $("askText").focus(), 50);
  }
  clearInterval(askTimer);
  askTimer = setInterval(tickAsk, 250);
  tickAsk();
}
function tickAsk() {
  const a = state.ask;
  if (!a) return;
  const left = a.endsAt - serverNow();
  const over = left <= 0;
  const t = Math.max(0, Math.ceil(left / 1000));
  $("askTime").textContent = over ? "Time's up" : clock(t);
  $("askBackTime").textContent = over ? "Time's up" : clock(t);
  if (over && askMin) { askMin = false; applyCover(); return; } // time ran out while they were on the sim: bring the question back
  if (over) {
    if (!$("askText").disabled) { if (askDirty) saveAsk(); $("askText").disabled = true; }
    $("askText").readOnly = false;
    $("askSubmit").disabled = true;
    $("askSubmit").textContent = "Submit";
    $("askNote").textContent = $("askText").value.trim() ? "Your answer was saved." : "Time ran out.";
    clearInterval(askTimer); askTimer = null;
    return;
  }
  const done = !!a.done && !askEditing;
  $("askText").disabled = false;
  $("askText").readOnly = done;
  $("askSubmit").disabled = false;
  $("askSubmit").textContent = done ? "Change my answer" : "Submit";
  $("askNote").textContent = done ? (a.part < a.parts ? "Submitted. Wait for the next part." : "Submitted.") : "";
}
function saveAsk() {
  if (!askId) return;
  askDirty = false;
  link.send({ t: "askAnswer", qid: askId, text: $("askText").value });
}
$("askText").oninput = () => {
  askDirty = true;
  clearTimeout(askSaveTimer);
  askSaveTimer = setTimeout(() => { if (askDirty) saveAsk(); }, 2000); // saves as they type
};
$("askSubmit").onclick = () => {
  const a = state.ask;
  if (!a || !askId) return;
  if (a.done && !askEditing) { askEditing = true; tickAsk(); $("askText").focus(); return; } // change a submitted answer
  askDirty = false; clearTimeout(askSaveTimer);
  link.send({ t: "askSubmit", qid: askId, text: $("askText").value });
  a.done = true; askEditing = false;
  tickAsk();
};
$("askToSim").onclick = () => { if (askDirty) saveAsk(); askMin = true; applyCover(); };
$("askBackBtn").onclick = () => { askMin = false; applyCover(); };

// ---------- questions that start on their own (a sim event, or after another question). Answered at the student's own pace.
const simEvents = {};       // pageId -> events the sim on that page has reported
const cmdSent = new Set();  // commands already sent to the sim
let spMinimized = false, spKey = null, spDirty = false, spSaveTimer = null;
const spAnswers = () => state.spMine || (state.spMine = {});
const spDone = (q, mine) => q.parts.every((_, i) => (mine[q.id + "." + i] || {}).done);
const spDoneAt = (q, mine) => Math.max(0, ...q.parts.map((_, i) => (mine[q.id + "." + i] || {}).at || 0));

window.addEventListener("message", (e) => {
  const d = e.data, name = d && d.classliveEvent;
  if (typeof name !== "string" || !state.pages) return;
  const fr = [...document.querySelectorAll(".cl-sim iframe")].find((f) => f.contentWindow === e.source);
  if (!fr) return; // only the sim on this page counts
  const pg = state.pages[page];
  if (!pg) return;
  if (name === "ready") { for (const k of [...cmdSent]) if (k.startsWith(pg.id + ".")) cmdSent.delete(k); }
  else (simEvents[pg.id] ||= {})[name.slice(0, 40)] = true;
  renderSp();
});

function sendSimCommands(pg, mine) {
  for (const q of pg.questions || []) {
    const k = pg.id + "." + q.id + "." + q.command;
    if (!q.command || cmdSent.has(k) || !spDone(q, mine)) continue;
    cmdSent.add(k);
    for (const f of document.querySelectorAll(".cl-sim iframe")) { try { f.contentWindow.postMessage({ classliveCommand: q.command }, "*"); } catch {} }
  }
}

function renderSp() {
  const pg = state.live && state.pages && state.pages[page];
  const qs = (pg && pg.questions) || [];
  const mine = spAnswers();
  let cur = null, recent = null;
  if (qs.length) {
    sendSimCommands(pg, mine);
    for (const q of qs) {
      const done = spDone(q, mine);
      const began = q.parts.some((_, i) => mine[q.id + "." + i]);
      let on = began;
      if (!on && q.trigger.type === "sim") on = !!(simEvents[pg.id] || {})[q.trigger.event];
      if (!on && q.trigger.type === "after") {
        const prev = qs.find((x) => x.id === q.trigger.afterId);
        on = !!prev && spDone(prev, mine) && serverNow() >= spDoneAt(prev, mine) + q.trigger.delay * 1000;
      }
      if (!on) continue;
      if (!done) { cur = { q }; break; }
      if (serverNow() - spDoneAt(q, mine) < 3000) recent = { q };
    }
  }
  const use = cur || recent;
  const showing = !!use && !(state.paused || state.qpaused);
  $("sp").hidden = !showing || spMinimized;
  $("spTab").hidden = !showing || !spMinimized;
  document.body.classList.toggle("sp-open", showing && !spMinimized);
  if (!showing) { spKey = null; return; }
  const q = use.q;
  const idx = cur ? q.parts.findIndex((_, i) => !(mine[q.id + "." + i] || {}).done) : q.parts.length - 1;
  const part = q.parts[idx], key = pg.id + "." + q.id + "." + idx;
  const finished = !cur;
  if (key !== spKey) {
    spKey = key; spDirty = false; spMinimized = false;
    $("sp").hidden = false; $("spTab").hidden = true; document.body.classList.add("sp-open");
    $("spLabel").textContent = q.parts.length > 1 ? "Question · part " + (idx + 1) + " of " + q.parts.length : "Question";
    $("spPrompt").replaceChildren(formatText(part.prompt));
    setMedia($("spMedia"), part);
    $("spText").value = (mine[q.id + "." + idx] || {}).text || "";
  }
  $("spText").readOnly = finished;
  $("spSubmit").hidden = finished;
  $("spSubmit").disabled = !$("spText").value.trim();
  $("spNote").textContent = finished ? "Submitted." : "";
}
function spSave(submit) {
  const pg = state.pages[page];
  const parts = spKey && spKey.split(".");
  if (!parts || parts[0] !== pg.id) return;
  const qid = parts[1], idx = Number(parts[2]);
  spDirty = false; clearTimeout(spSaveTimer);
  link.send({ t: submit ? "spSubmit" : "spAnswer", pageId: pg.id, qid, idx, text: $("spText").value });
  if (submit) { spAnswers()[qid + "." + idx] = { text: $("spText").value, done: true, at: serverNow() }; renderSp(); }
}
$("spText").oninput = () => {
  spDirty = true;
  $("spSubmit").disabled = !$("spText").value.trim();
  clearTimeout(spSaveTimer);
  spSaveTimer = setTimeout(() => { if (spDirty) spSave(false); }, 2000);
};
$("spSubmit").onclick = () => { if ($("spText").value.trim()) spSave(true); };
$("spMin").onclick = () => { if (spDirty) spSave(false); spMinimized = true; renderSp(); };
$("spTab").onclick = () => { spMinimized = false; renderSp(); };
setInterval(renderSp, 500);

// ---------- sign in: the student's code alone
function signOut() { store("cl_stoken", null); location.reload(); }
$("login").onsubmit = async (e) => {
  e.preventDefault();
  $("loginErr").textContent = "";
  $("signIn").disabled = true;
  try {
    const r = await api("/api/slogin", { method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ code: $("code").value, sid }) });
    stoken = r.token; store("cl_stoken", stoken);
    $("code").value = "";
    $("login").hidden = true; $("waiting").hidden = false;
    link.start();
  } catch (x) { $("loginErr").textContent = x.message; }
  $("signIn").disabled = false;
};
if (stoken) { $("waiting").hidden = false; link.start(); }
else { $("login").hidden = false; $("code").focus(); }
</script>
</body>
</html>
