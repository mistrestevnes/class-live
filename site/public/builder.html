<!doctype html>
<html lang="en" class="teacher builder">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Class Live · Page builder</title>
<link rel="stylesheet" href="app.css?v=40">
<link rel="stylesheet" href="teacher.css?v=15">
<link rel="stylesheet" href="aerolab.css?v=6">
<style>
  html.builder { --edge: 16px; }
  html.builder body { overflow: hidden; }
  .b-top { flex: none; margin: 0 0 8px; gap: 10px; flex-wrap: nowrap; }
  .b-top .t-title-input { flex: 1; min-width: 120px; }
  .b-canvas { flex: 1; min-height: 0; overflow: hidden; margin: 0; padding: 76px var(--padR, 350px) 64px 40px; }
  .b-canvas { position: relative; }
  .t-cb-sim .t-body, .t-cb-sim .t-body * { pointer-events: none !important; }
  #bStateNum { position: absolute; left: 40px; right: var(--padR, 350px); top: 22px; text-align: center; font: 700 30px Helvetica, Arial, sans-serif; line-height: 1.1; pointer-events: none; }
  .b-sheet { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  .b-win { position: fixed; z-index: 20; display: flex; flex-direction: column; padding: 0; max-height: calc(100vh - 150px); box-shadow: 0 8px 28px rgba(0, 0, 0, .4); }
  .b-win-head { display: flex; align-items: center; gap: 8px; padding: 6px 8px 6px 12px; cursor: grab; touch-action: none; user-select: none; font-size: 12px; font-weight: 700; font-family: Helvetica, Arial, sans-serif; }
  .b-win-head .t-title { flex: 1; }
  .b-win-body { overflow: auto; padding: 4px 12px 12px; }
  .b-win.min .b-win-body { display: none; }
  .b-win.min { width: auto !important; }
  .b-canvas { margin-left: calc(var(--side, 264px) + 8px); }
  .b-side { position: fixed; left: 16px; top: 62px; bottom: 16px; width: var(--side, 264px); z-index: 20; display: flex; flex-direction: column; padding: 8px 10px; box-sizing: border-box; }
  .b-side-title { font: 700 12px Helvetica, Arial, sans-serif; margin: 0 0 6px; }
  .b-thumbs { list-style: none; margin: 0; padding: 0 4px 0 0; flex: 1 1 0; min-height: 0; overflow-y: auto; }
  .b-thumbs li { margin: 0 0 10px; }
  .b-thumbs button { display: block; width: 100%; padding: 0; border: 0; background: none; cursor: pointer; text-align: left; min-height: 0; }
  .b-thumbs .b-tlabel { display: block; font: 700 12px Helvetica, Arial, sans-serif; margin: 0 0 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .b-thumb { position: relative; width: 100%; aspect-ratio: 1366 / 599; overflow: hidden; border-radius: 4px; outline: 2px solid rgba(0, 0, 0, .2); background: #FFFFFF; }
  .b-thumb > * { pointer-events: none; }
  .b-thumbs button[aria-pressed="true"], .b-thumbs button:hover { background: none !important; color: inherit !important; }
  .b-thumbs button[aria-pressed="true"] .b-thumb { outline: 4px solid #17A673; }
  .b-side-tools { flex: none; border-top: 1px solid rgba(0, 0, 0, .15); padding-top: 8px; max-height: 45%; overflow-y: auto; }
  .b-side .cl-field { display: block; margin-bottom: 8px; }
  .b-side .cl-field span { font-size: 12px; font-weight: 700; display: block; margin-bottom: 2px; }
  .b-side h3 { font-size: 13px; }
  .b-pal { display: flex; flex-direction: column; gap: 4px; }
  .b-pal button, html.teacher .b-pal .t-pal { font-size: 12px !important; padding: 3px 8px !important; min-height: 0 !important; text-align: left; }
  #winTools.b-adding { width: auto; }
  #winTools { right: 36px; top: 96px; width: 290px; }
  .b-win .t-pages { margin-bottom: 8px; }
  .b-win .t-pages button { padding: 4px 8px; font-size: 12px; }
  .b-win .t-pages button .t-num { width: 24px; height: 24px; font-size: 12px; }
  .b-win .cl-field { display: block; margin-bottom: 10px; }
  .b-win .cl-field span { font-size: 12px; font-weight: 700; display: block; margin-bottom: 2px; }
  .b-win h3 { font-size: 13px; }
  .b-win .t-block-head { margin-bottom: 8px; }
  #bPreview { position: fixed; inset: 0; z-index: 50; background: #0b1a14; display: flex; flex-direction: column; }
  #bPreview .aero-bar { margin: 8px 12px; flex: none; gap: 10px; }
  #bPreviewHold { flex: 1; min-height: 0; position: relative; overflow: hidden; }
  #bPreviewHold iframe { position: absolute; left: 0; top: 0; width: 1366px; height: 599px; border: 0; transform-origin: 0 0; border-radius: 8px; }
  .t-media .cl-figure.size-full { flex: 1 1 100%; }

  /* the page being built: everything sized in canvas units, so lines and handles use --is (1 / scale) to stay the same size on screen */
  .t-fit { overflow: visible; box-shadow: 0 3px 16px rgba(0, 0, 0, .35); }
  .t-canvas { outline: 1px solid rgba(0, 0, 0, .25); overflow: visible !important; }
  .t-cb { overflow: visible; cursor: pointer; }
  .t-cb:not(.sel) { touch-action: none; }
  .t-cb:not(.sel) > .t-body > * { pointer-events: none; }
  .t-cb:not(.sel):hover { outline: calc(3px * var(--is, 1.6)) dashed rgba(23, 166, 115, .75); outline-offset: calc(2px * var(--is, 1.6)); }
  .t-cb.sel { outline: calc(3px * var(--is, 1.6)) solid #17A673; cursor: default; }
  .t-body { position: absolute; inset: 0; overflow: hidden; }
  .t-cb-poll.sel > .t-body, .t-cb-question.sel > .t-body { overflow: auto; }
  .t-ta { display: block; width: 100%; height: 100%; box-sizing: border-box; padding: 8px 14px; border: 0; outline: 0; background: transparent; color: inherit; font: inherit; line-height: 1.4; resize: none; overflow: auto; }
  .t-ta.cl-chead { font-weight: 700; line-height: 1.2; }
  .t-ph { padding: 8px 14px; opacity: .45; }
  .t-rich.t-in { font-weight: inherit !important; }
  .t-float { position: absolute; z-index: 5; pointer-events: none; border: 3px dashed rgba(180, 35, 24, .8); border-radius: 10px; background: rgba(255, 255, 255, .55); color: #B42318;
    display: flex; align-items: center; justify-content: center; font: 700 26px Helvetica, Arial, sans-serif; box-sizing: border-box; }
  .t-float-time { left: 50%; top: 9px; width: 190px; height: 66px; transform: translateX(-50%); }
  .t-float-nav { right: 28px; bottom: 28px; width: 445px; height: 66px; }
  .t-rich { white-space: pre-wrap; outline: 0; cursor: text; min-height: 1.4em; }
  .t-rich b { font-weight: 700; } .t-rich i { font-style: italic; font-weight: inherit; } .t-rich b i { font-weight: 700; }
  .t-rich.t-empty::before { content: attr(data-ph); opacity: .45; pointer-events: none; }
  .t-poll, .t-qedit { font-size: 30px; }
  .t-cb.over > .t-body { outline: calc(3px * var(--is, 1.6)) dashed #C0392B; outline-offset: calc(-3px * var(--is, 1.6)); }
  .t-cb.over::after { content: "Text is cut off. Make the box bigger or the text smaller."; position: absolute; left: 0; top: 100%; margin-top: calc(6px * var(--is, 1.6)); z-index: 6; font: 700 calc(13px * var(--is, 1.6)) Helvetica, Arial, sans-serif; color: #FFFFFF; background: #C0392B; padding: calc(3px * var(--is, 1.6)) calc(8px * var(--is, 1.6)); border-radius: calc(4px * var(--is, 1.6)); white-space: nowrap; }
  .t-bar { position: absolute; left: 0; bottom: 100%; margin-bottom: calc(6px * var(--is, 1.6)); display: flex; gap: calc(6px * var(--is, 1.6)); z-index: 6; }
  .t-bar button { font-size: calc(13px * var(--is, 1.6)); padding: calc(5px * var(--is, 1.6)) calc(12px * var(--is, 1.6)); min-height: 0 !important; line-height: 1.2; touch-action: none; white-space: nowrap; }
  .t-mv { cursor: grab; }
  .t-h { position: absolute; width: calc(30px * var(--is, 1.6)); height: calc(30px * var(--is, 1.6)); margin: calc(-15px * var(--is, 1.6)) 0 0 calc(-15px * var(--is, 1.6)); touch-action: none; z-index: 6; }
  .t-h::after { content: ""; position: absolute; inset: calc(8px * var(--is, 1.6)); background: #FFFFFF; border: calc(2px * var(--is, 1.6)) solid #17A673; border-radius: 50%; box-sizing: border-box; }
  .t-h-nw { left: 0; top: 0; cursor: nwse-resize; } .t-h-n { left: 50%; top: 0; cursor: ns-resize; } .t-h-ne { left: 100%; top: 0; cursor: nesw-resize; } .t-h-e { left: 100%; top: 50%; cursor: ew-resize; }
  .t-h-se { left: 100%; top: 100%; cursor: nwse-resize; } .t-h-s { left: 50%; top: 100%; cursor: ns-resize; } .t-h-sw { left: 0; top: 100%; cursor: nesw-resize; } .t-h-w { left: 0; top: 50%; cursor: ew-resize; }
  .t-guides { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .t-gv, .t-gh { position: absolute; background: #D6336C; }
  .t-gv { top: 0; bottom: 0; width: calc(2px * var(--is, 1.6)); margin-left: calc(-1px * var(--is, 1.6)); }
  .t-gh { left: 0; right: 0; height: calc(2px * var(--is, 1.6)); margin-top: calc(-1px * var(--is, 1.6)); }
  .t-canvas .t-small { font-size: calc(14px * var(--is, 1.6)); min-height: 0; padding: calc(4px * var(--is, 1.6)) calc(10px * var(--is, 1.6)); }
  .t-swatches { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .t-sw { width: 28px; height: 28px; min-height: 0 !important; padding: 0 !important; border-radius: 50%; border: 2px solid var(--aero-btn-border); }
  .t-swatches input[type=color] { width: 40px; height: 32px; padding: 0; border: 1px solid var(--aero-btn-border); background: none; }
  .t-sizerow { display: flex; align-items: center; gap: 6px; }
  .t-sizerow input { width: 70px; }
  #pvQ button, #pvS button { padding: 2px 10px; }
  #pvS button[aria-pressed="true"] { background: var(--aero-emerald, #1f6b4f); color: #fff; }
  .b-states { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .b-states button { padding: 3px 10px; font-size: 12px; min-height: 0; }
  .b-states button[aria-pressed="true"] { background: var(--aero-emerald, #1f6b4f); color: #fff; }
  .t-cb.t-off > .t-body { opacity: .28; }
  .t-lockbadge { position: absolute; right: 0; top: 0; z-index: 5; padding: calc(4px * var(--is, 1.6)) calc(10px * var(--is, 1.6)); font: 700 calc(14px * var(--is, 1.6)) Helvetica, Arial, sans-serif; color: #FFFFFF; background: #8A5A00; pointer-events: none; }
  .b-statelist { margin: 0 0 10px; }
  .b-staterow { display: flex; gap: 6px; align-items: center; margin-bottom: 6px; }
  .b-staterow input[type=text] { flex: 1; min-width: 0; }
  .b-checks label { display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 700; margin-bottom: 4px; }
  .b-checks input { width: 18px; height: 18px; }
  #pvQ button[aria-pressed="true"] { background: var(--aero-emerald, #1f6b4f); color: #fff; }
  #bTools .t-small[aria-pressed="true"] { background: var(--aero-emerald, #1f6b4f); color: #fff; }
  .t-cb-question .cl-inline { width: auto; max-height: none; margin: 0; height: 100%; box-sizing: border-box; padding: 20px 26px; border: 2px solid var(--aero-emerald); background: var(--aero-well); box-shadow: none; font-size: 30px; display: flex; flex-direction: column; overflow: auto; }
  .t-cb-question .cl-inline textarea { flex: 1 1 auto; min-height: 90px; height: auto; resize: none; font-size: 30px; }
  .t-cb-question .cl-ask-foot { flex: none; }
  .b-msg { margin: 60px auto; max-width: 520px; padding: 20px; }
</style>
</head>
<body>

<header class="aero-bar b-top" id="bTop" hidden>
  <button id="bBack">◀ Lessons</button>
  <input type="text" id="bTitle" class="t-title-input" aria-label="Lesson title">
  <span class="aero-chip" id="saveState">Saved</span>
  <span id="bStates" class="b-states"></span>
  <button id="bPlan" title="Plan items, questions and notes for this lesson">Plan &amp; questions</button>
  <button class="aero-btn-primary" id="bPreviewBtn">Preview</button>
</header>

<main class="aero-panel b-canvas" id="bCanvas" hidden>
  <div id="bStateNum" hidden></div>
  <div class="b-sheet" id="bSheet"></div>
</main>

<aside class="aero-panel b-side" id="winPages" hidden>
  <div class="b-side-title" id="winPagesTitle">Pages</div>
  <ul class="b-thumbs" id="bPages"></ul>
  <div class="b-side-tools">
    <div class="t-row" style="margin-bottom:8px;flex-wrap:wrap;gap:6px">
      <button class="t-small" id="pgAdd">+ Page</button>
      <button class="t-small" id="pgUp" aria-label="Move page up">▲</button>
      <button class="t-small" id="pgDown" aria-label="Move page down">▼</button>
      <button class="t-small" id="pgDup">Copy</button>
      <button class="t-small" id="pgDel">Delete</button>
    </div>
    <label class="cl-field"><span>Page name (only you see this)</span><input type="text" id="pgName"></label>
    <div class="b-statelist" id="bStateList"></div>
  </div>
</aside>

<aside class="aero-panel b-win" id="winTools" hidden>
  <div class="b-win-head"><span class="t-title" id="winToolsTitle">Add to the page</span><button class="t-small" id="winToolsMin" aria-label="Open or close the Tools window">▾</button></div>
  <div class="b-win-body" id="bTools"></div>
</aside>

<section class="aero-panel b-msg" id="bMsg" hidden></section>

<div id="bPreview" hidden>
  <div class="aero-bar">
    <button class="aero-btn-primary" id="pvBack">◀ Back to building</button>
    <button id="pvPrev">◀ Page</button>
    <button id="pvNext">Page ▶</button>
    <span id="pvLabel" style="font-weight:700"></span>
    <span id="pvS" class="t-row" style="gap:6px"></span>
    <span id="pvQ" class="t-row" style="gap:6px"></span>
    <span id="pvV" class="t-row" style="gap:6px"></span>
    <span class="cl-grow"></span>
    <span class="t-hint">The real student page at Chromebook size. Pick a question to see it as students do once you open it.</span>
  </div>
  <div id="bPreviewHold"></div>
</div>

<script src="common.js?v=36"></script>
<script>
const $ = (id) => document.getElementById(id);
let token = store("cl_token");
const params = new URLSearchParams(location.search);
const lessonId = (params.get("id") || "").replace(/[^a-z0-9]/gi, "");
const toTeacher = (hash) => { location.href = "/teacher" + (hash || ""); };
const tapi = (path, opts = {}) => api(path, { ...opts, headers: { "x-token": token || "", ...(opts.headers || {}) } }).catch((e) => {
  if (e.status === 401) { store("cl_token", null); toTeacher(); }
  throw e;
});

let ed = null, edPage = 0, edSel = null, edSaveTimer = null;
const BLOCK_NAMES = { heading: "Heading", text: "Text", image: "Picture", poll: "Poll", sim: "Sim", video: "Video", question: "Question" };
const PALETTE = [["heading", "Heading"], ["text", "Text"], ["image", "Picture"], ["sim", "Sim"], ["video", "Video"], ["poll", "Poll"], ["question", "Question"]];
const newId = () => Math.random().toString(36).slice(2, 10).replace(/[^a-z0-9]/g, "x");
const grow = (t) => { t.style.height = "auto"; t.style.height = t.scrollHeight + "px"; };
const mb = (n) => (n / 1e6 >= 10 ? Math.round(n / 1e6) : (n / 1e6).toFixed(1)) + " MB";

const newPage = newCanvasPage;
function newBlock(type) {
  const [w, h] = BLOCK_START[type];
  const base = { type, x: 0, y: 0, w, h };
  if (type === "poll") return { ...base, question: "", options: ["", ""] };
  if (type === "image") return { ...base, imageId: "", caption: "" };
  if (type === "sim") return { ...base, url: "" };
  if (type === "video") return { ...base, videoId: "", caption: "" };
  if (type === "question") return { ...base, id: newId(), prompt: "", min: 3, kind: "text", options: ["", ""] };
  return { ...base, text: "", size: type === "heading" ? HEAD_SIZE : TEXT_SIZE, color: "" };
}
function pageLabel(p, i) {
  if (p.name) return p.name;
  const h = (p.blocks || []).find((b) => (b.type === "heading" || b.type === "text") && b.text && b.text.trim());
  if (h) return h.text.trim().split("\n")[0].slice(0, 60);
  const poll = (p.blocks || []).find((b) => b.type === "poll");
  if (poll) return "Poll: " + (poll.question || "").slice(0, 50);
  return "Page " + (i + 1);
}

// ---------------------------------------------------------------- saving (one save at a time, in order)
function setSave(text) { $("saveState").textContent = text; $("saveState").classList.toggle("aero-chip-warn", /n't/.test(text)); }
function changed() { if (ed) thumbsSoon(); setSave("Saving…"); clearTimeout(edSaveTimer); edSaveTimer = setTimeout(saveNow, 700); }
let saveChain = Promise.resolve();
function saveNow() {
  clearTimeout(edSaveTimer); edSaveTimer = null;
  if (!ed) return saveChain;
  const id = ed.id, body = JSON.stringify(ed);
  saveChain = saveChain.then(async () => {
    try {
      await tapi("/api/lessons/" + id, { method: "PUT", headers: { "content-type": "application/json" }, body });
      if (!edSaveTimer) setSave("Saved");
    } catch (e) {
      setSave("Couldn't save. Retrying…");
      if (!edSaveTimer) edSaveTimer = setTimeout(saveNow, 3000);
    }
  });
  return saveChain;
}
window.addEventListener("beforeunload", (e) => { if (edSaveTimer) { saveNow(); e.preventDefault(); } });

function askYesNo(text, yes) {
  return new Promise((resolve) => {
    const done = (v) => { ov.remove(); resolve(v); };
    const ov = el("div", { class: "cl-cover", role: "dialog", "aria-label": yes },
      el("section", { class: "aero-panel cl-cover-box t-pick" },
        el("h2", { text }),
        el("button", { class: "aero-btn-primary", text: yes, onclick: () => done(true) }),
        el("button", { text: "Cancel", onclick: () => done(false) })));
    document.body.append(ov);
  });
}

// ---------------------------------------------------------------- floating windows
function makeWin(win, onToggle) {
  const head = win.querySelector(".b-win-head");
  const btn = head.querySelector("button");
  btn.onclick = () => { win.classList.toggle("min"); onToggle(); };
  head.onpointerdown = (e) => {
    if (e.target.closest("button") || e.button > 0) return;
    const r = win.getBoundingClientRect(), dx = e.clientX - r.left, dy = e.clientY - r.top;
    win.style.left = r.left + "px"; win.style.top = r.top + "px"; win.style.right = "auto";
    head.setPointerCapture(e.pointerId);
    head.style.cursor = "grabbing";
    const move = (ev) => {
      const w = win.offsetWidth;
      win.style.left = Math.max(20, Math.min(innerWidth - w - 20, ev.clientX - dx)) + "px";
      win.style.top = Math.max(20, Math.min(innerHeight - 70, ev.clientY - dy)) + "px";
    };
    const up = () => { head.style.cursor = ""; head.removeEventListener("pointermove", move); head.removeEventListener("pointerup", up); head.removeEventListener("pointercancel", up); };
    head.addEventListener("pointermove", move); head.addEventListener("pointerup", up); head.addEventListener("pointercancel", up);
  };
}
function fitCanvas() {
  const w = $("winTools");
  $("bCanvas").style.setProperty("--padR", (w.hidden ? 40 : w.offsetWidth + 56) + "px"); // the page uses all the room left of the tools window
}
makeWin($("winTools"), fitCanvas);

// ---------------------------------------------------------------- the pages window
const thumbBoxes = new Map(); // page id -> its thumbnail, kept so an unchanged page isn't drawn again (and its sims don't reload)
let thumbTimer = null;
function drawThumbs() {
  clearTimeout(thumbTimer); thumbTimer = null;
  for (const p of ed.pages) {
    const box = thumbBoxes.get(p.id);
    if (box && box.isConnected) { try { mountPage(box, p, { stateId: pageStates(p)[0].id, preview: true, edit: { simPreview: true } }); } catch {} }
  }
}
const thumbsSoon = () => { clearTimeout(thumbTimer); thumbTimer = setTimeout(drawThumbs, 900); };
function renderPages() {
  const ids = new Set(ed.pages.map((p) => p.id));
  for (const k of [...thumbBoxes.keys()]) if (!ids.has(k)) thumbBoxes.delete(k);
  $("bPages").replaceChildren(...ed.pages.map((p, i) => {
    let box = thumbBoxes.get(p.id);
    if (!box) { box = el("div", { class: "b-thumb", inert: "" }); thumbBoxes.set(p.id, box); }
    return el("li", {},
      el("button", { "aria-pressed": i === edPage ? "true" : "false", onclick: () => { edPage = i; edSel = null; renderAll(); } },
        el("span", { class: "b-tlabel t-label", text: (i + 1) + ". " + pageLabel(p, i) }), box));
  }));
  $("pgUp").disabled = edPage === 0;
  $("pgDown").disabled = edPage === ed.pages.length - 1;
  $("winPagesTitle").textContent = "Pages · " + (edPage + 1) + " of " + ed.pages.length;
  const pn = $("pgName");
  if (document.activeElement !== pn) pn.value = ed.pages[edPage].name || "";
  pn.placeholder = pageLabel({ blocks: ed.pages[edPage].blocks }, edPage);
  thumbsSoon();
  const cur = $("bPages").children[edPage];
  if (cur) cur.scrollIntoView({ block: "nearest" });
}
function refreshPageLabels() {
  const labels = $("bPages").querySelectorAll(".t-label");
  ed.pages.forEach((p, i) => { if (labels[i]) labels[i].textContent = (i + 1) + ". " + pageLabel(p, i); });
}
$("pgName").oninput = (e) => { ed.pages[edPage].name = e.target.value; changed(); refreshPageLabels(); };
$("pgAdd").onclick = () => { ed.pages.splice(edPage + 1, 0, newPage()); edPage++; edSel = null; changed(); renderAll(); };
$("pgDup").onclick = () => {
  const copy = JSON.parse(JSON.stringify(ed.pages[edPage])); copy.id = randomId(8);
  for (const b of copy.blocks || []) if (b.type === "question") b.id = newId();
  ed.pages.splice(edPage + 1, 0, copy); edPage++; edSel = null; changed(); renderAll();
};
$("pgDel").onclick = async () => {
  if (ed.pages.length === 1) { await askYesNo("A lesson needs at least one page.", "OK"); return; }
  if (!(await askYesNo("Delete page " + (edPage + 1) + "?", "Delete"))) return;
  ed.pages.splice(edPage, 1); edPage = Math.min(edPage, ed.pages.length - 1); edSel = null; changed(); renderAll();
};
$("pgUp").onclick = () => movePage(-1);
$("pgDown").onclick = () => movePage(1);
function movePage(d) {
  const j = edPage + d;
  if (j < 0 || j >= ed.pages.length) return;

  return t.split(",").map((w) => w.trim()).filter(Boolean).map((w) => ({ label: w, msg: /^\d+$/.test(w) ? { classlive: "state", n: +w } : { classlive: "state", state: w } }));
}
function simShowsField(b) {
  const row = el("div", { class: "t-row", style: "flex-wrap:wrap;gap:6px" });
  const fill = () => {
    const list = simList(b);
    row.replaceChildren(...(list.length ? [el("span", { style: "font-weight:700", text: "Sim shows:" })] : []), ...list.map((x) => el("button", {
      class: "t-small", "aria-pressed": String(simOverride.has(b) && JSON.stringify(simOverride.get(b)) === JSON.stringify(x.msg)), text: x.label,
      onclick: () => {
        const f = fitBox && [...fitBox.querySelectorAll(".cl-sim iframe")].find((i) => i._clBlock === b);
        if (!f) return;
        simOverride.set(b, x.msg); f._clMsg = x.msg; postSimState(f); fill();
      } })));
  };
  fill();
  return el("div", { class: "cl-field" }, el("span", { text: "Sim states" }),
    el("input", { type: "text", value: b.simList || "", placeholder: "arrows, closeup   or   2", autocapitalize: "off", spellcheck: false,
      oninput: (e) => { const v = e.target.value; if (v.trim()) b.simList = v; else delete b.simList; changed(); fill(); } }),
    el("p", { class: "t-hint", text: "List the states the sim has, separated by commas, or just a number for how many. Click one below to show it in the sim right now. This only changes the editor; students see the state each page state sets." }),
    row);
}
function simInfo(id) {
  const box = el("div", { class: "t-hint", style: "margin-bottom:10px" });
  if (!id) return box;
  loadSims().then((list) => {
    const sim = list.find((x) => x.id === id);
    if (!sim) return;
    const line = (title, items) => {
      if (!items || !items.length) return null;
      return el("div", {}, el("strong", { text: title }),
        ...items.map((x) => el("div", { text: "• " + x.name + (x.says ? " — " + x.says : " — no description yet") + (x.found ? "" : " (not found in the sim's code)") })));
    };
    box.append(...[line("Events it reports", sim.events) || el("div", { text: "This sim reports no events." }), line("Commands it accepts", sim.commands)].filter(Boolean));
  });
  return box;
}

// ---------------------------------------------------------------- uploads
async function uploadImage(file) {
  let blob = file;
  if (!(file.type === "image/gif" && file.size < 1.5e6)) {
    const img = await new Promise((res, rej) => {
      const i = new Image(); i.onload = () => res(i); i.onerror = () => rej(new Error("That file isn't an image I can read.")); i.src = URL.createObjectURL(file);
    });
    const scale = Math.min(1, 1920 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * scale); c.height = Math.round(img.naturalHeight * scale);
    const g = c.getContext("2d");
    g.fillStyle = "#FFFFFF"; g.fillRect(0, 0, c.width, c.height);
    g.drawImage(img, 0, 0, c.width, c.height);
    blob = await new Promise((res) => c.toBlob(res, "image/jpeg", 0.9));
  }
  const r = await tapi("/api/images", { method: "POST", headers: { "content-type": blob.type }, body: blob });
  return r.id;
}
let videosCache = null;
async function loadVideos(force) {
  if (!videosCache || force) { try { videosCache = await tapi("/api/videos"); } catch { videosCache = { ready: false, videos: [] }; } }
  return videosCache;
}
function uploadVideo(file, onProgress) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", "/api/videos");
    x.setRequestHeader("x-token", token || "");
    x.setRequestHeader("content-type", file.type || ({ mp4: "video/mp4", m4v: "video/mp4", webm: "video/webm", mov: "video/quicktime" }[file.name.split(".").pop().toLowerCase()] || ""));
    x.setRequestHeader("x-name", encodeURIComponent(file.name));
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProgress(e.loaded / e.total); };
    x.onload = () => { let j = {}; try { j = JSON.parse(x.responseText); } catch {} x.status < 300 ? resolve(j) : reject(new Error(j.error || "Upload failed (" + x.status + ").")); };
    x.onerror = () => reject(new Error("The upload didn't go through. Check the connection and try again."));
    x.send(file);
  });
}
let simsCache = null;
async function loadSims() {
  if (!simsCache) { try { simsCache = await tapi("/api/sims"); } catch { return []; } }
  return simsCache;
}
async function uploadSim(file, id) {
  if (file.size > 1_900_000) throw new Error("That file is too large (the limit is about 1.8 MB).");
  const headers = { "content-type": "text/html" };
  if (!id) headers["x-name"] = encodeURIComponent(file.name);
  const r = await tapi(id ? "/api/sims/" + id : "/api/sims", { method: id ? "PUT" : "POST", headers, body: file });
  simsCache = null;
  return r;
}

// ---------------------------------------------------------------- preview: the real student page in a Chromebook-sized frame
let pvFrame = null, pvOn = false, pvQ = -1, pvEnds = 0, pvSeq = 0;
function pvQuestions() { return (ed.pages[edPage].blocks || []).filter((x) => x.type === "question" && blockShowsIn(x, curSid())); }
const pvNum = (q) => ed.pages[edPage].blocks.filter((x) => x.type === "question").indexOf(q) + 1;
function pvAsk() {
  const q = pvQuestions()[pvQ];
  if (!q) return null;
  return { id: "pvq" + pvSeq, prompt: q.prompt || "", endsAt: pvEnds, part: 1, parts: 1, allowSim: false, imageId: "", sim: "", blockId: q.id, pageId: ed.pages[edPage].id,
    options: q.kind === "mc" ? (q.options || []).filter((o) => String(o).trim()) : [], round: 1, mine: "", done: false };
}
function pvSetQ(i) {
  pvQ = i; pvSeq++; const q = pvQuestions()[i];
  pvEnds = q ? Date.now() + (Number(q.min) || 3) * 60000 : 0;
  pvRender();
}
// before you open a question in the preview, one set to appear by itself shows read only, as students see it
function pvStaged() { if (pvQ >= 0) return null; const q = pvQuestions().find((x) => x.auto); return q ? { blockId: q.id, pageId: ed.pages[edPage].id } : null; }
function pvState() {
  const pages = ed.pages.slice(0, edPage + 1).map((pg) => ({ ...pg, questions: [] }));
  return { live: true, sessionId: "pv" + edPage, title: ed.title, unlocked: edPage, total: ed.pages.length, pages, myVotes: {}, closed: {}, stateOf: { [ed.pages[edPage].id]: curSid() },
    now: Date.now(), paused: false, qpaused: false, ask: pvAsk(), show: null, staged: pvStaged(), signedIn: true, me: "preview", spMine: {}, myQs: [] };
}
function pvSend() { if (pvFrame && pvFrame.contentWindow) pvFrame.contentWindow.postMessage({ clPreview: pvState() }, location.origin); }
window.addEventListener("message", (e) => { if (e.origin === location.origin && e.data && e.data.clPreviewReady) pvSend(); });
// "View as": the student page in a window of each common shape (all 1366 wide)
const VIEWS = [["Chromebook", 599], ["16:9", 768], ["16:10", 854], ["3:2", 911], ["4:3", 1025]];
let pvH = 599;
function pvFit() {
  if (!pvFrame) return;
  pvFrame.style.height = pvH + "px";
  const h = $("bPreviewHold"), s = Math.min(1, h.clientWidth / 1366, h.clientHeight / pvH);
  pvFrame.style.transform = "scale(" + s + ")";
  pvFrame.style.left = Math.max(0, (h.clientWidth - 1366 * s) / 2) + "px";
}
function pvRender() {
  const qs = pvQuestions();
  if (pvQ >= qs.length) pvQ = -1;
  $("pvQ").replaceChildren(...(qs.length ? [
    el("span", { text: "Students see:", style: "font-weight:700" }),
    el("button", { "aria-pressed": String(pvQ === -1), text: "No question yet", onclick: () => pvSetQ(-1) }),
    ...qs.map((q, i) => el("button", { "aria-pressed": String(pvQ === i), text: "Question " + pvNum(q), title: (q.prompt || "").slice(0, 80), onclick: () => pvSetQ(i) })),
    el("button", { text: "Next question ▶", disabled: pvQ >= qs.length - 1, onclick: () => pvSetQ(pvQ + 1) })] : []));
  const sts = pageStates(ed.pages[edPage]), cur = curSid();
  $("pvS").replaceChildren(...(sts.length > 1 ? [
    el("span", { text: "State:", style: "font-weight:700" }),
    ...sts.map((x, i) => el("button", { "aria-pressed": String(x.id === cur), text: x.name || "State " + (i + 1), onclick: () => { edState = x.id; pvQ = -1; pvSeq++; pvRender(); } })),
    el("button", { text: "Next state ▶", disabled: sts.findIndex((x) => x.id === cur) >= sts.length - 1, onclick: () => { edState = sts[sts.findIndex((x) => x.id === cur) + 1].id; pvQ = -1; pvSeq++; pvRender(); } })] : []));
  $("pvLabel").textContent = "Page " + (edPage + 1) + " of " + ed.pages.length;
  $("pvV").replaceChildren(el("span", { text: "View as:", style: "font-weight:700" }),
    ...VIEWS.map(([name, h]) => el("button", { "aria-pressed": String(pvH === h), text: name, onclick: () => { pvH = h; pvFit(); pvRender(); } })));
  $("pvPrev").disabled = edPage === 0;
  $("pvNext").disabled = edPage >= ed.pages.length - 1;
  pvSend();
}
$("bPreviewBtn").onclick = () => {
  pvOn = true; pvQ = -1; $("bPreview").hidden = false;
  if (!pvFrame) { pvFrame = el("iframe", { src: "/?preview=1", title: "Student screen preview" }); $("bPreviewHold").append(pvFrame); }
  pvFit(); pvRender();
};
$("pvBack").onclick = () => { pvOn = false; $("bPreview").hidden = true; renderAll(); };
$("pvPrev").onclick = () => { edPage--; pvQ = -1; pvRender(); };
$("pvNext").onclick = () => { edPage++; pvQ = -1; pvRender(); };
window.addEventListener("resize", pvFit);

// ---------------------------------------------------------------- opening and leaving
$("bTitle").oninput = () => { ed.title = $("bTitle").value; changed(); };
const leave = async (hash) => { if (edSaveTimer) saveNow(); await saveChain; toTeacher(hash); };
$("bBack").onclick = () => leave("#/lessons");
$("bPlan").onclick = () => leave("#/edit/" + ed.id);

function splitShared(pg) {
  const sts = Array.isArray(pg.states) && pg.states.length > 1 ? pg.states.map((x) => x.id) : null;
  if (!sts) return false;
  let did = false;
  const out = [];
  for (const b of pg.blocks || []) {
    const ins = Array.isArray(b.states) && b.states.length ? b.states.filter((x) => sts.includes(x)) : sts.slice();
    if (ins.length < 2) { out.push(b); continue; }
    did = true;
    const lock = Array.isArray(b.lock) ? b.lock.slice() : [], words = b.simStates ? { ...b.simStates } : null;
    ins.forEach((sid, k) => {
      const c = k ? JSON.parse(JSON.stringify(b)) : b;
      c.states = [sid];
      if (lock.includes(sid)) c.lock = [sid]; else delete c.lock;
      if (words && words[sid]) c.simStates = { [sid]: words[sid] }; else delete c.simStates;
      if (k && c.type === "question") c.id = newId();
      out.push(c);
    });
  }
  pg.blocks = out;
  return did;
}
(async function init() {
  if (!token) return toTeacher();
  if (!lessonId) return toTeacher("#/lessons");
  try { ed = await tapi("/api/lessons/" + lessonId); }
  catch (e) { const m = $("bMsg"); m.hidden = false; m.replaceChildren(el("h2", { text: "Couldn't open that lesson." }), el("p", { text: e.message }), el("button", { text: "◀ Lessons", onclick: () => toTeacher("#/lessons") })); return; }
  ed.plan ||= [];
  if (!ed.pages || !ed.pages.length) ed.pages = [newPage()];
  // older pages (blocks stacked top to bottom) become canvas pages the first time they are opened here
  if (ed.pages.some((pg) => pg.layout !== "canvas")) { ed.pages.forEach(canvasify); changed(); }
  // an element shared by several states (made before + State copied them) becomes one copy per state, so changing one doesn't change the others
  if (ed.pages.some(splitShared)) changed();
  edPage = Math.max(0, Math.min(ed.pages.length - 1, (parseInt(params.get("page"), 10) || 1) - 1));
  $("bTitle").value = ed.title || "";
  for (const id of ["bTop", "bCanvas", "winPages", "winTools"]) $(id).hidden = false;
  fitCanvas();
  renderAll();
  Promise.all([loadSims(), loadVideos()]).then(() => renderStage()); // so sim and video boxes can show their names
})();
</script>
