/* ═══════════════════════════════════════════════════════════════
   SECTION 5 — POLYATOMIC IONS
   Level 1 uses fixed-charge main group metals, level 2 uses
   multivalent metals. Each level runs both directions: a name is
   turned into a formula on the puzzle board, and a formula is
   turned back into a name.
   ═══════════════════════════════════════════════════════════════ */
var POLY={
  NO3:{name:"nitrate",   q:-1},
  OH :{name:"hydroxide", q:-1},
  SO4:{name:"sulfate",   q:-2},
  CO3:{name:"carbonate", q:-2},
  PO4:{name:"phosphate", q:-3}
};

/* One pool. Main group and transition metals are shuffled together, some
   forming a single ion and some several, so the table has to be checked
   every time rather than being implied by which level you are on. */
var POLYM={ Li:[1], Na:[1], K:[1], Mg:[2], Ca:[2], Sr:[2], Ba:[2], Al:[3],
            Zn:[2], Ag:[1], Cd:[2], Sc:[3], Y:[3],
            Fe:[2,3], Co:[2,3], Cr:[2,3], Ni:[2], Cu:[2], Mn:[2] };
/* carbonates that do not survive in the bottle */
var NOPE={"Al3-CO3":1,"Cr2-CO3":1,"Cr3-CO3":1,"Fe3-CO3":1,"Co3-CO3":1,
          "Sc3-CO3":1,"Y3-CO3":1};

var PXPOOL=(function(){
  var out=[];
  Object.keys(POLYM).forEach(function(sym){
    POLYM[sym].forEach(function(q){
      Object.keys(POLY).forEach(function(p){
        if(NOPE[sym+q+"-"+p]) return;
        out.push({m:sym,mn:mName(sym),mq:q,p:p,multi:mMulti(sym)});
      });
    });
  });
  return out;
})();
/* One pool. Fixed-charge and multivalent metals are shuffled together, which
   is the point: the table has to be checked every time rather than being
   implied by which section you are in. */
var PXMANY=PXPOOL.filter(function(x){ return x.multi; });
var PXONE =PXPOOL.filter(function(x){ return !x.multi; });

function pxCounts(x){
  var aq=POLY[x.p].q, g=gcd(x.mq,Math.abs(aq));
  return {nm:Math.abs(aq)/g, na:x.mq/g};
}
function pxFormula(x,parens){
  var k=pxCounts(x);
  var a = (parens!==false && k.na>1) ? "("+x.p+")"+k.na : x.p+(k.na>1?k.na:"");
  return x.m+(k.nm>1?k.nm:"")+a;
}
function pxFormulaHTML(x){ return subDigits(pxFormula(x)); }
function pxName(x){
  return x.mn+(x.multi?"("+ROMAN[x.mq]+")":"")+" "+POLY[x.p].name;
}
var POLYNAMES=Object.keys(POLY).map(function(k){return POLY[k].name;});
/* real ion names beyond the ones in play, so that answering with a
   different ion is not mistaken for a misspelling */
var KNOWNIONS=["nitrate","nitrite","sulfate","sulfite","carbonate","bicarbonate",
  "hydrogen carbonate","phosphate","phosphite","hydroxide","chlorate","chlorite",
  "perchlorate","hypochlorite","acetate","ammonium","cyanide","permanganate",
  "chromate","dichromate","peroxide","oxalate","thiosulfate",
  "oxide","sulfide","chloride","fluoride","bromide","iodide","nitride","phosphide"];
var METALNAMES=Object.keys(METALS).map(function(s){return METALS[s].n;});

/* edit distance, used only to tell a typo from a different answer */
function pxLev(a,b){
  var m=a.length,n=b.length,i,j,prev,tmp,row=[];
  for(j=0;j<=n;j++) row[j]=j;
  for(i=1;i<=m;i++){
    prev=row[0]; row[0]=i;
    for(j=1;j<=n;j++){
      tmp=row[j];
      row[j]=Math.min(row[j]+1, row[j-1]+1,
        prev + (a.charAt(i-1)===b.charAt(j-1)?0:1));
      prev=tmp;
    }
  }
  return row[n];
}
/* a near miss is only a spelling problem if it isn't some other real name */
function pxTypo(got,want,pool){
  if(!got || got===want) return false;
  if(pool && pool.indexOf(got)>=0) return false;
  var d=pxLev(got,want);
  return d>0 && d<=Math.max(2,Math.floor(want.length/4));
}

function pxNorm(t){
  return String(t||"").toLowerCase().replace(/\s*\(\s*/g,"(").replace(/\s*\)\s*/g,") ")
    .replace(/\s+/g," ").trim();
}

/* ── puzzle pieces that can carry a subscripted label ─────────── */
function svgLabel(sym,fs){
  var out="", i, ch, sub=false, d=(fs*0.20).toFixed(1), small=(fs*0.64).toFixed(1);
  for(i=0;i<sym.length;i++){
    ch=sym.charAt(i);
    if(/\d/.test(ch)){
      out += sub ? '<tspan font-size="'+small+'">'+ch+'</tspan>'
                 : '<tspan dy="'+d+'" font-size="'+small+'">'+ch+'</tspan>';
      sub=true;
    } else {
      out += sub ? '<tspan dy="-'+d+'">'+ch+'</tspan>' : ch;
      sub=false;
    }
  }
  return {html:out, sub:sub, back:d};
}
function pxPiece(label,q,x,y,removable){
  var n=Math.abs(q), up=q>0, h=n*U;
  var fill=up?"var(--posFill)":"var(--negFill)", edge=up?"var(--posEdge)":"var(--negEdge)";
  var ink=up?"var(--posInk)":"var(--negInk)", tx=PW/2+R/4;
  var fs = label.length<=2 ? 38 : label.length<=4 ? 30 : 24;
  var L=svgLabel(label,fs);
  var chDy = (L.sub ? (-14 - parseFloat(L.back)) : -14).toFixed(1);
  return '<g class="piece" transform="translate('+x+','+y+')"'+
    (removable?' data-pxremove="'+removable+'"':'')+'>'+
    '<path d="'+(up?tabPath(n):slotPath(n))+'" fill="'+fill+'" stroke="'+edge+
      '" stroke-width="3" stroke-linejoin="round"/>'+
    '<text x="'+tx+'" y="'+(h/2+4)+'" text-anchor="middle" dominant-baseline="central" '+
      'fill="'+ink+'" style="font:700 '+fs+'px var(--mono)">'+L.html+
      '<tspan dy="'+chDy+'" style="font-size:'+Math.round(fs*0.58)+'px">'+
      chargeText(q)+'</tspan></text></g>';
}

/* ── shared state ────────────────────────────────────────────── */
var PX={mode:"f2n"};

/* ── name → formula (the puzzle, simplified) ─────────────────── */
var PN={x:null,last:null,phase:"entry",sym:["",""],chg:["",""],
        nc:0,na:0,ftext:"",bad:{},hint:null,ferr:null,
        done:0,clean:0,misses:0,prevGap:26,simple:0};

function pnParts(){
  var x=PN.x;
  return [{lab:x.mn+(x.multi?"("+ROMAN[x.mq]+")":""), sym:x.m, q:x.mq},
          {lab:POLY[x.p].name, sym:x.p, q:POLY[x.p].q}];
}

/* 0 is a 1:1 ratio, 1 is 1:2, 2 is everything harder. Once the
   simple ones are coming out clean, the harder ratios come up more. */
function pnTier(x){
  var k=pxCounts(x), hi=Math.max(k.nm,k.na), lo=Math.min(k.nm,k.na);
  if(hi===1) return 0;
  if(lo===1 && hi===2) return 1;
  return 2;
}
/* weighted by ratio difficulty, and never three of the same kind in a row */
function pxKey(x){ return x.m+"|"+x.p+"|"+x.mq; }

function pxPick(pool, st){
  var earned=st.simple||0;
  var wt = earned<3 ? [2,3,2] : earned<6 ? [1,3,4] : [1,2,6];
  var run=st.run||{t:-1,n:0};
  /* every compound already served in this section, so a long set of rounds
     works through the pool instead of circling back over a handful */
  var used = st.used || (st.used={});
  function bagUp(blockTier, skipUsed){
    var bag=[];
    pool.forEach(function(x){
      var t=pnTier(x);
      if(t===blockTier) return;
      if(skipUsed && used[pxKey(x)]) return;
      if(st.last && x.m===st.last.m && x.p===st.last.p && x.mq===st.last.mq) return;
      var n=wt[t], i;
      for(i=0;i<n;i++) bag.push(x);
    });
    return bag;
  }
  /* tier variety first, then anything unseen; only once the whole pool has
     been served does it start over */
  var bag = bagUp(run.n>=2 ? run.t : -1, true);
  if(!bag.length) bag = bagUp(-1, true);
  if(!bag.length){                       /* pool exhausted — begin a new pass */
    st.used = used = {};
    bag = bagUp(run.n>=2 ? run.t : -1, true);
    if(!bag.length) bag = bagUp(-1, true);
  }
  if(!bag.length) bag = pool;
  var pick=bag[Math.floor(Math.random()*bag.length)], pt=pnTier(pick);
  used[pxKey(pick)]=1;
  st.run = (run.t===pt) ? {t:pt,n:run.n+1} : {t:pt,n:1};
  st.last=pick;
  return pick;
}
function pxHalf(st){ return PXPOOL; }
function pnPick(){ return pxPick(pxHalf(PN), PN); }

function pnNew(){
  PN.x=pnPick();
  /* no "does it form more than one ion?" gate here — the name on screen
     already answers it, numeral or no numeral */
  PN.phase="entry"; PN.slot=0; PN.shown=false; PN.tip=null; PN.sym=["",""]; PN.chg=["",""];
  PN.nc=0; PN.na=0; PN.ftext=""; PN.bad={}; PN.hint=null; PN.ferr=null; PN.markNum=false;
  PN.misses=0; PN.prevGap=26; PN.tries={};
  pxRender();
}
function pnSync(){
  var f,i;
  for(i=0;i<2;i++){
    if((f=document.getElementById("pnS"+i))) PN.sym[i]=f.textContent;
    if((f=document.getElementById("pnC"+i))) PN.chg[i]=f.value;
  }
  if((f=document.getElementById("pnin"))) PN.ftext=f.textContent;
}

/* One ion at a time. `PN.slot` says which column is being worked on: the
   one before it is settled and shows its answer, the one after it waits.
   Checking one ion at a time means a wrong answer is only ever about the
   ion in front of them. */
function pnCol(i){
  var pt=pnParts()[i];
  var live = i===PN.slot;
  var done = i<PN.slot;
  var tone = pt.q>0 ? "p" : "n";

  var ask = live
    ? (i===0
        ? (PN.x.multi
           ? "Type the symbol for <b>"+PN.x.mn+"</b> and the charge on the <b>"+
             pt.lab+"</b> ion."
           : "Type the symbol for <b>"+PN.x.mn+"</b> and the charge of the ion it makes.")
        : "Type the formula for the <b>"+pt.lab+"</b> ion and its charge.")
    : "&nbsp;";

  var body;
  if(done)
    body='<div class="val">'+subDigits(pt.sym)+
         '<sup class="qsup '+(pt.q>0?"pp":"nn")+'">'+chargeText(pt.q)+'</sup></div>';
  else if(live)
    body='<div class="symfield'+(PN.bad["s"+i]?" bad":"")+'" id="pnS'+i+
      '" contenteditable="true" spellcheck="false" role="textbox" '+
      'data-ph="'+(i===0?"symbol":"formula")+'" '+
      'aria-label="Symbol of the '+pt.lab+' ion">'+subDigits(PN.sym[i])+'</div>'+
      '<input class="qfield'+(PN.bad["c"+i]?" bad":"")+'" id="pnC'+i+
      '" value="'+esc(PN.chg[i])+'" placeholder="charge" autocomplete="off" '+
      'spellcheck="false" aria-label="Charge on the '+pt.lab+' ion">';
  else
    body='<div class="val"><span style="opacity:.25">?</span></div>';

  /* only what has not been reached yet is dimmed — an ion already settled
     stays readable, because they need it to work out the next one */
  return '<div class="ioncol'+(live?" live":"")+(done?" "+tone:"")+
      (!live && !done ? " dim" : "")+'">'+
    '<p class="cap">'+pt.lab+'</p>'+
    '<p class="ask">'+ask+'</p>'+
    '<div class="ionentry">'+body+'</div>'+
  '</div>';
}

function pnRecap(){
  var pt=pnParts();
  return '<div class="ionrecap">'+pt.map(function(o){
    return '<div><p class="cap">'+o.lab+'</p>'+
      '<div class="rval '+(o.q>0?"p":"n")+'">'+subDigits(o.sym)+
      '<sup>'+chargeText(o.q)+'</sup></div></div>';
  }).join("")+'</div>';
}

/* ── the tab-and-slot board, shared by both name → formula activities ──
   `st` supplies nc / na / phase / shakeBoard and `tag` is the data-
   attribute its Check button answers to. Nothing here knows or cares
   whether the second ion is a single element or a polyatomic one. */
function boardSVG(st,pt,tag){
  var cat=pt[0], ani=pt[1];
  var pos=st.nc*cat.q, neg=st.na*-ani.q;
  var built=st.phase==="formula"||st.phase==="done";
  var units=Math.max(4,pos,neg), vh=units*U+50, i, grid="";
  for(i=0;i<=units;i++)
    grid+='<line x1="16" x2="'+(VW-16)+'" y1="'+(25+i*U)+'" y2="'+(25+i*U)+
      '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5" opacity=".5"/>';
  var cs="",as="";
  for(i=0;i<st.nc;i++) cs+=pxPiece(cat.sym,cat.q,SEAM-PW,25+i*cat.q*U,built?null:"c");
  for(i=0;i<st.na;i++) as+=pxPiece(ani.sym,ani.q,SEAM,25+i*-ani.q*U,built?null:"a");
  return '<div class="board'+(built?" solved":"")+(st.shakeBoard?" shake":"")+'">'+
    '<svg width="'+VW+'" height="'+vh+'" viewBox="0 0 '+VW+' '+vh+'">'+grid+
    '<line x1="'+SEAM+'" x2="'+SEAM+'" y1="16" y2="'+(vh-16)+
      '" stroke="var(--line)" stroke-width="1"/>'+
    '<g>'+cs+'</g><g id="'+tag+'Stack">'+as+'</g></svg></div>';
}
function boardSteppers(st,pt,tag){
  var cat=pt[0], ani=pt[1];
  var net=st.nc*cat.q - st.na*-ani.q;
  var reduced=st.nc>0&&st.na>0&&net===0&&gcd(st.nc,st.na)===1;
  var h='<div class="steppers">'+
    pxStepper("c",cat.sym,st.nc)+pxStepper("a",ani.sym,st.na)+'</div>';
  var cls="", txt;
  if(st.nc+st.na===0) txt="Add ions until the two sides fit together.";
  else if(net>0) txt=plural(net,"tab")+" on the left "+(net===1?"has":"have")+
    ' nothing to connect to. Add another <b class="mono">'+subDigits(ani.sym)+'</b>.';
  else if(net<0) txt=plural(-net,"slot")+" on the right "+(-net===1?"is":"are")+
    ' still empty. Add another <b class="mono">'+cat.sym+'</b>.';
  else if(!reduced){
    var g=gcd(st.nc,st.na); cls=" note";
    txt="The charges balance, but that is the same pair built "+g+
        " times over. A formula uses the smallest set that works — take "+
        (g-1)+" of each back off.";
  } else { cls=" good"; txt="Every tab is filled."; }
  return h+'<p class="status'+cls+'">'+txt+'</p>'+
    actionBlock('<button data-'+tag+'="build">Check</button>', tag)+hintBox(st.tip);
}
function boardFits(st,pt){
  return st.nc>0 && st.na>0 && st.nc*pt[0].q===st.na*-pt[1].q && gcd(st.nc,st.na)===1;
}
function boardCount(st,side,delta,draw){
  if(st.phase!=="build") return;
  if(side==="c") st.nc=Math.max(0,st.nc+delta); else st.na=Math.max(0,st.na+delta);
  st.shakeBoard=false; draw();
}
function boardCheck(st,pt,draw,onFit,act){
  if(st.phase!=="build") return;
  st.tries=st.tries||{};
  st.tries.board=(st.tries.board||0)+1;
  var typed=st.nc+":"+st.na, prompt=pt[0].sym+"/"+pt[1].sym, fits=boardFits(st,pt);
  if(act) logAttempt(act,"board",prompt,typed,fits,fits?"":"ratio",st.tries.board);
  if(fits){ st.shakeBoard=false; draw(); setTimeout(onFit,320); return; }
  st.shakeBoard=true; draw();
  setTimeout(function(){ st.shakeBoard=false; draw(); },440);
}
/* the stack of anions slides in to meet the cations once they balance */
function boardSlide(st,pt,tag){
  var stack=document.getElementById(tag+"Stack");
  if(!stack) return;
  var gap=(st.nc>0&&st.na>0&&(st.nc*pt[0].q-st.na*-pt[1].q)===0)?0:26;
  stack.style.transform="translate("+st.prevGap+"px,0)";
  requestAnimationFrame(function(){requestAnimationFrame(function(){
    stack.style.transform="translate("+gap+"px,0)";
  });});
  st.prevGap=gap;
}

function pnBoardSVG(){ return boardSVG(PN,pnParts(),"pn"); }

function pnSide(){
  if(PN.phase==="formula")
    return '<div class="fbox"><p class="lbl">It fits. Now write the formula.</p>'+
      '<div class="finput'+(PN.markNum?" marknum":"")+'" id="pnin" '+
        'contenteditable="true" spellcheck="false" '+
        'role="textbox" aria-label="Chemical formula">'+
        subDigitsMarked(PN.ftext,true)+'</div>'+
      (PN.ferr?'<p class="ferr">'+PN.ferr+'</p>':'')+'</div>'+
      actionBlock('<button data-pn="formula">Check formula</button>',"pn")+hintBox(PN.tip);

  if(PN.phase==="done"){
    var x=PN.x;
    return PN.shown
      ? revealBox(pxFormulaHTML(x), pnWhy(x))+
        '<div class="showrow"><button data-pn="next">New name</button></div>'
      : '<div class="win"><div class="f">'+pxFormulaHTML(x)+'</div>'+
        '<div class="c">'+pxName(x)+'</div>'+
        '<div style="height:10px"></div>'+
        '<button data-pn="next">New name</button></div>';
  }

  return boardSteppers(PN,pnParts(),"pn");
}
function pxStepper(side,sym,n){
  return '<div class="step">'+
    '<button data-pxremove="'+side+'" aria-label="Remove one"'+(n?"":" disabled")+'>−</button>'+
    '<span>'+n+' × <b>'+subDigits(sym)+'</b></span>'+
    '<button data-pxadd="'+side+'" aria-label="Add one">+</button></div>';
}

function pnBody(){
  var x=PN.x, ph=PN.phase;
  var h='<div class="subject'+(ph==="done"?" solved":"")+'">'+
        '<div class="bigname">'+pxName(x)+'</div>'+
        (ph==="entry"?"":pnRecap())+'</div>';

  if(ph==="entry"){
    h+='<p class="correction'+(PN.hint?"":" blank")+'">'+(PN.hint||"&nbsp;")+'</p>'+
       '<div class="ionpair">'+pnCol(0)+pnCol(1)+'</div>'+
       actionBlock('<button data-pn="entry">Check</button>',"pn")+hintBox(PN.tip);
    return h;
  }

  h+='<p class="nflead">How many of each ion is needed to balance out?</p>'+
     '<div class="buildrow">'+pnBoardSVG()+
     '<div class="buildside">'+pnSide()+'</div></div>'+
     "";
  return h;
}

function pnCheck(what){
  pnSync();
  var x=PN.x, pt=pnParts();
  PN.bad={}; PN.hint=null; PN.ferr=null;
  PN.tries=PN.tries||{};

  if(what==="entry"){
    var i=PN.slot, ok=true, okS=true, okQ=true;
    PN.tries["entry"+i]=(PN.tries["entry"+i]||0)+1;
    var got=(PN.sym[i]||"").replace(/\s+/g,"");
    if(got!==pt[i].sym){
      PN.bad["s"+i]=true; ok=false; okS=false;
      if(got.toLowerCase()===pt[i].sym.toLowerCase())
        PN.hint="Check the capitals. A symbol starts with a capital letter, and any letter after it is lowercase.";
    }
    var sheet="Check your ion sheet for the formula and charge of the <b>"+
              pt[1].lab+"</b> ion.";
    if(i===1 && PN.bad.s1 && !PN.hint) PN.hint=sheet;
    var r=parseCharge(PN.chg[i]);
    if(r.err){
      PN.bad["c"+i]=true; ok=false; okQ=false;
      if(!PN.hint) PN.hint = r.noSign
        ? "Is the <b>"+pt[i].lab+"</b> ion positive or negative?" : r.err;
    } else if(r.q!==pt[i].q){
      PN.bad["c"+i]=true; ok=false; okQ=false;
      if(!PN.hint) PN.hint = i===0
        ? (x.multi ? "The Roman numeral in the name is the charge."
           : mRuleGroup(x.m) ? "Check which group <b>"+x.mn+"</b> is in."
           : "Check your periodic table for the charge on the <b>"+x.mn+"</b> ion.")
        : sheet;
    }
    var entryFault = !okS && !okQ ? "both" : !okS ? "symbol" : "charge";
    logAttempt("poly_n2f","entry",pt[i].lab,got+" "+(PN.chg[i]||""),ok,ok?"":entryFault,
      PN.tries["entry"+i], detailStr([{l:"symbol",k:okS},{l:"charge",k:okQ}]));
    if(!ok){ PN.misses++; pxRender(); return; }
    /* that ion is settled — move to the next one, or on to the board */
    PN.slot++; PN.tip=null;
    if(PN.slot>1) PN.phase="build";
    pxRender(); return;
  }

  var got2=(PN.ftext||"").replace(/\s+/g,"");
  PN.tries.formula=(PN.tries.formula||0)+1;
  if(got2===pxFormula(x)){
    PN.markNum=false;
    PN.phase="done"; PN.done++;
    if(!PN.misses){ PN.clean++; if(pnTier(x)<2) PN.simple++; }
    track("poly_n2f", PN.misses===0);
    logAttempt("poly_n2f","formula",pxFormula(x),got2,true,"",PN.tries.formula);
    pxRender(); return;
  }
  var fault=pnFormulaFault(got2,x);
  PN.ferr=fault.msg;
  PN.markNum=fault.ring;
  PN.misses++;
  logAttempt("poly_n2f","formula",pxFormula(x),got2,false,fault.code,PN.tries.formula);
  pxRender();
}

/* what went wrong with a typed formula, parentheses first */
/* Sorts a wrong formula into the one thing that actually went wrong. Each
   answer carries `ring`: true only when the ion COUNTS are the fault, so a
   formula whose counts are right but whose parentheses are missing does not
   get a red box drawn round a digit that is perfectly correct. */
function pnFormulaFault(got,x){
  var k=pxCounts(x), want=pxFormula(x), bare=pxFormula(x,false);
  var poly=x.p, m=x.m;
  var shapeFault=function(t,code){ return {msg:t, ring:false, code:code||"parens"}; };
  var countFault=function(t,code){ return {msg:t, ring:true, code:code||"count"}; };
  if(!got) return shapeFault("Type the formula.","other");

  var round=got.replace(/[\[{]/g,"(").replace(/[\]}]/g,")");
  if(round!==got && round===want)
    return shapeFault("Use round parentheses ( ), not square or curly brackets.");

  var opens=(got.match(/\(/g)||[]).length, closes=(got.match(/\)/g)||[]).length;
  if(opens!==closes)
    return shapeFault("Your parentheses do not match up — there "+(opens===1?"is ":"are ")+opens+
           (opens===1?" opening parenthesis":" opening parentheses")+" and "+closes+
           (closes===1?" closing parenthesis":" closing parentheses")+".");

  if(got.indexOf("("+m+")")>=0)
    return shapeFault("Parentheses go around a polyatomic ion, never around a single element's symbol.");

  if(k.na>1 && got.indexOf("("+poly+k.na+")")>=0)
    return shapeFault("The number goes outside the parentheses, just after the closing parenthesis.");

  var stripped=got.replace(/[()]/g,"");
  if(opens>0 && k.na===1 &&
     (stripped===want || stripped.replace(/1(?!\d)/g,"")===want))
    return shapeFault("A polyatomic ion only takes parentheses when the formula needs more than one of it. "+
           "With just one, write it plain.");

  if(opens===0 && k.na>1 && got===bare)
    return shapeFault("When a formula needs more than one of a polyatomic ion, the ion goes in "+
           "parentheses and the number sits outside them.");

  if(k.na>1 && got===want.replace(/\)\d+$/,")"))
    return shapeFault("The number of polyatomic ions is missing. It goes just after the closing parenthesis.");

  /* right shape, wrong count */
  var shape=new RegExp("^"+m+"(\\d*)\\("+poly+"\\)(\\d+)$");
  var mm=got.match(shape);
  if(mm){
    var gotM=mm[1]===""?1:+mm[1], gotA=+mm[2];
    if(gotA!==k.na || gotM!==k.nm)
      return countFault("The shape is right, but the numbers are not. Count the pieces on the board again.");
  }

  if(got.toLowerCase()===want.toLowerCase())
    return shapeFault("Check the capitals. A symbol starts with a capital letter, and any letter after it is lowercase.","caps");
  if(got.replace(/1(?!\d)/g,"")===want)
    return countFault("Drop the 1. When there is only one ion, no number is written.","one");
  return countFault("Not quite. Count the pieces on each side and write that number after the ion.");
}

/* the + / − buttons are the same markup in both activities, so they go to
   whichever board is on screen */
function pxAddRemove(side,delta){
  if(onN2F()) boardCount(NF,side,delta,nfRender);
  else boardCount(PN,side,delta,pxRender);
}
function pnCheckBuild(){
  boardCheck(PN,pnParts(),pxRender,function(){
    PN.phase="formula"; PN.ftext=""; PN.ferr=null; PN.tip=null; pxRender();
  },"poly_n2f");
}

/* ── formula → name ─────────────────────────────────────────────
   The two ion boxes are filled in place, one at a time, and only the
   box being worked on is lit. A wrong Roman numeral at the end rings
   the metal ion's charge so they can compare the two.
   ─────────────────────────────────────────────────────────────── */
var PF={x:null,last:null,run:null,step:1,f:{},bad:{},hint:null,ring:false,
        done:0,clean:0,misses:0,solved:false,simple:0};

function pfNew(){
  PF.x=pxPick(pxHalf(PF), PF);
  PF.step=1; PF.f={sym:"",chg:"",cnt:"",mcnt:"",mchg:"",txt:""};
  PF.bad={}; PF.hint=null; PF.ring=false; PF.misses=0; PF.solved=false;
  PF.shown=false; PF.tip=null; PF.tries={};
  pxRender();
}
function pfSync(){
  var f;
  if((f=document.getElementById("pfSym")))  PF.f.sym=f.textContent;
  if((f=document.getElementById("pfQ")))    PF.f[pfStep().k==="mchg"?"mchg":"chg"]=f.value;
  if((f=document.getElementById("pfN")))    PF.f[pfStep().k==="mcount"?"mcnt":"cnt"]=f.value;
  if((f=document.getElementById("pfIn")))   PF.f.txt=f.value;
}

function pfSteps(){
  var x=PF.x, p=POLY[x.p], k=pxCounts(x), tot=k.na*p.q;
  var s=[];
  s.push({k:"gate", col:null,
      q:'Does <b class="mono">'+x.m+'</b> form more than one ion?'});
  if(x.multi){
    /* the charge is not on the table as a single value, so the first thing to
       do is read off every charge this metal is listed with */
    s.push({k:"charges", col:null, ans:metalCharges(x.m),
            q:chargeListAsk(x.mn)});
    s.push(
      /* formula and charge together — pulling the ion out of the compound
         means naming both, so both are typed in one step */
      {k:"ionentry", col:"a",
       q:'What is the formula of the <b>polyatomic ion</b> in this compound, and its charge?'},
      {k:"name", col:null, hi:"a", ans:p.name,
       q:'What is the name of the <b class="mono">'+subDigits(x.p)+
         '<sup>'+chargeText(p.q)+'</sup></b> ion?'},
      {k:"pcount", col:"a", q:countAsk(p.name), ans:k.na},
      {k:"total", col:null, hi:"a",
       q:'What is the <u style="color:var(--note)">total</u> negative charge?', ans:tot},
      {k:"mcount", col:"m", q:countAsk(x.mn), ans:k.nm},
      {k:"mchg", col:"m", ans:x.mq,
       q:balanceAsk(x.mn, k.nm, p.name, k.na, tot)});
  } else {
    /* one charge: nothing to work out, but the ion still has to be recognised,
       so it is named without any mention of charge */
    s.push({k:"pname", col:null, hi:"a", ans:p.name,
            q:'What is the name of the <b class="mono">'+subDigits(x.p)+'</b> ion?'});
  }
  s.push({k:"cname", col:null, q:'Now write the name of the <b>whole compound</b>.',
          ans:pxName(x)});
  return s;
}
function pfStep(){ return pfSteps()[PF.step-1] || {k:"",col:null}; }
function pfKnown(){
  var steps=pfSteps(), i, seen={}, n=PF.solved?steps.length:PF.step-1;
  for(i=0;i<n;i++) seen[steps[i].k]=true;
  return seen;
}

function pfCol(side){
  var x=PF.x, p=POLY[x.p], k=pxCounts(x), kn=pfKnown(), st=pfStep();
  var metal = side==="m";
  /* `col` says which column holds the answer box, `hi` says which column to
     look at when the answer is typed below — so a question about the anion
     keeps the eye on the anion even though nothing is typed into it */
  var focus = st.col || st.hi;
  var live  = !PF.solved && focus===side;
  var cap   = metal ? x.mn : ((kn.name||kn.pname) ? p.name : "polyatomic ion");
  /* with one charge there is nothing to deduce, so both ions are simply shown
     from the start — and the anion never carries a charge on this path */
  var plain = !x.multi;
  var tone  = metal ? "p" : "n";

  /* symbol */
  var symHTML;
  if(!metal && st.k==="ionentry")
    symHTML='<div class="symfield'+(PF.bad.sym?" bad":"")+'" id="pfSym" '+
      'contenteditable="true" spellcheck="false" role="textbox" data-ph="formula" '+
      'aria-label="Polyatomic ion formula">'+subDigits(PF.f.sym)+'</div>';
  else if(metal || kn.ionentry || plain)
    symHTML='<div class="val">'+(metal?x.m:subDigits(x.p))+'</div>';
  else
    symHTML='<div class="val"><span style="opacity:.25">?</span></div>';

  /* charge */
  var q = plain ? null
        : metal ? (kn.mchg ? x.mq : null) : (kn.ionentry ? p.q : null);
  var chgHTML="";
  if(!metal && st.k==="ionentry")
    chgHTML='<input class="qfield'+(PF.bad.chg?" bad":"")+'" id="pfQ" value="'+
      esc(PF.f.chg)+'" placeholder="charge" autocomplete="off" spellcheck="false" '+
      'aria-label="Charge on the ion">';
  else if(metal && st.k==="mchg")
    chgHTML='<input class="qfield'+(PF.bad.mchg?" bad":"")+'" id="pfQ" value="'+
      esc(PF.f.mchg)+'" placeholder="charge" autocomplete="off" spellcheck="false" '+
      'aria-label="Charge on the metal ion">';
  else if(q!==null)
    chgHTML='<sup class="qsup '+(q>0?"pp":"nn")+(metal&&PF.ring?" ring":"")+'">'+
      chargeText(q)+'</sup>';

  /* how many */
  var n = plain ? null
        : metal ? (kn.mcount ? k.nm : null) : (kn.pcount ? k.na : null);
  var cntHTML;
  if((!metal && st.k==="pcount") || (metal && st.k==="mcount"))
    cntHTML='× <input class="blank cnt'+(PF.bad.cnt?" bad":"")+'" id="pfN" value="'+
      esc(metal?PF.f.mcnt:PF.f.cnt)+'" inputmode="numeric" autocomplete="off" '+
      'aria-label="How many ions">';
  else if(plain) cntHTML="";
  else cntHTML = n===null ? '<span style="opacity:.3">× ?</span>' : '× '+n;

  var cls = "ioncol"+(live?" live":"")+((metal||kn.ionentry||plain)?" "+tone:"")+
            (!live && !PF.solved && focus ? " dim" : "");
  return '<div class="'+cls+'">'+
    '<p class="cap">'+cap+'</p>'+
    '<div class="ionentry">'+symHTML+chgHTML+'</div>'+
    '<div class="mult">'+cntHTML+'</div>'+
  '</div>';
}

function pfBody(){
  var x=PF.x, st=pfStep(), kn=pfKnown(), k=pxCounts(x), p=POLY[x.p];

  var h='<div class="subject'+(PF.solved?" solved":"")+'">'+
        '<div class="big">'+pxFormulaHTML(x)+'</div></div>';

  if(!PF.solved)
    h+='<p class="nflead">'+st.q+'</p>'+
       (PF.hint?'<p class="correction">'+PF.hint+'</p>':'');

  if(st.k==="gate" && !PF.solved)
    return h+actionBlock('<button data-pf="gy">Yes</button>'+
             '<button data-pf="gn">No</button>',"pf")+hintBox(PF.tip);

  h+='<div class="ionpair">'+pfCol("m")+pfCol("a")+'</div>';

  if(!PF.solved){
    h+='<div class="pfrow">';
    if(!st.col){
      var wide = st.k==="name"||st.k==="pname"||st.k==="cname"||st.k==="charges";
      var ph = st.k==="name" ? "name of the "+x.p+chargeText(POLY[x.p].q)+" ion"
             : st.k==="pname" ? "name of the "+x.p+" ion"
             : st.k==="charges" ? "for example  +1, +2"
             : st.k==="cname" ? "name of the compound" : "";
      h+='<input class="blank '+(wide?"wordin":"chg")+(PF.bad.txt?" bad":"")+
         '" id="pfIn" value="'+esc(PF.f.txt)+'" autocomplete="off" spellcheck="false" '+
         (ph?'placeholder="'+ph+'" ':'')+'aria-label="Answer">';
    }
    h+='</div>'+actionBlock('<button data-pf="go">Check</button>',"pf")+hintBox(PF.tip);
  } else if(PF.shown){
    h+=revealBox(pxName(x), pfWhy(x))+
       '<div class="showrow"><button data-pf="next">New formula</button></div>';
  } else {
    h+='<div class="win slim"><div class="fname">'+pxName(x)+'</div>'+
       '<div style="height:10px"></div>'+
       '<button data-pf="next">New formula</button></div>';
  }
  return h;
}

/* \u2500\u2500 Polyatomic, formula \u2192 name \u2500\u2500 */
function pfWhy(x){
  var p=POLY[x.p], k=pxCounts(x), tot=k.na*p.q, out=[];
  if(!x.multi)
    return [
      'The <b class="mono">'+subDigits(x.p)+"</b> in the formula is the <b>"+p.name+
        '</b> ion \u2014 that name is on your ion sheet.',
      onlyMakes(x.m, x.mq)+" A metal like that takes no Roman numeral.",
      "So the name is <b>"+pxName(x)+"</b>. A polyatomic ion keeps its own name \u2014 "+
        "it never takes an <i>-ide</i> ending."
    ];
  out.push('The <b class="mono">'+subDigits(x.p)+"</b> in the formula is the <b>"+
    p.name+'</b> ion, <b class="mono">'+subDigits(x.p)+chargeSup(p.q)+"</b>.");
  out.push("There "+(k.na===1?"is <b>1</b> of them":"are <b>"+k.na+"</b> of them")+
    ", so the negative charge adds up to <b>"+totText(tot)+"</b>.");
  if(x.multi){
    out.push(k.nm===1
      ? "The one "+x.mn+" ion has to be <b>"+chargeText(x.mq)+
        "</b> so the whole formula adds up to zero."
      : "The <b>"+k.nm+"</b> "+x.mn+" ions share it out, so each is <b>"+
        chargeText(x.mq)+"</b>.");
    out.push(cap(x.mn)+" is listed on your periodic table as <b>"+
      chargeListText(metalCharges(x.m))+"</b>, so the name says which one it is here: "+
      "<b>"+x.mn+"("+ROMAN[x.mq]+")</b>.");
  } else {
    out.push(cap(x.mn)+" forms only one ion, so the name takes no Roman numeral.");
  }
  out.push("So the name is <b>"+pxName(x)+"</b>. A polyatomic ion keeps its own "+
    "name \u2014 it never takes an <i>-ide</i> ending.");
  return out;
}
function pfReveal(){
  if(PF.solved) return;
  PF.shown=true; PF.misses++; PF.solved=true; PF.done++;
  track("poly_f2n", false);
  pxRender();
}

/* \u2500\u2500 Polyatomic, name \u2192 formula \u2500\u2500 */
function pnWhy(x){
  var p=POLY[x.p], k=pxCounts(x), out=[];
  out.push(x.multi
    ? 'The <b>('+ROMAN[x.mq]+")</b> in the name is the charge, so the metal ion is "+
      '<b class="mono">'+x.m+chargeSup(x.mq)+"</b>."
    : onlyMakes(x.m, x.mq));
  out.push(cap(p.name)+' is <b class="mono">'+subDigits(x.p)+chargeSup(p.q)+"</b>.");
  out.push(whyRatio(x.m,x.mq,k.nm,subDigits(x.p),p.q,k.na));
  out.push(k.na>1
    ? cap(p.name)+" is a polyatomic ion and there is more than one of it, so it goes "+
      "in parentheses with the <b>"+k.na+"</b> outside: <b class=\"mono\">"+
      pxFormulaHTML(x)+"</b>."
    : "There is only one "+p.name+", so it needs no parentheses: "+
      '<b class="mono">'+pxFormulaHTML(x)+"</b>.");
  return out;
}
function pnReveal(){
  if(PN.phase==="done") return;
  var k=pxCounts(PN.x);
  PN.shown=true; PN.misses++;
  PN.nc=k.nm; PN.na=k.na; PN.phase="done"; PN.done++;
  track("poly_n2f", false);
  pxRender();
}

/* the compound name: separates a missing Roman numeral, a wrong one,
   a different real ion, and a plain misspelling. `sym` is the metal's
   symbol, which is all it takes to know whether a numeral belongs there. */
/* the element's own name against the name its ion takes, so "barium
   fluorine" can be told apart from a plain misspelling */
var IDEFIX=(function(){
  var m={};
  MAIN.forEach(function(e){
    if(e.q<0) m[e.n.toLowerCase()] = e.ion.replace(/ ion$/,"");
  });
  Object.keys(ANION).forEach(function(k){ m[ANION[k].el] = ANION[k].name; });
  return m;
})();
/* returns the nudge if any word is an element name standing in for its ion */
function ideSlip(text){
  var hit=null;
  pxNorm(text).replace(/\([^)]*\)/g," ").split(/\s+/).forEach(function(word){
    if(IDEFIX[word]) hit=word;
  });
  return hit ? "That is the element's name. A negative ion takes an <i>-ide</i> "+
    "ending — <b>"+hit+"</b> becomes <b>"+IDEFIX[hit]+"</b>." : null;
}

/* `code` sorts each miss into one of the fault words the dashboard already
   knows (roman / ion / metal / other) so the Answers view can group these
   the same way it groups every other fault. */
function nameCheck(raw, want, sym){
  var multi=mMulti(sym), mn=mName(sym);
  var g=pxNorm(raw), w=pxNorm(want);
  var no=function(hint,ring,code){ return {ok:false,hint:hint||null,ring:!!ring,code:code||"other"}; };
  if(g===w) return {ok:true,hint:null,ring:false,code:""};
  if(!g) return no("Type the name of the compound.",false,"other");
  var slip=ideSlip(g);
  if(slip) return no(slip,false,"ion");

  var strip=function(t){ return t.replace(/\([^)]*\)/g,"").replace(/\s+/g," ").trim(); };
  var gp=strip(g), wp=strip(w);
  var gm=g.match(/\(([^)]*)\)/), wm=w.match(/\(([^)]*)\)/);

  if(multi && gp===wp){
    if(!gm)
      return no(cap(mn)+" forms more than one ion, so the name has to say which one — "+
        "put the Roman numeral in parentheses straight after the metal.", true, "roman");
    if(wm && gm[1]!==wm[1])
      return no("Check the Roman numeral against the charge on the "+mn+" ion.", true, "roman");
  }
  if(!multi && gm)
    return no(mWhyOne(sym)+" Its name takes no Roman numeral.",false,"roman");

  var gw=gp.split(" "), ww=wp.split(" ");
  var gLast=gw[gw.length-1], wLast=ww[ww.length-1];
  var gFirst=gw.slice(0,-1).join(" "), wFirst=ww.slice(0,-1).join(" ");
  if(gLast!==wLast && KNOWNIONS.indexOf(gLast)>=0)
    return no("That is a real ion, but not the one in this formula.",false,"ion");
  if(gLast!==wLast && pxTypo(gLast,wLast,KNOWNIONS))
    return no("Close — check the spelling of the ion's name.",false,"ion");
  if(gFirst!==wFirst && METALNAMES.indexOf(gFirst)>=0)
    return no("That is a different metal. Check the symbol in the formula.",false,"metal");
  if(gFirst!==wFirst && pxTypo(gFirst,wFirst,METALNAMES))
    return no("Close — check the spelling of the metal's name.",false,"metal");
  if(pxTypo(gp,wp,null)) return no("Close — check your spelling.",false,"other");
  return no(null,false,"other");
}

function pfNameCheck(raw, want){
  var r=nameCheck(raw, want, PF.x.m);
  PF.hint=r.hint; PF.ring=r.ring; PF.nameCode=r.code;
  return r.ok;
}

function pfCheck(){
  pfSync();
  var steps=pfSteps(), st=steps[PF.step-1], x=PF.x, p=POLY[x.p];
  if(st.k==="gate") return;   /* answered by its own buttons */
  PF.bad={}; PF.hint=null; PF.ring=false;
  PF.tries=PF.tries||{};
  PF.tries[st.k]=(PF.tries[st.k]||0)+1;
  var ok=false, typed="", fault="other";

  if(st.k==="ionentry"){
    typed=(PF.f.sym||"")+" "+(PF.f.chg||"");
    var gs=(PF.f.sym||"").replace(/\s+/g,"");
    var okS = gs===x.p;
    if(!okS){
      PF.bad.sym=true;
      if(gs.toLowerCase()===x.p.toLowerCase())
        PF.hint="Check the capitals. A symbol starts with a capital letter, and any letter after it is lowercase.";
    }
    var r=parseCharge(PF.f.chg), okQ=false;
    if(r.err){
      PF.bad.chg=true;
      if(!PF.hint) PF.hint = r.noSign ? "Is the <b>"+p.name+"</b> ion positive or negative?" : r.err;
    } else if(r.q===p.q) okQ=true;
    else {
      PF.bad.chg=true;
      if(!PF.hint) PF.hint="Check your ion sheet for the charge on the <b>"+
        p.name+"</b> ion.";
    }
    ok = okS && okQ;
    fault = !okS && !okQ ? "both" : !okS ? "symbol" : "charge";
    logAttempt("poly_f2n","ionentry",p.name,typed,ok,ok?"":fault,PF.tries[st.k],
      detailStr([{l:"symbol",k:okS},{l:"charge",k:okQ}]));
  } else if(st.k==="pcount" || st.k==="mcount"){
    var raw=(st.k==="mcount"?PF.f.mcnt:PF.f.cnt||"").trim();
    typed=raw;
    ok = /^\d+$/.test(raw) && +raw===st.ans;
    if(!ok){
      PF.bad.cnt=true;
      if(st.k==="mcount")
        PF.hint="Read the subscript straight after the metal's symbol. No subscript means one.";
    }
    logAttempt("poly_f2n",st.k,st.k==="mcount"?x.mn:p.name,typed,ok,ok?"":"count",PF.tries[st.k]);
  } else if(st.k==="mchg"){
    typed=PF.f.mchg;
    var rm=parseCharge(PF.f.mchg), skip=false;
    if(rm.err){
      PF.bad.mchg=true;
      PF.hint = rm.noSign ? "Is that charge positive or negative?" : rm.err;
      if(+((PF.f.mchg||"").trim())===Math.abs(st.ans) && rm.noSign){
        logAttempt("poly_f2n","mchg",x.mn,typed,false,"format",PF.tries[st.k]);
        pxRender(); return;
      }
    } else if(rm.q===st.ans) ok=true;
    else {
      PF.bad.mchg=true;
      PF.hint="Share the total out. Every "+x.mn+" ion in the formula carries the same charge.";
    }
    logAttempt("poly_f2n","mchg",x.mn,typed,ok,ok?"":(rm.err?"format":"charge"),PF.tries[st.k]);
  } else if(st.k==="name" || st.k==="pname"){
    typed=PF.f.txt;
    var gn=pxNorm(PF.f.txt), wn=pxNorm(st.ans);
    ok = gn===wn;
    if(!ok){
      PF.bad.txt=true;
      var slipN=ideSlip(gn);
      if(slipN) PF.hint=slipN;
      else if(KNOWNIONS.indexOf(gn)>=0) PF.hint="That is a real ion, but not the one in this formula.";
      else if(pxTypo(gn,wn,KNOWNIONS)) PF.hint="Close — check your spelling.";
    }
    logAttempt("poly_f2n",st.k,subDigits(x.p),typed,ok,ok?"":"ion",PF.tries[st.k]);
  } else if(st.k==="charges"){
    typed=PF.f.txt;
    var rc=parseChargeList(PF.f.txt);
    if(rc.err){
      PF.bad.txt=true; PF.hint=rc.err;
    } else if(sameCharges(rc.qs, st.ans)){
      ok=true;
    } else {
      PF.bad.txt=true;
      PF.hint=chargeListFault(rc.qs, st.ans, x.mn);
    }
    logAttempt("poly_f2n","charges",x.mn,typed,ok,ok?"":(rc.err?"format":"charge"),PF.tries[st.k]);
  } else if(st.k==="cname"){
    typed=PF.f.txt;
    ok = pfNameCheck(PF.f.txt, st.ans);
    if(!ok) PF.bad.txt=true;
    logAttempt("poly_f2n","cname",pxFormula(x),typed,ok,ok?"":(PF.nameCode||"other"),PF.tries[st.k]);
  } else {
    typed=PF.f.txt;
    var rt=parseCharge(PF.f.txt);
    if(rt.err){
      PF.bad.txt=true;
      PF.hint = rt.noSign ? "Is that charge positive or negative?" : rt.err;
      if(+((PF.f.txt||"").trim())===Math.abs(st.ans) && rt.noSign){
        logAttempt("poly_f2n","total",p.name,typed,false,"format",PF.tries[st.k]);
        pxRender(); return;
      }
    } else if(rt.q===st.ans) ok=true;
    else PF.bad.txt=true;
    logAttempt("poly_f2n","total",p.name,typed,ok,ok?"":(rt.err?"format":"charge"),PF.tries[st.k]);
  }

  if(ok){
    PF.f.txt="";
    if(PF.step===steps.length){
      PF.solved=true; PF.done++;
      if(!PF.misses){ PF.clean++; if(pnTier(PF.x)<2) PF.simple++; }
      track("poly_f2n", PF.misses===0);
    } else { PF.step++; PF.tip=null; }
  } else PF.misses++;
  pxRender();
}

/* ── the section shell ───────────────────────────────────────── */
/* Every item remembers the level it was built for. Changing the level or
   the direction throws away anything built for the other level — without
   this a level 1 compound can turn up under level 2, where it never asks
   about the metal. `force` rebuilds even a matching item, which is what
   pressing the level button should do. */
/* the "does this metal form more than one ion?" gate. Only formula → name
   asks it: going the other way the name already says so. */
function pfGate(said){
  PF.hint=null;
  PF.tries=PF.tries||{};
  PF.tries.gate=(PF.tries.gate||0)+1;
  var ok=said===mMulti(PF.x.m);
  if(ok){ PF.step++; PF.tip=null; }
  else { PF.misses++; PF.hint = said ? mWhyOne(PF.x.m) : mWhyMany(PF.x.m); }
  logAttempt("poly_f2n","gate",PF.x.m,said?"yes":"no",ok,ok?"":"gate",PF.tries.gate);
  pxRender();
}

function pxSync(force){
  if(PX.mode==="n2f"){
    if(force || !PN.x) { pnNew(); return; }
  } else {
    if(force || !PF.x) { pfNew(); return; }
  }
  pxRender();
}

function pxRender(){
  var h = PX.mode==="n2f" ? pnBody() : pfBody();

  var st = PX.mode==="n2f" ? PN : PF;
  h+='<p class="counter"><b>'+st.done+'</b> done · <b>'+st.clean+'</b> with no misses</p>';

  document.getElementById("sec-poly").innerHTML=h;

  if(PX.mode==="n2f") boardSlide(PN,pnParts(),"pn");

  if(ACTIVE!=="poly") return;
  var f=null;
  if(PX.mode==="n2f"){
    if(PN.phase==="entry") f=document.getElementById("pnS"+PN.slot);
    else if(PN.phase==="formula") f=document.getElementById("pnin");
  } else if(!PF.solved){
    var sk=pfStep().k;
    f = sk==="ionentry" ? document.getElementById("pfSym")
      : (sk==="pcount"||sk==="mcount") ? document.getElementById("pfN")
      : sk==="mchg" ? document.getElementById("pfQ")
      : document.getElementById("pfIn");
  }
  if(f){ f.focus(); if(/^(pnin|pnS\d|pfSym)$/.test(f.id)) caretToEnd(f); }
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-pmode],[data-pn],[data-pf],[data-pxadd],[data-pxremove]");
  if(!t) return;
  if(t.dataset.pmode){  PX.mode =t.dataset.pmode;    pxSync(false); return; }
  if(t.dataset.pxadd)    { pxAddRemove(t.dataset.pxadd,1); return; }
  if(t.dataset.pxremove) { pxAddRemove(t.dataset.pxremove,-1); return; }
  if(t.dataset.pn){
    if(t.dataset.pn==="next") pnNew();
    else if(t.dataset.pn==="hint"){ PN.tip=pnHint(); pxRender(); }
    else if(t.dataset.pn==="reveal") pnReveal();
    else if(t.dataset.pn==="build") pnCheckBuild();
    else pnCheck(t.dataset.pn);
  }
  if(t.dataset.pf){
    var e=t.dataset.pf;
    if(e==="next") pfNew();
    else if(e==="hint"){ PF.tip=pfHint(); pxRender(); }
    else if(e==="reveal") pfReveal();
    else if(e==="gy") pfGate(true);
    else if(e==="gn") pfGate(false);
    else pfCheck();
  }
});

document.addEventListener("input",function(ev){
  var t=ev.target, id=t.id;
  if(id!=="pnin" && id!=="pnS0" && id!=="pnS1" && id!=="pfSym") return;
  var off=textOffset(t), txt=t.textContent;
  if(id==="pnin") PN.ftext=txt;
  else if(id==="pfSym") PF.f.sym=txt;
  else PN.sym[id==="pnS0"?0:1]=txt;
  t.innerHTML = id==="pnin" ? subDigitsMarked(txt,true) : subDigits(txt);
  setOffset(t,off);
});
document.addEventListener("paste",function(ev){
  if(ev.target.id!=="pnin") return;
  ev.preventDefault();
  var txt=(ev.clipboardData||window.clipboardData).getData("text").replace(/\s+/g,"");
  document.execCommand("insertText",false,txt);
});
document.addEventListener("keydown",function(ev){
  if(ACTIVE!=="poly" || ev.key!=="Enter") return;
  ev.preventDefault();
  if(PX.mode==="n2f"){
    if(PN.phase==="done") pnNew();
    else if(PN.phase==="entry") pnCheck("entry");
    else if(PN.phase==="build") pnCheckBuild();
    else if(PN.phase==="formula") pnCheck("formula");
  } else {
    if(PF.solved) pfNew();
    else if(pfStep().k!=="gate") pfCheck();
  }
});

/* ═══════════════════════════════════════════════════════════════ */
mgNew();
piNew();
newRound();
fnNew();
nfNew();
/* build one of each before the first paint: pxRender draws whichever mode is
   current, so both have to exist before that mode is the polyatomic default */
PX.mode="n2f"; pnNew();
PX.mode="f2n"; pfNew();
drawSeg();
/* a link from the progress page can open one section: index.html#go=ions,
   #go=simple-f2n (24 Sept) */
function goFromHash(first){
  /* an activity id (from an assignment on the progress page, 25 Sept):
     index.html#go=poly_f2n opens that panel in that direction */
  var act=/[#&]go=([a-z0-9_]+)/.exec(location.hash);
  if(act && asgWhere(act[1])){ drawSeg(); openAct(act[1]); return; }
  var go=/[#&]go=([a-z]+)(?:-(f2n|n2f))?/.exec(location.hash), id=go&&go[1];
  if(id && sectionOf(id) && !sectionOf(id).subs.some(function(u){ return u.id===id && u.soon; })){
    if(go[2]) SM.mode=go[2];
    drawSeg(); showSection(id);
  } else if(first && !restoreIon()) drawPath();
}
goFromHash(true);
window.addEventListener("hashchange", function(){ goFromHash(false); });
gateSetup();
</script>
