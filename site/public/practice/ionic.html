<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ionic compounds · Class Live</title>
<style>
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --line:#12120f; --soft:#c9c5ba;
    --text:#101010; --muted:#454239;
    /* cations warm, anions cool — the bright pair fills the puzzle pieces,
       the dark pair is for anything set as text on white */
    --posFill:#f0a132; --posEdge:#8a4b00; --posInk:#2a1800; --pos:#8a4b00;
    --negFill:#45c4d6; --negEdge:#0d5c6b; --negInk:#04262e; --neg:#0b5866;
    --mark:#c2410c; --faint:#8a857a; --soft2:#e9e5da;
    --badbg:#ffecef; --badln:#f2a6a0; --goodbg:#e8f5ec; --warnbg:#fff3e8; --warnln:#fbd9bf;
    --bluebg:#e3edfb; --blueln:#bfe0f0; --blue:#0b4fa8;
    --good:#0a6b34; --bad:#b00018; --note:#7a4c00; --mark:#c2410c; --hot:#e01b00;
    --font: ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Courier New', Courier, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);
    padding:14px 16px 28px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;text-align:center}
  .mono{font-family:var(--mono)}
  sup{font-size:.58em;line-height:0}
  sub{font-size:.6em;line-height:0}

  h1{font-size:27px;font-weight:800;margin:0 0 3px}
  .lede{color:var(--muted);font-size:17.5px;font-weight:600;margin:0 auto 18px;
    max-width:52ch;line-height:1.4}

  .wordin{width:20ch}
  .pfrow{display:flex;gap:10px;align-items:center;justify-content:center;margin-top:12px}
  .ionpair .val{min-height:1.1em}
  .ioncol.live{border-color:var(--mark)}
  .ask b{font-weight:800;color:var(--text)}
  .correction{margin:16px auto 4px;font-size:17px;font-weight:600;line-height:1.4;
    color:var(--bad);max-width:46ch;min-height:1.4em}
  .correction.blank{visibility:hidden}
  /* the settled charge sits beside the symbol as its own flex item here,
     so it needs its own size rather than an em of the symbol */
  .ionentry > .qsup{font-family:var(--mono);font-weight:700;font-size:30px;
    line-height:1;margin-top:4px;opacity:.7}
  .ionentry > .qsup.pp{color:var(--pos)}
  .ionentry > .qsup.nn{color:var(--neg)}
  .ioncol .symfield{font-size:44px;min-width:122px}
  .qsup.ring{outline:4px solid var(--mark);outline-offset:3px;border-radius:7px;
    padding:1px 5px;opacity:1}

  /* symbol + charge entry: the charge sits raised, like a superscript */
  .ionentry{display:flex;align-items:flex-start;justify-content:center;gap:4px}
  .symfield{font-family:var(--mono);font-weight:700;font-size:52px;line-height:1.15;
    color:var(--text);background:var(--panel);border:3px solid var(--line);border-radius:12px;
    padding:4px 12px;min-width:140px;text-align:center;outline:none}
  .symfield:focus{border-color:var(--mark)}
  .symfield.bad{border-color:var(--bad)}
  .symfield:empty:before{content:attr(data-ph);font:500 15px var(--font);
    color:var(--muted);opacity:.6}
  .qfield{font-family:var(--mono);font-weight:700;font-size:26px;width:84px;
    text-align:center;padding:5px 4px;margin-top:2px;border:3px solid var(--line);
    border-radius:10px;background:var(--panel);color:var(--text)}
  .qfield:focus{outline:none;border-color:var(--mark)}
  .qfield.bad{border-color:var(--bad)}
  .qfield::placeholder{font:500 11.5px var(--font);color:var(--muted);opacity:.7}

  /* the ions restated under the compound name on the puzzle screen */
  .ionrecap{display:flex;gap:34px;justify-content:center;margin-top:14px;flex-wrap:wrap}
  .ionrecap .cap{margin:0 0 3px;font-size:13px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted)}
  .ionrecap .rval{font-family:var(--mono);font-weight:700;font-size:34px;line-height:1.1}
  .ionrecap .rval.p{color:var(--pos)}
  .ionrecap .rval.n{color:var(--neg)}

  /* board and its controls side by side */
  .buildrow{display:flex;gap:20px;align-items:flex-start;justify-content:center;
    flex-wrap:wrap;margin-top:14px}
  .buildside{flex:0 1 330px;min-width:270px;display:flex;flex-direction:column;gap:6px}
  .buildside .fbox,.buildside .win{margin-top:0}
  .buildside .steppers{margin-top:0}
  /* a revealed answer stands beside the board rather than under it, so it
     reads as the answer to what the board is showing */
  .buildside:has(.reveal),.buildside:has(.actions){flex:0 1 440px}
  /* the column is narrower than the page, so the two lower buttons carry a
     little less type — enough to stay on one line, which is what keeps them
     shorter than Check */
  .buildside .actions{margin-top:10px;max-width:none}
  .buildside .actions button{font-size:15px;padding:10px 12px}
  .buildside .actions .wide button{font-size:23px}
  .buildside .hintbox{font-size:16px;margin-top:10px}
  .buildside .reveal{margin:0;max-width:none;padding:12px 16px 14px}
  .buildside .reveal .rans{font-size:29px;margin-bottom:7px}
  .buildside .reveal .rwhy{font-size:16px;line-height:1.45;padding-left:20px}
  .buildside .reveal .rwhy li{margin:4px 0}
  .buildside .showrow{margin-top:2px}
  #gate{position:fixed;inset:0;z-index:200;background:var(--bg);
    display:flex;align-items:center;justify-content:center;padding:20px}
  #gate[hidden]{display:none}
  .gatebox{background:var(--panel);border:3px solid var(--line);border-radius:20px;
    padding:34px 30px 28px;max-width:440px;width:100%;text-align:center}
  .gatebox h2{margin:0 0 6px;font-size:26px;font-weight:700}
  .gatelede{margin:0 0 22px;font-size:17px;font-weight:600;color:var(--muted);line-height:1.45}
  .gatebox .gatename{font-size:24px;line-height:1.3}
  .gatenum{font-family:var(--mono);font-size:46px;font-weight:700;width:7.5ch;max-width:100%;
    text-align:center;letter-spacing:.06em;color:var(--text);background:var(--panel);
    border:3px solid var(--line);border-radius:14px;padding:8px 6px;vertical-align:middle}
  .gatenum:focus{outline:none;border-color:var(--mark)}
  .gatenum::placeholder{color:var(--muted);opacity:.3;font-size:22px}
  #gateAsk{display:flex;gap:12px;align-items:center;justify-content:center}
  #gateAsk .check{margin-top:0}
  .gatename{font-size:30px;font-weight:700;margin:4px 0 20px;color:var(--note)}
  .yn{display:inline-flex;gap:10px;justify-content:center;flex-wrap:wrap}
  div.yn{display:flex;margin-top:6px}
  .yn .check{min-width:110px}
  .qstep .in .yn .check{margin-top:0}
  .gatebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .gatebtns .check{margin-top:0}
  .ghostbtn{background:transparent;color:var(--muted);border:3px solid var(--line)}
  .ghostbtn:hover{color:var(--text)}
  .gatemsg{margin:16px auto 0;font-size:15.5px;line-height:1.45;color:var(--bad);
    min-height:1.4em;max-width:34ch}
  .linkbtn{margin-top:14px;background:none;border:none;color:var(--muted);
    font:600 14px var(--font);text-decoration:underline;cursor:pointer}
  .linkbtn:hover{color:var(--text)}
  .build{font:600 12px var(--mono);color:var(--muted);opacity:.55;
    position:fixed;right:10px;bottom:8px;z-index:50}
  .gatebuild{position:static;margin:14px 0 0;opacity:.5}
  .whoami b{color:var(--text)}
  .whoami a{color:var(--text)}
  .whoami .dot{color:var(--bad);font-weight:700}

  .sec{display:none}
  .sec.on{display:block}
  .sec [hidden]{display:none}
  /* the section owns the heading now; the two activities inside it do not */
  #sechead{text-align:center}
  #sechead h1{margin-bottom:10px}

  .pair{display:flex;gap:14px;max-width:620px;margin:0 auto}
  .layout{display:flex;gap:18px;align-items:flex-start;justify-content:center;flex-wrap:wrap}
  .ions{flex:0 1 280px;min-width:230px;display:flex;flex-direction:column;gap:12px}
  .rightcol{flex:0 1 auto;max-width:100%}

  .el{flex:1;min-width:0;background:var(--panel);border:3px solid var(--line);
    border-radius:18px;padding:18px 14px 16px;transition:border-color .25s}
  .el.ok-pos{border-color:var(--posEdge)}
  .el.ok-neg{border-color:var(--negEdge)}
  .el.dim{opacity:.32;border-color:var(--soft)}
  .el.err{border-color:var(--bad)}
  .el.shake{animation:shk .4s}
  .sym{font-family:var(--mono);font-size:56px;font-weight:700;line-height:1}
  .el.small{padding:12px 14px;display:flex;align-items:center;gap:14px;text-align:left}
  .el.small .sym{font-size:40px}
  .nm{font-size:18px;font-weight:600;color:var(--muted);margin:4px 0 14px}
  .el.small .nm{margin:0 0 3px;font-size:16px}

  .verbs{display:flex;gap:8px;justify-content:center}
  .verbs button{flex:1;background:var(--panel);color:var(--muted);border:3px solid var(--line);
    border-radius:11px;padding:10px 0;font:600 17px var(--font);cursor:pointer}
  .verbs button:hover{color:var(--text)}
  .verbs button.on{background:var(--note);border-color:var(--mark);color:var(--panel);font-weight:700}
  .verbs.err{border-radius:11px;box-shadow:0 0 0 3px var(--bad)}

  .ln{margin-top:12px;font-size:17px;font-weight:500;color:var(--muted);
    display:flex;align-items:center;justify-content:center;gap:7px;flex-wrap:wrap}
  .blank{background:none;border:none;border-bottom:2px solid var(--line);
    color:var(--text);font:700 22px var(--font);text-align:center;padding:3px}
  .blank:focus{outline:none;border-bottom-color:var(--note)}
  .blank::placeholder{font:500 13px var(--font);color:var(--muted);opacity:.6}
  .wordin::placeholder{font-size:14px}
  .blank.bad{border-bottom-color:var(--bad)}
  .num{width:56px}
  .chg{width:132px}
  .tiny{width:72px}
  .roman{width:88px;font-family:var(--mono)}

  .said{font-size:17px;font-weight:600;line-height:1.4}
  .said .hl{font-family:var(--mono);font-weight:700;font-size:19px}
  .said.p .hl{color:var(--pos)} .said.n .hl{color:var(--neg)}
  .why{font-size:15px;font-weight:500;line-height:1.4;margin:8px auto 0;
    max-width:28ch;color:var(--muted)}
  .why.err{color:var(--bad)}

  .check{margin-top:20px;background:var(--line);color:var(--panel);border:3px solid var(--line);
    border-radius:13px;padding:15px 34px;font:700 19px var(--font);cursor:pointer}
  .check:hover{filter:brightness(1.07)}
  .check.slim{margin-top:0;padding:12px 24px;font-size:17px}
  /* .check is declared after .ghostbtn, so the ghost look needs to be
     restated here to take effect on a button carrying both */
  .check.ghostbtn{background:transparent;color:var(--muted);border:3px solid var(--line)}
  .check.ghostbtn:hover{color:var(--text);border-color:var(--muted);filter:none}

  .board{background:var(--panel);border:3px solid var(--line);border-radius:18px;
    padding:8px;display:inline-block;transition:border-color .3s}
  .board.solved{border-color:var(--good)}
  .board svg{display:block;max-width:100%;height:auto}
  #anionStack{transition:transform .4s cubic-bezier(.2,.8,.3,1)}
  .piece{cursor:pointer}

  /* the two steppers sit side by side when they fit and stack when a long
     polyatomic formula means they do not */
  .steppers{display:flex;gap:12px;margin-top:12px;flex-wrap:wrap}
  .step{flex:1 1 120px;background:var(--panel);border:3px solid var(--line);
    border-radius:14px;
    padding:9px;display:flex;align-items:center;justify-content:center;gap:10px}
  .step span{font-size:18px;font-weight:700;min-width:58px;text-align:center;
    white-space:nowrap}
  .step button{flex:0 0 auto;width:40px;height:40px;border-radius:11px;border:3px solid var(--line);
    background:var(--panel);color:var(--text);font:700 22px var(--font);cursor:pointer;line-height:1}
  .step button:hover:not(:disabled){background:var(--line)}
  .step button:disabled{opacity:.3;cursor:default}

  .status{margin:11px auto 0;font-size:16px;font-weight:500;line-height:1.45;
    max-width:36ch;color:var(--muted)}
  .status.note{color:var(--note)} .status.good{color:var(--good)}

  /* ── numbered question steps (used by the naming sections) ───── */
  .subject{background:var(--panel);border:3px solid var(--line);border-radius:18px;
    padding:22px 18px 18px;max-width:560px;margin:0 auto;transition:border-color .3s}
  .subject.solved{border-color:var(--good)}
  .subject .big{font-family:var(--mono);font-weight:700;font-size:74px;line-height:1.05}
  .subject .bigname{font-size:37px;font-weight:700;line-height:1.2}
  .subject .cap{font-size:14px;font-weight:600;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted);margin-top:8px}
  .subject .ionline{font-family:var(--mono);font-weight:700;font-size:19px;
    color:var(--good);margin-top:9px;min-height:20px}
  .subject .big.p{color:var(--pos)} .subject .big.n{color:var(--neg)}

  .qsteps{max-width:560px;margin:16px auto 0;text-align:left;
    display:flex;flex-direction:column;gap:14px}
  .qstep{display:grid;grid-template-columns:22px 1fr;column-gap:12px;align-items:baseline}
  .qstep .no{font:700 14px var(--mono);color:var(--muted)}
  .qstep.cur .no{color:var(--note)}
  .qstep .qt b, .nflead b, .nfhint b, .correction b, .status b, .ask b{font-weight:800}
  .nflead b.mono sup{font-size:.6em}
  .qstep .qt{font-size:21px;font-weight:700;line-height:1.45}
  .qstep .dn{font-size:19px;font-weight:600;color:var(--muted);line-height:1.45}
  .qstep .dn b{color:var(--text);font-family:var(--mono)}
  .qstep .dn b.word{font-family:var(--font)}
  .qstep .in{margin-top:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .qstep .in .lbl{font-size:16px;font-weight:500;color:var(--muted)}
  .qstep .hint{flex-basis:100%;font-size:15.5px;font-weight:500;
    line-height:1.4;color:var(--bad);margin:0}
  .fill{font-size:18.5px;font-weight:600;line-height:2.2}
  .fill .blank{margin:0 2px}
  .qstep .in .fill{flex-basis:100%}
  .qstep .blank.bad{box-shadow:0 0 0 3px var(--bad);border-radius:6px}
  .ferr.mgno{flex-basis:100%;margin:2px 0 0;max-width:none;font-weight:700;font-size:18px}
  .qstep .in .verbs.err{box-shadow:0 0 0 3px var(--bad);border-radius:11px}

  .ionpair{display:flex;gap:16px;justify-content:center;margin:16px auto 0;
    flex-wrap:wrap;max-width:560px}
  .ioncol{flex:1 1 210px;max-width:260px;background:var(--panel);
    border:3px solid var(--line);border-radius:16px;padding:14px 12px;
    display:flex;flex-direction:column;gap:11px;align-items:center;
    transition:border-color .25s}
  .ioncol.p{border-color:var(--posEdge)}
  .ioncol.n{border-color:var(--negEdge)}
  .ioncol .cap{font-size:14px;font-weight:600;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);margin:0}
  .ioncol .val{font-family:var(--mono);font-weight:700;font-size:68px;line-height:1}
  .ioncol .cval{font-family:var(--mono);font-weight:700;font-size:38px;line-height:1}
  .ioncol .symin{width:160px;font-family:var(--mono);font-size:56px;
    font-weight:700;padding:0 4px}
  .ioncol .chg{width:150px;font-family:var(--mono);font-size:34px;font-weight:700}
  .ioncol.dim{opacity:.3}
  .ioncol .val sup.qsup{font-size:.44em;line-height:0;margin-left:3px;opacity:.62}
  .qsup.pp{color:var(--pos)} .qsup.nn{color:var(--neg)}
  .ioncol .blank{border:3px solid var(--line);border-radius:12px;
    background:var(--panel);padding:6px 10px}
  .ioncol .blank:focus{border-color:var(--mark)}
  .ioncol .blank.bad{border-color:var(--bad)}
  .ask{font-size:18px;font-weight:600;line-height:1.4;color:var(--note);
    margin:0 0 2px;max-width:26ch}
  .mult{display:flex;align-items:center;gap:7px;font-family:var(--mono);
    font-weight:700;font-size:23px}
  .mult .cnt{width:58px;font-family:var(--mono);font-size:23px}
  .mult .cnt.bad{border:2px solid var(--bad);border-radius:8px;padding:2px 4px;
    color:var(--bad)}
  .mult .ringnum{outline:3px solid var(--bad);outline-offset:3px;border-radius:7px;
    padding:1px 5px;color:var(--bad)}
  .mult .pp{color:var(--pos)} .mult .nn{color:var(--neg)}
  .nflead{margin:18px auto 6px;font-size:22px;font-weight:700;
    line-height:1.4;max-width:46ch}
  .nfstat{margin:13px auto 0;font-size:16px;font-weight:500;
    color:var(--muted);max-width:42ch;line-height:1.45}
  .nfstat.good{color:var(--good)} .nfstat.note{color:var(--note)}
  .nfhint{margin:11px auto 0;font-size:15.5px;font-weight:500;
    color:var(--bad);max-width:40ch;line-height:1.4}

  .tally{display:flex;gap:10px;justify-content:flex-start;margin-top:2px}
  .tally div{background:var(--panel);border:3px solid var(--line);border-radius:11px;
    padding:7px 13px;font:700 17px var(--mono)}
  .tally .p{color:var(--pos)} .tally .n{color:var(--neg)}

  /* Polyatomic ions: five options, one picked */
  .opts{display:flex;flex-direction:column;gap:9px;margin:16px auto 0;max-width:560px}
  .opt{background:var(--panel);border:3px solid var(--soft);border-radius:13px;
    padding:13px 16px;font-family:var(--mono);font-size:26px;font-weight:700;
    color:var(--text);cursor:pointer;text-align:center;letter-spacing:.03em}
  .opt:hover{border-color:var(--line)}
  .opt.on{border-color:var(--line);background:var(--soft2)}
  .sfx{color:var(--hot)}
  #sec-ions .check{width:100%;max-width:560px}
  .counter{margin:18px auto 0;font:600 14.5px var(--mono);color:var(--muted)}
  .counter b{color:var(--text)}

  /* formula entry */
  .fbox{margin-top:12px;background:var(--panel);border:2px solid var(--note);
    border-radius:18px;padding:16px;animation:pop .3s}
  .fbox .lbl{font-size:17px;font-weight:600;color:var(--text);margin:0 0 12px}
  .finput{font-family:var(--mono);font-size:38px;font-weight:700;color:var(--text);
    background:var(--panel);border:3px solid var(--line);border-radius:12px;
    padding:8px 14px;min-height:60px;min-width:200px;display:inline-block;
    text-align:center;outline:none;caret-color:var(--note)}
  .finput:focus{border-color:var(--mark)}
  .finput:empty:before{content:"type the formula";font:500 15px var(--font);
    color:var(--muted);opacity:.6}
  /* subscripts in the formula box sit on their own baseline rather than the
     page-wide line-height:0 rule, so a ring drawn round one is centred on
     the digit instead of on a collapsed line box */
  .finput sub{font-size:.58em;line-height:1;vertical-align:baseline;
    position:relative;top:.2em}
  /* after a wrong formula, ring the numbers that count ions — never the
     digits that belong inside a polyatomic ion, and only when the numbers
     are what went wrong */
  .finput.marknum sub.cnt{display:inline-block;outline:3px solid var(--bad);
    outline-offset:2px;border-radius:5px;padding:0 2px;color:var(--bad)}
  .fbox button{display:block;margin:12px auto 0;background:var(--line);color:var(--panel);
    border:none;border-radius:12px;padding:11px 26px;font:700 16px var(--font);cursor:pointer}
  .ferr{color:var(--bad);font-size:16px;font-weight:500;line-height:1.45;
    margin:10px auto 0;max-width:34ch}

  .okmsg{margin:0 0 10px;font:800 28px var(--font);color:var(--good)}
  .win{margin-top:12px;background:var(--goodbg);border:2px solid var(--good);
    border-radius:18px;padding:16px;animation:pop .3s}
  .win .f{font-family:var(--mono);font-size:38px;font-weight:700;color:var(--good);line-height:1.1}
  .win .fname{font-size:38px;font-weight:700;color:var(--good);line-height:1.15;
    text-wrap:balance}
  .win .c{font-size:21px;font-weight:600;margin-top:4px}
  .win p{color:var(--muted);font-size:16px;font-weight:500;line-height:1.5;margin:8px auto 14px;max-width:40ch}
  .win button{background:var(--line);color:var(--panel);border:none;border-radius:12px;
    padding:13px 28px;font:700 18px var(--font);cursor:pointer}
  .win.slim{max-width:560px;margin-left:auto;margin-right:auto}
  /* deliberately not the green of .win — a revealed answer is not a win */
  .reveal{margin:12px auto 0;max-width:620px;text-align:left;
    background:var(--warnbg);border:3px solid var(--note);border-radius:16px;
    padding:14px 20px 16px}
  .reveal .rlab{margin:0 0 3px;font:700 13px var(--font);letter-spacing:.14em;
    text-transform:uppercase;color:var(--note)}
  .reveal .rans{font-family:var(--mono);font-weight:700;font-size:36px;

<script>
/* ═══════════════════════════════════════════════════════════════
   STUDENT SIGN-IN AND TRACKING
   Finished items are queued in this browser and posted in batches,
   so a dropped connection never loses anyone's work.
   ═══════════════════════════════════════════════════════════════ */
/* ── the tracking switch ────────────────────────────────────────
   false: no sign-in screen, no class numbers, nothing sent anywhere.
   The counters under each section still run, so a student can see
   their own progress for as long as the tab is open.
   Set it back to true to turn the roster and the dashboard back on;
   nothing else has to change. */
var TRACKING = false;

var API=(window.ION_API||"/api").replace(/\/+$/,""), QKEY="ionq", ST={n:null,name:null,off:false};

/* A class number: digits only, short ones padded to three so an old
   three-digit roster still works, longer ones kept whole. The Worker does
   exactly the same, so the two always agree. */
function normNum(raw){
  var d=String(raw==null?"":raw).replace(/\D/g,"");
  if(!d || d.length>12) return "";
  return d.length<3 ? ("00"+d).slice(-3) : d;
}
function tqRead(){ try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; } }
function tqWrite(q){ try{ localStorage.setItem(QKEY,JSON.stringify(q.slice(-400))); }catch(e){} }

function track(activity, clean){
  if(!TRACKING || !ST.n) return;
  var q=tqRead();
  q.push({n:ST.n, a:activity, c:clean?1:0, t:Date.now()});
  tqWrite(q);
  ASG.forEach(function(x){ if(x.a===activity) x.k++; });
  asgNow();
}

/* ── assignments (25 Sept) ──────────────────────────────────────
   Read once after sign-in. The server sends the finishes it already has;
   finishes still waiting in the queue here are added on top, and every
   finish from now on adds one as it happens. Ported from Balance
   Workshop, which built this first. */
var ASG=[];
function loadAssigned(then){
  if(!TRACKING || !ST.n) return then();
  var q=tqRead();
  fetch(API+"/assigned?n="+ST.n)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(d){
      ASG=(d.list||[]).map(function(x){
        var ts=x.ts||[];
        x.k=ts.length;
        q.forEach(function(e){
          if(e.n===ST.n && e.a===x.a && e.t>=x.c && ts.indexOf(e.t)<0) x.k++; });
        delete x.ts;
        return x;
      });
    })
    .catch(function(){})
    .then(function(){ asgNow(); then(); });
}
/* Nothing is posted per answer: Cloudflare's free plan counts writes, and
   each post is one write per student, so the queues go every FLUSH_MS and
   when the page is left (23 Sept). */
var flushing=false, FLUSH_MS=120000;
function tqFlush(leaving){
  if(!TRACKING || flushing) return;
  var q=tqRead().slice(0,200);   /* the Worker takes 200 at a time */
  if(!q.length){ markSynced(true); return; }
  flushing=true;
  fetch(API+"/event",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({events:q}), keepalive:!!leaving})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(){ tqWrite(tqRead().slice(q.length)); markSynced(true); flushing=false;
      if(tqRead().length) tqFlush(leaving); })
    .catch(function(){ markSynced(false); flushing=false; });
}
function markSynced(ok){
  var w=document.getElementById("whoami");
  if(!w || !ST.n) return;
  /* the name goes back to their progress page (24 Sept) */
  w.innerHTML=esc(ST.name)+
    (ok ? "" : ' <span class="dot" title="not saved yet">•</span>');
}
function flushAll(leaving){ tqFlush(leaving); if(window.lqFlush) lqFlush(leaving); }
window.addEventListener("online", function(){ flushAll(); });
document.addEventListener("visibilitychange", function(){
  flushAll(document.visibilityState==="hidden");
});
window.addEventListener("pagehide", function(){ flushAll(true); });
setInterval(function(){ flushAll(); }, FLUSH_MS);

function startApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  var w=document.getElementById("whoami");
  if(!TRACKING){ w.hidden=true; return; }
  if(ST.n){ markSynced(true); loadAssigned(flushAll); }
  else if(ST.test){ w.textContent="practice · nothing recorded"; }
  else { w.textContent="not signed in"; }
}

/* tell the dashboard they signed in, including when a remembered student
   comes back to the page; nothing waits on it */
function signedIn(){
  try{ fetch(API+"/signin",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({n:ST.n, app:"ion"}), keepalive:true}).catch(function(){}); }catch(e){}
}

function gateSetup(){
  var g=function(id){ return document.getElementById(id); };
  var found=null;

  /* tracking off: straight into the app, no number asked for */
  if(!TRACKING){ ST.off=true; startApp(); return; }

  function msg(t){ g("gateMsg").textContent=t||""; }
  function ask(){
    g("gateAsk").hidden=false; g("gateConfirm").hidden=true;
    g("gateLede").textContent="Type your class number to begin.";
    g("gateNum").focus(); g("gateNum").select();
  }

  function confirmAs(rec){
    found=rec;
    g("gateAsk").hidden=true;
    g("gateConfirm").hidden=false;
    g("gateLede").textContent = rec.test ? "Testing mode" : "Is this you?";
    g("gateName").textContent = rec.name;
    msg("");
    g("gateYes").focus();
  }

  function lookUp(){
    /* whole number, however many digits it has — cutting it down to three is
       what stopped longer class numbers matching the roster */
    var n=normNum(g("gateNum").value);
    if(!n){ msg("Type your class number."); return; }

    msg("Checking…");
    fetch(API+"/student?n="+n)
      .then(function(r){
        if(r.status===404) throw new Error("nomatch");
        if(!r.ok) throw new Error("api");
        return r.json();
      })
      .then(function(d){ confirmAs({n:d.n, name:d.name}); })
      .catch(function(e){
        if(e.message==="nomatch"){
          msg("No one on the class list has the number "+n+". Check it and try again.");
          g("gateNum").select();
        } else {
          msg("The class list cannot be reached right now. Tell your teacher, "+
              "and show them this: "+location.origin+API+"/student");
        }
      });
  }

  g("gateGo").addEventListener("click", lookUp);
  g("gateNum").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); lookUp(); }
  });
  g("gateYes").addEventListener("click", function(){
    if(found.test){ ST.n=null; ST.name="Testing"; ST.test=true; startApp(); return; }
    ST.n=found.n; ST.name=found.name; CW.setPractice(false);
    try{ sessionStorage.setItem("ionStudent", JSON.stringify(ST)); }catch(e){}
    signedIn();
    /* a fresh sign-in opens on "Your progress" (24 Sept); coming back from
       there, the remembered sign-in drops them straight into the app */
    location.href="/beta/";
  });
  g("gateNo").addEventListener("click", function(){ found=null; msg(""); ask(); });
  g("gateSkip").addEventListener("click", function(){ ST.off=true; ST.test=true; CW.setPractice(true); startApp(); });

  var saved=null;
  try{ saved=JSON.parse(sessionStorage.getItem("ionStudent")||"null"); }catch(e){}
  if(saved && saved.n){ ST.n=saved.n; ST.name=saved.name; signedIn(); startApp(); return; }
  /* practice mode, chosen earlier on this tab: no number asked again */
  if(CW.practicing()){ ST.off=true; ST.test=true; startApp(); return; }
  g("gateNum").focus();
}

function gcd(a,b){return b?gcd(b,a%b):a;}
function chargeText(q){return (q>0?"+":"−")+Math.abs(q);}
function ionHTML(sym,q){return sym+"<sup>"+chargeText(q)+"</sup>";}
function cap(s){return s.charAt(0).toUpperCase()+s.slice(1);}
function plural(n,w){return n+" "+w+(n===1?"":"s");}
var NUMWORD=["zero","one","two","three","four","five","six","seven","eight"];
function numWord(n){return NUMWORD[n]||String(n);}

/* The question that turns the anion's charge into the metal's. The number of
   metal ions decides "the" against "each"; the number of anions decides
   whether that charge belongs to one ion or is a total across several. */
function balanceAsk(mn, nm, anName, na, tot){
  return 'What would the charge on '+(nm===1?"the":"each")+' <b>'+mn+'</b> ion have to be '+
    'to balance the '+(na===1?"":"total ")+'<b class="mono">'+chargeText(tot)+'</b> charge '+
    (na===1 ? 'on the <b>'+anName+'</b> ion?'
            : 'from the '+numWord(na)+' <b>'+anName+'</b> ions?');
}
/* "How many hydroxide ions are present in the formula?" */
function countAsk(name){
  return 'How many <b>'+name+'</b> ions are present in the formula?';
}
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
function subDigits(t){return esc(t).replace(/\d+/g,function(m){return "<sub>"+m+"</sub>";});}
function subTag(n){return n===1?"":"<sub>"+n+"</sub>";}

/* Same live subscripts, but the numbers that count ions are tagged
   separately from the digits that belong inside a polyatomic ion —
   so only the counts get ringed when a formula comes back wrong. */
function subDigitsMarked(t,poly){
  t=String(t||"");
  var out="", i=0, n=t.length, depth=0, seenParen=false, prev="";
  while(i<n){
    var ch=t.charAt(i);
    if(/\d/.test(ch)){
      var j=i;
      while(j<n && /\d/.test(t.charAt(j))) j++;
      var run=t.slice(i,j), isCount;
      if(!poly) isCount=true;
      else if(prev===")") isCount=true;
      else if(!seenParen && depth===0 && /^[A-Z][a-z]?$/.test(t.slice(0,i))) isCount=true;
      else isCount=false;
      out+='<sub'+(isCount?' class="cnt"':'')+'>'+esc(run)+'</sub>';
      prev=run.charAt(run.length-1);
      i=j;
      continue;
    }
    if(ch==="("){ depth++; seenParen=true; }
    if(ch===")") depth--;
    out+=esc(ch);
    prev=ch;
    i++;
  }
  return out;
}

function shuffle(a){
  var i,j,t;
  for(i=a.length-1;i>0;i--){
    j=Math.floor(Math.random()*(i+1));
    t=a[i]; a[i]=a[j]; a[j]=t;
  }
  return a;
}

/* charge entry. A bare number comes back as a prompt for the sign,
   which is the one piece of feedback the naming sections give. */
function parseCharge(raw){
  var s=(raw||"").trim().replace(/−/g,"-").replace(/\s+/g,"");
  if(!s) return {err:"Enter the charge."};
  /* the 1 is always written, +1 or -1 — a bare sign is not enough (25 Sept) */
  if(s==="+"||s==="-") return {err:"Write the 1 too: "+(s==="+"?"+1":"\u22121")+".", bare:true};
  var m=s.match(/^(?:([+-])(\d)|(\d)([+-]))$/);
  if(!m){
    if(/^\d+$/.test(s)) return {err:"Add a sign too — +"+s+" or −"+s, noSign:true};
    return {err:"Write a sign and a number, like +1"};
  }
  var d=+(m[2]||m[3]), sg=(m[1]||m[4])==="+"?1:-1;
  if(d===0) return {err:"An ion can't have a charge of zero."};
  return {q:d*sg};
}

var ROMAN={1:"I",2:"II",3:"III",4:"IV",5:"V",6:"VI",7:"VII"};

/* A list of charges read off the periodic table: "+2, +3" in any order, with
   commas, spaces or "and" between them. Returns {qs} sorted, or {err}. */
function parseChargeList(raw){
  var s=(raw||"").trim().replace(/[\u2212\u2013\u2014]/g,"-");
  if(!s) return {err:"List the charges, separated by commas."};
  var parts=s.split(/[,;/]|\s+and\s+|\s+/).filter(function(t){ return t; });
  var qs=[], i, r, unsigned=false;
  for(i=0;i<parts.length;i++){
    r=parseCharge(parts[i]);
    if(r.err){
      if(r.noSign) unsigned=true;
      else return {err:r.err};
    } else if(qs.indexOf(r.q)<0) qs.push(r.q);
  }
  if(unsigned) return {err:"Write a sign on each one, like +2.", noSign:true};
  if(!qs.length) return {err:"List the charges, separated by commas."};
  qs.sort(function(a,b){ return a-b; });
  return {qs:qs};
}
function chargeListText(qs){
  return qs.slice().sort(function(a,b){ return a-b; })
    .map(chargeText).join(" and ");
}
/* the charges this metal is listed with, as the app's own table has them */
function metalCharges(sym){ return (METALS[sym]||{qs:[]}).qs.slice().sort(function(a,b){ return a-b; }); }
function sameCharges(a,b){
  return a.length===b.length && a.every(function(v,i){ return v===b[i]; });
}
/* the shared wording for the "what charges can it form?" step */
function chargeListAsk(name){

    '<span style="font-weight:600;color:var(--muted)">List them all, separated by commas.</span>';

function chargeListFault(got, want, name){
  if(got.length<want.length)
    return "Your periodic table lists more charges than that under <b>"+name+"</b>.";
  if(got.length>want.length)
    return "That is more charges than <b>"+name+"</b> is listed with. Read them straight off the table.";
  return "Check the charges listed under <b>"+name+"</b> on your periodic table.";
}

/* live-subscript field: caret bookkeeping */
function textOffset(root){
  var sel=window.getSelection();
  if(!sel.rangeCount) return 0;
  var rg=sel.getRangeAt(0), r=document.createRange();
  r.selectNodeContents(root);
  try{ r.setEnd(rg.endContainer, rg.endOffset); }catch(e){ return root.textContent.length; }
  return r.toString().length;
}
function setOffset(root,off){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n, seen=0, r, s;
  while((n=w.nextNode())){
    var len=n.nodeValue.length;
    if(seen+len>=off){
      r=document.createRange(); r.setStart(n,off-seen); r.collapse(true);
      s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
      return;
    }
    seen+=len;
  }
  caretToEnd(root);
}
function caretToEnd(root){
  var r=document.createRange(); r.selectNodeContents(root); r.collapse(false);
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
