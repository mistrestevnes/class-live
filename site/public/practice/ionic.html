function mMulti(s){ return !!METALS[s] && METALS[s].qs.length>1; }
function mGroup(s){ return METALS[s] && METALS[s].g; }
/* Only groups 1 and 2 are predictable enough to state as a rule. Everything
   else — group 13 included — gets sent to the table. */
function mRuleGroup(s){ var g=mGroup(s); return (g===1||g===2) ? g : null; }

/* Why a metal does or does not need a Roman numeral, in the words the
   student can check against their own table. */
function mWhyOne(s){
  var g=mRuleGroup(s);
  return cap(mName(s))+(g
    ? " is in group "+g+", so it forms only one ion."
    : " has only one charge on your periodic table, so it forms only one ion.");
}
function mWhyMany(s){
  return cap(mName(s))+" has more than one charge on your periodic table, so "+
    "the name has to say which ion it is.";
}
function mGateDone(s){
  return mMulti(s)
    ? '<b class="word">Yes</b> — '+mName(s)+" forms more than one ion, so we have to "+
      "figure out its charge."
    : '<b class="word">No</b> — '+mName(s)+" forms only one ion, so we can go straight "+
      "to naming it.";
}

/* subscripts follow from the two charges, so a compound only has
   to name its metal, that metal's charge, and its anion */
function subscripts(mq,aq){
  var g=gcd(mq,Math.abs(aq));
  return {nm:Math.abs(aq)/g, na:mq/g};
}
function formulaOf(c){
  var k=subscripts(c.q,ANION[c.a].q);
  return c.m+(k.nm>1?k.nm:"")+c.a+(k.na>1?k.na:"");
}
function formulaHTML(c){
  var k=subscripts(c.q,ANION[c.a].q);
  return c.m+subTag(k.nm)+c.a+subTag(k.na);
}
function nameOf(c){
  return mName(c.m)+(mMulti(c.m)?"("+ROMAN[c.q]+")":"")+" "+ANION[c.a].name;
}

/* Which metal-charge/anion pairings are allowed to be generated. Every
   combination listed below is a compound that really exists, so a student
   never meets an invented one. Metals with a single charge sit in the same
   pool as the rest — that is the whole point: the activity cannot be
   answered without first checking the table. */
var PAIRS={
  Sc3:"F Cl Br I O N",   Y3 :"F Cl Br I O N",  Zr4:"F Cl Br I O S",
  Zn2:"F Cl Br I O S",   Ag1:"F Cl Br I O S",  Cd2:"F Cl Br I O S",
  Al3:"F Cl Br I O S N", Ga3:"F Cl Br I O S N",In3:"F Cl Br I O S N",
  Ti3:"F Cl Br I O",     Ti4:"F Cl Br I O S",
  V3 :"F Cl Br I O",     V4 :"F Cl O",         V5 :"F O",
  Cr2:"F Cl Br I O S",   Cr3:"F Cl Br I O S N",
  Mn2:"F Cl Br I O S",   Mn4:"F O",
  Fe2:"F Cl Br I O S",   Fe3:"F Cl Br I O S",
  Co2:"F Cl Br I O S",   Co3:"F O",
  Ni2:"F Cl Br I O S",   Ni3:"O",
  Cu1:"Cl Br I O S",     Cu2:"F Cl Br O S",    Cu3:"O",
  Sn2:"F Cl Br I O S",   Sn4:"F Cl O S",
  Pb2:"F Cl Br I O S",   Pb4:"O"
};
function C(m,q,a){return {m:m,q:q,a:a};}
var MULTI=(function(){
  var out=[];
  Object.keys(PAIRS).forEach(function(key){
    var m=key.replace(/\d+$/,""), q=+key.slice(m.length);
    PAIRS[key].split(" ").forEach(function(a){ out.push(C(m,q,a)); });
  });
  return out;
})();
var MULTI_MANY = MULTI.filter(function(c){ return mMulti(c.m); });
var MULTI_ONE  = MULTI.filter(function(c){ return !mMulti(c.m); });

/* formula → name keeps to formulas with a single metal atom, since
   its arithmetic runs straight from the anion count */
function oneMetal(c){ return subscripts(c.q,ANION[c.a].q).nm===1; }
var SINGLE_MANY = MULTI_MANY.filter(oneMetal);
var SINGLE_ONE  = MULTI_ONE.filter(oneMetal);

/* Naming · Binary · Single-charge (28 Sept): main-group metals only —
   groups 1 and 2 and aluminum. Zinc, silver and the other one-charge
   transition metals stay in Multi-charge.
   Its own list, since the main pool above is built around the transition
   metals; every pair is a compound that really exists. */
var MAIN_PAIRS={
  Li1:"F Cl Br I O S N", Na1:"F Cl Br I O S",   K1:"F Cl Br I O S",
  Mg2:"F Cl Br I O S N", Ca2:"F Cl Br I O S N", Sr2:"F Cl Br I O S N",
  Ba2:"F Cl Br I O S N", Al3:"F Cl Br I O S N"
};
var SC_N2F=(function(){
  var out=[];
  Object.keys(MAIN_PAIRS).forEach(function(key){
    var m=key.replace(/\d+$/,""), q=+key.slice(m.length);
    MAIN_PAIRS[key].split(" ").forEach(function(a){ out.push(C(m,q,a)); });
  });
  return out;
})();
var SC_F2N = SC_N2F.filter(oneMetal);

/* Draw alternately-ish from two decks so a run of items is a genuine mix of
   metals that need a Roman numeral and metals that do not. */
function mixDeck(a,b,n){
  var A=shuffle(a.slice()), B=shuffle(b.slice()), out=[];
  while(out.length<n && (A.length||B.length))
    out.push((!B.length || (A.length && Math.random()<0.5) ? A : B).pop());
  return out;
}

/* ═══════════════════════════════════════════════════════════════
   SECTION SWITCHING
   ═══════════════════════════════════════════════════════════════ */
/* Two parts, each a group in the nav. A section can be split into
   subsections, drawn as a row of pills under its heading. Direction —
   formula → name against name → formula — is never a subsection: it stays
   a toggle inside a panel. ACTIVE is the panel on screen, not the section,
   so every activity's own ACTIVE==="…" test still works unchanged. */
var SECTIONS=[
  {id:"ionic",    label:"Ionic charges",            grp:"Introduction to Ions",
   subs:[{id:"charges",   label:"Single-charge ions"},
         {id:"multi",     label:"Multi-charge ions", soon:true}]},
  {id:"polyid",   label:"Polyatomic ions",          grp:"Introduction to Ions",
   subs:[{id:"ions"}]},
  {id:"building", label:"Building ionic compounds", grp:"Ionic compounds",
   subs:[{id:"build",     label:"Binary ionic compounds"},
         {id:"buildpoly", label:"Polyatomic ionic compounds", soon:true}]},
  {id:"naming",   label:"Naming ionic compounds",   grp:"Ionic compounds",
   subs:[{id:"simple",    label:"Binary ionic compounds"},
         {id:"poly",      label:"Polyatomic ionic compounds"}]}
];
var ACTIVE=null;      /* nothing open until a section is picked */
/* the subsection each section was last left on */
var LASTSUB={};
function sectionOf(panel){
  for(var i=0;i<SECTIONS.length;i++)
    for(var j=0;j<SECTIONS[i].subs.length;j++)
      if(SECTIONS[i].subs[j].id===panel) return SECTIONS[i];
  return null;
}
/* which direction the Simple ions section is showing */
/* lvl: "one" = Single-charge (main group), "multi" = Multi-charge, the
   mixed set with the "more than one ion?" question (28 Sept) */
var SM={mode:"f2n", lvl:"one"};
function smId(dir){ return (SM.lvl==="one"?"sc_":"mv_")+dir; }
function setLvl(v){
  if(v===SM.lvl || (v!=="one"&&v!=="multi")) return;
  SM.lvl=v; FN.queue=[]; NF.queue=[]; fnNew(); nfNew();
}
function onF2N(){ return ACTIVE==="simple" && SM.mode==="f2n"; }
function onN2F(){ return ACTIVE==="simple" && SM.mode==="n2f"; }

/* the "you are here" row (27 Sept, Class Live practice): the section as a
   button that drops down the others, then the subsection and, for naming,
   the direction as joined controls. Before a section is picked the
   sections show as big buttons under the row. */
var SHORT={ionic:"Ionic charges", polyid:"Polyatomic ions", building:"Building", naming:"Naming"};
var SUBSHORT={build:"Binary", buildpoly:"Polyatomic", simple:"Binary", poly:"Polyatomic"};
var PICKED=false;      /* has a section been opened yet */
function drawPath(){
  asgNow();
  var o={title:"Ionic compounds", steps:[], segs:[], next:null};
  var secs=SECTIONS.map(function(s){ return [s.id, SHORT[s.id]]; });
  if(!PICKED) o.next={id:"sec", opts:secs};
  else{
    var sec=sectionOf(ACTIVE);
    o.steps.push({id:"sec", opts:secs, cur:sec.id});
    var subs=sec.subs.filter(function(u){ return SUBSHORT[u.id]; });
    if(sec.id==="naming"){
      /* Binary is a drop-down of its two levels; Polyatomic its own button */
      o.steps.push({id:"lvl", cur:ACTIVE==="simple"?SM.lvl:null, sel:ACTIVE==="simple", nosep:false,
        label:ACTIVE==="simple"?null:"Binary",
        opts:[["one","Binary \u00b7 Single-charge"],["multi","Binary \u00b7 Multi-charge"]]});
      o.steps.push({id:"sub", btn:true, val:"poly", label:"Polyatomic", sel:ACTIVE==="poly", nosep:true});
    }
    else if(subs.length>1) o.segs.push({id:"sub", cur:ACTIVE,
      opts:subs.map(function(u){ return [u.id, SUBSHORT[u.id], u.soon]; })});
    if(ACTIVE==="simple"||ACTIVE==="poly") o.segs.push({id:"dir", right:true,
      cur: ACTIVE==="simple" ? SM.mode : PX.mode,
      opts:[["f2n","Formula \u2192 name"],["n2f","Name \u2192 formula"]]});
    CW.save("ion",{panel:ACTIVE, sm:SM.mode, px:PX.mode, lvl:SM.lvl});
  }
  var el=document.getElementById("cwpath");
  if(el) el.innerHTML=CW.pathHTML(o);
}
function ionPick(id, v){
  if(id==="lvl"){ setLvl(v); if(ACTIVE!=="simple") showSection("simple"); else drawPath(); return; }
  if(id==="dir"){
    if(ACTIVE==="simple"){ SM.mode=v; drawSeg(); v==="f2n" ? fnRender() : nfRender(); }
    else { PX.mode=v; pxSync(false); }
    drawPath(); return;
  }
  if(PICKED && v===ACTIVE) return drawPath();
  showSection(v);
}
CW.init({draw:drawPath, pick:ionPick});

/* shows the direction's own panel inside Naming · Binary */
function drawSeg(){
  document.getElementById("sec-f2n").hidden = SM.mode!=="f2n";
  document.getElementById("sec-n2f").hidden = SM.mode!=="n2f";
}
/* takes a section id or a panel id (a subsection, or the puzzle's
   tutorial replay) */
function showSection(id){
  var sec=null;
  SECTIONS.forEach(function(s){ if(s.id===id) sec=s; });
  if(sec){
    var open=sec.subs.filter(function(u){ return !u.soon; });
    id=LASTSUB[sec.id]||open[0].id;
  }
  ACTIVE=id; PICKED=true;
  LASTSUB[sectionOf(id).id]=id;
  SECTIONS.forEach(function(s){ s.subs.forEach(function(u){
    var n=document.getElementById("sec-"+u.id);
    if(n) n.classList.toggle("on",u.id===id);
  }); });
  drawPath();
  if(id==="simple"){ drawSeg(); SM.mode==="f2n"?fnRender():nfRender(); }
  var rep=document.getElementById("tutReplay");
  if(id==="build"){ rep.hidden=!tut; drawTut(); }
  else{ rep.hidden=true; document.getElementById("tutLayer").hidden=true; }
}
/* coming back to the topic reopens where they left off */
function restoreIon(){
  var s=CW.load("ion");
  if(!s || !sectionOf(s.panel)) return false;
  if(s.sm==="f2n"||s.sm==="n2f") SM.mode=s.sm;
  if(s.px==="f2n"||s.px==="n2f") PX.mode=s.px;
  if(s.lvl) setLvl(s.lvl);
  showSection(s.panel);
  if(s.panel==="poly") pxSync(false);
  return true;
}
/* ═══════════════════════════════════════════════════════════════
   REPORTING EVERY ANSWER
   The dashboard's own counters still run through track(). This adds
   a second, fuller record — one row per attempt, with what was typed
   and which fault it was — queued locally and posted in batches.
   ═══════════════════════════════════════════════════════════════ */
var LKEY="ionlog", lflushing=false;
function lqRead(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"[]"); }catch(e){ return []; } }
function lqWrite(q){ try{ localStorage.setItem(LKEY,JSON.stringify(q.slice(-1500))); }catch(e){} }

function logAttempt(act, step, prompt, typed, ok, fault, tryNo, detail){
  if(!TRACKING || !ST.n) return;
  var q=lqRead();
  var row={n:ST.n, a:act, s:step, p:String(prompt).slice(0,60),
          y:String(typed).slice(0,40), k:ok?1:0, f:fault||"", r:tryNo, t:Date.now()};
  if(detail) row.d=String(detail).slice(0,180);
  q.push(row);
  lqWrite(q);
}
/* build a detail string from [{l:label, k:right-or-wrong}, ...] — same shape
   the balancing page uses, so the dashboard's pill rendering needs no change */
function detailStr(parts){
  return parts.map(function(p){ return String(p.l).replace(/[|=]/g,"")+"="+(p.k?1:0); }).join("|");
}
function lqFlush(leaving){
  if(!TRACKING || lflushing) return;
  var q=lqRead().slice(0,200);   /* the Worker takes 200 at a time */
  if(!q.length) return;
  lflushing=true;
  fetch(API+"/attempt",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({items:q}), keepalive:!!leaving})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(){ lqWrite(lqRead().slice(q.length)); lflushing=false;
      if(lqRead().length) lqFlush(leaving); })
    .catch(function(){ lflushing=false; });
}

/* ═══════════════════════════════════════════════════════════════
   ASSIGNMENTS (25 Sept)
   the ionic page has no fixed levels — a "level" here is just a panel
   (and, for the two naming sections, which direction). The assignable
   ids are exactly the ids the results table already tracks: charges,
   build, nf_id, sc_f2n, sc_n2f, mv_f2n, mv_n2f, poly_f2n, poly_n2f.
   ═══════════════════════════════════════════════════════════════ */
var ASG_WHERE={
  charges:  {panel:"charges"},
  build:    {panel:"build"},
  nf_id:    {panel:"ions"},
  sc_f2n:   {panel:"simple", mode:"f2n", lvl:"one"},
  sc_n2f:   {panel:"simple", mode:"n2f", lvl:"one"},
  mv_f2n:   {panel:"simple", mode:"f2n", lvl:"multi"},
  mv_n2f:   {panel:"simple", mode:"n2f", lvl:"multi"},
  poly_f2n: {panel:"poly",   mode:"f2n"},
  poly_n2f: {panel:"poly",   mode:"n2f"}
};
function asgWhere(a){ return ASG_WHERE[a]||null; }
/* open one panel by its results id — an assignment, or later a link from
   the progress page, the same way the balancing page's openAct works */
function openAct(a){
  var w=asgWhere(a);
  if(!w) return;
  if(w.panel==="simple" && w.mode) SM.mode=w.mode;
  if(w.lvl) setLvl(w.lvl);
  if(w.panel==="poly" && w.mode) PX.mode=w.mode;
  showSection(w.panel);
  if(w.panel==="poly") pxSync(false);
}

/* 29 Sept: which assignable id is on screen now, for the progress line */
function curAsgId(){
  if(typeof PICKED!=="undefined" && !PICKED) return null;
  for(var a in ASG_WHERE){
    var w=ASG_WHERE[a];
    if(w.panel!==ACTIVE) continue;
    if(w.panel==="simple" && (w.mode!==SM.mode || w.lvl!==SM.lvl)) continue;
    if(w.panel==="poly" && w.mode!==PX.mode) continue;
    return a;
  }
  return null;
}
function asgNow(){ var id=null; try{ id=curAsgId(); }catch(e){} CW.asgNow(ASG, id); }
/* ═══════════════════════════════════════════════════════════════
   SECTION 1 — ION CHARGES
   Three questions, one at a time. A wrong answer marks the field
   and nothing else; the only written prompt is the missing sign.
   ═══════════════════════════════════════════════════════════════ */
var MG={queue:[],e:null,step:1,verb:null,n:"",q:"",bad:{},hint:null,
        done:0,clean:0,misses:0,solved:false};

function mgNew(){
  if(!MG.queue.length) MG.queue=shuffle(MAIN.slice());
  MG.e=MG.queue.pop();
  MG.step=1; MG.verb=null; MG.n=""; MG.q="";
  MG.g=""; MG.val="";
  MG.bad={}; MG.hint=null; MG.misses=0; MG.solved=false; MG.shown=false; MG.tip=null; MG.run=0;
  MG.tries={};
  mgRender();
}

function mgSync(){
  var f;
  if((f=document.getElementById("mgG")))   MG.g=f.value;
  if((f=document.getElementById("mgV")))   MG.val=f.value;
  if((f=document.getElementById("mgN")))   MG.n=f.value;
  if((f=document.getElementById("mgQ")))   MG.q=f.value;
}

function mgRender(){
  var e=MG.e, s=MG.step, h;
  var solved=MG.solved;

  h='<p class="lede">Use your periodic table, then fill in the blanks.</p>'+
    '<div class="subject'+(solved?" solved":"")+'">'+
      '<div class="big'+(solved?(e.q>0?" p":" n"):"")+'">'+e.s+
        (solved?'<sup>'+chargeText(e.q)+'</sup>':'')+'</div>'+
      '<div class="cap">'+e.n+'</div>'+
      '<div class="ionline"></div>'+
    '</div><div class="qsteps">';

  /* a miss says so in words, not only a red box (28 Sept) */
  var NOTQ='<p class="ferr mgno" role="alert">Not quite.</p>';

  /* step 1 */
  h+=qstep(1,s,
    'What group is '+e.n.toLowerCase()+' in?',
    'It is in group <b>'+e.g+'</b>.',
    '<input class="blank num'+(MG.bad.g?" bad":"")+'" id="mgG" value="'+esc(MG.g||"")+
      '" inputmode="numeric" autocomplete="off" aria-label="Group number">'+
    (MG.bad.g?NOTQ:''));

  /* step 2 */
  h+=qstep(2,s,
    'How many valence electrons does it have?',
    'It has <b>'+e.v+'</b> valence electron'+(e.v===1?'':'s')+'.',
    '<input class="blank num'+(MG.bad.v?" bad":"")+'" id="mgV" value="'+esc(MG.val||"")+
      '" inputmode="numeric" autocomplete="off" aria-label="Valence electrons">'+
    (MG.bad.v?NOTQ:''));

  /* step 3 */
  var sentence=
    '<div class="fill">To have a filled outer energy level, it must '+
      '<span class="verbs'+(MG.bad.verb?" err":"")+'" id="mgVerbs" '+
        'style="display:inline-flex;gap:6px;vertical-align:middle">'+
        '<button data-mgverb="gain" class="'+(MG.verb==="gain"?"on":"")+'">gain</button>'+
        '<button data-mgverb="lose" class="'+(MG.verb==="lose"?"on":"")+'">lose</button>'+
      '</span> '+
      '<input class="blank num'+(MG.bad.n?" bad":"")+'" id="mgN" value="'+esc(MG.n)+
        '" inputmode="numeric" autocomplete="off" aria-label="Number of electrons">'+
      ' electrons to form a '+
      '<input class="blank chg'+(MG.bad.q?" bad":"")+'" id="mgQ" value="'+esc(MG.q)+
        '" placeholder="enter charge" autocomplete="off" spellcheck="false" aria-label="Ion charge">'+
      ' ion.</div>'+
    (MG.hint?'<p class="hint">'+MG.hint+'</p>':
      (MG.bad.verb||MG.bad.n||MG.bad.q)?NOTQ:'');

  h+=qstep(3,s,'Fill in the blanks.',
    'To have a filled outer energy level, it must '+(e.q>0?"lose":"gain")+" "+
      Math.abs(e.q)+" electron"+(Math.abs(e.q)===1?"":"s")+" to form a <b>"+
      chargeText(e.q)+"</b> ion.",
    sentence);

  h+='</div>';

  if(!solved)
    h+=hintBox(MG.tip)+actionBlock('<button data-mg="'+s+'">Check</button>',"mg");
  if(MG.shown) h+=revealBox(ionHTML(e.s,e.q), mgWhy(e));

  if(MG.shown)
    h+='<div class="showrow"><button data-mg="next">New element</button></div>';
  else if(solved)
    h+='<div class="win slim"><div class="f">'+ionHTML(e.s,e.q)+'</div>'+
       '<div class="c">'+e.ion+'</div>'+
       '<button data-mg="next">New element</button></div>';

  h+='<p class="counter"><b>'+MG.done+'</b> done · <b>'+MG.clean+'</b> with no misses</p>';

  document.getElementById("sec-charges").innerHTML=h;
  var f=document.getElementById(s===1?"mgG":s===2?"mgV":"mgN");
  if(f && ACTIVE==="charges" && !solved) f.focus();
}

/* ═══════════════════════════════════════════════════════════════
   SHOW ME THE ANSWER
   Every activity can give up its answer. Doing so counts as a miss, so
   the item still finishes but never counts as clean. Each explanation is
   worked out from the same values the checker uses, so the two can never
   disagree with each other.
   ═══════════════════════════════════════════════════════════════ */
/* The three controls, always in the same shape: what advances the step on
   top at full width, the two ways out beneath it. Every button carries the
   same padding, so only the type size differs. */
function actionBlock(topHTML, tag){
  return '<div class="actions">'+
    '<div class="wide">'+topHTML+'</div>'+
    '<button class="act" data-'+tag+'="hint">Give me a hint</button>'+
    '<button class="act" data-'+tag+'="reveal">Show me the answer</button>'+
  '</div>';
}
function hintBox(text){
  return text ? '<p class="hintbox">'+text+'</p>' : '';
}

/* ── hints ──────────────────────────────────────────────────────
   A hint says what to do next and where to look for it. It never
   states the value being asked for, so a student who takes every hint
   still has to read their own table. ────────────────────────────── */
var GROUPHINT = "The group number sits at the top of each column.";
var CAPHINT   = "A symbol starts with a capital letter; a second letter is lowercase.";
var ZEROHINT  = "A compound is neutral — the positives and negatives have to add up to zero.";

function valenceHint(g){
  return "For the main groups the last digit of the group number is the number of "+
    "valence electrons — group 1 has 1, group 16 has 6. This one is group <b>"+g+"</b>.";
}
function anionChargeHint(name){
  return "Count how far <b>"+name+"</b> is from a full outer level of 8. Group 17 is "+
    "one short, group 16 is two short, group 15 is three short — and each missing "+
    "electron it takes in is one more negative charge.";
}
function metalChargeHint(sym){
  if(mMulti(sym))
    return cap(mName(sym))+" has more than one charge on your periodic table, so the "+
      "Roman numeral in the name is the one to use.";
  return mRuleGroup(sym)
    ? cap(mName(sym))+" is in group <b>"+mRuleGroup(sym)+"</b> — group 1 metals make "+
      "+1 and group 2 make +2."
    : "Check your periodic table for the charge on the <b>"+mName(sym)+"</b> ion.";
}
function polyHint(){
  return "The polyatomic ion is everything in the formula after the metal. Its "+
    "formula and charge are both on your ion sheet.";
}
function boardHint(st){
  var pos=st.nc, neg=st.na;
  if(pos+neg===0) return "Put one of each on the board and see how far off it is.";
  return "The two stacks have to end up the same height. Keep adding to whichever "+
    "side is short, and use the smallest numbers that work.";
}
function formulaHint(parens){
  return "Write the positive ion first, then the negative one. A subscript says how "+
    "many of that ion, and a subscript of 1 is never written."+
    (parens ? " If there is more than one polyatomic ion, wrap it in parentheses and "+
      "put the number outside." : "");
}

/* Ion charges */
function mgHint(){
  var e=MG.e;
  if(MG.step===1) return "Find <b>"+e.s+"</b> on your periodic table. "+GROUPHINT;
  if(MG.step===2) return valenceHint(e.g);
  return "A full outer level holds 8. It has <b>"+e.v+"</b>. Getting rid of "+e.v+
    " or collecting "+(8-e.v)+" — whichever is fewer is what it does. Losing electrons "+
    "makes the charge positive, gaining them makes it negative.";
}

/* Build the compound */
function buildHint(){
  if(S.phase==="charge"){
    var k=S.side, sym=(k==="C"?S.c:S.a), e=EL[sym], m=MAINBY[sym];
    return "<b>"+e.name+"</b> is in group <b>"+m.g+"</b>, so it has <b>"+m.v+
      "</b> valence electrons. A full level is 8 — is it fewer to give those away or "+
      "to collect the rest?";
  }
  if(S.phase==="build")   return boardHint(S);
  if(S.phase==="formula") return formulaHint(false);
  return "Press New pair to move on.";
}

/* Simple ions, formula → name */
function fnHint(){
  var c=FN.c, an=ANION[c.a], k=subscripts(c.q,an.q);
  if(FN.step===1) return "Look up <b>"+c.m+"</b> on your periodic table. Does it list "+
    "one charge or more than one?";
  if(FN.step===7) return "Find <b>"+c.m+"</b> on your periodic table and copy down every "+
    "charge printed with it, each with its sign, separated by commas.";
  if(FN.step===2) return "Read the subscript straight after <b>"+c.a+"</b> in the "+
    "formula. No subscript means one.";
  if(FN.step===3) return anionChargeHint(ANION[c.a].el);
  if(FN.step===4) return "Multiply how many "+an.name+" ions there are by the charge "+
    "on each one.";
  if(FN.step===5) return ZEROHINT+" You need that much positive charge, shared out "+
    "over "+(k.nm===1?"the one":"all "+k.nm)+" "+mName(c.m)+" ion"+(k.nm===1?"":"s")+".";
  return "Metal name first, then the anion name. A Roman numeral goes in only when the "+
    "metal makes more than one ion.";
}

/* Simple ions, name → formula */
function nfHint(){
  var c=NF.c, i=NF.ci;
  if(NF.phase==="sym")
    return i===0
      ? "Find <b>"+mName(c.m)+"</b> on your periodic table and copy its symbol. "+CAPHINT
      : "Find <b>"+ANION[c.a].el+"</b> — the <i>-ide</i> ending is the element's own "+
        "name shortened. "+CAPHINT;
  if(NF.phase==="chg")
    return i===0 ? metalChargeHint(c.m) : anionChargeHint(ANION[c.a].el);
  if(NF.phase==="build")   return boardHint(NF);
  if(NF.phase==="formula") return formulaHint(false);
  return "Press New name to move on.";
}

/* Polyatomic, formula → name */
function pfHint(){
  var x=PF.x, p=POLY[x.p], k=pxCounts(x), st=pfStep();
  if(st.k==="gate")     return "Look up <b>"+x.m+"</b> on your periodic table. Does it "+
    "list one charge or more than one?";
  if(st.k==="charges")  return "Find <b>"+x.m+"</b> on your periodic table and copy down "+
    "every charge printed with it, each with its sign, separated by commas.";
  if(st.k==="ionentry") return polyHint();
  if(st.k==="name" || st.k==="pname")
    return "That one is on your ion sheet — the ions there each have a name of their own.";
  if(st.k==="pcount")   return "Read the subscript just outside the parentheses. No "+
    "parentheses at all means there is only one of them.";
  if(st.k==="total")    return "Multiply how many "+p.name+" ions there are by the <b>"+
    chargeText(p.q)+"</b> charge on each one.";
  if(st.k==="mcount")   return "Read the subscript straight after <b>"+x.m+"</b>. No "+
    "subscript means one.";
  if(st.k==="mchg")     return ZEROHINT+" Share that much positive charge out over "+
    (k.nm===1?"the one":"all "+k.nm)+" "+x.mn+" ion"+(k.nm===1?"":"s")+".";
  return "Metal name, then a Roman numeral if the metal makes more than one ion, then "+
    "the polyatomic ion's own name. It never takes an <i>-ide</i> ending.";
}

/* Polyatomic, name → formula */
function pnHint(){
  var x=PN.x;
  if(PN.phase==="entry")
    return PN.slot===0
      ? "Find <b>"+x.mn+"</b> on your periodic table. "+CAPHINT+" "+metalChargeHint(x.m)
      : polyHint()+" "+CAPHINT;
  if(PN.phase==="build")   return boardHint(PN);
  if(PN.phase==="formula") return formulaHint(true);
  return "Press New name to move on.";
}
function revealBtn(attr){
  return '<button class="act" data-'+attr+'="reveal">Show me the answer</button>';
}
function revealBox(answer, lines){
  return '<div class="reveal"><p class="rlab">The answer</p>'+
    '<div class="rans">'+answer+'</div><ol class="rwhy">'+
    lines.map(function(t){ return '<li>'+t+'</li>'; }).join("")+'</ol></div>';
}
/* group 17 has one electron missing, 16 has two, 15 has three */
function anGroup(q){ return 18+q; }
function eWord(n){ return n+" electron"+(n===1?"":"s"); }

/* what an atom does with its electrons and why — the sentence shared by
   Ion charges and Build the compound */
function whyIon(name, group, val, q){
  var all = val===1 ? "its one outer electron"
          : val===2 ? "both of them" : "all "+val+" of them";
  var out=[cap(name)+" is in group <b>"+group+"</b>, so it has <b>"+
           eWord(val)+"</b> in its outer level."];
  if(q>0)
    out.push("Letting go of "+all+" leaves the full level underneath, which is "+
      "less work than gaining the "+eWord(8-val)+" it would take to fill this one.",
      "Losing "+eWord(val)+" leaves "+val+" more proton"+(val===1?"":"s")+
      " than electrons, so the charge is <b>"+chargeText(q)+"</b>.");
  else
    out.push("It needs "+eWord(8-val)+" more to fill the level, which is less work "+
      "than giving up "+all+".",
      "Gaining "+eWord(-q)+" leaves "+(-q)+" more electron"+(q===-1?"":"s")+
      " than protons, so the charge is <b>"+chargeText(q)+"</b>.");
  return out;
}
/* how the two charges settle on a ratio */
function whyRatio(cs, cq, nc, as, aq, na){
  var cat='<b class="mono">'+cs+chargeSup(cq)+"</b>";
  var ani='<b class="mono">'+as+chargeSup(aq)+"</b>";
  if(nc===1 && na===1)
    return "One "+cat+" and one "+ani+" balance out on their own, so one of each "+
      "is enough.";
  return "It takes <b>"+na+"</b> "+ani+(na===1?" ion":" ions")+" to balance the <b>"+
    nc+"</b> "+cat+(nc===1?" ion":" ions")+".";
}
function chargeSup(q){ return "<sup>"+chargeText(q)+"</sup>"; }
/* a metal with a single charge: say what it makes, not that it "forms one ion" */
function onlyMakes(sym, q){
  var g=mRuleGroup(sym);
  return cap(mName(sym))+(g ? " is in group <b>"+g+"</b>, so it only makes a <b>" :
    " only makes a <b>")+chargeText(q)+"</b> ion.";
}

/* ── Ion charges ── */
function mgWhy(e){
  return whyIon(e.n.toLowerCase(), e.g, e.v, e.q);
}
function mgReveal(){
  if(MG.solved || MG.shown) return;
  MG.shown=true; MG.misses++;
  MG.step=4; MG.solved=true; MG.done++;
  track("charges", false);
  mgRender();
}

function qstep(n,cur,question,doneText,inputs){
  if(n>cur) return "";
  if(n<cur)
    return '<div class="qstep"><div class="no">'+n+'</div><div class="dn">'+doneText+'</div></div>';
  return '<div class="qstep cur"><div class="no">'+n+'</div><div>'+
    '<div class="qt">'+question+'</div><div class="in">'+inputs+'</div></div></div>';
}

/* three misses in a row on one step bring up the hint (28 Sept) */
function mgMissRun(){
  MG.run=(MG.run||0)+1;
  if(MG.run>=3) MG.tip=mgHint();
}
function mgCheck(which){
  mgSync();
  var e=MG.e, wasStep=MG.step;
  MG.bad={}; MG.hint=null;
  MG.tries=MG.tries||{};

  if(which===1){
    MG.tries.group=(MG.tries.group||0)+1;
    var ok1=/^\d+$/.test((MG.g||"").trim()) && +MG.g===e.g;
    if(ok1){ MG.step=2; MG.run=0; } else { MG.bad.g=true; MG.misses++; mgMissRun(); }
    logAttempt("charges","group",e.s,MG.g,ok1,ok1?"":"group",MG.tries.group);
    if(MG.step!==wasStep) MG.tip=null;
    mgRender(); return;
  }
  if(which===2){
    MG.tries.valence=(MG.tries.valence||0)+1;
    var ok2=/^\d+$/.test((MG.val||"").trim()) && +MG.val===e.v;
    if(ok2){ MG.step=3; MG.run=0; } else { MG.bad.v=true; MG.misses++; mgMissRun(); }
    logAttempt("charges","valence",e.s,MG.val,ok2,ok2?"":"valence",MG.tries.valence);
    if(MG.step!==wasStep) MG.tip=null;
    mgRender(); return;
  }

  var wantVerb=e.q>0?"lose":"gain", wantN=Math.abs(e.q);
  var okVerb=MG.verb===wantVerb;
  var okN=/^\d+$/.test((MG.n||"").trim()) && +MG.n===wantN;
  var r=parseCharge(MG.q), okQ=false;

  if(r.err){
    MG.hint = r.noSign
      ? "Does "+e.n.toLowerCase()+" form a positive or a negative ion?"
      : r.err;
    MG.bad.q=true;
  }
  else if(r.q===e.q){ okQ=true; }
  else MG.bad.q=true;

  MG.tries.charge=(MG.tries.charge||0)+1;
  var typed3=(MG.verb||"?")+" "+(MG.n||"?")+" electrons \u2192 "+(MG.q||"?");
  if(okVerb&&okN&&okQ){
    MG.solved=true; MG.step=4; MG.done++; if(!MG.misses) MG.clean++;
    track("charges", MG.misses===0);
    logAttempt("charges","charge",e.s,typed3,true,"",MG.tries.charge);
    mgRender(); return;
  }
  if(!okVerb) MG.bad.verb=true;
  if(!okN) MG.bad.n=true;
  /* a right number missing only its sign is a format slip, not a miss */
  var formatSlip=okVerb&&okN&&r.err&&/^\d+$/.test((MG.q||"").trim())&&+MG.q===Math.abs(e.q);
  if(!formatSlip){ MG.misses++; mgMissRun(); }
  logAttempt("charges","charge",e.s,typed3,false,
    r.err&&!formatSlip?"format":"charge",MG.tries.charge,
    detailStr([{l:"direction",k:okVerb},{l:"count",k:okN},{l:"sign",k:okQ}]));
  mgRender();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-mg],[data-mgverb]");
  if(!t) return;
  if(t.dataset.mgverb){
    mgSync(); MG.verb=t.dataset.mgverb; MG.bad.verb=false; mgRender();
    var f=document.getElementById("mgN"); if(f) f.focus();
    return;
  }
  if(t.dataset.mg==="next") mgNew();
  else if(t.dataset.mg==="reveal") mgReveal();
  else if(t.dataset.mg==="hint"){ MG.tip=mgHint(); mgRender(); }
  else mgCheck(+t.dataset.mg);
});

/* ═══════════════════════════════════════════════════════════════
   POLYATOMIC IONS — which one is this ion?
   Moved here from the old the ionic page page. An ion's name, five
   formula-and-charge options, one Check. The answer is never shown.
   Its results keep the id nf_id, so earlier results stay in the same
   dashboard column, and every pick goes to the answer log.
   ═══════════════════════════════════════════════════════════════ */
/* From the ion sheet, restricted to the families where the endings are the
   whole difficulty. Nothing is invented. */
var PI_ION={
  sulfate:     {f:"SO4",  q:-2, fam:"S"},
  sulfite:     {f:"SO3",  q:-2, fam:"S"},
  sulfide:     {f:"S",    q:-2, fam:"S", one:1},
  nitrate:     {f:"NO3",  q:-1, fam:"N"},
  nitrite:     {f:"NO2",  q:-1, fam:"N"},
  nitride:     {f:"N",    q:-3, fam:"N", one:1},
  phosphate:   {f:"PO4",  q:-3, fam:"P"},
  phosphite:   {f:"PO3",  q:-3, fam:"P"},
  phosphide:   {f:"P",    q:-3, fam:"P", one:1},
  perchlorate: {f:"ClO4", q:-1, fam:"Cl"},
  chlorate:    {f:"ClO3", q:-1, fam:"Cl"},
  chlorite:    {f:"ClO2", q:-1, fam:"Cl"},
  hypochlorite:{f:"ClO",  q:-1, fam:"Cl"},
  chloride:    {f:"Cl",   q:-1, fam:"Cl", one:1},
  carbonate:   {f:"CO3",  q:-2, fam:"C"},
  hydroxide:   {f:"OH",   q:-1, fam:"OH"},
  oxide:       {f:"O",    q:-2, fam:"OH", one:1}
};
var PI_KEYS=Object.keys(PI_ION);
var PI={target:null, opts:[], picked:null, tries:0, hint:null, done:false,
        recent:[], n:0, clean:0};

/* charges written the way the ion sheet writes them: SO₄²⁻, not SO₄⁻² */
function piCharge(q){ var n=Math.abs(q); return "<sup>"+(n>1?n:"")+(q<0?"−":"+")+"</sup>"; }
/* the answer log's own spelling, unchanged, so old and new rows match */
function piLogCharge(q){ return (q<0?"":"+")+q; }
function piEnding(name){ return esc(name).replace(/(ate|ite|ide)$/, '<span class="sfx">$1</span>'); }
function piLookItUp(key){
  return PI_ION[key].one
    ? "Check your periodic table for the charge on the <b>"+piEnding(key)+"</b> ion."
    : "Check your ion sheet for the formula and charge of the <b>"+piEnding(key)+"</b> ion.";
}

function piOptions(target){
  var t=PI_ION[target], right={f:t.f, q:t.q, key:target};
  var fam=PI_KEYS.filter(function(k){ return PI_ION[k].fam===t.fam && k!==target; });
  var far=PI_KEYS.filter(function(k){ return PI_ION[k].fam!==t.fam; });
  shuffle(fam); shuffle(far);
  var wrongCharges=shuffle([-1,-2,-3].filter(function(q){ return q!==t.q; }));

  var pile=[{f:t.f, q:wrongCharges[0], key:target, badq:true}];
  fam.slice(0,3).forEach(function(k){ pile.push({f:PI_ION[k].f, q:PI_ION[k].q, key:k}); });
  if(fam.length){
    var k=fam[0], wq=shuffle([-1,-2,-3].filter(function(q){ return q!==PI_ION[k].q; }));
    pile.push({f:PI_ION[k].f, q:wq[0], key:k, badq:true});
  }
  if(wrongCharges.length>1) pile.push({f:t.f, q:wrongCharges[1], key:target, badq:true});
  far.slice(0,3).forEach(function(k){ pile.push({f:PI_ION[k].f, q:PI_ION[k].q, key:k}); });

  var seen={}, opts=[right];
  seen[right.f+"|"+right.q]=1;
  for(var i=0;i<pile.length && opts.length<5;i++){
    var sig=pile[i].f+"|"+pile[i].q;
    if(seen[sig]) continue;
    seen[sig]=1; opts.push(pile[i]);
  }
  return shuffle(opts);
}

function piNew(){
  var keys=PI_KEYS.filter(function(k){ return PI.recent.indexOf(k)<0; });
  if(!keys.length){ PI.recent=[]; keys=PI_KEYS.slice(); }
  var target=keys[Math.floor(Math.random()*keys.length)];
  PI.recent.push(target); if(PI.recent.length>8) PI.recent.shift();
  PI.target=target; PI.opts=piOptions(target); PI.picked=null;
  PI.tries=0; PI.hint=null; PI.done=false;
  piRender();
}

function piRender(){
  var t=PI_ION[PI.target], h;
  if(PI.done){
    h='<div class="win slim"><div class="f">'+subDigits(t.f)+piCharge(t.q)+'</div>'+
      '<div class="c">'+esc(PI.target)+'</div>'+
      (PI.tries===0 ? '<p class="okmsg">Correct!</p>' : '<div style="height:10px"></div>')+
      '<button data-pi="next">New ion</button></div>';
  } else {
    h='<div class="subject"><div class="bigname">'+esc(PI.target)+'</div>'+
        '<div class="cap">which one is this ion?</div></div>'+
      '<div class="opts">'+PI.opts.map(function(o,i){
        return '<button class="opt'+(PI.picked===i?" on":"")+'" data-piopt="'+i+'">'+
          subDigits(o.f)+piCharge(o.q)+'</button>';
      }).join("")+'</div>'+
      '<p class="correction'+(PI.hint?"":" blank")+'">'+(PI.hint||"&nbsp;")+'</p>'+
      '<button class="check" data-pi="check">Check</button>';
  }
  h+='<p class="counter"><b>'+PI.n+'</b> done · <b>'+PI.clean+'</b> with no misses</p>';
  document.getElementById("sec-ions").innerHTML=h;
}

function piCheck(){
  if(PI.picked==null) return;
  var o=PI.opts[PI.picked], t=PI_ION[PI.target], typed=o.f+piLogCharge(o.q);
  if(o.f===t.f && o.q===t.q){
    logAttempt("nf_id", "pick", PI.target, typed, true, "", PI.tries+1);
    PI.n++; if(PI.tries===0) PI.clean++;
    track("nf_id", PI.tries===0);
    PI.done=true; piRender(); return;
  }
  PI.tries++;
  logAttempt("nf_id", "pick", PI.target, typed, false, o.f===t.f ? "charge" : "ion", PI.tries);
  PI.hint = o.f===t.f
    ? "The formula is right, the charge is not. "+piLookItUp(PI.target)
    : (o.badq
       ? "Neither the formula nor the charge. "+piLookItUp(PI.target)
       : "That is the <b>"+piEnding(o.key)+"</b> ion. "+piLookItUp(PI.target));
  PI.picked=null; shuffle(PI.opts);
  piRender();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-piopt],[data-pi]");
  if(!t) return;
  if(t.dataset.piopt!=null){ PI.picked=+t.dataset.piopt; piRender(); return; }
  if(t.dataset.pi==="next") piNew(); else piCheck();
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter" || ACTIVE!=="ions") return;
  ev.preventDefault();
  PI.done ? piNew() : piCheck();
});

/* ═══════════════════════════════════════════════════════════════
   SECTION 3 — FORMULA → NAME
   ═══════════════════════════════════════════════════════════════ */
/* Steps: 1 gate · 2 anion charge · 3 how many anions · 4 total negative ·
   5 metal charge · 6 the whole name. The gate comes first so the table is
   checked before any arithmetic, and the name is typed in full so the shape
   of the answer never gives away whether a numeral belongs in it. */
var FN={queue:[],c:null,step:1,v:["","","",""],bad:{},hint:null,
        cname:"",ring:false,done:0,clean:0,misses:0,solved:false};

function fnNew(){
  if(!FN.queue.length) FN.queue = SM.lvl==="one"
    ? shuffle(SC_F2N.slice()).slice(0,40) : mixDeck(SINGLE_MANY,SINGLE_ONE,40);
  FN.c=FN.queue.pop();
  FN.step=fnPlan()[0]; FN.v=["","","",""]; FN.cname=""; FN.qlist=""; FN.bad={}; FN.hint=null;
  FN.ring=false; FN.misses=0; FN.solved=false; FN.shown=false; FN.tip=null;
  FN.tries={};
  fnRender();
}
function fnSync(){
  [2,3,4,5].forEach(function(i){
    var f=document.getElementById("fn"+i);
    if(f) FN.v[i-2]=f.value;
  });
  var r=document.getElementById("fnName");
  if(r) FN.cname=r.value;
  var q=document.getElementById("fn7");
  if(q) FN.qlist=q.value;
}

/* The steps this compound actually asks. Everything between the gate and
   the name is there to work out the metal's charge, so a metal with only
   one charge skips straight from the gate to naming the compound. */
function fnPlan(){
  if(SM.lvl==="one") return [6];     /* every metal has one charge: no gate */
  return mMulti(FN.c.m) ? [1,7,2,3,4,5,6] : [1,6];
}
function fnPos(step){ return fnPlan().indexOf(step)+1; }
function fnNext(step){
  var plan=fnPlan(), i=plan.indexOf(step);
  return (i<0 || i===plan.length-1) ? 7 : plan[i+1];
}

function fnRender(){
  var c=FN.c, an=ANION[c.a], k=subscripts(c.q,an.q);
  var solved=FN.solved;
  var plan=fnPlan();
  /* `s` is the position in the plan, so the numbers a student sees run
     1, 2, … with no gaps where a step was skipped */
  var s = solved ? plan.length+1 : fnPos(FN.step);
  var at = function(step){ return plan.indexOf(step)>=0 ? fnPos(step) : 99; };

  var h=(SM.lvl==="one" ? '' :
      '<p class="lede">Some of these metals form more than one ion and some do not. '+
      'Check your periodic table before you name anything.</p>')+
    '<div class="subject'+(solved?" solved":"")+'">'+
      '<div class="big">'+formulaHTML(c)+'</div>'+
      '<div class="cap">compound</div>'+
      '<div class="ionline"></div>'+
    '</div><div class="qsteps">';

  h+=qstep(at(1),s,'Does <b class="mono">'+c.m+'</b> form more than one ion?',
    mGateDone(c.m),
    (FN.step===1&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+=qstep(at(7),s,chargeListAsk(mName(c.m)),
    'Your periodic table lists <b>'+chargeListText(metalCharges(c.m))+'</b>.',
    '<input class="blank wordin'+(FN.bad[7]?" bad":"")+'" id="fn7" value="'+esc(FN.qlist||"")+
      '" placeholder="for example  +1, +2" autocomplete="off" spellcheck="false" '+
      'aria-label="Charges this metal can form">'+
    (FN.step===7&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+=qstep(at(2),s,countAsk(an.name),
    (k.na===1?'There is 1 '+an.name+' ion.':'There are <b>'+k.na+'</b> '+an.name+' ions.'),
    '<input class="blank num'+(FN.bad[2]?" bad":"")+'" id="fn2" value="'+esc(FN.v[0])+
      '" inputmode="numeric" autocomplete="off" aria-label="Number of anions">'+
    '<button class="check slim" data-fn="2">Check</button>');

  h+=qstep(at(3),s,'What is the charge on the <b>'+an.name+'</b> ion?',
    'Each '+an.name+' ion has a charge of <b>'+chargeText(an.q)+'</b>.',
    '<input class="blank chg'+(FN.bad[3]?" bad":"")+'" id="fn3" value="'+esc(FN.v[1])+
      '" placeholder="enter charge" autocomplete="off" spellcheck="false" aria-label="Anion charge">'+
    (FN.step===3&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+=qstep(at(4),s,'What is the <u style="color:var(--note)">total</u> negative charge in the formula?',
    'The total negative charge is <b>'+chargeText(k.na*an.q)+'</b>.',
    '<input class="blank chg'+(FN.bad[4]?" bad":"")+'" id="fn4" value="'+esc(FN.v[2])+
      '" placeholder="enter charge" autocomplete="off" spellcheck="false" aria-label="Total negative charge">'+
    (FN.step===4&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+=qstep(at(5),s,balanceAsk(mName(c.m), k.nm, an.name, k.na, k.na*an.q),
    'The '+mName(c.m)+' ion must be <b>'+chargeText(c.q)+'</b>.',
    '<input class="blank chg'+(FN.bad[5]?" bad":"")+'" id="fn5" value="'+esc(FN.v[3])+
      '" placeholder="enter charge" autocomplete="off" spellcheck="false" aria-label="Metal charge">'+
    (FN.step===5&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+=qstep(at(6),s,'Now write the name of the <b>whole compound</b>.',
    'It is '+nameOf(c)+'.',
    '<input class="blank wordin'+(FN.bad[6]?" bad":"")+'" id="fnName" value="'+esc(FN.cname||"")+
      '" placeholder="name of the compound" autocomplete="off" spellcheck="false" '+
      'aria-label="Name of the compound">'+
    (FN.step===6&&FN.hint?'<p class="hint">'+FN.hint+'</p>':''));

  h+='</div>';
  if(!solved)
    h+=actionBlock(FN.step===1
        ? '<button data-fn="gy">Yes</button><button data-fn="gn">No</button>'
        : '<button data-fn="'+FN.step+'">Check</button>', "fn")+hintBox(FN.tip);
  if(FN.shown) h+=revealBox(nameOf(c), fnWhy(c));
  if(solved && !FN.shown)
    h+='<div class="win slim"><div class="fname">'+nameOf(c)+'</div>'+
       '<p><b class="mono">'+c.m+'<sup>'+chargeText(c.q)+'</sup></b> balanced by '+
         k.na+' × <b class="mono">'+c.a+'<sup>'+chargeText(an.q)+'</sup></b></p>'+
       '<button data-fn="next">New compound</button></div>';
  if(FN.shown)
    h+='<div class="showrow"><button data-fn="next">New compound</button></div>';
  h+='<p class="counter"><b>'+FN.done+'</b> done · <b>'+FN.clean+'</b> with no misses</p>';

  document.getElementById("sec-f2n").innerHTML=h;
  var f=document.getElementById(FN.step===6?"fnName":"fn"+FN.step);
  if(FN.step===7) f=document.getElementById("fn7");
  if(f && onF2N() && !solved) f.focus();
}

function fnGate(said){
  fnSync();
  FN.bad={}; FN.hint=null;
  FN.tries=FN.tries||{};
  FN.tries.gate=(FN.tries.gate||0)+1;
  var ok=said===mMulti(FN.c.m);
  if(ok){ FN.step=fnNext(1); FN.tip=null; }
  else {
    FN.misses++;
    FN.hint = said ? mWhyOne(FN.c.m) : mWhyMany(FN.c.m);
  }
  logAttempt(smId("f2n"),"gate",FN.c.m,said?"yes":"no",ok,ok?"":"gate",FN.tries.gate);
  fnRender();
}

function fnCheck(step){
  fnSync();
  var c=FN.c, an=ANION[c.a], k=subscripts(c.q,an.q), wasStep=FN.step;
  FN.bad={}; FN.hint=null; FN.ring=false;
  FN.tries=FN.tries||{};
  var STEPKEY={2:"count",3:"anioncharge",4:"total",5:"metalcharge",6:"name",7:"charges"};
  var sk=STEPKEY[step]||("step"+step);
  FN.tries[sk]=(FN.tries[sk]||0)+1;

  if(step===7){
    var rl=parseChargeList(FN.qlist), want=metalCharges(c.m);
    var ok7=!rl.err && sameCharges(rl.qs, want);
    if(rl.err){ FN.bad[7]=true; FN.hint=rl.err; FN.misses++; }
    else if(ok7) FN.step=fnNext(7);
    else { FN.bad[7]=true; FN.hint=chargeListFault(rl.qs, want, mName(c.m)); FN.misses++; }
    logAttempt(smId("f2n"),"charges",c.m,FN.qlist,ok7,ok7?"":(rl.err?"format":"charge"),FN.tries[sk]);
    if(FN.step!==wasStep) FN.tip=null;
    fnRender(); return;
  }
  if(step===2){
    var ok2=/^\d+$/.test((FN.v[0]||"").trim()) && +FN.v[0]===k.na;
    if(ok2) FN.step=fnNext(2);
    else { FN.bad[2]=true; FN.misses++; }
    logAttempt(smId("f2n"),"count",an.name,FN.v[0],ok2,ok2?"":"count",FN.tries[sk]);
    if(FN.step!==wasStep) FN.tip=null;
    fnRender(); return;
  }
  if(step===6){
    var res=nameCheck(FN.cname, nameOf(c), c.m);
    if(res.ok){
      FN.solved=true; FN.step=99; FN.done++; if(!FN.misses) FN.clean++;
      track(smId("f2n"), FN.misses===0);
    } else {
      FN.bad[6]=true; FN.hint=res.hint; FN.ring=res.ring; FN.misses++;
    }
    logAttempt(smId("f2n"),"name",formulaOf(c),FN.cname,res.ok,res.ok?"":(res.code||"other"),FN.tries[sk]);
    fnRender(); return;
  }

  var want = step===3 ? an.q : step===4 ? k.na*an.q : c.q;
  var raw  = FN.v[step-2];
  var r    = parseCharge(raw);
  var formatSlip = r.err && /^\d+$/.test((raw||"").trim()) && +raw===Math.abs(want);
  var ok = !r.err && r.q===want;

  if(r.err){
    FN.hint = !r.noSign ? r.err
      : step===3 ? "Is the <b>"+an.name+"</b> ion positive or negative?"
      : step===4 ? "Are those charges positive or negative?"
      : "Does the <b>"+mName(c.m)+"</b> ion come out positive or negative?";
    FN.bad[step]=true;
    /* the right number lacking only its sign is a format slip */
    if(!formatSlip) FN.misses++;
  } else if(ok){
    FN.step=fnNext(step);
  } else {
    if(step===3) FN.hint="Check which group "+an.el+" is in.";
    FN.bad[step]=true; FN.misses++;
  }
  logAttempt(smId("f2n"),sk,step===3?an.name:step===4?"total":mName(c.m),raw,ok,
    ok?"":(r.err?(formatSlip?"format":"format"):"charge"),FN.tries[sk]);
  if(FN.step!==wasStep) FN.tip=null;
  fnRender();
}

/* ── Simple ions, formula \u2192 name ── */
function fnWhy(c){
  var an=ANION[c.a], k=subscripts(c.q,an.q), tot=k.na*an.q, out=[];
  /* a metal with one charge needs none of the working out, so its
     explanation is the short one the activity now asks for */
  if(!mMulti(c.m))
    return [
      onlyMakes(c.m, c.q)+" A metal like that takes no Roman numeral.",
      "<b>"+cap(an.el)+"</b> as a negative ion is <b>"+an.name+"</b> \u2014 negative "+
        "ions take an <i>-ide</i> ending.",
      "So the name is <b>"+nameOf(c)+"</b>."
    ];
  out.push(cap(mName(c.m))+" is listed on your periodic table as <b>"+
    chargeListText(metalCharges(c.m))+"</b>, so the name has to say which one this is.");
  out.push("There "+(k.na===1?"is <b>1</b> "+an.name+" ion":"are <b>"+k.na+"</b> "+
    an.name+" ions")+", and each one is <b>"+chargeText(an.q)+"</b>.");
  out.push("That is <b>"+totText(tot)+"</b> of negative charge to balance.");
  out.push(k.nm===1
    ? "The one "+mName(c.m)+" ion has to be <b>"+chargeText(c.q)+
      "</b> so the whole formula adds up to zero."
    : "The <b>"+k.nm+"</b> "+mName(c.m)+" ions share that out, so each is <b>"+
      chargeText(c.q)+"</b>.");
  out.push("So the name is <b>"+nameOf(c)+"</b> \u2014 the numeral is the metal\u2019s "+
    "charge, not how many there are.");
  return out;
}
function fnReveal(){
  if(FN.solved) return;
  FN.shown=true; FN.misses++;
  FN.step=99; FN.solved=true; FN.done++;
  track(smId("f2n"), false);
  fnRender();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-fn]");
  if(!t) return;
  var d=t.dataset.fn;
  if(d==="next") fnNew();
  else if(d==="hint"){ FN.tip=fnHint(); fnRender(); }
  else if(d==="reveal") fnReveal();
  else if(d==="gy") fnGate(true);
  else if(d==="gn") fnGate(false);
  else fnCheck(+d);
});

/* ═══════════════════════════════════════════════════════════════
   SECTION 4 — NAME → FORMULA
   The name is laid out as two ions. Under each one the student
   writes the symbol, then the charge, then how many are needed —
   shown as  charge × count = total  so the balance is visible.
   ═══════════════════════════════════════════════════════════════ */
var NF={queue:[],c:null,phase:"sym",ci:0,sym:["",""],chg:["",""],
        nc:0,na:0,prevGap:26,shakeBoard:false,
        ftext:"",bad:{},hint:null,ferr:null,done:0,clean:0,misses:0};

function totText(t){ return t===0 ? "0" : chargeText(t); }
function nfParts(){
  var c=NF.c;
  return [{lab:mName(c.m), sym:c.m, q:c.q},
          {lab:ANION[c.a].name, sym:c.a, q:ANION[c.a].q}];
}
function nfCounts(){ return [NF.nc, NF.na]; }

function nfNew(){
  if(!NF.queue.length) NF.queue = SM.lvl==="one"
    ? shuffle(SC_N2F.slice()).slice(0,40) : mixDeck(MULTI_MANY,MULTI_ONE,40);
  NF.c=NF.queue.pop();
  NF.phase="sym"; NF.ci=0; NF.sym=["",""]; NF.chg=["",""];
  NF.nc=0; NF.na=0; NF.prevGap=26; NF.shakeBoard=false;
  NF.ftext=""; NF.bad={}; NF.hint=null; NF.ferr=null; NF.markNum=false; NF.misses=0;
  NF.shown=false; NF.tip=null; NF.tries={};
  nfRender();
}
function nfSync(){
  var f,i;
  for(i=0;i<2;i++){
    if((f=document.getElementById("nfS"+i))) NF.sym[i]=f.textContent;
    if((f=document.getElementById("nfC"+i))) NF.chg[i]=f.value;
  }
  if((f=document.getElementById("nfin"))) NF.ftext=f.textContent;
}

function nfAsk(i,phase){
  var c=NF.c, pt=nfParts()[i];
  if(phase==="sym") return "Type the symbol for "+pt.lab+".";
  if(phase==="chg")
    return i===0
      ? "What is the charge on the <b>"+mName(c.m)+
        (mMulti(c.m)?"("+ROMAN[c.q]+")":"")+"</b> ion?"
      : "What is the charge on the <b>"+ANION[c.a].name+"</b> ion?";
  return "How many "+pt.sym+" ions?";
}

function nfChargeKnown(i){
  var ph=NF.phase;
  if(ph==="sym") return false;
  if(ph==="chg") return i<NF.ci;
  return true;
}

function nfCol(i){
  var pt=nfParts()[i], ph=NF.phase;
  /* one ion at a time in both phases: NF.ci is the column being worked on,
     so a wrong answer is only ever about that ion */
  var symSet = ph!=="sym" || i<NF.ci;
  var chgSet = nfChargeKnown(i);
  var waiting = i>NF.ci;
  var h='<div class="ioncol'+(symSet?(pt.q>0?" p":" n"):"")+
        (i===NF.ci?" live":"")+(waiting?" dim":"")+'">'+
        '<p class="cap">'+pt.lab+'</p>';

  if(ph==="sym") h+='<p class="ask">'+(i===NF.ci?nfAsk(i,"sym"):"&nbsp;")+'</p>';
  h+= symSet
    ? '<div class="val">'+pt.sym+
        (chgSet?'<sup class="qsup '+(pt.q>0?"pp":"nn")+'">'+chargeText(pt.q)+'</sup>':'')+
      '</div>'
    : (waiting
       ? '<div class="val"><span style="opacity:.25">?</span></div>'
       : '<div class="blank symin'+(NF.bad["s"+i]?" bad":"")+'" id="nfS'+i+
         '" contenteditable="true" spellcheck="false" role="textbox" '+
         'aria-label="Symbol of the '+pt.lab+' ion">'+subDigitsMarked(NF.sym[i],false)+'</div>');

  /* only the ion being worked on shows a charge box; the other is greyed out */
  if(ph==="chg" && i===NF.ci){
    h+='<p class="ask">'+nfAsk(i,"chg")+'</p>'+
       '<input class="blank chg'+(NF.bad["c"+i]?" bad":"")+'" id="nfC'+i+
       '" value="'+esc(NF.chg[i])+'" autocomplete="off" spellcheck="false" '+
       'aria-label="Charge on the '+pt.lab+' ion">';
  }

  return h+'</div>';
}

/* what sits beside the board: the steppers while it is being built, then
   the formula box, then the finished compound — the whole of the second
   half of the activity happens on the one page */
function nfSide(){
  if(NF.phase==="formula")
    return '<div class="fbox"><p class="lbl">It fits. Now write the formula.</p>'+
      '<div class="finput'+(NF.markNum?" marknum":"")+'" id="nfin" '+
        'contenteditable="true" spellcheck="false" '+
        'role="textbox" aria-label="Chemical formula">'+
        subDigitsMarked(NF.ftext,false)+'</div>'+
      (NF.ferr?'<p class="ferr">'+NF.ferr+'</p>':'')+'</div>'+
      actionBlock('<button data-nf="formula">Check formula</button>',"nf")+hintBox(NF.tip);

  if(NF.phase==="done")
    return NF.shown
      ? revealBox(formulaHTML(NF.c), nfWhy(NF.c))+
        '<div class="showrow"><button data-nf="next">New name</button></div>'
      : '<div class="win"><div class="f">'+formulaHTML(NF.c)+'</div>'+
        '<div class="c">'+nameOf(NF.c)+'</div>'+
        '<div style="height:10px"></div>'+
        '<button data-nf="next">New name</button></div>';

  return boardSteppers(NF,nfParts(),"nf");
}

/* \u2500\u2500 Simple ions, name \u2192 formula \u2500\u2500 */
function nfWhy(c){
  var an=ANION[c.a], k=subscripts(c.q,an.q), out=[];
  out.push(mMulti(c.m)
    ? 'The <b>(' +ROMAN[c.q]+ ')</b> in the name is the charge, so the metal ion is '+
      '<b class="mono">'+c.m+chargeSup(c.q)+"</b>."
    : onlyMakes(c.m, c.q));
  out.push(cap(an.name)+' is <b class="mono">'+c.a+chargeSup(an.q)+"</b>.");
  out.push(whyRatio(c.m,c.q,k.nm,c.a,an.q,k.na));
  out.push('So the formula is <b class="mono">'+subDigits(formulaOf(c))+
    "</b>"+(k.nm>1||k.na>1
      ? " \u2014 the subscript says how many of that ion, and a subscript of 1 is never written."
      : ".")); 
  return out;
}
function nfReveal(){
  if(NF.phase==="done") return;
  var c=NF.c, k=subscripts(c.q,ANION[c.a].q);
  NF.shown=true; NF.misses++;
  NF.nc=k.nm; NF.na=k.na; NF.phase="done"; NF.done++;
  track(smId("n2f"), false);
  nfRender();
}

function nfRender(){
  var c=NF.c, an=ANION[c.a], k=subscripts(c.q,an.q), ph=NF.phase;

  var h=(SM.lvl==="one" ? '' :
      '<p class="lede">A Roman numeral in the name is the metal\'s charge. '+
      'No numeral means the metal forms only one ion — look it up on your periodic table.</p>')+
    '<div class="subject'+(ph==="done"?" solved":"")+'">'+
      '<div class="bigname">'+nameOf(c)+'</div>'+
    '</div>';

  /* the board replaces typing the counts: the pieces only interlock when
     the charges cancel, so the ratio is something they see rather than
     something they are told — and the formula is written right there
     beside it rather than on a page of its own */
  if(ph==="build"||ph==="formula"||ph==="done"){
    h+='<p class="nflead">How many of each ion is needed to balance out?</p>'+
       '<div class="ionrecap">'+nfParts().map(function(o){
         return '<div><p class="cap">'+o.lab+'</p>'+
           '<div class="rval '+(o.q>0?"p":"n")+'">'+o.sym+
           '<sup>'+chargeText(o.q)+'</sup></div></div>';
       }).join("")+'</div>'+
       '<div class="buildrow">'+boardSVG(NF,nfParts(),"nf")+
       '<div class="buildside">'+nfSide()+'</div></div>'+
       '<p class="counter"><b>'+NF.done+'</b> done · <b>'+NF.clean+'</b> with no misses</p>';
    document.getElementById("sec-n2f").innerHTML=h;
    boardSlide(NF,nfParts(),"nf");
    if(onN2F() && ph==="formula"){
      var fi=document.getElementById("nfin");
      if(fi){ fi.focus(); caretToEnd(fi); }
    }
    return;
  }

  var lead = ph==="sym" ? "Write the symbol for the "+nfParts()[NF.ci].lab+" ion."
           : "Type the charge on the "+nfParts()[NF.ci].lab+" ion, then press Enter.";
  h+='<p class="nflead">'+lead+'</p>'+
     '<div class="ionpair">'+nfCol(0)+nfCol(1)+'</div>';

  h+=actionBlock('<button data-nf="'+ph+'">Check</button>',"nf");

  if(NF.hint) h+='<p class="nfhint">'+NF.hint+'</p>';
  h+=hintBox(NF.tip);

  h+='<p class="counter"><b>'+NF.done+'</b> done · <b>'+NF.clean+'</b> with no misses</p>';

  document.getElementById("sec-n2f").innerHTML=h;

  if(!onN2F()) return;
  var f = document.getElementById((ph==="sym"?"nfS":"nfC")+NF.ci);
  if(f) f.focus();
}

function nfCheckBuild(){
  boardCheck(NF,nfParts(),nfRender,function(){
    NF.phase="formula"; NF.ftext=""; NF.ferr=null; NF.tip=null; nfRender();
  },smId("n2f"));
}

function nfCheck(phase){
  nfSync();
  var c=NF.c, an=ANION[c.a], k=subscripts(c.q,an.q), pt=nfParts();
  var was=NF.phase+"/"+NF.ci;
  NF.bad={}; NF.hint=null; NF.ferr=null;
  NF.tries=NF.tries||{};
  var moved=function(){ if(was!==NF.phase+"/"+NF.ci) NF.tip=null; };

  if(phase==="sym"){
    var i=NF.ci, ok=(NF.sym[i]||"").trim()===pt[i].sym;
    NF.tries.sym=(NF.tries.sym||0)+1;
    if(!ok){ NF.bad["s"+i]=true; NF.misses++; }
    else if(++NF.ci>1){ NF.ci=0; NF.phase="chg"; }
    logAttempt(smId("n2f"),"sym",pt[i].lab,NF.sym[i],ok,ok?"":"symbol",NF.tries.sym);
    moved(); nfRender(); return;
  }

  if(phase==="chg"){
    var i=NF.ci, want=pt[i].q, r=parseCharge(NF.chg[i]);
    NF.tries.chg=(NF.tries.chg||0)+1;
    var okChg=false, formatSlip=false;
    if(r.err){
      NF.bad["c"+i]=true;
      NF.hint = r.noSign
        ? (i===0 ? "Does the <b>"+mName(c.m)+"</b> ion come out positive or negative?"
                 : "Is the <b>"+an.name+"</b> ion positive or negative?")
        : r.err;
      /* the right number missing only its sign is a format slip, not a miss */
      formatSlip = +((NF.chg[i]||"").trim())===Math.abs(want) && r.noSign;
      if(!formatSlip) NF.misses++;
    } else if(r.q===want){
      okChg=true;
      if(i===0){ NF.ci=1; }
      else { NF.phase="build"; NF.nc=0; NF.na=0; NF.prevGap=26; }
    } else {
      NF.bad["c"+i]=true; NF.misses++;
      if(i===1) NF.hint="Check which group <b>"+an.el+"</b> is in.";
      else NF.hint = mMulti(c.m)
        ? "The Roman numeral in the name is the charge."
        : (mRuleGroup(c.m)
            ? "Check which group <b>"+mName(c.m)+"</b> is in."
            : "Check your periodic table for the charge on the <b>"+mName(c.m)+"</b> ion.");
    }
    logAttempt(smId("n2f"),"chg",pt[i].lab,NF.chg[i],okChg,
      okChg?"":(r.err?"format":"charge"),NF.tries.chg);
    moved(); nfRender(); return;
  }

  if(phase==="build"){ nfCheckBuild(); return; }

  /* the formula itself */
  var got=(NF.ftext||"").replace(/\s+/g,"");
  var want=formulaOf(c);
  var flipped=c.a+(k.na>1?k.na:"")+c.m+(k.nm>1?k.nm:"");
  NF.tries.formula=(NF.tries.formula||0)+1;
  var fault="count";

  /* the ring goes on only when the ion counts are what went wrong */
  NF.markNum=true;
  if(!got){ NF.ferr="Type the formula."; NF.markNum=false; fault="other"; }
  else if(got===want){
    NF.markNum=false;
    NF.phase="done"; NF.done++; if(!NF.misses) NF.clean++;
    track(smId("n2f"), NF.misses===0);
    logAttempt(smId("n2f"),"formula",formulaOf(c),got,true,"",NF.tries.formula);
    nfRender(); return;
  }
  else if(got.toLowerCase()===want.toLowerCase()){
    NF.ferr="Check the capitals. A symbol starts with a capital letter, and a second letter is always lowercase.";
    NF.markNum=false; fault="caps";
  }
  else if(got.replace(/1(?!\d)/g,"")===want){
    NF.ferr="Drop the 1. When there is only one ion, no number is written.";
    fault="one";
  }
  else if(got===flipped){
    NF.ferr="The metal is always written first."; NF.markNum=false; fault="order";
  }
  else if(got===c.m+ROMAN[c.q]+c.a){
    NF.ferr="The Roman numeral is the charge, not a subscript. It never appears in the formula.";
    NF.markNum=false; fault="roman";
  }
  else
    NF.ferr="Not quite. Count the pieces on each side and write that number after the ion.";
  NF.misses++;
  logAttempt(smId("n2f"),"formula",formulaOf(c),got,false,fault,NF.tries.formula);
  nfRender();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-nf]");
  if(!t) return;
  if(t.dataset.nf==="next") nfNew();
  else if(t.dataset.nf==="hint"){ NF.tip=nfHint(); nfRender(); }
  else if(t.dataset.nf==="reveal") nfReveal();
  else if(t.dataset.nf==="build") nfCheckBuild();
  else nfCheck(t.dataset.nf);
});

document.addEventListener("input",function(ev){
  var t=ev.target;
  if(t.id==="nfin"){
    var off=textOffset(t), txt=t.textContent;
    NF.ftext=txt;
    t.innerHTML=subDigitsMarked(txt,false);
    setOffset(t,off);
    return;
  }
  /* the ion-symbol box, e.g. "SO4" while typing it (24 Sept) */
  var m=/^nfS(\d)$/.exec(t.id);
  if(!m) return;
  var off2=textOffset(t), txt2=t.textContent;
  NF.sym[+m[1]]=txt2;
  t.innerHTML=subDigitsMarked(txt2,false);
  setOffset(t,off2);
});
document.addEventListener("paste",function(ev){
  if(ev.target.id!=="nfin") return;
  ev.preventDefault();
  var txt=(ev.clipboardData||window.clipboardData).getData("text").replace(/\s+/g,"");
  document.execCommand("insertText",false,txt);
});

/* Enter advances whichever naming section is open */
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter") return;
  if(ACTIVE==="charges"){ ev.preventDefault(); MG.solved?mgNew():mgCheck(MG.step); }
  else if(onF2N()){
    ev.preventDefault();
    if(FN.solved) fnNew(); else if(FN.step>1) fnCheck(FN.step);
  }
  else if(onN2F()){
    ev.preventDefault();
    NF.phase==="done" ? nfNew() : nfCheck(NF.phase);
  }
});

/* ═══════════════════════════════════════════════════════════════
   SECTION 2 — BUILD THE COMPOUND  (the puzzle, unchanged in
   behaviour; it now renders into its own section and its tutorial
   only runs while that section is open)
   ═══════════════════════════════════════════════════════════════ */
var EL = {
  Li:{name:"lithium",   q:1},
  Na:{name:"sodium",    q:1},
  K :{name:"potassium", q:1},
  Mg:{name:"magnesium", q:2},
  Ca:{name:"calcium",   q:2},
  Ba:{name:"barium",    q:2},
  Al:{name:"aluminum",  q:3},
  F :{name:"fluorine",  q:-1, ion:"fluoride"},
  Cl:{name:"chlorine",  q:-1, ion:"chloride"},
  Br:{name:"bromine",   q:-1, ion:"bromide"},
  I :{name:"iodine",    q:-1, ion:"iodide"},
  O :{name:"oxygen",    q:-2, ion:"oxide"},
  S :{name:"sulfur",    q:-2, ion:"sulfide"},
  N :{name:"nitrogen",  q:-3, ion:"nitride"}
};
var CATIONS = ["Li","Na","K","Mg","Ca","Ba","Al"];
var ANIONS  = ["F","Cl","Br","I","O","S","N"];


/* puzzle piece geometry */
var U=54, PW=140, R=18, SEAM=185, VW=370;
function tabPath(n){
  var h=n*U, d="M 0 0 L "+PW+" 0", i, cy;
  for(i=0;i<n;i++){cy=i*U+U/2;
    d+=" L "+PW+" "+(cy-R)+" A "+R+" "+R+" 0 0 1 "+PW+" "+(cy+R);}
  return d+" L "+PW+" "+h+" L 0 "+h+" Z";
}
function slotPath(n){
  var h=n*U, d="M 0 0 L "+PW+" 0 L "+PW+" "+h+" L 0 "+h, i, cy;
  for(i=n-1;i>=0;i--){cy=i*U+U/2;
    d+=" L 0 "+(cy+R)+" A "+R+" "+R+" 0 0 0 0 "+(cy-R);}
  return d+" Z";
}
function piece(sym,q,x,y,removable){
  var n=Math.abs(q), up=q>0, h=n*U;
  var fill=up?"var(--posFill)":"var(--negFill)", edge=up?"var(--posEdge)":"var(--negEdge)";
  var ink=up?"var(--posInk)":"var(--negInk)", tx=PW/2+R/4;
  return '<g class="piece" transform="translate('+x+','+y+')"'+
    (removable?' data-remove="'+removable+'"':'')+'>'+
    '<path d="'+(up?tabPath(n):slotPath(n))+'" fill="'+fill+'" stroke="'+edge+
      '" stroke-width="3" stroke-linejoin="round"/>'+
    '<text x="'+tx+'" y="'+(h/2+4)+'" text-anchor="middle" dominant-baseline="central" '+
      'fill="'+ink+'" style="font:700 38px var(--mono)">'+sym+
      '<tspan dy="-14" style="font-size:22px">'+chargeText(q)+'</tspan></text></g>';
}

var TIERS=[
  [[1,-1],[2,-1],[1,-2]],
  [[3,-2],[2,-3]],
  [[3,-1],[2,-2],[1,-3],[3,-3]]
];
function buildSchedule(){
  var out=[];
  TIERS.forEach(function(tier){
    shuffle(tier.slice()).forEach(function(p){ out.push(p); });
  });
  return out;
}
var SCHEDULE=buildSchedule();
var round=0, used={};

function pickPair(){
  var pat = round<SCHEDULE.length ? SCHEDULE[round] : null;
  var all=[], fit=[];
  CATIONS.forEach(function(c){
    ANIONS.forEach(function(a){
      if(used[c+a]) return;
      all.push([c,a]);
      if(pat && EL[c].q===pat[0] && EL[a].q===pat[1]) fit.push([c,a]);
    });
  });
  var pool = fit.length ? fit : all;
  if(!pool.length){ used={}; round=0; SCHEDULE=buildSchedule(); return pickPair(); }
  var p = pool[Math.floor(Math.random()*pool.length)];
  used[p[0]+p[1]]=true;
  round++;
  return p;
}

var tut=true, tutUsed=false, tutIntro=true;

var TUT={
  intro:{sel:null, next:true, text:
    "<p>Each ion here is a puzzle piece. A <b>tab</b> is an electron given away, a "+
    "<b>slot</b> is one taken in, and the compound is right when every tab meets a slot.</p>"},

  first:{sel:"#cardC", text:
    "<p>Magnesium is a metal, and metal atoms lose electrons to nonmetals.</p>"+
    "<p>Fill in the whole sentence: it <b>loses</b> <b>2</b> electrons and forms a <b>2+</b> ion.</p>"},

  second:{sel:"#cardA", text:
    "<p>Now chlorine. It is a nonmetal, so it gains rather than loses — and it needs "+
    "just one electron to fill its outer shell.</p>"},

  check:{sel:"#check", text:"<p>Both done. Check your answers.</p>"},

  add:{sel:"#rightcol", text:
    "<p>Your pieces are ready. Put one magnesium and one chlorine on the board.</p>"},

  fit:{sel:"#rightcol", text:
    "<p>Magnesium has two tabs, but chlorine only brings one slot, so a tab is left with "+
    "nothing to hold. Add a second chlorine.</p>"},

  fits:{sel:"#bcheck", text:"<p>Every tab is filled. Check it.</p>"},

  formula:{sel:"#fbox", text:
    "<p>Count the pieces — one Mg and two Cl.</p>"+
    "<p>Type <b>MgCl2</b>. The number turns into a subscript by itself.</p>"},

  finish:{sel:"#winbox", text:
    "<p>That is the whole loop, and every round works the same way.</p>"}
};

function sideDone(k){ return S[k].ok || judge(k)===null; }

function tutStep(){
  if(!tut || ACTIVE!=="build") return null;
  if(tutIntro) return "intro";
  if(S.phase==="charge"){
    if(!sideDone(S.order[0])) return "first";
    if(!sideDone(S.order[1])) return "second";
    return "check";
  }
  if(S.phase==="build")   return (S.nc+S.na===0) ? "add" : (buildFits() ? "fits" : "fit");
  if(S.phase==="formula") return "formula";
  if(S.phase==="done")    return "finish";
  return null;
}

function drawTut(){
  var layer=document.getElementById("tutLayer");
  var step=tutStep();
  if(!step){ layer.hidden=true; return; }
  var t=TUT[step];
  var box=document.getElementById("tutBox");
  var hole=document.getElementById("tutHole");

  layer.hidden=false;
  box.innerHTML=t.text+'<div id="tutBtns">'+
    (t.next?'<button id="tutNext">Next</button>':'')+
    '<button id="tutSkip">Skip tutorial</button></div>';

  if(!t.sel){
    hole.style.cssText="left:50%;top:50%;width:0;height:0;border-color:transparent";
    box.className="center";
    box.style.width=Math.min(400,window.innerWidth-32)+"px";
    box.style.left=""; box.style.top="";
    return;
  }

  var el=document.querySelector(t.sel);
  if(!el){ layer.hidden=true; return; }
  box.className="";
  var bw=Math.min(290,window.innerWidth-24);
  box.style.width=bw+"px";
  var bh=box.offsetHeight;

  var r=el.getBoundingClientRect(), pad=7, gap=10;
  hole.style.cssText="";
  hole.style.left=(r.left-pad)+"px";
  hole.style.top=(r.top-pad)+"px";
  hole.style.width=(r.width+pad*2)+"px";
  hole.style.height=(r.height+pad*2)+"px";

  var W=window.innerWidth, H=window.innerHeight, m=10, i, c, pick=null;
  var cands=[
    {l:r.left+r.width/2-bw/2, t:r.bottom+pad+gap},
    {l:r.left+r.width/2-bw/2, t:r.top-pad-gap-bh},
    {l:r.right+pad+gap,       t:r.top},
    {l:r.left-pad-gap-bw,     t:r.top}
  ];
  for(i=0;i<cands.length;i++){
    c=cands[i];
    if(c.t>=m && c.t+bh<=H-m && c.l>=m && c.l+bw<=W-m){ pick=c; break; }
  }
  if(!pick) pick=cands[0];
  box.style.left=Math.max(m,Math.min(pick.l,W-bw-m))+"px";
  box.style.top =Math.max(m,Math.min(pick.t,H-bh-m))+"px";
}

function endTut(){
  tut=false;
  document.getElementById("tutLayer").hidden=true;
  document.getElementById("tutReplay").hidden=true;
}

window.addEventListener("resize",function(){ if(ACTIVE==="build") drawTut(); });
window.addEventListener("scroll",function(){ if(ACTIVE==="build") drawTut(); },true);

var S={}, prevGap=26;
function blankSide(){return {verb:null,n:"",q:"",err:null,ok:false};}

function newRound(){
  var p;
  var walking = tut && !tutUsed;
  if(walking){ p=["Mg","Cl"]; used.MgCl=true; tutUsed=true; }
  else p=pickPair();
  /* which card the metal sits on is a coin toss, so telling a metal from a
     nonmetal is part of the work rather than something position gives away.
     The questions follow the order on screen, left card first. */
  /* the walkthrough talks about magnesium first, so it always runs unflipped */
  var order = (walking || Math.random()<0.5) ? ["C","A"] : ["A","C"];
  S={c:p[0],a:p[1],C:blankSide(),A:blankSide(),shake:null,
     order:order, side:order[0], tip:null,
     phase:"charge",nc:0,na:0,ftext:"",ferr:null,markNum:false,misses:0,shown:false,tries:{}};
  prevGap=26;
  render();
}

function sync(){
  ["C","A"].forEach(function(k){
    var n=document.getElementById("n"+k), q=document.getElementById("q"+k);
    if(n) S[k].n=n.value;
    if(q) S[k].q=q.value;
  });
  var f=document.getElementById("fin");
  if(f) S.ftext=f.textContent;
}

function render(){
  var cat=EL[S.c], ani=EL[S.a];
  var pos=S.nc*cat.q, neg=S.na*-ani.q, net=pos-neg;
  var balanced=S.nc>0&&S.na>0&&net===0;
  var reduced=balanced&&gcd(S.nc,S.na)===1;
  var built=S.phase==="formula"||S.phase==="done";

  var h;
  if(S.phase==="charge"){
    h='<p class="lede">Work out what each atom does with its electrons.</p>'+
      '<div class="pair">'+S.order.map(function(k){
         return elBlock(k, k==="C"?S.c:S.a, false); }).join("")+'</div>'+
      actionBlock('<button id="check">Check</button>',"bd")+hintBox(S.tip);
  } else {
    h='';

    var units=Math.max(4,pos,neg), vh=units*U+50, i;
    var grid="";
    for(i=0;i<=units;i++)
      grid+='<line x1="16" x2="'+(VW-16)+'" y1="'+(25+i*U)+'" y2="'+(25+i*U)+
        '" stroke="var(--line)" stroke-width="1" stroke-dasharray="3 5" opacity=".5"/>';
    var cs="",as="";
    for(i=0;i<S.nc;i++) cs+=piece(S.c,cat.q,SEAM-PW,25+i*cat.q*U,built?null:"c");
    for(i=0;i<S.na;i++) as+=piece(S.a,ani.q,SEAM,25+i*-ani.q*U,built?null:"a");

    var col='<div class="board'+(built?' solved':'')+(S.shakeBoard?' shake':'')+'" id="board">'+
       '<svg width="'+VW+'" height="'+vh+'" viewBox="0 0 '+VW+' '+vh+'">'+grid+
       '<line x1="'+SEAM+'" x2="'+SEAM+'" y1="16" y2="'+(vh-16)+
         '" stroke="var(--line)" stroke-width="1"/>'+
       '<g>'+cs+'</g><g id="anionStack">'+as+'</g></svg></div>';

    if(!built){
      col+='<div class="steppers" id="steppers">'+stepper("c",S.c,S.nc)+stepper("a",S.a,S.na)+'</div>';
      var cls="", txt;
      if(S.nc+S.na===0) txt="Add ions until the two sides fit together.";
      else if(net>0)
        txt=plural(net,"tab")+" on the left "+(net===1?"has":"have")+
            ' nothing to connect to. Add another <b class="mono">'+S.a+'</b>.';
      else if(net<0)
        txt=plural(-net,"slot")+" on the right "+(-net===1?"is":"are")+
            ' still empty. Add another <b class="mono">'+S.c+'</b>.';
      else if(!reduced){
        var k=gcd(S.nc,S.na); cls=" note";
        txt="The charges balance, but that is the same pair built "+k+
            " times over. A formula uses the smallest set that works — take "+
            (k-1)+" of each back off.";
      } else { cls=" good"; txt="Every tab is filled."; }
      col+='<p class="status'+cls+'">'+txt+'</p>'+
        actionBlock('<button id="bcheck">Check</button>',"bd")+hintBox(S.tip);
    }

    if(S.phase==="formula"){
      col+='<div class="fbox" id="fbox"><p class="lbl">It fits. Now write the formula.</p>'+
        '<div class="finput'+(S.markNum?" marknum":"")+'" id="fin" '+
        'contenteditable="true" spellcheck="false" '+
        'role="textbox" aria-label="Chemical formula">'+
        subDigitsMarked(S.ftext,false)+'</div>'+
        (S.ferr?'<p class="ferr">'+S.ferr+'</p>':'')+'</div>'+
        actionBlock('<button id="fcheck">Check formula</button>',"bd")+hintBox(S.tip);
    }

    if(S.phase==="done"){
      if(S.shown)
        col+=revealBox(subDigits(S.c+(S.nc>1?S.nc:"")+S.a+(S.na>1?S.na:"")), buildWhy())+
          '<div class="showrow"><button id="next">New pair</button></div>';
      else
        col+='<div class="win" id="winbox">'+
          '<div class="f">'+S.c+subTag(S.nc)+S.a+subTag(S.na)+'</div>'+
          '<div class="c">'+cat.name+" "+ani.ion+'</div>'+
          '<div style="height:14px"></div>'+
          '<button id="next">New pair</button></div>';
    }

    h+='<div class="layout"><div class="ions">'+
        S.order.map(function(k){ return elBlock(k, k==="C"?S.c:S.a, true); }).join("")+
       '</div><div class="rightcol" id="rightcol">'+col+'</div></div>';
  }

  document.getElementById("sec-build").innerHTML=h;

  var stack=document.getElementById("anionStack");
  if(stack){
    var gap=balanced?0:26;
    stack.style.transform="translate("+prevGap+"px,0)";
    requestAnimationFrame(function(){requestAnimationFrame(function(){
      stack.style.transform="translate("+gap+"px,0)";
    });});
    prevGap=gap;
  }
  var fin=document.getElementById("fin");
  if(fin && S.phase==="formula" && ACTIVE==="build"){ fin.focus(); caretToEnd(fin); }
  if(ACTIVE==="build") drawTut();
}

function elBlock(side,sym,compact){
  var e=EL[sym], st=S[side];
  /* not their turn yet: the atom is named, but nothing to fill in */
  var waiting = !compact && S.phase==="charge" && !st.ok && S.side!==side;
  var cls="el"+(compact?" small":"")+(st.ok?(e.q>0?" ok-pos":" ok-neg"):"")+
          (st.err?" err":"")+(S.shake===side?" shake":"")+(waiting?" dim":"");

  if(waiting)
    return '<div class="'+cls+'" id="card'+side+'"><div class="sym">'+sym+'</div>'+
      '<div class="nm">'+e.name+'</div>'+
      '<div class="said" style="opacity:.45">waits its turn</div></div>';

  if(st.ok){
    var verb=e.q>0?"loses":"gains", n=Math.abs(e.q);
    return '<div class="'+cls+'" id="card'+side+'"><div class="sym">'+sym+'</div><div>'+
      '<div class="nm">'+e.name+'</div>'+
      '<div class="said '+(e.q>0?"p":"n")+'">'+verb+" "+n+" electron"+(n===1?"":"s")+
      ' → <span class="hl">'+ionHTML(sym,e.q)+'</span></div></div></div>';
  }

  var body='<div class="verbs" id="verbs'+side+'">'+
      '<button data-verb="'+side+'|lose" class="'+(st.verb==="lose"?"on":"")+'">loses</button>'+
      '<button data-verb="'+side+'|gain" class="'+(st.verb==="gain"?"on":"")+'">gains</button>'+
    '</div>'+
    '<div class="ln"><input class="blank num" id="n'+side+'" value="'+esc(st.n)+
      '" autocomplete="off" inputmode="numeric" aria-label="Number of electrons">'+
      '<span>electrons</span></div>'+
    '<div class="ln"><span>to form a</span><input class="blank chg" id="q'+side+
      '" value="'+esc(st.q)+'" placeholder="enter charge" autocomplete="off" '+
      'spellcheck="false" aria-label="Charge of the ion"><span>ion</span></div>'+
    (st.err?'<p class="why err">'+st.err+'</p>':'');

  return '<div class="'+cls+'" id="card'+side+'"><div class="sym">'+sym+'</div>'+
    '<div class="nm">'+e.name+'</div>'+body+'</div>';
}

function stepper(side,sym,n){
  return '<div class="step">'+
    '<button data-remove="'+side+'" aria-label="Remove one '+sym+'"'+(n?"":" disabled")+
      '>−</button>'+
    '<span>'+n+' <b class="mono">'+sym+'</b></span>'+
    '<button data-add="'+side+'" aria-label="Add one '+sym+'">+</button></div>';
}

function judge(side){
  var e=EL[side==="C"?S.c:S.a], st=S[side];
  var wantVerb=e.q>0?"lose":"gain", wantN=Math.abs(e.q);

  if(!st.verb) return "Choose whether it gains or loses electrons.";
  if(st.verb!==wantVerb)
    return e.q>0
      ? cap(e.name)+" is a metal, and metals lose electrons."
      : cap(e.name)+" is a nonmetal, and nonmetals gain electrons.";

  var n=(st.n||"").trim();
  if(!/^\d+$/.test(n)) return "Enter how many electrons it transfers.";
  n=+n;
  if(n===0) return "An ion has to transfer at least one electron.";
  if(n!==wantN)
    return e.q>0
      ? "Not that many. Check the periodic table — a metal loses every electron in its outer shell."
      : "Not that many. A nonmetal gains only enough to fill its outer shell to eight.";

  var r=parseCharge(st.q);
  if(r.err) return r.noSign
    ? "Does "+e.name+" form a positive or a negative ion?"
    : r.err;
  if(Math.sign(r.q)!==Math.sign(e.q))
    return e.q>0
      ? "Losing electrons leaves extra protons behind, so the ion comes out positive."
      : "Gaining electrons adds negative charge, so the ion comes out negative.";
  if(r.q!==e.q)
    return "Each electron transferred is worth one unit of charge, so the number should match.";
  return null;
}

function buildWhy(){
  var cat=EL[S.c], ani=EL[S.a], k=subscripts(cat.q,ani.q);
  var mc=MAINBY[S.c], ma=MAINBY[S.a];
  return [
    cap(cat.name)+" is in group <b>"+mc.g+"</b>, so it loses "+eWord(mc.v)+
      ' and forms <b class="mono">'+S.c+chargeSup(cat.q)+"</b>.",
    cap(ani.name)+" is in group <b>"+ma.g+"</b>, so it gains "+eWord(-ani.q)+
      ' and forms <b class="mono">'+S.a+chargeSup(ani.q)+"</b>.",
    whyRatio(S.c,cat.q,k.nm,S.a,ani.q,k.na),
    'So the formula is <b class="mono">'+
      subDigits(S.c+(k.nm>1?k.nm:"")+S.a+(k.na>1?k.na:""))+"</b>."
  ];
}
function buildReveal(){
  if(S.phase==="done") return;
  var cat=EL[S.c], ani=EL[S.a], k=subscripts(cat.q,ani.q);
  S.shown=true; S.misses=(S.misses||0)+1;
  S.C.ok=true; S.A.ok=true; S.C.err=null; S.A.err=null;
  S.nc=k.nm; S.na=k.na; S.ftext=""; S.ferr=null;
  S.phase="done";
  track("build", false);
  render();
}

/* One atom at a time. `S.side` is the card being worked on; the other one
   waits, so a wrong answer is only ever about the atom in front of them. */
function check(){
  sync();
  var k=S.side, e=EL[k==="C"?S.c:S.a], problem=judge(k);
  S.tries=S.tries||{};
  var slotKey="charge"+k;
  S.tries[slotKey]=(S.tries[slotKey]||0)+1;
  var typed=(S[k].verb||"?")+" "+(S[k].n||"?")+" electrons \u2192 "+(S[k].q||"?");
  if(problem){
    S[k].err=problem; S.shake=k;
    S.misses=(S.misses||0)+1;
    /* the same order judge() checks in, so the fault matches what actually failed */
    var wantVerb=e.q>0?"lose":"gain", wantN=Math.abs(e.q);
    var fault;
    if(!S[k].verb || S[k].verb!==wantVerb) fault="direction";
    else if(!/^\d+$/.test((S[k].n||"").trim()) || +S[k].n!==wantN) fault="count";
    else fault = parseCharge(S[k].q).err ? "format" : "charge";
    logAttempt("build","charge",e.name,typed,false,fault,S.tries[slotKey]);
    render();
    setTimeout(function(){
      S.shake=null; render();
      var f=document.getElementById("n"+k)||document.getElementById("q"+k);
      if(f) f.focus();
    },440);
    return;
  }
  logAttempt("build","charge",e.name,typed,true,"",S.tries[slotKey]);
  S[k].ok=true; S[k].err=null; S.shake=null; S.tip=null;
  if(k===S.order[0]) S.side=S.order[1];
  if(S.C.ok&&S.A.ok) S.phase="build";
  render();
  var nxt=document.getElementById("n"+S.side);
  if(S.phase==="charge" && nxt) nxt.focus();
}

function changeCount(side,delta){
  if(S.phase!=="build") return;
  if(side==="c") S.nc=Math.max(0,S.nc+delta);
  else S.na=Math.max(0,S.na+delta);
  S.shakeBoard=false;
  render();
}
function buildFits(){
  var cat=EL[S.c], ani=EL[S.a];
  return S.nc>0 && S.na>0 && S.nc*cat.q===S.na*-ani.q && gcd(S.nc,S.na)===1;
}
function checkBuild(){
  if(S.phase!=="build") return;
  S.tries=S.tries||{};
  S.tries.board=(S.tries.board||0)+1;
  var typed=S.nc+":"+S.na;
  if(buildFits()){
    logAttempt("build","board",S.c+"/"+S.a,typed,true,"",S.tries.board);
    S.shakeBoard=false; render();
    setTimeout(function(){ S.phase="formula"; S.ftext=""; S.ferr=null; S.tip=null;
      render(); },320);
    return;
  }
  logAttempt("build","board",S.c+"/"+S.a,typed,false,"ratio",S.tries.board);
  S.misses=(S.misses||0)+1;
  S.shakeBoard=true; render();
  setTimeout(function(){ S.shakeBoard=false; render(); },440);
}

function checkFormula(){
  var fin=document.getElementById("fin");
  var got=(fin?fin.textContent:"").replace(/\s+/g,"");
  S.ftext=got;
  var want=S.c+(S.nc>1?S.nc:"")+S.a+(S.na>1?S.na:"");
  var flipped=S.a+(S.na>1?S.na:"")+S.c+(S.nc>1?S.nc:"");
  S.tries=S.tries||{};
  S.tries.formula=(S.tries.formula||0)+1;

  var fault="count";
  S.markNum=true;
  if(!got){ S.ferr="Type the formula."; fault="blank"; }
  else if(got===want){ S.phase="done"; S.ferr=null; S.markNum=false; }
  else if(got.toLowerCase()===want.toLowerCase()){
    S.ferr="Check the capitals. A symbol starts with a capital letter, and a second letter is always lowercase.";
    fault="caps";
  }
  else if(got.replace(/1(?!\d)/g,"")===want){
    S.ferr="Drop the 1. When there is only one ion, no number is written.";
    fault="one";
  }
  else if(got===flipped){
    S.ferr="The metal is always written first.";
    fault="order";
  }
  else

}
