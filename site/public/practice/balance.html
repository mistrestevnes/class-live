function pnHint(){
  var x=pnLive()[0]; if(!x) return null;
  var it=pnItems(P.eq)[x[0]];
  if(it.el) return "Find <b>"+esc(it.name)+"</b> on your periodic table.";
  if(x[1]==="f") return "Put the two ions together so that the charges balance.";
  return "Find the metal on your periodic table"+(isPoly(it.an)?" and the polyatomic ion on your ion sheet":"")+"."+
    (PPMV[it.cat] ? " A Roman numeral in the name is the metal's charge." : "");
}

/* ── checking ─────────────────────────────────────────────────── */
/* the ionic page's parseCharge: +2, 2+, a bare + or − for one */
function pnCharge(raw){
  var s=(raw||"").trim().replace(/[\u2212\u2013\u2014]/g,"-").replace(/\s+/g,"");
  /* a bare sign is not enough: the 1 is always written, +1 or -1 (24 Sept) */
  if(s==="+"||s==="-") return {bare:s};
  var m=s.match(/^(?:([+-])(\d)|(\d)([+-]))$/);
  if(!m) return /^\d+$/.test(s) ? {noSign:true} : {err:true};
  var d=+(m[2]||m[3]);
  return d ? {q:d*((m[1]||m[4])==="+"?1:-1)} : {err:true};
}
var PNCAPS="Check the capitals. A symbol starts with a capital letter, and a second letter is always lowercase.";

/* both ions of one compound: {fault, msg, bad:[ids]} or null */
function pnIonsFault(i,it){
  var first=null, bad=[];
  [0,1].forEach(function(k){
    var p="pn"+i, want=k?it.an:it.cat, q=k?-it.aq:it.cq;
    var ion=k?pnAnName(it.an):pnCatName(it.cat,it.cq);
    var sym=plainDigits(pnVal(p+"s"+k)).replace(/[\s()]/g,""), f=null;
    if(sym!==want){
      bad.push(p+"s"+k);
      if(sym.toLowerCase()===want.toLowerCase()) f=["caps",PNCAPS];
      else if(!k) f=["symbol","Find <b>"+esc(eName(it.cat))+"</b> on your periodic table."];
      else if(isPoly(want)) f=["ion","Find <b>"+pnRed(ion)+"</b> on your ion sheet."];
      else f=["symbol","The <b>"+pnRed(ion)+"</b> ion comes from <b>"+esc(eName(want))+"</b>."];
    }
    var r=pnCharge(pnVal(p+"c"+k)), g=null;
    if(r.bare) g=["format","Write the 1 too: <b>"+(r.bare==="+"?"+1":"\u22121")+"</b>."];
    else if(r.err) g=["format","Write a sign and a number, like +1."];
    else if(r.noSign || r.q===-q) g=["sign","Is the <b>"+esc(ion)+"</b> ion positive or negative?"];
    else if(r.q!==q) g=["charge",
        !k ? (PPMV[it.cat] ? "What does the Roman numeral tell you?"
              : PNGROUP[it.cat] ? "Check which group <b>"+esc(eName(it.cat))+"</b> is in."
              : "Check your periodic table for the charge on the <b>"+esc(ion)+"</b> ion.")
           : (isPoly(want) ? "Find <b>"+pnRed(ion)+"</b> on your ion sheet."
              : "Check which group <b>"+esc(eName(want))+"</b> is in.")];
    if(g) bad.push(p+"c"+k);
    if(!first) first=f||g;
  });
  return first ? {fault:first[0], msg:first[1], bad:bad} : null;
}
/* Does this typed formula actually name a different real ion — the sulfate/
   sulfite kind of mix-up — rather than being malformed? Same cation, a
   different anion that is itself a real one. Used only on the last try (24
   Sept): he rescinded "never show the answer" for this case specifically,
   because a student stuck on one item should be told plainly and moved on,
   not left to keep guessing. */
function pnWrongIonNamed(got,it){
  var c=ionSplit(got);
  if(!c || c.cat!==it.cat || c.an===it.an) return null;
  return pnAnName(c.an) || null;
}
function pnIonsTyped(i){
  var p="pn"+i;
  return [0,1].map(function(k){ return pnVal(p+"s"+k).trim()+" "+pnVal(p+"c"+k).trim(); }).join(", ");
}

/* one formula: {fault, msg} or null. The order of the tests is the order
   a student should fix things in: the shape first, then the numbers. */
function pnFormFault(raw,it){
  var got=plainDigits(String(raw||"")).replace(/\s+/g,""), want=it.f;
  if(got===want) return null;
  var F=function(f,m){ return {fault:f, msg:m}; };
  if(!got) return F("other","Type the formula.");
  var round=got.replace(/[\[{]/g,"(").replace(/[\]}]/g,")");
  if(round!==got && round===want) return F("parens","Use round parentheses ( ), not square or curly brackets.");
  if(got.toLowerCase()===want.toLowerCase()) return F("caps",PNCAPS);
  if(it.el) return F("other","Not quite.");
  got=round;
  if((got.match(/\(/g)||[]).length!==(got.match(/\)/g)||[]).length)
    return F("parens","Your parentheses do not match up. Every one that opens has to close.");
  var rn=PNROMAN[it.cq];
  if(PPMV[it.cat] && (got.indexOf("("+rn+")")>=0 || got.indexOf(it.cat+rn)===0))
    return F("roman","The Roman numeral is the charge, not a subscript. It never appears in the formula.");
  var one=/\(([A-Z][a-z]?)\)/.exec(got);
  if(one && !isPoly(one[1]))
    return F("parens","Parentheses go around a polyatomic ion, never around a single element's symbol.");
  var poly=isPoly(it.an), C=it.cat, A=it.an;
  if(poly && new RegExp("\\("+A+"\\d+\\)").test(got))
    return F("parens","The number goes outside the parentheses, just after the closing parenthesis.");
  var m=new RegExp("^"+C+"(\\d*)(?:\\("+A+"\\)(\\d*)|"+A+"(\\d*))$").exec(got);
  if(m){
    var paren=m[2]!==undefined, dc=m[1], da=paren?m[2]:m[3];
    var nc=dc===""?1:+dc, na=da===""?1:+da;
    if(dc==="1" || da==="1") return F("one","Drop the 1. When there is only one ion, no number is written.");
    if(poly && na>1 && !paren)
      return F("parens","When a formula needs more than one of a polyatomic ion, the ion goes in "+
               "parentheses and the number sits outside them.");
    if(paren && da==="" && it.na>1)
      return F("parens","The number of polyatomic ions is missing. It goes just after the closing parenthesis.");
    if(paren && na===1)
      return F("parens","A polyatomic ion only takes parentheses when the formula needs more than one of it. "+
               "With just one, write it plain.");
    if(it.cq*nc!==it.aq*na) return F("balance","The charges don't balance yet.");
    return F("reduce","The charges balance, but the subscripts can be smaller.");
  }
  if(new RegExp("^(?:\\("+A+"\\)\\d*|"+A+"\\d*)"+C+"\\d*$").test(got))
    return F("order","The positive ion is written first.");
  return F("other","Not quite.");
}

function pnCheck(){
  var its=pnItems(P.eq), msgs=[], wrong=false, pnStuck=false;
  P.nm.bad={};
  pnLive().forEach(function(x){
    var i=x[0], it=its[i], r;
    if(x[1]==="ions"){
      r=pnIonsFault(i,it);
      /* each ion right or wrong on the dashboard, and which practice topic
         a miss belongs to on the student's progress page (24 Sept) */
      var ib=r?r.bad:[], pre="pn"+i, ionOk=function(k){
        return ib.indexOf(pre+"s"+k)<0 && ib.indexOf(pre+"c"+k)<0; };
      var ionDet=[0,1].map(function(k){
        return {l:(pnVal(pre+"s"+k).trim()+" "+pnVal(pre+"c"+k).trim()).trim()||"(blank)", k:ionOk(k)}; });
      var catChgBad=ib.indexOf(pre+"c0")>=0, anPoly=isPoly(it.an);
      var tg="C"+((catChgBad || (!anPoly && ib.indexOf(pre+"c1")>=0))?1:0);
      if(anPoly) tg+=",P"+(ionOk(1)?0:1);
      if(catChgBad && PPMV[it.cat]) tg+=",M";
      logAttempt("ions", it.name, pnIonsTyped(i), !r, r?r.fault:"", ppTry(i+"ions"), detailStr(ionDet), tg);
      if(!r){ P.nm.ok[i+"ions"]=true;
        /* the charges they typed stay on screen written the standard way: +3, -1 */
        P.nm.v["pn"+i+"c0"]="+"+it.cq; P.nm.v["pn"+i+"c1"]="-"+it.aq;
        return; }
      r.bad.forEach(function(id){ P.nm.bad[id]=true; });
    } else {
      var id="pn"+i+"f", typed=plainDigits(pnVal(id)).replace(/\s+/g,"");
      var tryNo=(P.tries[i+"f"]||0)+1;
      r=pnFormFault(typed,it);
      if(r && tryNo>=5){
        var wrongIon=pnWrongIonNamed(typed,it);
        if(wrongIon){
          r={fault:"ion", msg:"That is the <b>"+esc(wrongIon)+"</b> ion. You are looking for the "+
             "<b>"+esc(pnAnName(it.an))+"</b> ion."};
        }
        pnStuck=true;
      }
      /* a formula built on a different real ion (sulfite for sulfate) is
         logged as "ion" whatever the correction on screen says */
      var otherIon=r && pnWrongIonNamed(typed,it);
      logAttempt("formula", it.name, typed, !r, r?(otherIon?"ion":r.fault):"", ppTry(i+"f"), null,
        isPoly(it.an)?"P"+(otherIon?1:0):"");
      if(!r){ P.nm.ok[i+"f"]=true; return; }
      P.nm.bad[id]=true;
    }
    wrong=true;
    /* one correction per reactant at most */
    if(msgs.length<2 && !msgs.some(function(m){ return m.i===i; })) msgs.push({i:i, m:r.msg});
  });
  if(wrong){
    P.misses++;
    P.hint=msgs.map(function(m){ return m.m; }).join(" ");
    /* five tries on one reactant's formula and still wrong: rather than a
       sixth attempt at the same item, move straight to a new one (24 Sept) */
    P.stuck=pnStuck;
    ppRender(); return;
  }
  P.ok=true;
  if(pnAt()<its.length){ ppRender(); return; }   /* beginner: on to the next part */

  /* every reactant written: the charges they typed go onto the tiles */
  var pp=P.eq.pp;
  its.forEach(function(it){
    if(it.el) return;
    [it.cat, it.an].forEach(function(s){
      var t=pp.tiles.indexOf(s);
      if(t>=0){ P.chg[t]=pp.tch[t]; P.lock[t]=true; }
    });
  });
  P.phase = L.level===0 ? "replace" : ppDR() ? "predict" : "charges";
  ppRender();
}

/* ── typing ───────────────────────────────────────────────────── */
function pnOffset(root){
  var sel=window.getSelection();
  if(!sel.rangeCount) return root.textContent.length;
  var rg=sel.getRangeAt(0), r=document.createRange();
  r.selectNodeContents(root);
  try{ r.setEnd(rg.endContainer, rg.endOffset); }catch(e){ return root.textContent.length; }
  return r.toString().length;
}
function pnCaret(root,off){
  var w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT), n, seen=0, r=document.createRange();
  while((n=w.nextNode())){
    if(seen+n.nodeValue.length>=off){ r.setStart(n,off-seen); r.collapse(true); break; }
    seen+=n.nodeValue.length;
  }
  if(!n){ r.selectNodeContents(root); r.collapse(false); }
  var s=window.getSelection(); s.removeAllRanges(); s.addRange(r);
}
document.addEventListener("input",function(ev){
  var t=ev.target, id=t.id||"";
  if(!/^pn\d[scf]\d?$/.test(id) || P.phase!=="names") return;
  if(id.slice(-1)==="f"){
    /* digits become subscripts as they are typed, in the box itself */
    var off=pnOffset(t), txt=plainDigits(t.textContent);
    P.nm.v[id]=txt; t.innerHTML=subDigits(txt); pnCaret(t,off);
  } else if(/s\d$/.test(id)){
    /* the symbol box — e.g. "SO4" — the same live subscript, not the
       charge box beside it (24 Sept) */
    if(/\d/.test(t.value)){ var pos=t.selectionStart; t.value=toSubs(t.value); t.setSelectionRange(pos,pos); }
    P.nm.v[id]=t.value;
  } else P.nm.v[id]=t.value;
  var btn=document.querySelector('.check[data-b="go"]'); if(btn) btn.disabled=!ppReady();
});
document.addEventListener("paste",function(ev){
  if(!/^pn\df$/.test(ev.target.id||"")) return;
  ev.preventDefault();
  var txt=(ev.clipboardData||window.clipboardData).getData("text").replace(/\s+/g,"");
  document.execCommand("insertText",false,txt);
});
/* ═══════════════════════════════════════════════════════════════
   THE ACTIVITY
   Elements, then counting one cell at a time, then coefficients.
   ═══════════════════════════════════════════════════════════════ */
/* No level ends (23 Sept). After GOOD_AT equations right first time on a level
   — not necessarily in a row — they are asked whether to go up or practise
   more. Practising more starts the count again. Never offered at the top. */
var GOOD_AT=10;

/* nothing is chosen at the start: the row builds up one step at a time */
var L={mode:null, src:null, type:null, level:null, unlocked:2, seen:[], intro:{}, tips:false, good:0};
var B={eq:null,phase:"elements",els:[],
       ecell:[],rcell:[],pcell:[],coef:[],focusK:null,
       stale:[],bad:{},hint:null,tip:null,misses:0,done:0,clean:0,ok:false};
/* Whether the student updates the table by hand after changing a
   coefficient. Off on every level for now (21 Sept) — he has turned it on and
   off several times, so the by-hand path (recount, restale, clearing on
   leaving a coefficient box) is kept behind this one switch. */
var MANUAL_TABLE=false;
/* Intermediate and advanced (23 Sept): straight to the coefficients. The table
   is optional, off by default, and the student's own — never checked, never
   filled in for them. Their on/off choice is kept, across levels and visits. */
function freeLevel(){ return L.level>0; }
var TKEY="baltable";
L.showTable=(function(){ try{ return localStorage.getItem(TKEY)==="1"; }catch(e){ return false; } })();
function setShowTable(on){ L.showTable=on; try{ localStorage.setItem(TKEY,on?"1":"0"); }catch(e){} }
function manual(){ return MANUAL_TABLE && L.level!==0; }
/* the arrow in the equation goes at advanced, and only there */
function noPointers(){ return L.level===2; }

/* one equation finished: count it, and decide whether to ask about moving up */
function noteSolved(clean){
  B.done++; if(clean){ B.clean++; L.good++; }
  B.offerUp = L.good>=GOOD_AT && L.level<levels().length-1;
}
function winHTML(title){
  /* what the balanced equation says, in words (24 Sept) */
  var eq=isPP()?ppBeq():B.eq, coef=isPP()?P.coef:B.coef;
  return '<div class="win"><div class="f">'+(title||"Correct!")+'</div>'+
    meaningHTML(eq, coef)+
    (B.offerUp
      ? '<p class="offer">You have '+GOOD_AT+' right on the '+esc(curLevel().name.toLowerCase())+
          ' level. Would you like to go to the next level, or practice more on this level?</p>'+
        '<div class="btnrow"><button data-b="levelup">Next level</button>'+
        '<button class="ghostbtn" data-b="staylevel">Practice more</button></div>'
      : '<button data-b="next">New equation</button>')+'</div>';
}
/* Check, Hint and Start over, the same row everywhere */
function btnRowHTML(ready){
  return '<div class="btnrow"><button class="check" data-b="go"'+(ready?'':' disabled')+'>Check</button>'+
    '<button class="check ghostbtn" data-b="hint">Hint</button>'+
    '<button class="check ghostbtn" data-b="restart">Start over</button></div>';
}
function counterHTML(){
  /* on an assigned level, how far through it they are */
  asgNow();
  return '<p class="counter"><b>'+B.done+'</b> done · <b>'+B.clean+'</b> with no misses'+
'</p>'+
    (PUZZLE?pzHTML():"");
}

/* for the mistake report: the equation, and coefficients as typed ("_" for blank) */
function eqText(eq){ return eq.r.join(" + ")+" \u2192 "+eq.p.join(" + "); }
function coefText(eq, coef){
  var v=coef.map(function(c){ c=(c||"").trim(); return c===""?"_":c; }), nr=eq.r.length;
  return v.slice(0,nr).join(" + ")+" \u2192 "+v.slice(nr).join(" + ");
}
function bqTry(step){ B.tries[step]=(B.tries[step]||0)+1; return B.tries[step]; }

function levels(){ return SETS[L.type].levels; }
function curLevel(){ return levels()[L.level]; }

/* draw from the current level, skipping anything already used in this set */
function pickEq(){
  var pool=curLevel().eqs, fresh=pool.filter(function(e){ return L.seen.indexOf(e)<0; });
  var lastSig=B.eq?B.eq.sig:null;
  var varied=fresh.filter(function(e){ return e.sig!==lastSig; });
  var bag = varied.length ? varied : (fresh.length ? fresh : pool);
  return bag[Math.floor(Math.random()*bag.length)];
}

function bqNew(){
  if(L.level===null) return menuOnly();
  if(isPP()) return ppNew();
  B.eq=pickEq();
  if(L.seen.indexOf(B.eq)<0) L.seen.push(B.eq);
  B.els=elementsOf(B.eq);
  /* the first time an ion gets its own row, say so once */
  if(groupsOf(B.eq).length && !L.intro.poly) L.intro.poly="show";
  B.phase=freeLevel()?"balance":"elements"; B.stale=[]; B.focusK=null;
  B.ecell=B.els.map(function(){return "";});
  B.rcell=B.els.map(function(){return "";});
  B.pcell=B.els.map(function(){return "";});
  B.ft={e:B.els.map(function(){return "";}), r:B.els.map(function(){return "";}),
        p:B.els.map(function(){return "";})};
  B.coef=B.eq.r.concat(B.eq.p).map(function(){return "";});
  B.committed=B.coef.slice(); B.unbal=[];
  B.bad={}; B.hint=null; B.tip=null; B.tipEl=null; B.misses=0; B.tries={}; B.ok=false;
  bqRender();
}

/* a blank coefficient slot means one — the 1 is never written */
function coefVals(){
  return B.coef.map(function(v){
    v=(v||"").trim();
    return v==="" ? 1 : (/^\d+$/.test(v) ? +v : 0);
  });
}
function liveCount(i, side){
  var c=coefVals(), nr=B.eq.r.length;
  return side==="r" ? sideCount(B.eq.r, c.slice(0,nr), B.els[i], groupsOf(B.eq))
                    : sideCount(B.eq.p, c.slice(nr), B.els[i], groupsOf(B.eq));
}
function rowMatched(i){ return liveCount(i,"r")===liveCount(i,"p"); }
function allMatched(){
  for(var i=0;i<B.els.length;i++) if(!rowMatched(i)) return false;
  return true;
}

function cellAt(k){ return {i:Math.floor(k/2), side:(k%2===0?"r":"p")}; }
/* the count boxes open right now: every one while counting, only the stale
   ones while recounting */
function openCells(){
  if(B.phase==="counts") return B.els.map(function(e,i){ return [i*2,i*2+1]; })
                                  .reduce(function(a,b){ return a.concat(b); },[]);
  if(B.phase==="recount") return B.stale.slice();
  return [];
}
function cellVal(k){
  var at=cellAt(k); return ((at.side==="r"?B.rcell:B.pcell)[at.i]||"").trim();
}
/* Check does nothing until every open box is filled */
function readyToCheck(){
  if(B.phase==="elements")
    return B.ecell.every(function(v){ return (v||"").trim()!==""; });
  if(B.phase==="counts"||B.phase==="recount")
    return openCells().every(function(k){ return /^\d+$/.test(cellVal(k)); });
  return true;
}
function cellState(i,side){
  var k=i*2+(side==="r"?0:1);
  if(B.phase==="counts") return "live";
  if(B.phase==="recount") return B.stale.indexOf(k)<0 ? "done" : "live";
  return "other";
}

/* ── the equation line ───────────────────────────────────────── */
/* keep the whole equation on one line by stepping the size down */
function eqSize(){
  var all=B.eq.r.concat(B.eq.p);
  var len=all.join("").length + all.length*3;
  return len<=20 ? "" : len<=25 ? " s1" : len<=30 ? " s2" : " s3";
}
function eqHTML(){
  var live = B.phase==="balance"||B.phase==="done"||B.phase==="recount";
  var out='<div class="eq'+eqSize()+'">', all=B.eq.r.concat(B.eq.p), nr=B.eq.r.length, i;
  for(i=0;i<all.length;i++){
    if(i===nr) out+='<span class="arrow">&rarr;</span>';
    else if(i>0) out+='<span class="plus">+</span>';
    var side = i<nr ? "r" : "p";
    var mark = (B.markEl && (!B.markSide || B.markSide===side)) ? B.markEl : null;
    out+='<span class="term">'+
      (live
        ? '<input class="coef'+(B.phase==="done"?" solved":"")+(B.bad["c"+i]?" bad":"")+'" id="bc'+i+'" value="'+
          esc(B.coef[i])+'" inputmode="numeric" autocomplete="off" maxlength="2" '+
          'aria-label="Coefficient for '+esc(all[i])+'">'
        : "")+
      '<span>'+((B.unbal||[]).length ? ppMarkHTML(all[i], B.unbal, B.eq)
                                     : formulaHTML(all[i], mark))+'</span></span>';
  }
  return out+'</div>';
}

/* ── the ERP table ───────────────────────────────────────────── */
function tableHTML(){
  var ph=B.phase, h='<div class="erpwrap"><table class="erp'+(groupsOf(B.eq).length?" wide":"")+'"><thead><tr>'+
    '<th>Element</th><th>Reactant</th><th>Product</th></tr></thead><tbody>';
  B.els.forEach(function(el,i){
    var shown = shownCount(i);
    var matched = (ph==="balance"||ph==="done") &&
                  shown.r!==null && shown.p!==null && shown.r===shown.p;
    h+='<tr class="row'+(matched?" matched":"")+'">';

    /* element column, one row at a time while listing them */
    var rowStale = ph==="recount" &&
      (B.stale.indexOf(i*2)>=0 || B.stale.indexOf(i*2+1)>=0);
    h+='<td class="ecell'+(rowStale?" restale":"")+'">'+ (ph==="elements"
      ? '<input id="be'+i+'" class="'+(B.bad["e"+i]?"bad":"")+'" value="'+esc(B.ecell[i])+
        '" autocomplete="off" spellcheck="false" aria-label="Element">'
      : '<div class="elock">'+keyHTML(B.els[i])+'</div>') +'</td>';

    ["r","p"].forEach(function(side){
      if(ph==="elements"){ h+='<td class="ncell"><div class="waiting">·</div></td>'; return; }
      var val=side==="r"?B.rcell[i]:B.pcell[i];
      if(ph==="counts"||ph==="recount"){
        var st=cellState(i,side);
        var flag = ph==="recount" && B.stale.indexOf(i*2+(side==="r"?0:1))>=0;
        h+='<td class="ncell'+(flag?" restale":"")+'">'+(
          st==="live"
            ? '<input id="b'+side+i+'" class="'+(B.bad[side+i]?"bad":"")+'" value="'+
              esc(val)+'" inputmode="numeric" autocomplete="off" aria-label="How many '+
              esc(unitName(B.els[i]))+(isPoly(B.els[i])?' ions':' atoms')+'">'
            : '<div class="fixed">'+esc(val)+'</div>')+'</td>';
        return;
      }
      /* balancing: worked out for them below advanced, their own numbers above */
      var n = side==="r"?shown.r:shown.p;
      h+='<td class="ncell">'+(n===null
        ? '<div class="waiting">·</div>'
        : '<div class="live '+(matched?"match":"miss")+'">'+n+'</div>')+'</td>';
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}
/* intermediate and advanced: blank boxes that are theirs to fill and change */
function freeTableHTML(){
  var h='<div class="erpwrap"><table class="erp free'+(groupsOf(B.eq).length?" wide":"")+
    '"><thead><tr><th>Element</th><th>Reactant</th><th>Product</th></tr></thead><tbody>';
  B.els.forEach(function(el,i){
    h+='<tr class="row"><td class="ecell"><input id="fe'+i+'" value="'+esc(B.ft.e[i])+
      '" autocomplete="off" spellcheck="false" aria-label="Element"></td>'+
      ["r","p"].map(function(s){ return '<td class="ncell"><input id="f'+s+i+'" value="'+
        esc(B.ft[s][i])+'" inputmode="numeric" autocomplete="off" aria-label="'+
        (s==="r"?"Reactant":"Product")+' count"></td>'; }).join("")+'</tr>';
  });
  return h+'</tbody></table></div>';
}
/* what the table is showing for a row: the live count, or — once the student
   is keeping it themselves — whatever they last wrote there */
function shownCount(i){
  if(!manual() || B.phase==="counts" || B.phase==="elements")
    return {r:liveCount(i,"r"), p:liveCount(i,"p")};
  var a=(B.rcell[i]||"").trim(), b=(B.pcell[i]||"").trim();
  return {r:/^\d+$/.test(a)?+a:null, p:/^\d+$/.test(b)?+b:null};
}
/* rows whose real count no longer matches what the student wrote down */
function staleCells(){
  var out=[];
  B.els.forEach(function(el,i){
    ["r","p"].forEach(function(side){
      var raw=((side==="r"?B.rcell:B.pcell)[i]||"").trim();
      if(!/^\d+$/.test(raw) || +raw!==liveCount(i,side)) out.push(i*2+(side==="r"?0:1));
    });
  });
  return out;
}

function leadText(){
  if(B.phase==="elements")
    return "Name every element in this equation, one in each box, then press Check."+
      (groupsOf(B.eq).length ? " A polyatomic ion on both sides takes one box of its own." : "");
  if(B.phase==="counts")
    return "Count the atoms of each element"+
      (groupsOf(B.eq).length ? ", and each polyatomic ion as one piece," : "")+
      " on the <b class=\"side\">reactant</b> and "+
      "<b class=\"side\">product</b> sides. Fill in every box, then press Check.";
  if(B.phase==="recount")
    return (B.justStale
      ? "<span class=\"warn\">Changing a coefficient changed some counts.</span> "
      : "")+"Count the boxed rows again, then press Check.";
  if(B.phase==="balance" && freeLevel())
    return "Add coefficients until both sides match, then press Check.";
  if(B.phase==="balance")
    return manual()
      ? "Add coefficients, then check. On this level, you update the table yourself."
      : "Add coefficients until every row matches. The counts keep themselves up to date.";
  return "";
}

/* ── the hint ────────────────────────────────────────────────── */
/* counts for a formula in the current equation, whole ions kept whole */
function fa(f){ return unitsOf(f, groupsOf(B.eq)); }
function lcm(a,b){ return a/gcd(a,b)*b; }
function spread(i){
  var el=B.els[i];
  var r=B.eq.r.filter(function(f){ return fa(f)[el]; }).length;
  var p=B.eq.p.filter(function(f){ return fa(f)[el]; }).length;
  return Math.max(r,p);
}
/* a formula that is one element on its own, like O2 or Na */
function loneOf(i){
  var el=B.els[i], hit=null;
  B.eq.r.concat(B.eq.p).forEach(function(f){
    var a=fa(f);
    if(a[el] && Object.keys(a).length===1) hit=f;
  });
  return hit;
}
/* Which element to talk about. One that sits in a single formula on each
   side can be fixed and stays fixed; one that appears in several moves
   again every time anything else changes. */
function hintTarget(){
  var best=-1, i;
  for(i=0;i<B.els.length;i++){
    if(rowMatched(i)) continue;
    if(spread(i)===1) return i;
    if(best<0) best=i;
  }
  return best;
}
function hintCell(){
  var open=openCells();
  if(open.indexOf(B.focusK)>=0) return B.focusK;
  var bad=open.filter(function(k){ var a=cellAt(k); return B.bad[a.side+a.i]; });
  if(bad.length) return bad[0];
  var empty=open.filter(function(k){ return !/^\d+$/.test(cellVal(k)); });
  return empty.length ? empty[0] : open[0];
}
function hintText(){
  if(B.phase==="elements")
    return "Every capital letter in a formula begins an element, and a small letter "+
           "after it belongs to the same one. Each box takes a different one."+
           (groupsOf(B.eq).length ? " A polyatomic ion that appears on both sides "+
             "takes one box of its own." : "");
  if(B.phase==="counts"||B.phase==="recount"){
    var at=cellAt(hintCell()), el=B.els[at.i];
    var list=(at.side==="r"?B.eq.r:B.eq.p).filter(function(f){ return fa(f)[el]; });
    var looks="Look at "+(list.length===1?"the formula ":"each formula ")+
      list.map(function(f){ return '<b class="mono">'+formulaHTML(f)+"</b>"; }).join(" and ");
    if(isPoly(el))
      return looks+". <b>"+keyHTML(el)+"</b> counts as one piece. A number right after "+
        "the parentheses around it says how many, and with no parentheses there is one"+
        (B.phase==="recount" ? ". The coefficient in front multiplies the whole formula." : ".");
    return looks+". A subscript right after <b>"+esc(el)+"</b> says how many, and no subscript "+
      "means one. A number outside parentheses multiplies everything inside them"+
      (B.phase==="recount" ? ", and the coefficient in front multiplies the whole formula." : ".");
  }

  var i2=hintTarget();
  if(i2<0) return "Both sides match. Check whether all the coefficients can be "+
    "divided by the same number.";
  B.tipEl=B.els[i2];
  var el2=B.els[i2], a=liveCount(i2,"r"), b2=liveCount(i2,"p");
  if(!a || !b2)
    return "There is no <b>"+keyHTML(el2)+"</b> on one side yet. Every atom in the "+
      "reactants has to turn up in the products.";
  if(spread(i2)===1)
    return "You have <b>"+a+" "+keyHTML(el2)+"</b> on the reactant side and <b>"+b2+" "+
      keyHTML(el2)+"</b> on the product side. The smallest number both <b>"+a+"</b> and <b>"+
      b2+"</b> divide into is <b>"+lcm(a,b2)+"</b>, so aim for <b>"+lcm(a,b2)+" "+
      keyHTML(el2)+"</b> on each side.";

  /* it is in more than one formula — is it also sitting on its own somewhere? */
  var lone=loneOf(i2);
  /* Only the elements that are still out. Naming one that already matches is
     what made this advice read as nonsense when sulfur sat at 1/1. */
  var others=B.els.filter(function(e,j){ return j!==i2 && !rowMatched(j); })
    .map(function(e){ return esc(unitName(e)); });
  if(lone){
    var per=fa(lone)[el2]||1;          /* O2 moves oxygen two at a time */
    var gap=Math.abs(a-b2);
    if(!others.length && per>1 && gap%per!==0)
      /* everything else agrees, but the lone formula cannot close an odd gap:
         the matching formulas have to be scaled before it can finish */
      return "Everything else already matches, and <b>"+esc(unitName(el2))+"</b> is out by <b>"+
        gap+"</b> — but <b class=\"mono\">"+formulaHTML(lone)+"</b> only moves "+
        esc(unitName(el2))+" <b>"+per+"</b> at a time, so no number in front of it can "+
        "close a gap of "+gap+". The formulas that already agree have to move first, "+
        "together, and then <b class=\"mono\">"+formulaHTML(lone)+"</b> can make up "+
        "the difference.";
    return "<b>"+esc(unitName(el2))+"</b> is the only one left, and it appears in more "+
      "than one formula — but it is also on its own as <b class=\"mono\">"+
      formulaHTML(lone)+"</b>. A substance made of one element is the one to save "+
      "for last, because changing it moves nothing else. "+
      (others.length
        ? "Get the formulas holding "+
          (others.length===1?"<b>"+others[0]+"</b>":"the other elements")+
          " to agree first, then use <b class=\"mono\">"+formulaHTML(lone)+
          "</b> to make up the difference."
        : "Use <b class=\"mono\">"+formulaHTML(lone)+"</b> to make up the difference.");
  };
  return "<b>"+esc(unitName(el2))+"</b> turns up in more than one formula on a side, so "+
    "its count shifts every time you change something else. Leave it until last and "+
    "sort the other elements first.";
}

/* ── the list they can call up at any time ───────────────────── */
var TIPS=[
  "Count every element on both sides before you change anything.",
  "Only the big number in front may change. A subscript is part of the formula and "+
    "is never touched.",
  "Start with an element that appears in only one formula on each side.",
  "An element that appears in several formulas on the same side shifts every time "+
    "you change something else — leave it until last.",
  "A substance made of one element on its own, like <b class=\"mono\">O<sub>2</sub></b> "+
    "or <b class=\"mono\">Na</b>, is the easiest thing to change last, because it moves "+
    "nothing but itself.",
  "When one side has 2 and the other has 3, look for the smallest number both divide "+
    "into. For 2 and 3 that is 6; for 2 and 10 it is 10, not 20.",
  "Fixing one element often breaks another. Recount every row before you call it done.",
  "A number outside parentheses multiplies everything inside them: "+
    "<b class=\"mono\">Ca(OH)<sub>2</sub></b> is 1 calcium, 2 oxygen and 2 hydrogen.",
  "A coefficient of 1 is never written — leave that space blank.",
  "If every coefficient divides by the same number, divide them all down."
];
function tipsHTML(){
  return '<div class="intro tipbox"><h2>Balancing tips</h2><ol class="tiplist">'+
    TIPS.map(function(t){ return "<li>"+t+"</li>"; }).join("")+
    '</ol><button class="check" data-b="closetips">Back to the equation</button></div>';
}

/* ── navigation ──────────────────────────────────────────────
   Three rows that build up as they are chosen (23 Sept): what to do, which
   reaction, which level. Every row stays on screen, so any choice is one tap
   away. Nothing else is drawn until a level is picked. */
var MODES=[["bal","Balancing equations"],["pp","Predicting products"]];
var MENU={bal:[["syn","Synthesis"],["sr","Single replacement"],["dr","Double replacement"]],
          pp:[["pp","Single replacement"],["pdr","Double replacement"]]};
/* Predicting products has one more row, right after it: where the
   reactants come from (23 Sept). Everything before this is From formulas. */
var SOURCES=[["f","From formulas"],["n","From names"]];
/* the "you are here" row (27 Sept, Class Live practice): each choice is a
   button that drops down its alternatives; the level is a joined control.
   Before a choice is made, that step shows as big buttons under the row. */
function balPath(){
  var o={title:"Balancing", steps:[], segs:[], next:null};
  if(!L.mode) o.next={id:"mode", opts:MODES};
  else{
    o.steps.push({id:"mode", opts:MODES, cur:L.mode});
    if(L.mode==="pp" && !L.src) o.next={id:"src", opts:SOURCES};
    else{
      if(L.mode==="pp") o.steps.push({id:"src", opts:SOURCES, cur:L.src});
      if(!L.type) o.next={id:"type", opts:MENU[L.mode]};
      else{
        o.steps.push({id:"type", opts:MENU[L.mode], cur:L.type});
        var lv=levels().map(function(x,i){ return [String(i), x.name]; });
        if(L.level===null) o.next={id:"level", opts:lv};
        else o.segs.push({id:"level", opts:lv, cur:String(L.level)});
      }
    }
  }
  return o;
}
function drawPath(){
  asgNow();
  if(L.level!==null) CW.save("bal",{mode:L.mode, src:L.src, type:L.type, level:L.level});
  var el=document.getElementById("cwpath");
  if(el) el.innerHTML=CW.pathHTML(balPath());
}
/* the row lives above #sec; the activity no longer carries its own menu */
function navHTML(){ drawPath(); return ""; }
/* nothing but the row, before a level is chosen */
function menuOnly(){
  asgNow();
  drawPath();
  document.getElementById("sec").innerHTML="";
}
/* a pick from the row. Changing one step keeps the others where they
   still apply, so a student already on an activity lands on another
   activity, never back at the start. */
function balPick(id, v){
  var had=L.level!==null, was=L.type && L.mode ? menuName(MENU[L.mode],L.type) : null;
  if(id==="level"){ if(+v!==L.level) goLevel(+v); else drawPath(); return; }
  if(id==="mode"){
    if(v===L.mode) return drawPath();
    L.mode=v;
    if(v!=="pp") L.src=null;
    else if(!L.src && had) L.src=L.lastSrc||"f";
  }
  if(id==="src"){ if(v===L.src) return drawPath(); L.src=v; L.lastSrc=v; }
  if(id==="type"){ if(v===L.type) return drawPath(); L.type=v; }
  else if(L.type){           /* the same reaction, by name, in the new list */
    var same=MENU[L.mode].filter(function(t){ return t[1]===was; })[0];
    L.type = same ? same[0] : (had ? MENU[L.mode][0][0] : null);
  }
  if(L.mode==="pp" && !L.src) L.type=null;
  L.seen=[]; L.good=0; B.offerUp=false;
  var lv = !L.type ? null : L.level===null ? (had?0:null) : Math.min(L.level, levels().length-1);
  L.level=null;
  if(lv===null) return menuOnly();
  goLevel(lv);
}
CW.init({draw:function(){ asgNow(); L.level===null ? menuOnly() : drawPath(); }, pick:balPick});
/* coming back to the topic reopens where they left off */
function restoreBal(){
  var s=CW.load("bal");
  if(!s || !MENU[s.mode] || !MENU[s.mode].some(function(t){ return t[0]===s.type; })) return;
  if(s.mode==="pp" && SOURCES.every(function(o){ return o[0]!==s.src; })) return;
  if(!SETS[s.type] || !SETS[s.type].levels[s.level]) return;
  L.mode=s.mode; L.src=s.mode==="pp"?s.src:null; L.type=s.type; L.lastSrc=L.src||L.lastSrc;
  L.seen=[]; goLevel(s.level);
}

/* ── assignments: where each results id lives in the menu ── */
var ASG_WHERE={syn:["bal",null,"syn"], sr:["bal",null,"sr"], dr:["bal",null,"dr"],
  pp:["pp","f","pp"], pdr:["pp","f","pdr"], pn:["pp","n","pp"], pdn:["pp","n","pdr"]};
function asgWhere(a){
  var m=/^bal_([a-z]+)(\d)$/.exec(a), w=m && ASG_WHERE[m[1]];
  if(!w || !SETS[w[2]] || !SETS[w[2]].levels[+m[2]-1]) return null;
  return {mode:w[0], src:w[1], type:w[2], level:+m[2]-1};
}
function menuName(list, k){
  for(var i=0;i<list.length;i++) if(list[i][0]===k) return list[i][1];
  return k;
}
/* open one level by its results id, bal_sr2 and so on: an assignment, or a
   link from the progress page (balance.html#go=bal_sr2) */
function openAct(a){
  var w=asgWhere(a);
  if(!w) return;
  L.mode=w.mode; L.src=w.src; L.type=w.type;
  L.seen=[]; B.offerUp=false;
  goLevel(w.level);
}

/* shown once, the first time a polyatomic ion gets its own row */
function polyIntroHTML(){
  return '<div class="intro">'+
    '<h2>Polyatomic ions on both sides</h2>'+
    '<p>When a polyatomic ion appears on both sides of an equation, count it as '+
      (freeLevel() ? 'a single unit, just like an element.</p>'
                   : 'one piece. It gets one row in the table, just like an element.</p>')+
    '<div class="exbox"><span class="exf">Al<sub>2</sub>(<span class="multi">SO<sub>4</sub></span>)<sub>3</sub></span></div>'+
    '<table class="extab"><tr><td>Al</td><td>subscript <b>2</b></td></tr>'+
    '<tr><td>SO<sub>4</sub></td><td>1 inside &times; 3 = <b>3</b></td></tr></table>'+
    '<p class="exwarn">So Al<sub>2</sub>(SO<sub>4</sub>)<sub>3</sub> is 2 aluminum and 3 sulfate. '+
      'You do not count the atoms inside the sulfate one by one.</p>'+
    '<button class="check" data-b="gotpoly">Got it</button></div>';
}

function bqRender(){
  if(L.level===null) return menuOnly();
  if(isPP()) return ppRender();
  setMark();
  var solved=B.phase==="done";
  var h=navHTML();

  if(L.tips){ document.getElementById("sec").innerHTML=h+tipsHTML(); return; }
  if(L.intro.poly==="show"){
    document.getElementById("sec").innerHTML=h+polyIntroHTML();
    return;
  }

  var tbl = !freeLevel() ? tableHTML() : (L.showTable ? freeTableHTML() : "");
  h+='<div class="eqbox">'+eqHTML()+'</div>'+
    '<div class="workrow'+(tbl?"":" notable")+'">'+tbl+'<div class="guide">'+
      (solved
        ? winHTML()
        : (B.ok?'<p class="okmsg">Correct!</p>':'')+
          '<p class="lead">'+leadText()+'</p>'+
          '<p class="hint'+(B.hint?"":" blank")+'">'+(B.hint||"")+'</p>'+
          (B.tip?'<p class="tip">'+B.tip+'</p>':'')+
          '')+
    '</div></div>'+
    /* Check | Hint | Start over directly under the work (24 Sept) */
    (solved ? '' : '<div class="bottomrow">'+btnRowHTML(readyToCheck())+
      '<div class="linkrow">'+
      (freeLevel() ? '<button class="linkbtn" data-b="table">'+
        (L.showTable?"Hide the table":"Show the table")+'</button>' : '')+
      '<button class="linkbtn" data-b="tips">Balancing tips</button></div></div>');

  h+=counterHTML();
  document.getElementById("sec").innerHTML=h;

  var f=null, pick=false;
  if(B.phase==="elements"||B.phase==="counts"||B.phase==="recount"){
    var boxes=[].slice.call(document.querySelectorAll(".erp input"));
    var kept=B.tip && B.focusK!==null && B.phase!=="elements"
      ? document.getElementById("b"+cellAt(B.focusK).side+cellAt(B.focusK).i) : null;
    f=kept ||    /* after a hint, stay in the box it is about */
      boxes.filter(function(x){ return x.classList.contains("bad"); })[0] ||
      boxes.filter(function(x){ return !x.value.trim(); })[0] || boxes[0];
    pick=true;
  }
  else if(B.phase==="balance" && B.coef.every(function(v){return !(v||"").trim();}))
    f=document.getElementById("bc0");   /* only on arrival, never mid-edit */
  fitEq();
  if(f){ f.focus(); if(pick && f.select) f.select(); }
}
/* shrink the equation until it fits the box — never a scroll bar */
function fitEq(){
  var eq=document.querySelector(".eqbox .eq");
  if(!eq) return;
  eq.style.zoom="";
  /* the row is centred, so an overflow spills off both ends: measure the
     pieces themselves rather than scrollWidth, which misses the left side */
  var lo=Infinity, hi=-Infinity;
  [].forEach.call(eq.children,function(c){
    var r=c.getBoundingClientRect(); lo=Math.min(lo,r.left); hi=Math.max(hi,r.right); });
  var room=eq.clientWidth, need=hi-lo;
  if(need>room) eq.style.zoom=Math.floor(room/need*100)/100-0.01;
}
window.addEventListener("resize",fitEq);

/* which element the equation should point at right now */
function setMark(){
  B.markEl=null; B.markSide=null;
  if(!B.eq || noPointers()) return;  /* advanced works without the pointers */
  if(B.phase==="counts"){
    if(B.focusK!==null){ var at=cellAt(B.focusK); B.markEl=B.els[at.i]; B.markSide=at.side; }
    return;
  }
  if(B.phase==="balance" && (B.hint||B.tip)){
    if(B.tip && B.tipEl){ B.markEl=B.tipEl; return; }
    var j=hintTarget();
    if(j>=0) B.markEl=B.els[j];
  }
}

/* ── reading the fields back ─────────────────────────────────── */
function bqSync(){
  var f,i;
  for(i=0;i<B.els.length;i++){
    if((f=document.getElementById("be"+i))) B.ecell[i]=f.value;
    if((f=document.getElementById("br"+i))) B.rcell[i]=f.value;
    if((f=document.getElementById("bp"+i))) B.pcell[i]=f.value;
  }
  for(i=0;i<B.coef.length;i++)
    if((f=document.getElementById("bc"+i))) B.coef[i]=f.value;
}

function bqCheck(){
  if(isPP()) return ppCheck();
  bqSync();
  if(!readyToCheck()) return;       /* nothing until every box has something in it */
  B.bad={}; B.hint=null; B.tip=null; B.tipEl=null; B.unbal=[]; B.ok=false;

  /* every element at once; any order, as long as each is really in there */
  if(B.phase==="elements"){
    var grp=groupsOf(B.eq), all=B.eq.r.concat(B.eq.p);
    /* a whole ion is matched ignoring case, then the capitals are checked */
    function asIon(raw){
      var lo=raw.toLowerCase();
      for(var k=0;k<POLY.length;k++) if(POLY[k][0].toLowerCase()===lo) return POLY[k][0];
      return null;
    }
    var norm=B.ecell.map(function(v){ v=plainDigits((v||"").trim()).replace(/\s+/g,"");
      return asIon(v) || v.charAt(0).toUpperCase()+v.slice(1).toLowerCase(); });
    var seen=[], msgs=[], stray=false, efault="";
    B.ecell.forEach(function(v,i){
      var raw=plainDigits((v||"").trim()).replace(/\s+/g,""), g=norm[i], msg=null;
      var ion=asIon(raw);
      if(ion && grp.indexOf(ion)<0)
        msg=all.some(function(f){ return polyAt(f,ion)>=0; })
          ? "<b>"+keyHTML(ion)+"</b> is only on one side of this equation, so list its "+
            "elements one at a time."
          : "<b>"+esc(raw)+"</b> is not in this equation.";
      else if(!ion && /\d/.test(raw))
        msg=grp.length ? "This column takes element symbols and polyatomic ions, not numbers."
                       : "This column takes element symbols, not numbers.";
      else if(!ion && B.els.indexOf(g)<0 &&
              grp.some(function(p){ return unitsOf(p,[]).hasOwnProperty(g); }) &&
              all.some(function(f){ return atoms(f)[g]; }))
        msg="<b>"+esc(g)+"</b> is part of a polyatomic ion that appears on both sides. "+
            "List the whole ion in one box.";
      else if(B.els.indexOf(g)<0){ msg="<b>"+esc(raw)+"</b> is not in this equation."; stray=true; }
      else if(ion && raw!==g) msg="Check the capitals — <b>"+keyHTML(g)+"</b>, not <b>"+
        esc(raw)+"</b>.";
      else if(raw!==g) msg="Check the capitals. A symbol starts with a capital letter, and a "+
        "second letter is always lowercase — <b>"+esc(g)+"</b>, not <b>"+esc(raw)+"</b>.";
      else if(seen.indexOf(g)>=0) msg="<b>"+keyHTML(g)+"</b> is already listed. Find a different one.";
      else seen.push(g);
      if(msg){ B.bad["e"+i]=true; if(msgs.indexOf(msg)<0) msgs.push(msg);
        if(!efault) efault = /capitals/.test(msg) ? "caps" : /not in this equation/.test(msg) ? "notin"
          : /already listed/.test(msg) ? "dup" : /polyatomic|one side/.test(msg) ? "polyrow" : "other"; }
    });
    var edet=B.ecell.map(function(v,i){ return {l:(v||"").trim()||"(blank)", k:!B.bad["e"+i]}; });
    logAttempt("elements", eqText(B.eq), B.ecell.map(function(v){ return (v||"").trim(); }).join(", "),
      !msgs.length, efault, bqTry("elements"), edet.length>1?detailStr(edet):null);
    if(msgs.length){
      B.misses++;
      B.hint=msgs.join(" ")+(stray?" Read the symbols in the formulas.":"");
    } else {
      B.els=norm;                    /* the rows keep the order they chose */
      B.phase="counts"; B.focusK=null; B.ok=true;
    }
    bqRender(); return;
  }

  /* the whole table, or every boxed row, at once */
  if(B.phase==="counts"||B.phase==="recount"){
    var wrong=openCells().filter(function(k){
      var at=cellAt(k); return +cellVal(k)!==liveCount(at.i,at.side); });
    B.justStale=false;
    var cdet=openCells().map(function(k){ var a=cellAt(k);
      return {l:eName(B.els[a.i])+" "+(a.side==="r"?"left":"right"), k:+cellVal(k)===liveCount(a.i,a.side)}; });
    logAttempt("counts", eqText(B.eq), wrong.map(function(k){ var a=cellAt(k);
        return B.els[a.i]+(a.side==="r"?" left ":" right ")+cellVal(k); }).join(", "),
      !wrong.length, wrong.length?"count":"", bqTry("counts"), cdet.length>1?detailStr(cdet):null);
    if(!wrong.length){ B.phase="balance"; B.stale=[]; B.focusK=null; B.ok=true; }
    else {
      wrong.forEach(function(k){ var at=cellAt(k); B.bad[at.side+at.i]=true; });
      B.misses++;
      var w=cellAt(wrong[0]);
      B.hint = wrong.length===1
        ? "Not quite. Count <b>"+esc(eName(B.els[w.i]))+"</b> again on the "+
          '<b class="side">'+(w.side==="r"?"reactant":"product")+"</b> side."
        : "Not quite. Count the red boxes again.";
    }
    bqRender(); return;
  }

  /* balancing — any number of coefficients per check */
  var c=coefVals(), i2, fault=null, changed=[];
  for(i2=0;i2<B.coef.length;i2++)
    if((B.coef[i2]||"").trim()!==((B.committed||[])[i2]||"").trim()) changed.push(i2);
  if(!changed.length && !allMatched()){
    B.hint="Change a coefficient, then check.";
    bqRender(); return;
  }

  for(i2=0;i2<c.length;i2++){
    if((B.coef[i2]||"").trim()==="1"){ B.bad["c"+i2]=true; fault="one"; }
    else if(c[i2]===0){ B.bad["c"+i2]=true; fault=fault||"nan"; }
  }
  var ctyped=coefText(B.eq, B.coef);
  var ball=B.eq.r.concat(B.eq.p);
  var bdet=B.coef.map(function(v,i){ return {l:ball[i], k:!B.bad["c"+i]}; });
  if(fault) logAttempt("balance", eqText(B.eq), ctyped, false, fault, bqTry("balance"), bdet.length>1?detailStr(bdet):null);
  if(fault==="one"){
    B.hint="A coefficient of <b>1</b> is never written. Leave that space blank.";
    B.misses++; bqRender(); return;
  }
  if(fault==="nan"){
    B.hint="A coefficient has to be a whole number.";
    B.misses++; bqRender(); return;
  }
  B.committed=B.coef.slice();
  var g2=c.reduce(function(a,b){return gcd(a,b);});
  if(g2>1 && allMatched()){
    logAttempt("balance", eqText(B.eq), ctyped, false, "reduce", bqTry("balance"));
    B.hint="Both sides match, but every coefficient can be divided by <b>"+g2+
           "</b>. Coefficients must be the smallest whole numbers that work.";
    B.misses++; bqRender(); return;
  }
  if(manual()){
    var st=staleCells();
    if(st.length){
      /* their table no longer describes the equation — wipe those cells */
      st.forEach(function(kk){
        var a2=cellAt(kk);
        if(a2.side==="r") B.rcell[a2.i]=""; else B.pcell[a2.i]="";
      });
      B.stale=st; B.phase="recount"; B.justStale=true;
      bqRender(); return;
    }
  }
  var rdet=B.els.map(function(e,i){ return {l:eName(e), k:rowMatched(i)}; });
  if(!allMatched()) logAttempt("balance", eqText(B.eq), ctyped, false,
    "unbal:"+B.els.filter(function(e,i){ return !rowMatched(i); }).join(","), bqTry("balance"),
    rdet.length>1?detailStr(rdet):null);
  if(!allMatched() && freeLevel()){
    B.unbal=B.els.filter(function(e,i){ return !rowMatched(i); });
    B.hint="Not balanced yet.";
    B.misses++; bqRender(); return;
  }
  if(!allMatched()){
    B.hint="Not yet — the red rows still have different numbers on each side.";
    B.misses++; bqRender(); return;
  }

  logAttempt("balance", eqText(B.eq), ctyped, true, "", bqTry("balance"),
    B.els.length>1?detailStr(B.els.map(function(e){ return {l:eName(e), k:true}; })):null);
  B.phase="done";
  noteSolved(!B.misses);
  if(PUZZLE) B.earned = pzEarn() ? "full" : "one";
  track(actId(), B.misses===0);
  bqRender();
}

/* ── moving between levels and sets ──────────────────────────── */
function goLevel(i){
  if(i>L.unlocked) return;
  L.level=i; L.good=0;
  bqNew();
}
function afterSolve(){ B.offerUp=false; bqNew(); }
/* 3. start over the part they are on — the elements, the counts or the
   coefficients — never the whole equation (24 Sept). Misses already made
   still count; starting over clears the mess, not the record. Their own
   table at the upper levels is theirs and is left alone. */
function startOver(){
  if(isPP()) return ppRestartPart();
  var blank=function(){ return B.els.map(function(){return "";}); };
  if(B.phase==="elements") B.ecell=blank();
  else if(B.phase==="counts"||B.phase==="recount"){ B.rcell=blank(); B.pcell=blank(); B.focusK=null; }
  else if(B.phase==="balance"){
    B.coef=B.eq.r.concat(B.eq.p).map(function(){return "";});
    B.committed=B.coef.slice(); B.unbal=[];
  }
  B.bad={}; B.hint=null; B.tip=null; B.tipEl=null; B.ok=false;
  bqRender();
}

document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-b]");
  if(!t || t.disabled) return;
  var d=t.dataset.b;
  if(d==="next") afterSolve();
  else if(d==="levelup"){ B.offerUp=false; goLevel(L.level+1); }
  else if(d==="staylevel"){ L.good=0; afterSolve(); }
  else if(d==="gotpoly"){ L.intro.poly="seen"; bqRender(); }
  else if(d==="hint" && isPP()) ppHint();
  else if(d==="hint"){ B.unbal=[]; B.tip=hintText(); bqRender(); }
  else if(d==="table"){ bqSync(); setShowTable(!L.showTable); bqRender(); }
  else if(d==="tips"){ L.tips=true; bqRender(); }
  else if(d==="closetips"){ L.tips=false; bqRender(); }
  else if(d==="restart") startOver();
  else if(d==="pznext") pzNext();
  else bqCheck();
});
/* the counts follow the coefficients as they are typed, without a
   redraw that would cost the caret */
document.addEventListener("input",function(ev){
  var m=/^b([erp])(\d+)$/.exec(ev.target.id||"");
  if(m){
    if(m[1]==="e" && /\d/.test(ev.target.value)){
      var el=ev.target, pos=el.selectionStart;
      el.value=toSubs(el.value); el.setSelectionRange(pos,pos);
    }
    (m[1]==="e"?B.ecell:m[1]==="r"?B.rcell:B.pcell)[+m[2]]=ev.target.value;
    var btn=document.querySelector('.check[data-b="go"]');
    if(btn) btn.disabled=!readyToCheck();
    return;
  }
  var ft=/^f([erp])(\d+)$/.exec(ev.target.id||"");
  if(ft && B.ft && !isPP()){      /* their own table: kept, never judged */
    if(ft[1]==="e" && /\d/.test(ev.target.value)){
      var fe=ev.target, fpos=fe.selectionStart;
      fe.value=toSubs(fe.value); fe.setSelectionRange(fpos,fpos);
    }
    B.ft[ft[1]][+ft[2]]=ev.target.value;
    return;
  }
  if(!/^bc\d+$/.test(ev.target.id||"") || B.phase!=="balance") return;
  B.coef[+ev.target.id.slice(2)]=ev.target.value;
  if(freeLevel()) return;   /* nothing in their table updates itself */
  if(manual()) return;      /* above this level the student keeps the table */
  var rows=document.querySelectorAll(".erp tbody tr");
  B.els.forEach(function(el,i){
    if(!rows[i]) return;
    var m=rowMatched(i), cells=rows[i].querySelectorAll(".live");
    rows[i].classList.toggle("matched",m);
    if(cells[0]){ cells[0].textContent=liveCount(i,"r");
      cells[0].className="live "+(m?"match":"miss"); }
    if(cells[1]){ cells[1].textContent=liveCount(i,"p");
      cells[1].className="live "+(m?"match":"miss"); }
  });
});
/* leaving a coefficient box clears the counts it changed, and the student
   updates them before going on (intermediate and advanced) */
document.addEventListener("change",function(ev){
  if(!/^bc\d+$/.test(ev.target.id||"") || !manual()) return;
  if(B.phase!=="balance" && B.phase!=="recount") return;
  bqSync();
  /* not a whole number yet: leave the table alone, Check will say what is wrong */
  if(B.coef.some(function(v){ return !/^\d*$/.test((v||"").trim()); })) return;
  var st=staleCells();
  if(!st.length) return;
  st.forEach(function(k){
    var a=cellAt(k);
    if(a.side==="r") B.rcell[a.i]=""; else B.pcell[a.i]="";
  });
  B.stale=st; B.phase="recount"; B.justStale=true; B.bad={}; B.hint=null; B.ok=false;
  bqRender();
});
/* moving into a count box points the equation at that element */
document.addEventListener("focusin",function(ev){
  var m=/^b([rp])(\d+)$/.exec(ev.target.id||"");
  if(!m || (B.phase!=="counts" && B.phase!=="recount")) return;
  B.focusK=+m[2]*2+(m[1]==="r"?0:1);
  if(B.phase!=="counts" || noPointers()) return;
  setMark();
  var box=document.querySelector(".eqbox"); if(box){ box.innerHTML=eqHTML(); fitEq(); }
});
document.addEventListener("keydown",function(ev){
  if(ev.key!=="Enter" || document.getElementById("app").hidden) return;
  ev.preventDefault();
  if(L.tips){ L.tips=false; bqRender(); return; }
  if(L.level===null) return;   /* the menu: nothing to check yet */
  if(L.intro.poly==="show"){ L.intro.poly="seen"; bqRender(); return; }
  /* a question on screen waits for a button, not Enter */
  if(B.offerUp && (isPP()?P.phase:B.phase)==="done") return;
  /* Enter in their own table moves along it rather than checking */
  if(/^f[erp]\d+$/.test(ev.target.id||"")){
    var fb=[].slice.call(document.querySelectorAll(".erp.free input")), fi=fb.indexOf(ev.target);
    if(fi>=0 && fi<fb.length-1){ fb[fi+1].focus(); fb[fi+1].select(); }
    return;
  }
  if(/^b[erp]\d+$/.test(ev.target.id||"") && !readyToCheck()){
    var boxes=[].slice.call(document.querySelectorAll(".erp input")),
        at=boxes.indexOf(ev.target), n=boxes.length, j;
    for(j=1;j<=n;j++){ var x=boxes[(at+j)%n];
      if(B.phase==="elements" ? !x.value.trim() : !/^\d+$/.test(x.value.trim())){
        x.focus(); x.select(); return; } }
    return;
  }
  (isPP()?P.phase:B.phase)==="done" ? afterSolve() : bqCheck();
});

gateSetup();
</script>
