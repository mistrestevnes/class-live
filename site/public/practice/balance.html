<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Balancing · Class Live</title>
<style>
  :root{
    --bg:#f4f2ec; --panel:#ffffff; --line:#12120f; --soft:#c9c5ba;
    --text:#101010; --muted:#454239;
    --mark:#c2410c; --faint:#8a857a; --soft2:#e9e5da;
    --badbg:#ffecef; --badln:#f2a6a0; --goodbg:#e8f5ec; --warnbg:#fff3e8; --warnln:#fbd9bf;
    --bluebg:#e3edfb; --blueln:#bfe0f0; --blue:#0b4fa8;
    --good:#0a6b34; --bad:#b00018; --note:#7a4c00; --mark:#c2410c; 
    --font: ui-rounded, 'SF Pro Rounded', 'Segoe UI Variable', 'Segoe UI', system-ui, sans-serif;
    --mono: 'Courier New', Courier, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--text);font-family:var(--font);
    padding:44px 16px 28px;-webkit-font-smoothing:antialiased}
  .wrap{max-width:940px;margin:0 auto;text-align:center}
  sub{font-size:.6em;line-height:0}

  h1{font-size:30px;font-weight:800;margin:0 0 14px}


  /* ── sign in ─────────────────────────────────────────────────── */
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;
    align-items:center;justify-content:center;z-index:50;padding:20px}
  #gate[hidden]{display:none}   /* display:flex would beat the attribute */
  .gatebox{background:var(--panel);border:3px solid var(--line);border-radius:20px;
    padding:32px 28px;max-width:460px;width:100%;text-align:center}
  .gatebox h2{margin:0 0 6px;font-size:27px;font-weight:800}
  .gatelede{margin:0 0 22px;font-size:17px;color:var(--muted);line-height:1.45;font-weight:600}
  .gatenum{font-family:var(--mono);font-size:46px;font-weight:700;width:7.5ch;max-width:100%;
    text-align:center;letter-spacing:.06em;color:var(--text);background:var(--panel);
    border:3px solid var(--line);border-radius:14px;padding:8px 6px;vertical-align:middle}
  .gatenum:focus{outline:3px solid var(--note);outline-offset:2px}
  .gatenum::placeholder{color:var(--soft);font-size:22px}
  #gateAsk{display:flex;gap:12px;align-items:center;justify-content:center}
  #gateAsk .check{margin-top:0}
  .gatename{font-size:30px;font-weight:800;margin:4px 0 20px}
  .gatebtns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .gatebtns .check{margin-top:0}
  .gatemsg{margin:16px auto 0;font-size:15.5px;line-height:1.45;color:var(--bad);
    font-weight:700;min-height:1.4em;max-width:34ch}
  .linkbtn{margin-top:14px;background:none;border:none;color:var(--muted);
    font:700 14px var(--font);text-decoration:underline;cursor:pointer}
  .linkbtn:hover{color:var(--text)}
  .build{position:fixed;right:8px;bottom:6px;font:700 11px var(--mono);
    color:var(--muted);opacity:.5}
  .gatebuild{position:static;margin:14px 0 0;text-align:center}

  /* ── buttons ─────────────────────────────────────────────────── */
  .check{margin-top:24px;background:var(--line);color:var(--panel);border:3px solid var(--line);
    border-radius:13px;padding:15px 40px;font:800 22px var(--font);cursor:pointer}
  .check:hover{background:var(--text);border-color:var(--text)}
  .check.ghostbtn{background:transparent;color:var(--text)}
  .check.ghostbtn:hover{background:var(--soft);border-color:var(--line)}
  .check:disabled,.check:disabled:hover{opacity:.35;cursor:default;
    background:var(--line);border-color:var(--line)}

  /* ── the equation ────────────────────────────────────────────── */
  .eqbox{background:var(--panel);border:3px solid var(--line);border-radius:18px;
    padding:20px 18px;margin:0 auto 20px;max-width:720px}
  /* one line always — the size steps down rather than the equation wrapping */
  .eqbox{overflow:hidden}      /* fitEq() shrinks it to fit, so nothing scrolls */
  .eq{display:flex;flex-wrap:nowrap;gap:6px 10px;align-items:center;
    justify-content:center;white-space:nowrap;
    font-family:var(--mono);font-size:52px;font-weight:700;line-height:1.3;
    letter-spacing:1px}
  .eq.s1{font-size:44px}
  .eq.s2{font-size:37px;letter-spacing:0}
  .eq.s3{font-size:31px;letter-spacing:0;gap:4px 6px}
  .eq.s1 .coef{font-size:44px;min-width:48px;height:56px}
  .eq.s2 .coef{font-size:37px;min-width:40px;height:48px;border-bottom-width:5px}
  .eq.s3 .coef{font-size:31px;min-width:34px;height:42px;border-bottom-width:5px}
  .eq .plus,.eq .arrow{font-weight:700;padding:0 4px}
  .term{display:inline-flex;align-items:baseline;gap:4px}
  /* while counting, the element being counted is boxed where it appears —
     the prompt says which element, this says where to look for it */
  .eq .mark{outline:4px solid var(--mark);outline-offset:3px;border-radius:7px}
  /* the number outside parentheses, on the intro screen that explains it */
  .exf .multi{outline:3px dashed var(--mark);outline-offset:3px;
    border-radius:5px;color:var(--mark)}
  /* a coefficient is written on a line, not in a box */
  .coef{width:2ch;min-width:58px;height:64px;text-align:center;
    font:700 52px var(--mono);color:var(--text);background:transparent;
    border:none;border-bottom:6px solid var(--line);border-radius:0;padding:0 2px}
  .coef:focus{outline:none;border-bottom-color:var(--mark);background:var(--warnbg)}
  .coef.bad{border-bottom-color:var(--bad);background:var(--badbg)}
  /* balanced: the coefficients and the number words that match them (24 Sept) */
  .coef.solved{color:var(--good);border-bottom-color:var(--good)}
  .meaning{margin:10px 0 16px;font:600 20px var(--font);line-height:1.5}
  .meaning .mnum{font-weight:800;color:var(--good)}

  /* ── table on the left, prompts beside it on the right ───────── */
  .workrow{display:flex;gap:24px;align-items:center;justify-content:flex-start;
    max-width:720px;margin:0 auto}
  .guide{flex:1 1 auto;text-align:left;min-width:0}
  .guide .check{margin-top:18px}
  .lead{margin:0;font-size:24px;font-weight:700;line-height:1.38}
  .lead b{font-weight:800}
  .lead .side,.hint .side{color:var(--blue);font-weight:800}
  .btnrow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .btnrow .check{margin-top:18px}
  .btnrow .ghostbtn{padding:15px 26px}
  .tip{margin:14px 0 0;padding:12px 14px;background:var(--warnbg);
    border-left:6px solid var(--mark);border-radius:0 10px 10px 0;
    font-size:18px;font-weight:600;line-height:1.45}
  .tip b{font-weight:800}
  .tip .mono{font-family:var(--mono)}
  .lead .warn{color:var(--mark);font-weight:800}
  .win .offer{font-size:18px;font-weight:700;line-height:1.45;color:var(--text);
    margin:10px auto 4px;max-width:34ch}
  .guide .linkbtn{margin-top:12px;display:block}
  .counter .linkbtn{margin:0 0 0 4px;font-size:13.5px;font-family:var(--font)}
  .hint{margin:12px 0 0;font-size:20px;font-weight:700;line-height:1.4;
    color:var(--bad)}
  .hint.blank{display:none}
  .erpwrap{flex:0 0 auto}

  /* ── the ERP table ───────────────────────────────────────────── */
  .erp{border-collapse:separate;border-spacing:0;background:var(--panel);
    border:3px solid var(--line);border-radius:14px;overflow:hidden}
  .erp th{font:800 14px var(--font);letter-spacing:.07em;text-transform:uppercase;
    color:var(--text);padding:9px 8px;background:var(--soft);
    border-bottom:3px solid var(--line);white-space:nowrap}
  .erp td{padding:7px 8px;border-bottom:2px solid var(--soft)}
  /* what went out of date when a coefficient changed, and has to be counted
     again */
  .erp td.restale > *{outline:3px solid var(--bad);outline-offset:3px;
    border-radius:8px}
  .erp td.restale .waiting{color:var(--bad);opacity:1}
  .erp tr:last-child td{border-bottom:none}
  .erp td.ecell,.erp th:first-child{width:104px}
  /* a whole ion in the first column (ClO4) needs more room than a symbol */
  .erp.wide td.ecell,.erp.wide th:first-child{width:150px}
  .erp td.ncell,.erp th:not(:first-child){width:112px}
  .erp input{width:100%;height:66px;text-align:center;background:var(--panel);
    border:3px solid var(--line);border-radius:10px;color:var(--text);
    font:700 42px var(--mono);padding:0}
  .erp input:focus{outline:4px solid var(--mark);outline-offset:2px}
  .erp input::placeholder{color:var(--soft)}
  .erp input.bad{border-color:var(--bad);background:var(--badbg)}
  .erp .elock{font:700 46px var(--mono);text-align:center;line-height:1.35}
  .erp .fixed{font:700 42px var(--mono);text-align:center;line-height:1.55}
  .erp .waiting{font:700 42px var(--mono);text-align:center;color:var(--soft);line-height:1.55}
  /* live counts: colour is the whole signal once balancing starts */
  .erp .live{font:800 44px var(--mono);text-align:center;line-height:1.5;
    transition:color .18s}
  .erp .live.match{color:var(--good)}
  .erp .live.miss{color:var(--bad)}
  .erp tr.row.matched td{background:var(--goodbg)}

  .counter{margin:26px 0 0;font:700 15px var(--mono);color:var(--muted)}
  .counter b{color:var(--text)}

  .win{background:var(--panel);border:3px solid var(--good);border-radius:16px;
    padding:16px 20px;margin:0;animation:pop .3s;text-align:center}
  .win .f{font-size:28px;font-weight:800;color:var(--good)}
  .win .earned{margin:6px 0 0;font-size:17px;font-weight:700;color:var(--mark)}
  .setwin{max-width:520px;margin:0 auto}

  /* ── the walkthrough that opens the advanced level ───────────── */
  .intro{background:var(--panel);border:3px solid var(--line);border-radius:18px;
    padding:24px 26px;max-width:620px;margin:0 auto;text-align:left}
  .intro h2{margin:0 0 10px;font-size:26px;font-weight:800}
  .intro p{margin:0 0 14px;font-size:19px;font-weight:600;line-height:1.45}
  .exbox{text-align:center;margin:18px 0}
  .exf{font:700 54px var(--mono);letter-spacing:1px}
  .extab{margin:0 auto 16px;border-collapse:collapse;font-size:20px;font-weight:700}
  .extab td{padding:7px 16px;border-bottom:2px solid var(--soft)}
  .extab td:first-child{width:80px}
  .extab td:first-child{font-family:var(--mono);font-size:24px;text-align:right}
  .extab tr:last-child td{border-bottom:none}
  .exwarn{font-weight:800}
  .intro .check{display:block;margin:20px auto 0}
  .tipbox{max-width:660px}
  .tiplist{margin:0;padding-left:26px}
  .tiplist li{font-size:18px;font-weight:600;line-height:1.45;margin-bottom:11px}
  .tiplist .mono{font-family:var(--mono)}
  @keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
  .win button{margin-top:14px;background:var(--line);color:var(--panel);border:3px solid var(--line);
    border-radius:12px;padding:13px 30px;font:800 19px var(--font);cursor:pointer}

  /* ── the picture that fills in as equations are finished ─────── */
  .reward{margin:28px auto 0;max-width:320px}
  .pzhead{font:800 15px var(--font);color:var(--muted);margin:0 0 8px}
  .pzhead b{color:var(--text)}
  .pzwrap{position:relative;width:288px;height:288px;margin:0 auto;
    border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
  .pzart{position:absolute;inset:0}
  .pzart svg{width:100%;height:100%;display:block}
  .pztile{position:absolute;background:var(--soft);
    box-shadow:inset 0 0 0 1px var(--bg);
    transition:opacity .5s ease,transform .5s ease}
  .pztile.gone{opacity:0;transform:scale(.7)}
  .pzdone{margin:10px 0 0;font:800 17px var(--font);color:var(--good)}
  .pzdone button{margin-top:8px;background:var(--line);color:var(--panel);
    border:3px solid var(--line);border-radius:11px;padding:9px 20px;
    font:800 15px var(--font);cursor:pointer}


  @media (max-width:760px){
    .workrow{flex-direction:column;gap:16px;align-items:center}
    .guide{text-align:center;flex:1 1 100%}
  }
  @media (max-width:620px){
    body{padding-top:62px}   /* the name pill wraps to two lines down here */
    .eq{font-size:38px}
    .coef{min-width:44px;height:48px;font-size:38px;border-bottom-width:5px}
    .lead{font-size:21px} .hint{font-size:18px}
    .erp td.ecell,.erp th:first-child{width:82px}
    .erp.wide td.ecell,.erp.wide th:first-child{width:118px}
    .erp td.ncell,.erp th:not(:first-child){width:88px}
    .erp input{height:56px;font-size:34px}
    .erp .elock{font-size:36px} .erp .fixed,.erp .waiting{font-size:34px}
    .erp .live{font-size:36px}
  }
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .build,.gatebuild{display:none!important}
</style>
<script src="/practice/theme.js"></script>
</head>
<body>

<div id="gate">
  <div class="gatebox">
    <h2>Class Live</h2>
    <p class="gatelede" id="gateLede">Type your class number to begin.</p>

    <div id="gateAsk">
      <input id="gateNum" class="gatenum" inputmode="numeric" autocomplete="off"
             maxlength="12" aria-label="Class number" placeholder="number">
      <button class="check" id="gateGo">Go</button>
    </div>

    <div id="gateConfirm" hidden>
      <div class="gatename" id="gateName"></div>
      <div class="gatebtns">
        <button class="check" id="gateYes">Yes, that's me</button>
        <button class="check ghostbtn" id="gateNo">No, go back</button>
      </div>
    </div>

    <p class="gatemsg" id="gateMsg"></p>
    <button class="linkbtn" id="gateSkip">Just practice — don't record my work</button>
    <p class="build gatebuild">build 3.17</p>
  </div>
</div>

<div id="cwtop"></div>
<div class="wrap" id="app" hidden>
  <div class="build">build 3.17</div>
  <div id="sec"></div>
</div>

<style>
  /* ── predicting products ─────────────────────────────────────── */
  .eqbox.ppwork{padding-bottom:62px}   /* room for the steppers under the boxes */
  .ppcomp{display:inline-flex;gap:8px;align-items:center}
  .ppslot{position:relative;display:inline-flex}
  .ppbox{min-width:84px;height:74px;padding:0 8px;display:inline-flex;align-items:center;
    justify-content:center;border:4px dashed var(--soft);border-radius:12px;
    background:var(--soft2);cursor:pointer;touch-action:none}
  .ppbox.full{border-style:solid;border-color:var(--line);background:var(--panel)}
  .ppbox.target{border-color:var(--mark)}
  .ppbox.over{border-color:var(--mark);border-style:solid;background:var(--warnbg)}
  .ppbox.bad{border-color:var(--bad);border-style:solid;background:var(--badbg)}
  .ppstep{position:absolute;top:100%;left:50%;transform:translateX(-50%);
    margin-top:8px;display:flex;gap:6px}
  .ppstep.off{visibility:hidden}
  .ppstep button{width:36px;height:36px;padding:0;border:3px solid var(--line);
    border-radius:9px;background:var(--panel);color:var(--text);
    font:800 22px/1 var(--font);cursor:pointer}
  .ppstep button:disabled{opacity:.3;cursor:default}
  .pptray{display:flex;gap:16px;justify-content:center;flex-wrap:wrap;margin:24px auto 22px}
  .pppc sup,.pptile sup{font-size:.5em;line-height:0}
  /* the charge is grayed so it never reads as part of the formula */
  .ppq{color:var(--faint);font-weight:600}
  .pptile{display:inline-flex;align-items:center;gap:12px;min-width:96px;padding:10px 20px;background:var(--panel);color:var(--text);
    border:3px solid var(--line);border-radius:14px;font:700 44px var(--mono);
    cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
  .pptile.setting{cursor:default;padding-right:10px}
  .pptile.bad{border-color:var(--bad);background:var(--badbg)}
  .ppchg{display:flex;flex-direction:column;gap:4px}
  .ppchg button{width:40px;height:30px;padding:0;border:3px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--text);font:800 15px/1 var(--font);cursor:pointer}
  .ppchg button:disabled{opacity:.3;cursor:default}
  .pptile.sel{border-color:var(--mark);box-shadow:0 0 0 5px var(--warnln)}
  .pptile.used{opacity:.2;cursor:default}
  .pptile.lifted{opacity:.35}
  .ppghost{position:fixed;z-index:60;pointer-events:none;transform:translate(-50%,-50%);
    box-shadow:0 8px 20px rgba(0,0,0,.25)}
  .ppguide{max-width:720px;margin:0 auto}
  .ppsym{width:3.2em;height:58px;margin:0 4px;text-align:center;vertical-align:middle;
    font:700 34px var(--mono);color:var(--text);background:var(--panel);
    border:3px solid var(--line);border-radius:10px}
  .ppsym:focus{outline:4px solid var(--mark);outline-offset:2px}
  .ppsym.bad{border-color:var(--bad);background:var(--badbg)}
  .ppguide .btnrow,.bottomrow .btnrow{justify-content:center}
  .bottomrow{margin:6px 0 0}
  .linkrow{display:flex;gap:22px;justify-content:center}
  .linkrow .linkbtn{margin-top:10px}
  .okmsg{margin:0 0 10px;font:800 28px var(--font);color:var(--good)}
  .ppnote{margin:0 0 12px;font-size:24px;font-weight:800}
  .eq .unbal{outline:4px solid var(--bad);outline-offset:3px;border-radius:7px}
  /* from names: the reactant names in the equation, and the boxes under it */
  .eq .pnword{font:700 .62em var(--font);white-space:nowrap}
  .eq .pnq{color:var(--faint)}
  .pncards{display:flex;flex-direction:column;gap:18px;margin:18px 0 4px}
  .pncard{border:3px solid var(--line);border-radius:14px;background:var(--soft2);padding:14px 16px}
  .pnions{display:flex;gap:14px 26px;flex-wrap:wrap;justify-content:center}
  .pnion{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pnlab{font-size:20px;font-weight:700;min-width:6.2em}
  .pnsym,.pnchg{height:58px;text-align:center;font:700 32px var(--mono);color:var(--text);
    background:var(--panel);border:3px solid var(--line);border-radius:10px}
  .pnsym{width:3.4em} .pnchg{width:2.8em}
  .pnsym::placeholder,.pnchg::placeholder{font:500 15px var(--font);color:var(--faint)}
  .pnsym:focus,.pnchg:focus,.pncards .finput:focus{outline:4px solid var(--mark);outline-offset:2px}
  .pnsym:disabled,.pnchg:disabled{background:var(--panel);border-style:dashed;color:var(--text);opacity:1}
  .pnsym.bad,.pnchg.bad,.pncards .finput.bad{border-color:var(--bad);background:var(--badbg)}
  .pnfrow{display:flex;align-items:center;gap:8px;margin-top:14px;justify-content:center;flex-wrap:wrap}
  .pncards .finput{min-width:7em;min-height:62px;padding:4px 14px;font:700 38px/1.3 var(--mono);
    color:var(--text);background:var(--panel);border:3px solid var(--line);border-radius:10px;text-align:left}
  .pncards .finput.sym{min-width:4em}
  .pncards .finput.sym:empty:before{content:"type the symbol";font:500 15px var(--font);color:var(--faint)}
  .pncards .finput:not(.sym):empty:before{content:"type the formula";font:500 15px var(--font);color:var(--faint)}
  .pncards .finput sub{font-size:.58em;line-height:1}
  .pnend{color:var(--bad)}
  @media (max-width:620px){
    .pptile{font-size:34px;min-width:78px;padding:8px 14px}
    .ppnote{font-size:21px}
    .pnsym,.pnchg{font-size:26px;height:50px} .pncards .finput{font-size:30px}
  }
</style>
<script>
/* ═══════════════════════════════════════════════════════════════
   STUDENT SIGN-IN AND TRACKING
   Shares the class list and the Worker with the ionic page, so a
   student's number is the same one they already use.
   ═══════════════════════════════════════════════════════════════ */
/* ── the tracking switch ────────────────────────────────────────
   false: no sign-in screen, no class numbers, nothing sent anywhere.
   Set it back to true to turn the roster and the dashboard back on. */
var TRACKING = false;

var API=(window.ION_API||"/api").replace(/\/+$/,""), QKEY="ionq", ST={n:null,name:null,off:false};

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");}
/* A class number: digits only, short ones padded to three so an old
   three-digit roster still works, longer ones kept whole. The Worker does
   exactly the same, so the two always agree. */
function normNum(raw){
  var d=String(raw==null?"":raw).replace(/\D/g,"");
  if(!d || d.length>12) return "";
  return d.length<3 ? ("00"+d).slice(-3) : d;
}
function tqRead(){ try{ return JSON.parse(localStorage.getItem(QKEY)||"[]"); }catch(e){ return []; } }
function tqWrite(q){ try{ localStorage.setItem(QKEY,JSON.stringify(q.slice(-400))); }catch(e){} }

function track(activity, clean){
  if(!TRACKING || !ST.n) return;
  var q=tqRead();
  q.push({n:ST.n, a:activity, c:clean?1:0, t:Date.now()});
  tqWrite(q);
  ASG.forEach(function(x){ if(x.a===activity) x.k++; });
  asgNow();
}

/* ── assignments (24 Sept) ──────────────────────────────────────
   Read once after sign-in. The server sends the finishes it already has;
   finishes still waiting in the queue here are added on top, and every
   finish from now on adds one as it happens. */
var ASG=[];
function loadAssigned(then){
  if(!TRACKING || !ST.n) return then();
  /* the queue as it stands now; nothing is posted until the reply is in, so
     the server's count and this queue never overlap */
  var q=tqRead();
  fetch(API+"/assigned?n="+ST.n)
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(d){
      ASG=(d.list||[]).map(function(x){
        var ts=x.ts||[];
        x.k=ts.length;
        /* a finish still queued here counts unless the server already has
           it — a page closed mid-post leaves it in both places */
        q.forEach(function(e){
          if(e.n===ST.n && e.a===x.a && e.t>=x.c && ts.indexOf(e.t)<0) x.k++; });
        delete x.ts;
        return x;
      });
      if(L.level===null) menuOnly();
      else{   /* arrived from the dashboard before the list came back: just the counter */

/* Every check, with what went wrong (23 Sept) — the same record Ion
   Workshop keeps, posted to /api/attempt. Cloudflare's free plan counts
   writes, and each post is one write per student, so nothing goes out per
   check: both queues go together every FLUSH_MS, and when the page is left. */
var LKEY="ballog", FLUSH_MS=120000, lflushing=false;
function lqRead(){ try{ return JSON.parse(localStorage.getItem(LKEY)||"[]"); }catch(e){ return []; } }
function lqWrite(q){ try{ localStorage.setItem(LKEY,JSON.stringify(q.slice(-1500))); }catch(e){} }
/* the Worker takes 200 at a time; anything over goes in the next post */
var POST_MAX=200;
/* the results id for where the student is: bal_sr2, bal_pp1, bal_pn1 ... */
function actId(){
  var t=L.type;
  if(L.src==="n") t = t==="pp" ? "pn" : "pdn";
  return "bal_"+t+(L.level+1);
}
/* detail (24 Sept): for a check with more than one part, which parts were
   right and which were wrong, so the dashboard can colour each one rather
   than the whole answer. "label=1|label=0|..."; built with detailStr(). */
/* topics (optional): which practice topics this check counts toward on the
   student's progress page — "C1,P0,M" = charges missed, polyatomic ion
   right, and the missed charge was a multivalent metal's */
function logAttempt(step, asked, typed, ok, fault, tryNo, detail, topics){
  if(!TRACKING || !ST.n) return;
  var q=lqRead();
  var row={n:ST.n, a:actId(), s:step, p:String(asked).slice(0,60),
          y:String(typed).slice(0,40), k:ok?1:0, f:fault||"", r:tryNo||1, t:Date.now()};
  if(detail) row.d=String(detail).slice(0,180);
  if(topics) row.g=String(topics).slice(0,20);
  q.push(row);
  lqWrite(q);
}
/* build a detail string from [{l:label, k:right-or-wrong}, ...] */
function detailStr(parts){
  return parts.map(function(p){ return String(p.l).replace(/[|=]/g,"")+"="+(p.k?1:0); }).join("|");
}
function lqFlush(leaving){
  if(!TRACKING || lflushing) return;
  var q=lqRead().slice(0,POST_MAX);
  if(!q.length) return;
  lflushing=true;
  fetch(API+"/attempt",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({items:q}), keepalive:!!leaving})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(){ lqWrite(lqRead().slice(q.length)); lflushing=false;
      if(lqRead().length) lqFlush(leaving); })
    .catch(function(){ lflushing=false; });
}
function flushAll(leaving){ tqFlush(leaving); lqFlush(leaving); }
var flushing=false;
function tqFlush(leaving){
  if(!TRACKING || flushing) return;
  var q=tqRead().slice(0,POST_MAX);
  if(!q.length){ markSynced(true); return; }
  flushing=true;
  fetch(API+"/event",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({events:q}), keepalive:!!leaving})
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r); })
    .then(function(){ tqWrite(tqRead().slice(q.length)); markSynced(true); flushing=false;
      if(tqRead().length) tqFlush(leaving); })
    .catch(function(){ markSynced(false); flushing=false; });
}
function markSynced(ok){
  var w=document.getElementById("whoami");
  if(!w || !ST.n) return;
  /* the name goes back to their progress page (24 Sept) */
  w.innerHTML=esc(ST.name)+
    (ok ? "" : ' <span class="dot" title="not saved yet">•</span>');
}
window.addEventListener("online", function(){ flushAll(); });
document.addEventListener("visibilitychange", function(){
  flushAll(document.visibilityState==="hidden");
});
window.addEventListener("pagehide", function(){ flushAll(true); });
setInterval(function(){ flushAll(); }, FLUSH_MS);

function startApp(){
  document.getElementById("gate").hidden=true;
  document.getElementById("app").hidden=false;
  var w=document.getElementById("whoami");
  if(!TRACKING){ w.hidden=true; bqNew(); goFromHash(); if(L.level===null) restoreBal(); return; }
  if(ST.n){ markSynced(true); loadAssigned(flushAll); }
  else if(ST.test){ w.textContent="practice · nothing recorded"; }
  else { w.textContent="not signed in"; }
  bqNew();
  goFromHash();
  if(L.level===null) restoreBal();
}
function goFromHash(){
  var go=/[#&]go=(bal_[a-z]+\d)/.exec(location.hash);
  if(go) openAct(go[1]);
}
window.addEventListener("hashchange", goFromHash);

/* tell the dashboard they signed in, including when a remembered student
   comes back to the page; nothing waits on it */
function signedIn(){
  try{ fetch(API+"/signin",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({n:ST.n, app:"balance"}), keepalive:true}).catch(function(){}); }catch(e){}
}

function gateSetup(){
  var g=function(id){ return document.getElementById(id); };
  var found=null;

  /* tracking off: straight into the app, no number asked for */
  if(!TRACKING){ ST.off=true; startApp(); return; }

  function msg(t){ g("gateMsg").textContent=t||""; }
  function ask(){
    g("gateAsk").hidden=false; g("gateConfirm").hidden=true;
    g("gateLede").textContent="Type your class number to begin.";
    g("gateNum").focus(); g("gateNum").select();
  }
  function confirmAs(rec){
    found=rec;
    g("gateAsk").hidden=true; g("gateConfirm").hidden=false;
    g("gateLede").textContent="Is this you?";
    g("gateName").textContent=rec.name;
    msg(""); g("gateYes").focus();
  }
  function lookUp(){
    /* whole number, however many digits it has — cutting it down to three is
       what stopped longer class numbers matching the roster */
    var n=normNum(g("gateNum").value);
    if(!n){ msg("Type your class number."); return; }

    msg("Checking…");
    fetch(API+"/student?n="+n)
      .then(function(r){
        if(r.status===404) throw new Error("nomatch");
        if(!r.ok) throw new Error("api");
        return r.json();
      })
      .then(function(d){ confirmAs({n:d.n, name:d.name}); })
      .catch(function(e){
        if(e.message==="nomatch"){
          msg("No one on the class list has the number "+n+". Check it and try again.");
          g("gateNum").select();
        } else {
          msg("The class list cannot be reached right now. Tell your teacher, "+
              "and show them this: "+location.origin+API+"/student");
        }
      });
  }
  g("gateGo").addEventListener("click", lookUp);
  g("gateNum").addEventListener("keydown", function(e){
    if(e.key==="Enter"){ e.preventDefault(); lookUp(); }
  });
  g("gateYes").addEventListener("click", function(){
    ST.n=found.n; ST.name=found.name; CW.setPractice(false);
    try{ sessionStorage.setItem("ionStudent", JSON.stringify(ST)); }catch(e){}
    signedIn();
    /* a fresh sign-in opens on "Your progress" (24 Sept); coming back from
       there, the remembered sign-in drops them straight into the app */
    location.href="/beta/";
  });
  g("gateNo").addEventListener("click", function(){ found=null; msg(""); ask(); });
  g("gateSkip").addEventListener("click", function(){ ST.off=true; ST.test=true; CW.setPractice(true); startApp(); });

  var saved=null;
  try{ saved=JSON.parse(sessionStorage.getItem("ionStudent")||"null"); }catch(e){}
  if(saved && saved.n){ ST.n=saved.n; ST.name=saved.name; signedIn(); startApp(); return; }
  /* practice mode, chosen earlier on this tab: no number asked again */
  if(CW.practicing()){ ST.off=true; ST.test=true; startApp(); return; }
  g("gateNum").focus();
}

function gcd(a,b){return b?gcd(b,a%b):a;}
/* digits typed in the element column become subscripts as they are typed */
var SUBS="\u2080\u2081\u2082\u2083\u2084\u2085\u2086\u2087\u2088\u2089";
function toSubs(s){ return s.replace(/\d/g,function(d){ return SUBS.charAt(+d); }); }
function plainDigits(s){ return s.replace(/[\u2080-\u2089]/g,function(c){ return ""+SUBS.indexOf(c); }); }
function subDigits(t){return esc(t).replace(/\d+/g,function(m){return "<sub>"+m+"</sub>";});}

/* A formula, with one element boxed wherever it appears — or, when the thing
   marked is a polyatomic ion that has its own row, the whole ion boxed. */
function formulaHTML(f, markEl){
  if(markEl && isPoly(markEl)){
    var at=polyAt(f, markEl);
    if(at<0) return formulaHTML(f);
    return formulaHTML(f.slice(0,at))+'<span class="mark">'+subDigits(markEl)+'</span>'+
           formulaHTML(f.slice(at+markEl.length));
  }
  return plainFormulaHTML(f, markEl);
}
function plainFormulaHTML(f, markEl){
  var out="", i=0, n=f.length;
  while(i<n){
    var ch=f.charAt(i);
    if(ch==="("){ out+="("; i++; continue; }
    if(ch===")"){
      out+=")"; i++;
      var d="";
      while(i<n && /\d/.test(f.charAt(i))) d+=f.charAt(i++);
      if(d) out+="<sub>"+d+"</sub>";
      continue;
    }
    if(/[A-Z]/.test(ch)){
      var sym=ch; i++;
      while(i<n && /[a-z]/.test(f.charAt(i))) sym+=f.charAt(i++);
      var sd="";
      while(i<n && /\d/.test(f.charAt(i))) sd+=f.charAt(i++);
      var piece=esc(sym)+(sd?"<sub>"+sd+"</sub>":"");
      if(markEl && sym===markEl) out+='<span class="mark">'+piece+"</span>";
      else out+=piece;
      continue;
    }
    if(/\d/.test(ch)){ var g=""; while(i<n && /\d/.test(f.charAt(i))) g+=f.charAt(i++);
      out+="<sub>"+g+"</sub>"; continue; }
    out+=esc(ch); i++;
  }
  return out;
}

var ENAME={H:"hydrogen",Li:"lithium",C:"carbon",N:"nitrogen",O:"oxygen",F:"fluorine",
  Na:"sodium",Mg:"magnesium",Al:"aluminum",P:"phosphorus",S:"sulfur",Cl:"chlorine",
  K:"potassium",Ca:"calcium",Zn:"zinc",Br:"bromine",Sr:"strontium",I:"iodine",
  Ba:"barium",Si:"silicon",B:"boron",Ga:"gallium",
  /* the multivalent metals, added when they were let into the equations —
     without these every prompt would read "How many Fe atoms..." */
  Fe:"iron",Cu:"copper",Cr:"chromium",Mn:"manganese",Co:"cobalt",Ni:"nickel",
  Ti:"titanium",V:"vanadium",Ag:"silver",Sn:"tin",Pb:"lead"};
function eName(s){ return ENAME[s]||s; }

/* Atom counts for one formula. Parentheses are handled — nothing in the
   synthesis stage needs them, but later stages will, and a parser that
   quietly mis-reads Ca(OH)2 is the kind of bug that shows up in class. */
function atoms(f){
  var i=0, n=f.length, stack=[{}];
  function num(){
    var d="";
    while(i<n && /\d/.test(f.charAt(i))) d+=f.charAt(i++);
    return d?+d:1;
  }
  function fold(mult){
    var top=stack.pop(), under=stack[stack.length-1];
    for(var k in top) under[k]=(under[k]||0)+top[k]*mult;
  }
  (function walk(){
    while(i<n){
      var ch=f.charAt(i);
      if(ch==="("){ i++; stack.push({}); walk(); continue; }
      if(ch===")"){ i++; fold(num()); return; }
      if(/[A-Z]/.test(ch)){
        var s=ch; i++;
        while(i<n && /[a-z]/.test(f.charAt(i))) s+=f.charAt(i++);
        var c=num(), top=stack[stack.length-1];
        top[s]=(top[s]||0)+c;
        continue;
      }
      i++;
    }
  })();
  while(stack.length>1) fold(1);
  return stack[0];
}

/* ── polyatomic ions that stay whole ──────────────────────────
   His ion sheet only. A polyatomic ion that appears on both sides of an
   equation gets one row and is counted as one piece; on one side only, its
   atoms are counted separately as before (Ca + H2O -> Ca(OH)2 + H2).
   Longest first, so ClO4 is tried before ClO and NO3 never swallows ClO3. */
var POLY=[["ClO4","perchlorate"],["ClO3","chlorate"],["ClO2","chlorite"],
  ["ClO","hypochlorite"],["SO4","sulfate"],["SO3","sulfite"],["NO3","nitrate"],
  ["NO2","nitrite"],["PO4","phosphate"],["PO3","phosphite"],["CO3","carbonate"],
  ["OH","hydroxide"],["NH4","ammonium"]];
var PNAME={}; POLY.forEach(function(p){ PNAME[p[0]]=p[1]; });
function isPoly(k){ return PNAME.hasOwnProperty(k); }
/* what a row is called in a sentence, and how its key is drawn */
function unitName(k){ return isPoly(k) ? PNAME[k] : eName(k); }
function keyHTML(k){ return isPoly(k) ? subDigits(k) : esc(k); }
/* where ion g sits inside formula f: in parentheses, NH4 at the front, or
   the anion at the end (NaNO3, H2SO4). -1 if it is not there. */
function polyAt(f, g){
  var i=f.indexOf("("+g+")"); if(i>=0) return i+1;
  if(g==="NH4") return (f.indexOf("NH4")===0 && f.length>3) ? 0 : -1;
  if(f.charAt(f.length-1)===")" || f.length<=g.length) return -1;
  for(var k=0;k<POLY.length;k++){
    var p=POLY[k][0];
    if(p==="NH4") continue;
    if(f.slice(-p.length)===p) return p===g ? f.length-p.length : -1;
  }
  return -1;
}
function polysIn(f){
  return POLY.map(function(p){ return p[0]; })
    .filter(function(g){ return polyAt(f,g)>=0; });
}
/* the ions whole on both sides of this equation, worked out once */
function groupsOf(eq){
  if(eq.groups) return eq.groups;
  var r=[], p=[];
  eq.r.forEach(function(f){ r=r.concat(polysIn(f)); });
  eq.p.forEach(function(f){ p=p.concat(polysIn(f)); });
  eq.groups=POLY.map(function(x){ return x[0]; })
    .filter(function(g){ return r.indexOf(g)>=0 && p.indexOf(g)>=0; });
  return eq.groups;
}
/* counts for one formula with the listed ions kept whole */
function unitsOf(f, groups){
  var out={}, segs=[];
  (groups||[]).forEach(function(g){
    var at=polyAt(f,g); if(at<0) return;
    if(f.charAt(at-1)==="("){
      var m=/^\)(\d*)/.exec(f.slice(at+g.length));
      segs.push({g:g, a:at-1, b:at+g.length+m[0].length, n:m[1]?+m[1]:1});
    } else segs.push({g:g, a:at, b:at+g.length, n:1});
  });
  var rest=f;
  segs.sort(function(x,y){ return y.a-x.a; }).forEach(function(s){
    rest=rest.slice(0,s.a)+rest.slice(s.b); out[s.g]=(out[s.g]||0)+s.n; });
  var a=atoms(rest); for(var s in a) out[s]=(out[s]||0)+a[s];
  return out;
}
function elementsOf(eq){
  var seen=[], g=groupsOf(eq);
  eq.r.concat(eq.p).forEach(function(f){
    Object.keys(unitsOf(f,g)).forEach(function(s){ if(seen.indexOf(s)<0) seen.push(s); });
  });
  return seen;
}

  var t=0;

    var a=unitsOf(f, groups);
    if(a[el]) t += a[el]*(coefs[i]||0);
  });
  return t;
}

        E(["Al2(SO4)3","Ca(OH)2"],["CaSO4","Al(OH)3"]),
        E(["(NH4)3PO4","Ca(NO3)2"],["Ca3(PO4)2","NH4NO3"]),
        E(["Na3PO3","Mg(NO2)2"],["Mg3(PO3)2","NaNO2"]),
        E(["Fe(NO3)3","Ba(OH)2"],["Fe(OH)3","Ba(NO3)2"]),
        E(["Al2(SO4)3","BaCl2"],["BaSO4","AlCl3"]),
        E(["Ba(NO3)2","K3PO4"],["Ba3(PO4)2","KNO3"]),
        E(["Al(ClO3)3","Ba(OH)2"],["Al(OH)3","Ba(ClO3)2"]),
        E(["Na3PO4","Al2(SO4)3"],["AlPO4","Na2SO4"]),
        E(["FeCl3","Pb(NO3)2"],["PbCl2","Fe(NO3)3"]),
        E(["Ca(NO3)2","Na3PO4"],["Ca3(PO4)2","NaNO3"]),
        E(["Fe2(SO4)3","Ba(OH)2"],["BaSO4","Fe(OH)3"])
      ]}
    ]
  }
  /* combustion: left off for now (23 Sept) */
};

/* The smallest whole-number coefficients that balance an equation, found by
   search — so the answer is never stored apart from the equation, and a
   mistyped formula fails loudly at load instead of teaching the wrong thing. */
function solve(eq){
  var els=elementsOf(eq), g=groupsOf(eq), all=eq.r.concat(eq.p), n=all.length, LIM=12, best=null;
  var c=new Array(n).fill(1);
  (function step(i){
    if(best) return;
    if(i===n){
      for(var j=0;j<els.length;j++)
        if(sideCount(eq.r,c.slice(0,eq.r.length),els[j],g)!==
           sideCount(eq.p,c.slice(eq.r.length),els[j],g)) return;
      if(c.reduce(function(a,b){return gcd(a,b);})===1) best=c.slice();
      return;
    }
    for(var v=1;v<=LIM && !best;v++){ c[i]=v; step(i+1); }
    c[i]=1;
  })(0);
  return best;
}

function eachEq(fn){
  Object.keys(SETS).forEach(function(k){
    SETS[k].levels.forEach(function(lv,li){ lv.eqs.forEach(function(eq){ fn(eq,k,li); }); });
  });
}
eachEq(function(eq){
  eq.sol=solve(eq);
  eq.sig=eq.sol?eq.sol.join("-"):"";
  eq.steps=eq.sol?eq.sol.filter(function(v){return v>1;}).length:0;
  /* the starting counts, as the equation is written with no coefficients */
  eq.start=elementsOf(eq).map(function(el){
    var one=eq.r.map(function(){return 1;}), two=eq.p.map(function(){return 1;});
    return [sideCount(eq.r,one,el,eq.groups), sideCount(eq.p,two,el,eq.groups)];
  });
});

/* Each level has a rule about what belongs in it. Anything that breaks its
   rule is dropped here rather than turning up in front of a class. */
function fitsLevel(eq, li){
  if(!eq.sol || Math.max.apply(null,eq.sol)<=1) return false;     /* already balanced */
  if(li===0){
    /* In a single replacement the free element sits at 1/1 on both sides and
       passes the divisibility test for free, which let things like
       Al + HCl (2,6,2,3) through as "beginner". A cap on the answer itself
       catches those wherever they are placed. */
    if(Math.max.apply(null,eq.sol)>3) return false;
    /* no common-multiple step: on every row one count has to divide the other */
    return eq.start.every(function(pair){
      var a=pair[0], b=pair[1];
      return a===b || (a && b && (a%b===0 || b%a===0));
    });
  }
  /* above beginner, one number is never enough */
  return eq.steps>=2;
}
Object.keys(SETS).forEach(function(k){
  SETS[k].levels.forEach(function(lv,li){
    lv.eqs=lv.eqs.filter(function(eq){ return fitsLevel(eq,li); });
  });
});


/* ═══════════════════════════════════════════════════════════════
   WHAT THE BALANCED EQUATION MEANS (24 Sept)
   Once an equation is balanced, it is read back as a sentence:
   "Two molecules of hydrogen gas react with one molecule of oxygen gas
   to form two molecules of water."
   The coefficients in the equation and the matching number words in the
   sentence are both green, so a student can see which goes with which.

   Every formula in every pool must have a name — a test walks all of
   them — so a formula with no name can never reach a student.
   ═══════════════════════════════════════════════════════════════ */

/* Compounds that are not named by ion + ion, and the acids. Anything in
   here counts as a molecule rather than a formula unit. */
var MOLNAME={
  H2O:"water", NH3:"ammonia", CH4:"methane",
  CO:"carbon monoxide", CO2:"carbon dioxide", CS2:"carbon disulfide",
  NO:"nitrogen monoxide", NO2:"nitrogen dioxide",
  SO2:"sulfur dioxide", SO3:"sulfur trioxide",
  NF3:"nitrogen trifluoride", SiCl4:"silicon tetrachloride",
  B2O3:"diboron trioxide",
  HCl:"hydrochloric acid", HBr:"hydrobromic acid",
  H2SO4:"sulfuric acid", H3PO4:"phosphoric acid"
};
/* the acids: read back with the formula after the name (25 Sept) */
var ACIDS={HCl:1, HBr:1, H2SO4:1, H3PO4:1};
/* the elements that are gases as the free element, where saying so tells
   the molecule apart from the atom */
var GASNAME={H2:1, O2:1, N2:1, F2:1, Cl2:1};
/* the negative ions a compound can end in, beyond the polyatomic list */
var ANNAME={F:"fluoride", Cl:"chloride", Br:"bromide", I:"iodide",
            O:"oxide", S:"sulfide", N:"nitride", P:"phosphide"};
var ANCH={F:1, Cl:1, Br:1, I:1, O:2, S:2, N:3, P:3,
          NO3:1, NO2:1, ClO4:1, ClO3:1, ClO2:1, ClO:1, OH:1,
          SO4:2, SO3:2, CO3:2, PO4:3, PO3:3};
var ROMAN={1:"I", 2:"II", 3:"III", 4:"IV", 5:"V", 6:"VI"};

/* the pieces of an ionic formula: Al2(SO4)3, NaCl, (NH4)3PO4, NH4Cl */
function ionSplit(f){
  var cat, nc, rest;
  var a=/^\(NH4\)(\d+)/.exec(f);
  if(a){ cat="NH4"; nc=+a[1]; rest=f.slice(a[0].length); }
  else if(f.indexOf("NH4")===0 && f.length>3){ cat="NH4"; nc=1; rest=f.slice(3); }
  else {
    var m=/^([A-Z][a-z]?)(\d*)/.exec(f);
    if(!m) return null;
    cat=m[1]; nc=m[2]?+m[2]:1; rest=f.slice(m[0].length);
  }
  if(!rest) return null;
  var an, na, q=/^\(([A-Za-z0-9]+)\)(\d+)$/.exec(rest);
  if(q){ an=q[1]; na=+q[2]; }
  else if(ANCH[rest]!==undefined){ an=rest; na=1; }
  else { var e=/^([A-Z][a-z]?)(\d*)$/.exec(rest);
         if(!e) return null; an=e[1]; na=e[2]?+e[2]:1; }
  if(ANCH[an]===undefined || !ENAME[cat] && cat!=="NH4") return null;
  return {cat:cat, nc:nc, an:an, na:na};
}
/* the positive ion's name, with the Roman numeral only where the metal
   forms more than one ion — the same rule the rest of the app uses */
function catName(c){
  if(c.cat==="NH4") return "ammonium";
  if(!PPMV[c.cat]) return eName(c.cat);
  var q=ANCH[c.an]*c.na/c.nc;
  if(q!==Math.floor(q) || !ROMAN[q]) return null;
  return eName(c.cat)+"("+ROMAN[q]+")";
}
function anName(a){ return isPoly(a) ? PNAME[a] : ANNAME[a]; }

/* the name of one formula, or null if it cannot be named */
function subName(f){
  if(MOLNAME[f]) return MOLNAME[f];
  var e=/^([A-Z][a-z]?)(\d*)$/.exec(f);
  if(e && ENAME[e[1]]) return eName(e[1])+(GASNAME[f]?" gas":"");
  var c=ionSplit(f);
  if(!c) return null;
  var cn=catName(c), an=anName(c.an);
  return cn && an ? cn+" "+an : null;
}
/* what one of it is called: an atom, a molecule or a formula unit */
function subUnit(f){
  if(MOLNAME[f]) return "molecule";
  var e=/^([A-Z][a-z]?)(\d*)$/.exec(f);
  if(e) return e[2] ? "molecule" : "atom";
  return "formula unit";
}
var COUNTWORD=["zero","one","two","three","four","five","six","seven","eight",
  "nine","ten","eleven","twelve","thirteen","fourteen","fifteen","sixteen",
  "seventeen","eighteen","nineteen","twenty"];
function countWord(n){ return COUNTWORD[n] || String(n); }

/* "two molecules of water", with the number in green */
/* HCl/HBr made from the elements is the gas; as a reactant it is the acid */
var GASFORM={HCl:"hydrogen chloride", HBr:"hydrogen bromide"};
function pieceHTML(n, f, first, prod){
  var w=countWord(n), unit=subUnit(f)+(n===1?"":"s");
  return '<span class="mnum">'+esc(first ? w.charAt(0).toUpperCase()+w.slice(1) : w)+
    '</span> '+esc(unit)+" of "+esc(prod&&GASFORM[f] ? GASFORM[f] : subName(f))+
    (ACIDS[f] ? " ("+esc(f).replace(/(\d+)/g,"<sub>$1</sub>")+")" : "");
}
/* a list read aloud: A, B and C */
function joinList(parts){
  if(parts.length<2) return parts.join("");
  return parts.slice(0,-1).join(", ")+" and "+parts[parts.length-1];
}
/* Can this equation be read back? Every formula has to have a name. */
function canRead(eq){
  return eq.r.concat(eq.p).every(function(f){ return !!subName(f); });
}
/* the sentence, or "" if anything in the equation has no name */
function meaningHTML(eq, coef){
  if(!canRead(eq)) return "";
  var nr=eq.r.length, all=eq.r.concat(eq.p);
  var n=coef.map(function(v){ v=(v||"").trim(); return v===""?1:(/^\d+$/.test(v)?+v:1); });
  var left=eq.r.map(function(f,i){ return pieceHTML(n[i], f, i===0); });
  var right=eq.p.map(function(f,i){ return pieceHTML(n[nr+i], f, false, true); });
  var verb = eq.r.length<2 ? (n[0]===1?"forms":"form")
                           : (n[0]===1?"reacts with":"react with");
  var body = eq.r.length<2
    ? left[0]+" "+verb+" "+joinList(right)
    : left[0]+" "+verb+" "+joinList(left.slice(1))+" to form "+joinList(right);
  return '<p class="meaning">'+body+'.</p>';
}

   single replacement. No water, no acids, no ammonium, no mercury. A
   multivalent metal's charge is worked out from the compound it is in, so
   there is no "Use Fe+3" note here (his call, 23 Sept). */
SETS.pdr={
  name:"Predicting: double replacement",
  levels:[
    /* fixed-charge metals; halides, hydroxide and carbonate only */
    {name:"Beginner", eqs:[
      E(["KOH","MgCl2"],["KCl","Mg(OH)2"]),
      E(["CaI2","AgF"],["CaF2","AgI"]),
      E(["ZnCl2","K2CO3"],["ZnCO3","KCl"]),
      E(["CaBr2","NaOH"],["Ca(OH)2","NaBr"]),
      E(["Na2CO3","BaBr2"],["NaBr","BaCO3"]),
      E(["NaOH","AlCl3"],["NaCl","Al(OH)3"]),
      E(["MgBr2","KF"],["MgF2","KBr"]),
      E(["K2CO3","CaCl2"],["KCl","CaCO3"]),
      E(["LiOH","ZnI2"],["LiI","Zn(OH)2"]),
      E(["BaCl2","Li2CO3"],["BaCO3","LiCl"]),
      E(["KOH","SrBr2"],["KBr","Sr(OH)2"])
    ]},
    /* the full polyatomic set and multivalent metals */
    {name:"Advanced", eqs:[
      E(["Cr(NO3)3","K2CO3"],["Cr2(CO3)3","KNO3"]),
      E(["Mg(ClO3)2","Na3PO4"],["Mg3(PO4)2","NaClO3"]),
      E(["FeCl3","NaOH"],["Fe(OH)3","NaCl"]),
      E(["Al2(SO4)3","Ca(NO3)2"],["Al(NO3)3","CaSO4"]),
      E(["CoCl2","Na3PO4"],["Co3(PO4)2","NaCl"]),
      E(["Pb(NO2)2","K2CO3"],["PbCO3","KNO2"]),
      E(["Fe(NO3)3","K2SO4"],["Fe2(SO4)3","KNO3"]),
      E(["SnCl2","AgNO3"],["Sn(NO3)2","AgCl"]),
      E(["Na2CO3","AlBr3"],["NaBr","Al2(CO3)3"]),
      E(["Mn(ClO4)2","K2SO3"],["MnSO3","KClO4"]),
      E(["CuSO4","K3PO4"],["Cu3(PO4)2","K2SO4"]),
      E(["CrCl3","AgNO3"],["Cr(NO3)3","AgCl"]),
      E(["Ni(NO3)2","NaOH"],["Ni(OH)2","NaNO3"]),
      E(["CuCl2","Li3PO4"],["Cu3(PO4)2","LiCl"]),
      E(["FeSO4","Ba(ClO3)2"],["Fe(ClO3)2","BaSO4"]),
      E(["Pb(NO3)2","NaI"],["PbI2","NaNO3"])
    ]}
  ]
};

/* both predicting sections run on this one engine */
function isPP(){ return L.type==="pp" || L.type==="pdr"; }

/* a compound as cation, anion and their subscripts */
function ppSplit(f){
  var m=/^([A-Z][a-z]?)(\d*)/.exec(f); if(!m) return null;
  var rest=f.slice(m[0].length), an, na;
  var q=/^\(([A-Za-z0-9]+)\)(\d+)$/.exec(rest);
  if(q){ an=q[1]; na=+q[2]; }
  else if(isPoly(rest)){ an=rest; na=1; }
  else { var e=/^([A-Z][a-z]?)(\d*)$/.exec(rest); if(!e) return null;
         an=e[1]; na=e[2]?+e[2]:1; }
  return {cat:m[1], nc:m[2]?+m[2]:1, an:an, na:na};
}
function ppElem(f){ var m=/^([A-Z][a-z]?)(\d*)$/.exec(f);
  return m?{sym:m[1], n:m[2]?+m[2]:1}:null; }
/* the positive ion's charge in a compound, or 0 if it does not come out whole */
function ppCatQ(c){
  if(!c || !PPCH[c.an]) return 0;
  var q=PPCH[c.an]*c.na/c.nc;
  return q===Math.floor(q) && gcd(c.nc,c.na)===1 ? q : 0;
}
function ppTerm(c, k){
  return {c:true, k:k, cat:c.cat, an:c.an, nc:c.nc, na:c.na, cq:ppCatQ(c), aq:PPCH[c.an]};
}

/* Work out the pieces once, and drop anything that does not add up.
   eq.pp.tiles are the pieces on the tray, eq.pp.tch their charges as ions,
   eq.pp.terms the products in the order they are written, each naming the
   boxes (slots) it is made of. */
function ppPrep(eq){
  var ri=ppElem(eq.r[0])?0:1, pi=ppElem(eq.p[0])?0:1;
  var rel=ppElem(eq.r[ri]), rc=ppSplit(eq.r[1-ri]), pel=ppElem(eq.p[pi]), pc=ppSplit(eq.p[1-pi]);
  if(!rel||!rc||!pel||!pc) return false;
  var tiles=[rel.sym, rc.cat, rc.an];
  if([pc.cat,pc.an,pel.sym].slice().sort().join()!==tiles.slice().sort().join()) return false;
  var cc=ppCatQ(pc), rcc=ppCatQ(rc);
  if(!cc || !rcc) return false;
  if(tiles.some(function(s){ return !isPoly(s) && !ENAME[s]; })) return false;
  eq.sol=solve(eq); if(!eq.sol) return false;
  eq.sig=eq.sol.join("-");
  /* the charge each piece has as an ion: the free element's from the product
     compound, the other two from the reactant compound */
  var tch=[rel.sym===pc.cat ? cc : -PPCH[pc.an], rcc, -PPCH[rc.an]];
  var comp=ppTerm(pc,[0,1]), el={c:false, k:[2], sym:pel.sym, n:pel.n};
  /* the slots: 0 the compound's positive ion, 1 its negative ion, 2 the element */
  eq.pp={kind:"sr", tiles:tiles, tch:tch, terms:pi===0?[el,comp]:[comp,el],
         want:[pc.cat, pc.an, pel.sym], rep:[rel.sym, pel.sym],
         mv:PPMV[rel.sym] ? rel.sym : null, cc:cc};
  return true;
}
function ppPrepDR(eq){
  var r=eq.r.map(ppSplit), p=eq.p.map(ppSplit);
  if(r.some(function(x){ return !x; }) || p.some(function(x){ return !x; })) return false;
  var tiles=[r[0].cat, r[0].an, r[1].cat, r[1].an];
  if(tiles.some(function(s,i){ return tiles.indexOf(s)!==i; })) return false;
  if(tiles.some(function(s){ return !isPoly(s) && !ENAME[s]; })) return false;
  /* each product pairs one reactant's positive ion with the other's negative ion */
  var pairs=p.map(function(c){ return c.cat+"|"+c.an; }).sort().join();
  if(pairs!==[r[0].cat+"|"+r[1].an, r[1].cat+"|"+r[0].an].sort().join()) return false;
  var q=[ppCatQ(r[0]), ppCatQ(r[1])];
  if(!q[0] || !q[1]) return false;
  var terms=[ppTerm(p[0],[0,1]), ppTerm(p[1],[2,3])];
  /* the charges on the products must agree with the reactants' */
  if(terms.some(function(t){ return t.cq!==q[tiles.indexOf(t.cat)/2]; })) return false;
  eq.sol=solve(eq); if(!eq.sol) return false;
  eq.sig=eq.sol.join("-");
  eq.pp={kind:"dr", tiles:tiles, tch:[q[0], -PPCH[r[0].an], q[1], -PPCH[r[1].an]],
         terms:terms, want:[p[0].cat, p[0].an, p[1].cat, p[1].an],
         rep:[r[0].cat, r[1].cat], mv:null};
  return true;
}
[["pp",ppPrep],["pdr",ppPrepDR]].forEach(function(s){
  SETS[s[0]].levels.forEach(function(lv){
    lv.eqs=lv.eqs.filter(function(eq){
      var ok=s[1](eq);
      if(!ok && window.console) console.error("predict: dropped", eq.r.join("+"));
      return ok;
    });
  });
});

/* ── state ───────────────────────────────────────────────────── */
/* phases: "replace" (beginner only: "In this reaction __ replaces __" or
   "__ swaps partners with __"), "charges" (arrows on the tiles), "predict",
   "balance", "done". flip: in double replacement the student wrote the two
   products the other way round, which is just as right. */
var P={eq:null, phase:"charges", rep:["",""], tip:null, ok:false, chg:[], slot:[], sub:[], order:[],
       sel:null, bad:{}, hint:null, misses:0, coef:[], unbal:[], flip:false};
function ppElStep(){ return L.level>0; }   /* the element gets a stepper at advanced */
function ppDR(){ return P.eq.pp.kind==="dr"; }
/* the slots that belong to a compound */
function ppInComp(k){
  return P.eq.pp.terms.some(function(t){ return t.c && t.k.indexOf(k)>=0; });
}
/* the equation as the student wrote it, for balancing */
function ppBeq(){
  var eq=P.eq;
  if(!P.flip) return eq;
  if(!P.beq || P.beq.base!==eq)
    P.beq={base:eq, r:eq.r, p:eq.p.slice().reverse(), groups:groupsOf(eq), pp:eq.pp};
  return P.beq;
}

function ppPool(){
  var eqs=curLevel().eqs;
  return ppNames() ? eqs.filter(pnFits) : eqs;
}
function ppPick(){
  var pool=ppPool(), fresh=pool.filter(function(e){ return L.seen.indexOf(e)<0; });
  var last=P.eq;
  var varied=fresh.filter(function(e){ return e!==last && (!last || e.r[0]!==last.r[0]); });
  var bag=varied.length ? varied : (fresh.length ? fresh : pool.filter(function(e){ return e!==last; }));
  if(!bag.length) bag=pool;
  /* never more than two in a row without a free multivalent metal */
  if((P.sinceMV||0)>=2){
    var mv=bag.filter(function(e){ return e.pp.mv; });
    if(!mv.length) mv=pool.filter(function(e){ return e.pp.mv && e!==last; });
    if(mv.length) bag=mv;
  }
  var e=bag[Math.floor(Math.random()*bag.length)];
  P.sinceMV = e.pp.mv ? 0 : (P.sinceMV||0)+1;
  return e;
}
function ppNew(){
  P.eq=ppPick();
  if(L.seen.indexOf(P.eq)<0) L.seen.push(P.eq);
  P.misses=0; P.tries={};
  var n=P.eq.pp.tiles.length, o=[];
  for(var i=0;i<n;i++) o.push(i);
  for(i=n-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=o[i]; o[i]=o[j]; o[j]=t; }
  P.order=o;
  ppReset();
}
/* start this equation again — misses already made still count */
function ppReset(){
  var n=P.eq.pp.tiles.length, z=function(v){ var a=[]; for(var i=0;i<n;i++) a.push(v); return a; };
  P.phase=ppNames()?"names":L.level===0?"replace":"charges"; P.rep=["",""]; P.tip=null; P.ok=false;
  P.nm={ok:{}, v:{}, bad:{}}; P.lock=z(false);
  P.chg=z(0); P.slot=z(null); P.sub=z(1); P.sel=null; P.flip=false; P.beq=null;
  P.bad={}; P.hint=null; P.unbal=[]; P.stuck=false;
  P.coef=P.eq.r.concat(P.eq.p).map(function(){ return ""; });
  ppRender();
}

/* Start over clears the part they are on, not the whole equation (24 Sept).
   Misses already made still count. */
function ppRestartPart(){
  var n=P.eq.pp.tiles.length, i;
  if(P.phase==="names") pnLive().forEach(function(x){
    pnIds(x).forEach(function(id){ delete P.nm.v[id]; }); });
  else if(P.phase==="replace") P.rep=["",""];
  else if(P.phase==="charges"){ for(i=0;i<n;i++) if(!P.lock[i]) P.chg[i]=0; }
  else if(P.phase==="predict"){ for(i=0;i<n;i++){ P.slot[i]=null; P.sub[i]=1; } P.sel=null; }
  else if(P.phase==="balance"){ P.coef=P.coef.map(function(){ return ""; }); P.unbal=[]; }
  P.bad={}; P.nm.bad={}; P.hint=null; P.tip=null; P.ok=false;
  ppRender();
}

/* ── drawing ─────────────────────────────────────────────────── */
/* 0, +1, +2, \u22121 — sign first, the 1 always written, as in the ionic page */
function ppChgText(q){
  return q===0 ? "0" : (q>0?"+":"\u2212")+Math.abs(q);
}
/* The charge on a piece is grayed, on the tray and in the products, so it
   never reads as part of the formula (his call, 23 Sept). */
function ppChgHTML(q){ return '<sup class="ppq">'+ppChgText(q)+'</sup>'; }
function ppPiece(s,n){
  return isPoly(s)&&n>1 ? "("+subDigits(s)+")<sub>"+n+"</sub>"
                        : subDigits(s)+(n>1?"<sub>"+n+"</sub>":"");
}
function ppSlotHTML(k){
  var t=P.slot[k], s=t===null?null:P.eq.pp.tiles[t], n=P.sub[k], comp=ppInComp(k);
  var step=(comp||ppElStep())
    ? '<span class="ppstep'+(s===null?" off":"")+'">'+
        '<button data-pp="dn" data-k="'+k+'" aria-label="Smaller subscript"'+(n<=1?" disabled":"")+'>\u2212</button>'+
        '<button data-pp="up" data-k="'+k+'" aria-label="Bigger subscript"'+(n>=9?" disabled":"")+'>+</button></span>'
    : "";
  return '<span class="ppslot"><span class="ppbox'+(s!==null?" full":"")+
    (P.bad["s"+k]?" bad":"")+(P.sel!==null&&s===null?" target":"")+'" data-slot="'+k+'">'+
    (s===null?"":'<span class="pppc">'+ppPiece(s,n)+
      /* the ions carry their total charge; the element on its own carries none */
      (comp?ppChgHTML(P.chg[t]*n):'')+'</span>')+'</span>'+step+'</span>';
}
/* a formula with every piece that does not agree boxed in red */
function ppMarkEl(s, marks){
  return s.replace(/([A-Z][a-z]?)(\d*)|\)(\d+)|(\d+)|([^A-Za-z\d])/g,
    function(m,sym,d,pd,dd,other){
      if(sym){ var p=esc(sym)+(d?"<sub>"+d+"</sub>":"");
        return marks.indexOf(sym)>=0 ? '<span class="unbal">'+p+'</span>' : p; }
      if(pd) return ")<sub>"+pd+"</sub>";
      if(dd) return "<sub>"+dd+"</sub>";
      return esc(other);
    });
}
function ppMarkHTML(f, marks, eq){
  if(!marks.length) return formulaHTML(f);
  var spans=[], out="", i=0;
  groupsOf(eq||ppBeq()).forEach(function(g){ var at=polyAt(f,g); if(at>=0) spans.push([at,g]); });
  spans.sort(function(a,b){ return a[0]-b[0]; }).forEach(function(s){
    out+=ppMarkEl(f.slice(i,s[0]),marks);
    var ion=subDigits(s[1]);
    out+=marks.indexOf(s[1])>=0 ? '<span class="unbal">'+ion+'</span>' : ion;
    i=s[0]+s[1].length;
  });
  return out+ppMarkEl(f.slice(i),marks);
}
function ppEqHTML(){
  var eq=ppBeq(), out='<div class="eq pp">', i, nr=eq.r.length;
  if(P.phase==="names"||P.phase==="replace"||P.phase==="charges"||P.phase==="predict"){
    eq.r.forEach(function(f,j){
      if(j) out+='<span class="plus">+</span>';
      out+='<span class="term"><span>'+(P.phase==="names" && !pnDone(j)
        ? '<span class="pnword">'+esc(pnItems(eq)[j].name)+'</span>' : formulaHTML(f))+'</span></span>';
    });
    out+='<span class="arrow">&rarr;</span>';
    /* from names: the products are not the job yet, so no empty boxes */
    if(P.phase==="names") return out+'<span class="term pnq">?</span></div>';
    eq.pp.terms.forEach(function(t,j){
      if(j) out+='<span class="plus">+</span>';
      out+= t.c ? '<span class="ppcomp">'+t.k.map(ppSlotHTML).join("")+'</span>'
                : ppSlotHTML(t.k[0]);
    });
    return out+'</div>';
  }
  var all=eq.r.concat(eq.p);
  for(i=0;i<all.length;i++){
    if(i===nr) out+='<span class="arrow">&rarr;</span>';
    else if(i>0) out+='<span class="plus">+</span>';
    out+='<span class="term">'+
      '<input class="coef'+(P.phase==="done"?" solved":"")+(P.bad["c"+i]?" bad":"")+'" id="pc'+i+'" value="'+esc(P.coef[i])+
      '" inputmode="numeric" autocomplete="off" maxlength="2" aria-label="Coefficient for '+
      esc(all[i])+'"'+(P.phase==="done"?" disabled":"")+'>'+
      '<span>'+ppMarkHTML(all[i], P.unbal)+'</span></span>';
  }
  return out+'</div>';
}
function ppTrayHTML(){
  return '<div class="pptray">'+P.order.map(function(t){
    var s=P.eq.pp.tiles[t], used=P.slot.indexOf(t)>=0;
    var arrows = P.phase==="charges" && !P.lock[t]
      ? '<span class="ppchg">'+
          '<button data-pp="cu" data-t="'+t+'" aria-label="Raise the charge"'+(P.chg[t]>=4?" disabled":"")+'>&#9650;</button>'+
          '<button data-pp="cd" data-t="'+t+'" aria-label="Lower the charge"'+(P.chg[t]<=-4?" disabled":"")+'>&#9660;</button></span>'
      : "";
    return '<div class="pptile'+(used?" used":"")+(P.sel===t?" sel":"")+
      (P.phase==="charges"&&!P.lock[t]?" setting":"")+(P.bad["t"+t]?" bad":"")+'" data-t="'+t+'"'+
      ' aria-label="'+esc(unitName(s))+'"><span class="pplab">'+subDigits(s)+
      ppChgHTML(P.chg[t])+'</span>'+arrows+'</div>';
  }).join("")+'</div>';
}
function ppReady(){
  if(P.phase==="names") return pnReady();
  if(P.phase==="replace") return P.rep.every(function(v){ return (v||"").trim()!==""; });
  return P.phase!=="predict" || P.slot.every(function(t){ return t!==null; });
}

function ppRender(){
  var h=navHTML(), sec=document.getElementById("sec");
  var early=P.phase==="names"||P.phase==="replace"||P.phase==="charges"||P.phase==="predict";
  h+='<div class="eqbox'+(early?" ppwork":"")+'">'+ppEqHTML()+'</div>';
  var pp=P.eq.pp;
  /* the prompts sit right under the equation; the pieces come after them */
  h+='<div class="ppguide">';
  if(P.phase==="done"){
    h+=winHTML("Correct!");
  } else {
    /* every passed check says so, until the next Check */
    if(P.ok) h+='<p class="okmsg">Correct!</p>';
    if(early && pp.mv && P.phase!=="names")
      h+='<p class="ppnote">Use '+esc(pp.mv)+'<sup>'+ppChgText(pp.cc)+'</sup>.</p>';
    h+='<p class="lead">'+(P.phase==="names"
        ? pnLead()
        : P.phase==="replace"
        ? 'In this reaction '+ppRepBox(0)+(ppDR()?' swaps partners with ':' replaces ')+ppRepBox(1)+'.'
        : P.phase==="charges"
        ? (ppNames() ? "Use the arrows to enter the charge on the <b>"+
                         esc(PNANION[pp.tiles[0]]||eName(pp.tiles[0]))+"</b> ion."
                     : "Use the arrows to give each ion its charge.")
        : P.phase==="predict"
        ? "Drag each piece into the products, then set the subscripts."
        : "Add coefficients until both sides match, then press Check.")+'</p>'+
      '<p class="hint'+(P.hint?"":" blank")+'">'+(P.hint||"")+'</p>'+
      (P.tip?'<p class="tip">'+P.tip+'</p>':'');
  }
  h+='</div>';
  /* the work, then Check | Hint | Start over directly under it (24 Sept) */
  if(P.phase==="names") h+='<div class="ppguide">'+pnCardsHTML()+'</div>';
  if(P.phase==="charges"||P.phase==="predict") h+=ppTrayHTML();
  /* five wrong tries on one item, from names: no sixth attempt at it — one
     button moves on, same as the win screen's (24 Sept) */
  if(P.stuck) h+='<div class="ppguide"><button data-b="next">New equation</button></div>';
  else if(P.phase!=="done") h+='<div class="ppguide">'+btnRowHTML(ppReady())+'</div>';
  h+=counterHTML();
  sec.innerHTML=h;
  fitEq();
  if(P.phase==="names") pnFocus();
  if(P.phase==="replace"){
    var rb=document.querySelector(".ppsym.bad")||
      [].filter.call(document.querySelectorAll(".ppsym"),function(x){ return !x.value.trim(); })[0];
    if(rb){ rb.focus(); rb.select(); }
  }
  if(P.phase==="balance"){
    var f=document.querySelector(".coef.bad")||
      (P.coef.every(function(v){ return !(v||"").trim(); }) ? document.getElementById("pc0") : null);
    if(f){ f.focus(); f.select(); }
  }
}

/* the two blanks in "In this reaction __ replaces __" / "__ swaps partners with __" */
function ppRepBox(i){
  var lab=ppDR() ? (i?"Symbol of the other positive ion":"Symbol of one positive ion")
                 : (i?"Symbol of what is replaced":"Symbol of what does the replacing");
  return '<input class="ppsym'+(P.bad["r"+i]?" bad":"")+'" id="pr'+i+'" value="'+esc(P.rep[i])+
    '" autocomplete="off" spellcheck="false" maxlength="4" aria-label="'+lab+'">';
}

/* ── hints: never a miss ─────────────────────────────────────── */
function ppHint(){
  var pp=P.eq.pp;
  if(P.phase==="names") P.tip=pnHint();
  else if(P.phase==="replace")
    P.tip=ppDR() ? "Each compound has a positive ion and a negative ion. The positive ions swap partners, and so do the negative ions."
                 : "The element on its own takes the place of one element in the compound.";
  else if(P.phase==="charges")
    P.tip="Find each element on your periodic table."+
      (pp.tiles.some(isPoly) ? " Find a polyatomic ion on your ion sheet." : "")+
      (ppDR() && pp.tiles.some(function(s){ return PPMV[s]; })
        ? " A metal that forms more than one ion gets its charge from the negative ion it is with." : "");
  else if(P.phase==="predict")
    P.tip=ppDR() ? "The positive ions swap partners. Write the positive ion first in each compound."
                 : "The element on its own and the element it replaces trade places.";
  else if(P.phase==="balance"){
    /* the balancing page's own hint, run on this equation and these coefficients */
    [].forEach.call(document.querySelectorAll('.eq.pp .coef'),function(x){
      P.coef[+x.id.slice(2)]=x.value; });
    var keep={eq:B.eq, els:B.els, coef:B.coef, phase:B.phase, tipEl:B.tipEl};
    B.eq=ppBeq(); B.els=elementsOf(B.eq); B.coef=P.coef.slice(); B.phase="balance";
    P.tip=hintText();
    B.eq=keep.eq; B.els=keep.els; B.coef=keep.coef; B.phase=keep.phase; B.tipEl=keep.tipEl;
    P.unbal=[];
  }
  ppRender();
}

/* ── checking ────────────────────────────────────────────────── */
function ppCheck(){
  if(P.phase==="done") return;
  if(!ppReady()){
    var empty=[].filter.call(document.querySelectorAll(".ppsym"),function(x){ return !x.value.trim(); })[0];
    if(empty) empty.focus();
    return;
  }
  var pp=P.eq.pp, dr=ppDR();
  P.bad={}; P.hint=null; P.tip=null; P.unbal=[]; P.ok=false;

  if(P.phase==="names"){ pnCheck(); return; }

  if(P.phase==="replace"){
    var want=pp.rep, msgs=[];
    var got=P.rep.map(function(v){ return plainDigits((v||"").trim()).replace(/\s+/g,""); });
    /* single replacement: in that order. Double replacement: the two positive
       ions or the two negative ions, either way round (his call, 23 Sept) */
    var negs=pp.tiles.filter(function(t,k){ return pp.tch[k]<0; }),
        lneg=negs.map(function(t){ return t.toLowerCase(); });
    if(dr && negs.indexOf(got[0])>=0 && negs.indexOf(got[1])>=0) want=negs;
    var right=function(i){
      return dr ? want.indexOf(got[i])>=0 && !(i===1 && got[1]===got[0]) : got[i]===want[i];
    };
    var repTyped=P.rep.map(function(v){ return (v||"").trim(); }).join(", ");
    if(right(0) && right(1)){
      logAttempt("replace", ppAsked(), repTyped, true, "", ppTry("replace"));
      /* from names, double replacement: the charges are already on the tiles */
      P.phase = ppNames() && dr ? "predict" : "charges"; P.ok=true; ppRender(); return;
    }
    P.misses++;
    var repFault="";
    /* in double replacement, which sign the other box holds */
    var other=function(i){ var o=got[1-i].toLowerCase();
      return lneg.indexOf(o)>=0 ? "neg" : want.some(function(w){ return w.toLowerCase()===o; }) ? "pos" : ""; };
    [0,1].forEach(function(i){
      if(right(i)) return;
      var g=got[i], lo=g.toLowerCase(), m;
      P.bad["r"+i]=true;
      /* a positive ion they should have written, typed with the wrong capitals */
      var near=(dr?pp.rep.concat(negs):[want[i]]).filter(function(w){ return w!==g && w.toLowerCase()===lo; })[0];
      var fc;
      if(dr && ((lneg.indexOf(lo)>=0 && other(i)==="pos") || (lneg.indexOf(lo)<0 && other(i)==="neg"))){
        m="Ions swap with ions of the same charge sign."; fc="swapsign"; }
      else if(!dr && lneg.indexOf(lo)>=0){
        m="Positive ions replace positive ions."; fc="negion"; }
      else if(near){
        m="Check the capitals. A symbol starts with a capital letter, and a second letter "+
          "is always lowercase — <b>"+keyHTML(near)+"</b>, not <b>"+esc(g)+"</b>."; fc="caps"; }
      else if(!pp.tiles.some(function(t){ return t.toLowerCase()===lo; })){
        m="<b>"+esc(g)+"</b> is not in this equation."; fc="notin"; }
      else { m="Not quite."; fc="other"; }
      if(!repFault) repFault=fc;
      if(msgs.indexOf(m)<0) msgs.push(m);
    });
    /* "Not quite." says nothing the others do not */
    if(msgs.length>1) msgs=msgs.filter(function(m){ return m!=="Not quite."; });
    P.hint=msgs.join(" ");
    var repDet=[0,1].map(function(i){ return {l:got[i]||"(blank)", k:right(i)}; });
    logAttempt("replace", ppAsked(), repTyped, false, repFault, ppTry("replace"), detailStr(repDet));
    ppRender(); return;
  }

  if(P.phase==="charges"){
    var chgTyped=P.order.map(function(t){ return pp.tiles[t]+" "+ppChgText(P.chg[t]); }).join(", ");
    var off=pp.tch.map(function(q,t){ return t; }).filter(function(t){ return P.chg[t]!==pp.tch[t]; });
    var chgDet=P.order.map(function(t){ return {l:pp.tiles[t]+" "+ppChgText(P.chg[t]), k:P.chg[t]===pp.tch[t]}; });
    logAttempt("charges", ppAsked(), chgTyped, !off.length, off.length?"charge":"", ppTry("charges"),
      chgDet.length>1?detailStr(chgDet):null,
      "C"+(off.length?1:0)+(off.some(function(t){ return PPMV[pp.tiles[t]]; })?",M":""));
    if(off.length){
      P.misses++;
      off.forEach(function(t){ P.bad["t"+t]=true; });
      P.hint="Not quite. Check the boxed charges.";
      ppRender(); return;
    }
    P.phase="predict"; P.ok=true; ppRender(); return;
  }
  if(P.phase==="predict"){
    var s=P.slot.map(function(t){ return pp.tiles[t]; });
    /* double replacement: the products may be written in either order */
    var orders=[pp.terms], wants=[pp.want];
    if(dr){
      orders.push([pp.terms[1],pp.terms[0]]);
      wants.push(pp.want.slice(2).concat(pp.want.slice(0,2)));
    }
    var score=wants.map(function(w){ return w.filter(function(x,k){ return s[k]===x; }).length; });
    var o=score.length>1 && score[1]>score[0] ? 1 : 0, w=wants[o], terms=orders[o];
    var wrong=w.map(function(x,k){ return k; }).filter(function(k){ return s[k]!==w[k]; });
    if(wrong.length){
      P.misses++;
      wrong.forEach(function(k){ P.bad["s"+k]=true; });
      /* where each box sits, and what belongs there */
      var boxes=pp.terms.filter(function(t){ return t.c; }).map(function(t){ return t.k; });
      var reversed=boxes.some(function(k){ return s[k[0]]===w[k[1]] && s[k[1]]===w[k[0]]; });
      var kept=dr && boxes.some(function(k){
        var a=pp.tiles.indexOf(s[k[0]]), b=pp.tiles.indexOf(s[k[1]]);
        return Math.floor(a/2)===Math.floor(b/2) && a!==b; });
      P.hint = reversed ? "The positive ion is written first."
             : kept ? "The positive ions swap partners."
             : "Not quite. The boxed pieces are in the wrong places.";
      var prDet=w.map(function(x,k){ return {l:s[k]||"(blank)", k:s[k]===x}; });
      logAttempt("products", ppAsked(), ppBuilt(), false, reversed?"order":kept?"kept":"place", ppTry("products"),
        prDet.length>1?detailStr(prDet):null);
      ppRender(); return;
    }
    /* each compound's subscripts, against the compound that belongs in that place */
    var badSub=null, subFault="";
    pp.terms.forEach(function(t,j){
      if(!t.c) return;
      var want=terms[j], a=P.sub[t.k[0]], b=P.sub[t.k[1]];
      if(a===want.nc && b===want.na) return;
      P.bad["s"+t.k[0]]=P.bad["s"+t.k[1]]=true;
      if(!badSub){ subFault = want.cq*a===want.aq*b ? "reduce" : "balance";
        badSub = subFault==="reduce"
        ? "The charges balance, but the subscripts can be smaller."
        : "The charges don't balance yet."; }
    });
    if(badSub){ P.misses++; P.hint=badSub;
      logAttempt("products", ppAsked(), ppBuilt(), false, subFault, ppTry("products"));
      ppRender(); return; }
    var elt=pp.terms.filter(function(t){ return !t.c; })[0];
    if(elt && P.sub[elt.k[0]]!==elt.n){
      P.misses++; P.bad["s"+elt.k[0]]=true;
      P.hint="Not quite. Check the boxed subscript.";
      logAttempt("products", ppAsked(), ppBuilt(), false, "elsub", ppTry("products"));
      ppRender(); return;
    }
    logAttempt("products", ppAsked(), ppBuilt(), true, "", ppTry("products"));
    P.flip = o===1; P.beq=null;
    P.phase="balance"; P.ok=true; ppRender(); return;
  }

  /* coefficients: a blank means one, and a 1 is never written */
  [].forEach.call(document.querySelectorAll('.eq.pp .coef'),function(x){
    P.coef[+x.id.slice(2)]=x.value; });
  var fault=null, c=P.coef.map(function(v,i){
    v=(v||"").trim();
    if(v==="1"){ P.bad["c"+i]=true; fault="one"; return 1; }
    if(v==="") return 1;
    if(!/^\d+$/.test(v) || +v===0){ P.bad["c"+i]=true; fault=fault||"nan"; return 0; }
    return +v;
  });
  var coefTyped=coefText(ppBeq(), P.coef);
  if(fault){
    P.misses++;
    P.hint = fault==="one"
      ? "A coefficient of <b>1</b> is never written. Leave that space blank."
      : "A coefficient has to be a whole number.";
    logAttempt("balance", ppAsked(), coefTyped, false, fault, ppTry("balance"));
    ppRender(); return;
  }
  var eq=ppBeq(), g=groupsOf(eq), nr=eq.r.length;
  var off2=elementsOf(eq).filter(function(u){
    return sideCount(eq.r,c.slice(0,nr),u,g)!==sideCount(eq.p,c.slice(nr),u,g); });
  if(off2.length){
    P.misses++; P.unbal=off2; P.hint="Not balanced yet.";
    logAttempt("balance", ppAsked(), coefTyped, false, "unbal:"+off2.join(","), ppTry("balance"));
    ppRender(); return;
  }
  var g2=c.reduce(function(x,y){ return gcd(x,y); });
  if(g2>1){
    P.misses++;
    P.hint="Both sides match, but every coefficient can be divided by <b>"+g2+
           "</b>. Coefficients must be the smallest whole numbers that work.";
    logAttempt("balance", ppAsked(), coefTyped, false, "reduce", ppTry("balance"));
    ppRender(); return;
  }
  logAttempt("balance", ppAsked(), coefTyped, true, "", ppTry("balance"));
  P.phase="done";
  noteSolved(!P.misses);
  if(PUZZLE) B.earned = pzEarn() ? "full" : "one";
  track(actId(), P.misses===0);
  ppRender();
}

/* ── for the mistake report ── */
function ppTry(step){ P.tries[step]=(P.tries[step]||0)+1; return P.tries[step]; }
/* the reactants, as the report shows what was asked */
function ppAsked(){ return P.eq.r.join(" + ")+" \u2192"; }
/* the products as the student built them, e.g. "Zn(NO3)2 + Ag" */
function ppBuilt(){
  var pp=P.eq.pp;
  return pp.terms.map(function(t){
    return t.k.map(function(k){
      var s=P.slot[k]===null?"?":pp.tiles[P.slot[k]], n=P.sub[k];
      return n>1 ? (isPoly(s)?"("+s+")"+n:s+n) : s;
    }).join("");
  }).join(" + ");
}

/* ── placing pieces: drag with mouse or touch, or tap a piece then a box ── */
function ppPlace(t,k){
  var was=P.slot.indexOf(t); if(was>=0){ P.slot[was]=null; P.sub[was]=1; }
  P.slot[k]=t; P.sub[k]=1; P.sel=null; P.bad={}; P.hint=null; P.tip=null;
  ppRender();
}
function ppBoxAt(x,y){
  var el=document.elementFromPoint(x,y);
  return el ? el.closest(".ppbox") : null;
}
var PPD=null;   /* a drag in progress */
document.addEventListener("pointerdown",function(ev){
  if(!isPP() || P.phase!=="predict") return;
  var tile=ev.target.closest(".pptile"), box=ev.target.closest(".ppbox");
  if(tile && !tile.classList.contains("used")){
    PPD={t:+tile.dataset.t, x:ev.clientX, y:ev.clientY, ghost:null, src:tile};
    ev.preventDefault();
  } else if(box) PPD={slot:+box.dataset.slot};
});
document.addEventListener("pointermove",function(ev){
  if(!PPD || PPD.t===undefined) return;
  if(!PPD.ghost){
    if(Math.abs(ev.clientX-PPD.x)+Math.abs(ev.clientY-PPD.y)<7) return;
    var g=document.createElement("div");
    g.className="pptile ppghost"; g.innerHTML=PPD.src.innerHTML;
    document.body.appendChild(g); PPD.ghost=g;
    PPD.src.classList.add("lifted");
  }
  PPD.ghost.style.left=ev.clientX+"px"; PPD.ghost.style.top=ev.clientY+"px";
  var b=ppBoxAt(ev.clientX,ev.clientY);
  [].forEach.call(document.querySelectorAll(".ppbox.over"),function(x){
    if(x!==b) x.classList.remove("over"); });
  if(b) b.classList.add("over");
});
document.addEventListener("pointerup",function(ev){
  if(!PPD) return;
  var d=PPD; PPD=null;
  if(d.t!==undefined){
    if(d.ghost){
      d.ghost.remove();
      var b=ppBoxAt(ev.clientX,ev.clientY);
      if(b) ppPlace(d.t,+b.dataset.slot); else ppRender();
    } else { P.sel = P.sel===d.t ? null : d.t; ppRender(); }
    return;
  }
  var box=ppBoxAt(ev.clientX,ev.clientY);
  if(!box || +box.dataset.slot!==d.slot) return;
  if(P.sel!==null) ppPlace(P.sel,d.slot);
  else if(P.slot[d.slot]!==null){   /* tap a filled box to take the piece back */
    P.slot[d.slot]=null; P.sub[d.slot]=1; P.bad={}; P.hint=null; ppRender();
  }
});
document.addEventListener("pointercancel",function(){
  if(PPD && PPD.ghost) PPD.ghost.remove();
  PPD=null; if(isPP() && P.phase==="predict") ppRender();
});
document.addEventListener("click",function(ev){
  var t=ev.target.closest("[data-pp]");
  if(!t || t.disabled || !isPP()) return;
  if(t.dataset.pp==="cu"||t.dataset.pp==="cd"){
    var i=+t.dataset.t;
    P.chg[i]=Math.max(-4,Math.min(4,P.chg[i]+(t.dataset.pp==="cu"?1:-1)));
    P.bad={}; P.hint=null; P.tip=null; ppRender(); return;
  }
  var k=+t.dataset.k;
  P.sub[k]=Math.max(1,Math.min(9,P.sub[k]+(t.dataset.pp==="up"?1:-1)));
  P.bad={}; P.hint=null;
  ppRender();
});
document.addEventListener("input",function(ev){
  var r=/^pr(\d)$/.exec(ev.target.id||"");
  if(r && isPP()){
    if(/\d/.test(ev.target.value)){
      var re=ev.target, rpos=re.selectionStart;
      re.value=toSubs(re.value); re.setSelectionRange(rpos,rpos);
    }
    P.rep[+r[1]]=ev.target.value;
    var btn=document.querySelector('.check[data-b="go"]'); if(btn) btn.disabled=!ppReady();
    return;
  }
  var m=/^pc(\d+)$/.exec(ev.target.id||"");
  if(m && isPP()) P.coef[+m[1]]=ev.target.value;
});
/* ═══════════════════════════════════════════════════════════════
   PREDICTING PRODUCTS — FROM NAMES (23 Sept)
   The reactants arrive as names. For each compound the student types the
   symbol and charge of both ions, then its formula in a box beneath; a
   free element is just a formula box. Beginner: one reactant at a time,
   its ions checked before its formula. Advanced: everything at once, one
   Check. Short corrections only — no ladder, no columns, no board.
   Once every reactant is written it runs as From formulas, with the
   charges they typed already on the tiles.
   ═══════════════════════════════════════════════════════════════ */
function ppNames(){ return isPP() && L.src==="n"; }

var PNROMAN={1:"I",2:"II",3:"III",4:"IV"};
var PNANION={F:"fluoride",Cl:"chloride",Br:"bromide",I:"iodide",O:"oxide",S:"sulfide",N:"nitride"};
/* only groups 1 and 2 get "check which group" for a metal's charge */
var PNGROUP={Li:1,Na:1,K:1,Mg:2,Ca:2,Sr:2,Ba:2};

function pnAnName(s){ return isPoly(s) ? PNAME[s] : PNANION[s]; }
/* "iron(III)", "zinc" — the Roman numeral only on a metal with more than one ion */
function pnCatName(s,q){ return (s==="NH4"?"ammonium":eName(s))+(PPMV[s]?"("+PNROMAN[q]+")":""); }
/* the -ate, -ite or -ide ending in red: corrections only, never a prompt */
function pnRed(name){
  var m=/(ate|ite|ide)$/.exec(name);
  return m ? esc(name.slice(0,-3))+'<span class="pnend">'+m[1]+'</span>' : esc(name);
}

/* the reactants as the student has to write them, worked out once */
function pnItems(eq){
  if(eq.pn) return eq.pn;
  eq.pn=eq.r.map(function(f){
    var e=ppElem(f);
    if(e) return {el:true, f:f, sym:e.sym, name:eName(e.sym)};
    var c=ppSplit(f), q=ppCatQ(c);
    return {el:false, f:f, cat:c.cat, an:c.an, nc:c.nc, na:c.na, cq:q, aq:PPCH[c.an],
            name:pnCatName(c.cat,q)+" "+pnAnName(c.an)};
  });
  return eq.pn;
}
/* acids are left out of From names (his call, 23 Sept) */
function pnFits(eq){
  if(eq.pp.tiles.indexOf("H")>=0) return false;
  return pnItems(eq).every(function(it){
    return it.el ? !!ENAME[it.sym] : !!pnAnName(it.an) && it.cq>0 && !!ENAME[it.cat];
  });
}

/* ── where the student is ─────────────────────────────────────── */
function pnDone(i){
  var it=pnItems(P.eq)[i];
  return !!P.nm.ok[i+"f"] && (it.el || !!P.nm.ok[i+"ions"]);
}
function pnAt(){
  var n=pnItems(P.eq).length;
  for(var i=0;i<n;i++) if(!pnDone(i)) return i;
  return n;
}
/* the parts to check now: [item, "ions" | "f"] */
function pnLive(){
  var its=pnItems(P.eq), out=[];
  its.forEach(function(it,i){
    if(pnDone(i) || i!==pnAt()) return;
    var ionsOk=it.el || P.nm.ok[i+"ions"];
    if(!ionsOk) out.push([i,"ions"]);
    /* beginner: the formula only once its ions are right */
    if(ionsOk || L.level>0) out.push([i,"f"]);
  });
  return out;
}
function pnVal(id){ return P.nm.v[id]||""; }
function pnIds(x){
  var p="pn"+x[0];
  return x[1]==="ions" ? [p+"s0",p+"c0",p+"s1",p+"c1"] : [p+"f"];
}
function pnReady(){
  return pnLive().every(function(x){
    return pnIds(x).every(function(id){ return pnVal(id).trim()!==""; });
  });
}

function pnDiatomic(it){ return it.el && it.f!==it.sym; }

/* ── drawing ──────────────────────────────────────────────────── */
function pnLead(){
  var i=pnAt(), it=pnItems(P.eq)[i];
  /* an element that is one atom is a symbol, not a formula (24 Sept) */
  if(it.el) return pnDiatomic(it) ? "Write the formula for <b>"+esc(it.name)+"</b>."
                                  : "Enter the symbol of <b>"+esc(it.name)+"</b>.";
  if(L.level>0)
    return "Type the symbol and charge of each ion in <b>"+esc(it.name)+"</b>, then write its formula.";
  if(!P.nm.ok[i+"ions"])
    return "Type the symbol and charge of each ion in <b>"+esc(it.name)+"</b>.";
  return "Write the formula for <b>"+esc(it.name)+"</b>.";
}
function pnField(id, cls, ph, lab, locked){
  return '<input class="'+cls+(P.nm.bad[id]?" bad":"")+'" id="'+id+'" value="'+esc(pnVal(id))+
    '" placeholder="'+ph+'" autocomplete="off" spellcheck="false" maxlength="6" aria-label="'+esc(lab)+'"'+
    (locked?" disabled":"")+'>';
}
function pnIonHTML(i,k,locked){
  var p="pn"+i, lab=k?"Negative ion":"Positive ion";
  return '<div class="pnion"><span class="pnlab">'+lab+'</span>'+
    pnField(p+"s"+k,"pnsym","symbol",lab+" symbol",locked)+
    pnField(p+"c"+k,"pnchg","charge",lab+" charge",locked)+'</div>';
}
function pnCardsHTML(){
  var its=pnItems(P.eq), adv=L.level>0, h='<div class="pncards">';
  its.forEach(function(it,i){
    if(pnDone(i) || i!==pnAt()) return;
    var ionsOk=!!P.nm.ok[i+"ions"], id="pn"+i+"f", sym=it.el && !pnDiatomic(it);
    h+='<div class="pncard">';
    if(!it.el) h+='<div class="pnions">'+pnIonHTML(i,0,ionsOk)+pnIonHTML(i,1,ionsOk)+'</div>';
    if(it.el || ionsOk || adv)
      h+='<div class="pnfrow"><span class="pnlab">'+(sym?"Symbol":"Formula")+'</span>'+
        '<div class="finput'+(sym?" sym":"")+(P.nm.bad[id]?" bad":"")+'" id="'+id+'" contenteditable="true" '+
        'spellcheck="false" role="textbox" aria-label="'+(sym?"Symbol":"Formula")+' for '+esc(it.name)+'">'+
        subDigits(pnVal(id))+'</div></div>';
    h+='</div>';
  });
  return h+'</div>';
}
/* the first box that is wrong, or else the first empty one */
function pnFocus(){
  var all=[].slice.call(document.querySelectorAll(".pncards input:not([disabled]), .pncards .finput"));
  var f=all.filter(function(x){ return x.classList.contains("bad"); })[0] ||
        all.filter(function(x){ return !(x.value!==undefined ? x.value : x.textContent).trim(); })[0];
  if(!f) return;
  f.focus();
  if(f.select) f.select(); else pnCaret(f, f.textContent.length);
}

/* ── hints: never a miss ──────────────────────────────────────── */
