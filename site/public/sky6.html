<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Circles</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Varela+Round&display=swap">
<style>




:root {
  /* palette */
  --aero-forest: #12291F;      /* page background, all body text */
  --aero-emerald: #1E5E46;     /* primary actions, icons, links */
  --aero-emerald-dark: #12432F;
  --aero-jade: #5FA084;        /* fills, slider tracks, data series */
  --aero-mint: #D2E8DD;        /* soft surfaces, highlights, selected rows */
  --aero-gold: #E0B43C;        /* accent, vectors, warnings */
  --aero-mist: #EEF5F1;        /* sim stage on light, panel tint */
  --aero-muted: #3A5247;       /* secondary text on white */
  --aero-line: #BFDCCD;        /* borders, table rules */
  --aero-stage: #0B1C15;       /* behind videos / dark canvases */

  /* type */
  --aero-font-display: "Varela Round", "Lexend", sans-serif;
  --aero-font-body: "Lexend", system-ui, sans-serif;
  --aero-font-data: ui-monospace, "SFMono-Regular", Consolas, monospace;

  /* shape */
  --aero-radius: 24px;
  --aero-radius-sm: 12px;
  --aero-shadow: 0 12px 32px rgba(0, 0, 0, .35), inset 0 1px 0 #FFFFFF;
  --aero-focus: 0 0 0 3px #FFFFFF, 0 0 0 6px #12291F;

  color-scheme: light;
}

/* ---------- page ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  color: var(--aero-forest);
  font-family: var(--aero-font-body);
  font-size: 18px;
  line-height: 1.5;
  letter-spacing: .03em;
  word-spacing: .1em;
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .22) 0px, rgba(0, 0, 0, .22) 2px, transparent 2px, transparent 4px),
    var(--aero-forest);
  background-attachment: fixed;
}

h1, h2 { font-family: var(--aero-font-display); font-weight: 400; letter-spacing: .02em; text-transform: none; margin: 0 0 .4em; }
h1 { font-size: 2rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .3em; }
p { margin: 0 0 .8em; }
a { color: var(--aero-emerald); }
a:hover { color: var(--aero-forest); }
em, i { font-style: normal; font-weight: 600; } /* no italics, for readability */

.aero-muted { color: var(--aero-muted); }
.aero-data, code, pre, table, output, input[type=number] {
  font-family: var(--aero-font-data);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  word-spacing: 0;
}

/* ---------- surfaces ---------- */
.aero-panel, dialog {
  background: linear-gradient(180deg, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .9) 100%);
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: var(--aero-radius);
  box-shadow: var(--aero-shadow);
  padding: 20px 24px;
  color: var(--aero-forest);
}
.aero-bar {
  background: linear-gradient(180deg, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .9) 100%);
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: 20px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
  padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.aero-stage {
  background: var(--aero-stage);
  border-radius: var(--aero-radius);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 12px 32px rgba(0, 0, 0, .35);
  overflow: hidden;
}

/* ---------- buttons: light mint gel (default) ---------- */
button, .aero-btn {
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 8px 20px;
  border-radius: 999px;
  border: 1px solid #A8CDB9;
  color: var(--aero-forest);
  background: linear-gradient(180deg, #F8FBF9 0%, #E3F0E9 100%);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 8px rgba(18, 41, 31, .12);
  cursor: pointer;
  transition: background 120ms ease, box-shadow 120ms ease;
}
button:hover:not(:disabled), .aero-btn:hover:not(:disabled) {
  border-color: #7FB59A;
  background: linear-gradient(180deg, #FFFFFF 0%, #EAF5EF 100%);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 5px 12px rgba(18, 41, 31, .18);
}
button:active:not(:disabled), .aero-btn:active:not(:disabled) {
  border-color: #8FBFA6;
  background: #E0EEE6;
  box-shadow: inset 0 1px 2px rgba(18, 41, 31, .14), 0 2px 5px rgba(18, 41, 31, .1);
}

/* ---------- buttons: emerald gel (primary) ---------- */
.aero-btn-primary, button.primary, button[aria-pressed="true"] {
  color: #FFFFFF;
  font-weight: 700;
  border: 1px solid var(--aero-emerald-dark);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
  background: linear-gradient(180deg, #2E7357 0%, #1E5E46 50%, #19533E 51%, #1E5E46 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 4px 10px rgba(18, 67, 47, .3);
}
.aero-btn-primary:hover:not(:disabled), button.primary:hover:not(:disabled), button[aria-pressed="true"]:hover:not(:disabled) {
  border-color: var(--aero-emerald-dark);
  background: linear-gradient(180deg, #3A8264 0%, #26694F 50%, #1F5D46 51%, #26694F 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px rgba(18, 67, 47, .38);
}
.aero-btn-primary:active:not(:disabled), button.primary:active:not(:disabled), button[aria-pressed="true"]:active:not(:disabled) {
  background: linear-gradient(180deg, #1C5842 0%, #1E5E46 100%);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .25), 0 2px 5px rgba(18, 67, 47, .25);
}

/* ---------- disabled ---------- */
button:disabled, .aero-btn:disabled, .aero-btn-primary:disabled {
  cursor: not-allowed;
  opacity: 1;
  color: #5E7068;
  text-shadow: none;
  background: #D3DED8;
  border-color: #B3C4BB;
  box-shadow: none;
}

/* ---------- keyboard focus ---------- */
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible,
textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: none;
  box-shadow: var(--aero-focus) !important;
  border-radius: 999px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { border-radius: var(--aero-radius-sm); }

/* ---------- form controls ---------- */
select, input[type=text], input[type=number], textarea {
  font: inherit;
  color: var(--aero-forest);
  background: #FFFFFF;
  border: 1px solid var(--aero-line);
  border-radius: var(--aero-radius-sm);
  min-height: 40px;
  padding: 6px 10px;
}
input[type=range], input[type=checkbox], input[type=radio], progress { accent-color: var(--aero-emerald); }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; }
label { cursor: pointer; }

/* ---------- chips & readouts ---------- */
.aero-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, .85);
  border: 1px solid var(--aero-line);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.aero-chip-warn { background: #F8EDCB; border-color: var(--aero-gold); }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: right; font-weight: 600; color: var(--aero-muted); padding: 6px 10px; border-bottom: 1px solid var(--aero-line); background: #FFFFFF; }
td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--aero-line); }
tbody tr:hover td, tr.current td { background: var(--aero-mint); }

/* ---------- details / explainers ---------- */
details { border-top: 1px solid var(--aero-line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; color: var(--aero-emerald); }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Layout: the model fills the window, zoom controls float at the top right. Single AeroLab look. */
:root{color-scheme:light}
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;display:flex;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{flex:1 1 0;min-width:0;height:100%;position:relative;border-radius:var(--aero-radius-sm)}
#side{flex:0 0 48%;min-width:0;display:flex;flex-direction:column;gap:10px;padding:12px;border-radius:var(--aero-radius-sm)}
#view{flex:1 1 auto;min-height:0;width:100%;display:block;background:#000;border-radius:var(--aero-radius-sm)}
#side .group{display:flex;flex-wrap:wrap;gap:6px}
#side button{padding:6px 12px}
.speed{display:flex;align-items:center;gap:12px;font-weight:600}
.speed input{flex:1 1 auto;min-width:0}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block}
#sky:focus-visible{border-radius:0;box-shadow:none!important;outline:2px solid var(--aero-mint);outline-offset:-2px}
.zoom{position:absolute;top:8px;right:8px;padding:5px 7px;gap:5px}
.zoom button{padding:6px 16px}

/* Layout: the sky fills the whole window and controls float over it.
   Controls drop the AeroLab gel look for a compact dark panel that suits a night sky, keeping its emerald and mint. */
html,body{background:#000}
#app{position:relative;padding:0!important;gap:0!important;display:block!important;height:100%}
#stage{position:relative;width:100%;height:100%!important;border-radius:0!important;box-shadow:none!important;background:#000!important}
.ctl{position:absolute;z-index:5;top:10px;left:max(10px,env(safe-area-inset-left,0px));width:150px;max-height:calc(100% - 20px);display:flex;flex-direction:column;gap:5px;padding:7px!important;
  background:rgba(12,24,19,.86)!important;border:1px solid rgba(210,232,221,.22)!important;border-radius:10px!important;box-shadow:none!important;color:#E6F1EB;
  overflow-y:auto;letter-spacing:0;word-spacing:0;font-family:Helvetica,Arial,sans-serif;font-size:13px}
.ctl button{width:100%;min-height:26px;padding:1px 6px;font:500 13px Helvetica,Arial,sans-serif;letter-spacing:0;word-spacing:0;color:#E6F1EB;text-shadow:none;
  background:rgba(255,255,255,.09);border:1px solid rgba(210,232,221,.2);border-radius:6px;box-shadow:none}
.ctl button:hover:not(:disabled){background:rgba(255,255,255,.17);border-color:rgba(210,232,221,.4);box-shadow:none}
.ctl button:active:not(:disabled){background:rgba(255,255,255,.05);box-shadow:none}
.ctl button[aria-pressed="true"],.ctl button.primary{background:#2E7357;border-color:#5FA084;color:#fff;box-shadow:none}
.ctl button[aria-pressed="true"]:hover:not(:disabled),.ctl button.primary:hover:not(:disabled){background:#3A8264;border-color:#5FA084;box-shadow:none}
.ctl button:disabled{background:transparent;border-color:rgba(210,232,221,.1);color:rgba(230,241,235,.32)}
.ctl .aero-chip{justify-content:center;padding:1px 4px;font:600 13px Helvetica,Arial,sans-serif;letter-spacing:0;word-spacing:0;min-width:0!important;width:100%;white-space:nowrap;background:transparent;border:0;color:#fff}
.ctl input[type=range]{flex:0 0 auto!important;width:100%;height:20px!important;margin:0;accent-color:#5FA084}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.lbl{font-size:12px;font-weight:400;color:#A9C6B7;margin-top:3px}
.end{margin-top:5px}
/* one-row panel for the page where a column would cover the map */
.ctl.top{flex-direction:row;align-items:center;width:auto;flex-wrap:wrap;max-width:calc(100% - 20px);padding:5px 8px!important;gap:5px 8px}
.ctl.top .aero-chip{width:92px;flex:0 0 auto}
.ctl.top .lbl{margin-top:0}
.ctl.top .pair{flex:0 0 112px}
.ctl.top .pl{display:flex;gap:3px}
.ctl.top .pl button{width:82px}
/* Ptolemaic pages */
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl.wide{width:auto;right:8px;top:8px;max-height:none;overflow:visible}
.row{display:flex;gap:6px;align-items:center}
.row>button{flex:1 1 0;min-width:0}
.row>.aero-chip{width:auto;flex:0 0 auto;padding:1px 6px}
.row>.lbl{margin-top:0}
.row>input[type=range]{flex:1 1 0!important;width:auto;min-width:60px}
.row>button[data-b]{padding:1px 2px}
@media (max-width:760px){.ctl.wide{left:10px!important;top:auto;bottom:6px}}
</style>

<style id="notebook">
/* Astronomer's Notebook panels over the black sky */
:root{--paper:#F3EAD3;--sheet:#FFFBEF;--ink:#2A2118;--soft:#574832;--faint:#C9B98F;--accent:#8C3B22;--accent-dark:#6F2D19;--on-accent:#FFF8E8;--tint:#E7DABB;--nb-sans:"Source Sans 3","Helvetica Neue",Helvetica,Arial,sans-serif;--nb-serif:"Source Serif 4",Georgia,serif}

.ctl.top{padding:6px 10px!important}
.ctl button,.ctl button.primary{font:400 14px var(--nb-sans)!important;color:var(--ink)!important;background:transparent!important;border:1px solid var(--ink)!important;border-radius:8px!important;box-shadow:none!important;text-shadow:none!important}
.ctl button:hover:not(:disabled){background:var(--tint)!important;border-color:var(--ink)!important}
.ctl button[aria-pressed="true"],.ctl button.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--on-accent)!important;font-weight:600!important}
.ctl button[aria-pressed="true"]:hover:not(:disabled),.ctl button.primary:hover:not(:disabled){background:var(--accent-dark)!important;border-color:var(--accent-dark)!important}
.ctl button:disabled{background:transparent!important;border-color:var(--faint)!important;color:#8E7E62!important}
.ctl .aero-chip,.ctl .chip{font-family:var(--nb-serif)!important;font-weight:600!important;color:var(--ink)!important;font-size:15px;background:transparent!important}
.ctl.top .aero-chip{font-size:24px}
.ctl input[type=range]{accent-color:var(--accent)!important}
.ctl .lbl{color:var(--soft)!important;font-size:14px}
.ctl button{white-space:nowrap;padding:1px 4px!important}
.ctl.top .tm button{width:84px!important}
#sm{flex:0 0 158px!important}
#bigdate{position:absolute;z-index:4;color:#fff;pointer-events:none;font:600 40px/1.1 "Source Serif 4",Georgia,serif;text-shadow:0 1px 4px #000;top:8px;left:14px}
#bigdate small,#bigdate .tm2{display:inline;font:inherit;margin-left:.5em}
.ctl,.ctl.aero-panel{top:64px!important}
#bigdate{left:24px;top:20px}
.ctl,.ctl.aero-panel{left:24px!important;top:76px!important}
.ctl,.ctl.aero-panel{top:auto!important;left:auto!important;right:24px!important;bottom:24px!important}
</style>

    vx.restore();
  });
}
