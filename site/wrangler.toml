# The pages.dev site students and the teacher open.
# Its /api, /ws and /img requests are passed to the "class-live" Worker
# (in the server folder), which holds the lessons, votes and passcode.
name = "class-live"
pages_build_output_dir = "./public"
compatibility_date = "2026-06-01"

[[services]]
binding = "SERVER"
service = "class-live"
