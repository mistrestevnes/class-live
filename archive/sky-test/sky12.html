<section><h1>The Medieval Cosmos</h1><ul id="list">
<li hidden>The universe is divided into the Earthly realm and Heavenly realm.</li>
<li hidden>Things on Earth are subject to change and decay, and it sits motionless at the center of the universe.</li>
<li hidden>Heavenly objects are perfect and unchanging, and move in perfect circles around the Earth.</li>
</ul><button id="next">Next</button></section>

<script>
var items=document.querySelectorAll("#list li"),btn=document.getElementById("next"),shown=0,inClass=window.parent!==window;
function show(n){shown=n;items.forEach(function(li,i){li.hidden=i>=n;});btn.disabled=n>=items.length;}
btn.onclick=function(){var n=Math.min(items.length,shown+1);if(inClass) window.parent.postMessage({type:"points",n:n},location.origin);else show(n);};
if(inClass) btn.hidden=true;
window.addEventListener("message",function(e){var m=e.data;if(!m||m.type!=="zodiac"||e.source!==window.parent)return;show(m.points||0);btn.hidden=!(m.teacher||m.free);});
show(0);
</script>
