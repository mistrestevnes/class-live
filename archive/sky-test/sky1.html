<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>[hidden]{display:none!important}</style>
<title>Turning Sky</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Varela+Round&display=swap">
<style>




:root {
  /* palette */
  --aero-forest: #12291F;      /* page background, all body text */
  --aero-emerald: #1E5E46;     /* primary actions, icons, links */
  --aero-emerald-dark: #12432F;
  --aero-jade: #5FA084;        /* fills, slider tracks, data series */
  --aero-mint: #D2E8DD;        /* soft surfaces, highlights, selected rows */
  --aero-gold: #E0B43C;        /* accent, vectors, warnings */
  --aero-mist: #EEF5F1;        /* sim stage on light, panel tint */
  --aero-muted: #3A5247;       /* secondary text on white */
  --aero-line: #BFDCCD;        /* borders, table rules */
  --aero-stage: #0B1C15;       /* behind videos / dark canvases */

  /* type */
  --aero-font-display: "Varela Round", "Lexend", sans-serif;
  --aero-font-body: "Lexend", system-ui, sans-serif;
  --aero-font-data: ui-monospace, "SFMono-Regular", Consolas, monospace;

  /* shape */
  --aero-radius: 24px;
  --aero-radius-sm: 12px;
  --aero-shadow: 0 12px 32px rgba(0, 0, 0, .35), inset 0 1px 0 #FFFFFF;
  --aero-focus: 0 0 0 3px #FFFFFF, 0 0 0 6px #12291F;

  color-scheme: light;
}

/* ---------- page ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { font-size: 17px; }
body {
  margin: 0;
  color: var(--aero-forest);
  font-family: var(--aero-font-body);
  font-size: 18px;
  line-height: 1.5;
  letter-spacing: .03em;
  word-spacing: .1em;
  background:
    repeating-linear-gradient(180deg, rgba(0, 0, 0, .22) 0px, rgba(0, 0, 0, .22) 2px, transparent 2px, transparent 4px),
    var(--aero-forest);
  background-attachment: fixed;
}

h1, h2 { font-family: var(--aero-font-display); font-weight: 400; letter-spacing: .02em; text-transform: none; margin: 0 0 .4em; }
h1 { font-size: 2rem; }
h2 { font-size: 1.4rem; }
h3 { font-size: 1.1rem; font-weight: 600; margin: 0 0 .3em; }
p { margin: 0 0 .8em; }
a { color: var(--aero-emerald); }
a:hover { color: var(--aero-forest); }
em, i { font-style: normal; font-weight: 600; } /* no italics, for readability */

.aero-muted { color: var(--aero-muted); }
.aero-data, code, pre, table, output, input[type=number] {
  font-family: var(--aero-font-data);
  font-variant-numeric: tabular-nums;
  letter-spacing: 0;
  word-spacing: 0;
}

/* ---------- surfaces ---------- */
.aero-panel, dialog {
  background: linear-gradient(180deg, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .9) 100%);
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: var(--aero-radius);
  box-shadow: var(--aero-shadow);
  padding: 20px 24px;
  color: var(--aero-forest);
}
.aero-bar {
  background: linear-gradient(180deg, rgba(255, 255, 255, .97) 0%, rgba(255, 255, 255, .9) 100%);
  border: 1px solid rgba(255, 255, 255, .85);
  border-radius: 20px;
  box-shadow: 0 8px 22px rgba(0, 0, 0, .3);
  padding: 10px 16px;
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
}
.aero-stage {
  background: var(--aero-stage);
  border-radius: var(--aero-radius);
  box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .08), 0 12px 32px rgba(0, 0, 0, .35);
  overflow: hidden;
}

/* ---------- buttons: light mint gel (default) ---------- */
button, .aero-btn {
  font: inherit;
  font-weight: 600;
  min-height: 44px;
  padding: 8px 20px;
  border-radius: 999px;
  border: 1px solid #A8CDB9;
  color: var(--aero-forest);
  background: linear-gradient(180deg, #F8FBF9 0%, #E3F0E9 100%);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 3px 8px rgba(18, 41, 31, .12);
  cursor: pointer;
  transition: background 120ms ease, box-shadow 120ms ease;
}
button:hover:not(:disabled), .aero-btn:hover:not(:disabled) {
  border-color: #7FB59A;
  background: linear-gradient(180deg, #FFFFFF 0%, #EAF5EF 100%);
  box-shadow: inset 0 1px 0 #FFFFFF, 0 5px 12px rgba(18, 41, 31, .18);
}
button:active:not(:disabled), .aero-btn:active:not(:disabled) {
  border-color: #8FBFA6;
  background: #E0EEE6;
  box-shadow: inset 0 1px 2px rgba(18, 41, 31, .14), 0 2px 5px rgba(18, 41, 31, .1);
}

/* ---------- buttons: emerald gel (primary) ---------- */
.aero-btn-primary, button.primary, button[aria-pressed="true"] {
  color: #FFFFFF;
  font-weight: 700;
  border: 1px solid var(--aero-emerald-dark);
  text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
  background: linear-gradient(180deg, #2E7357 0%, #1E5E46 50%, #19533E 51%, #1E5E46 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 4px 10px rgba(18, 67, 47, .3);
}
.aero-btn-primary:hover:not(:disabled), button.primary:hover:not(:disabled), button[aria-pressed="true"]:hover:not(:disabled) {
  border-color: var(--aero-emerald-dark);
  background: linear-gradient(180deg, #3A8264 0%, #26694F 50%, #1F5D46 51%, #26694F 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45), 0 6px 14px rgba(18, 67, 47, .38);
}
.aero-btn-primary:active:not(:disabled), button.primary:active:not(:disabled), button[aria-pressed="true"]:active:not(:disabled) {
  background: linear-gradient(180deg, #1C5842 0%, #1E5E46 100%);
  box-shadow: inset 0 1px 3px rgba(0, 0, 0, .25), 0 2px 5px rgba(18, 67, 47, .25);
}

/* ---------- disabled ---------- */
button:disabled, .aero-btn:disabled, .aero-btn-primary:disabled {
  cursor: not-allowed;
  opacity: 1;
  color: #5E7068;
  text-shadow: none;
  background: #D3DED8;
  border-color: #B3C4BB;
  box-shadow: none;
}

/* ---------- keyboard focus ---------- */
button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible,
textarea:focus-visible, summary:focus-visible, [tabindex]:focus-visible {
  outline: none;
  box-shadow: var(--aero-focus) !important;
  border-radius: 999px;
}
input:focus-visible, select:focus-visible, textarea:focus-visible { border-radius: var(--aero-radius-sm); }

/* ---------- form controls ---------- */
select, input[type=text], input[type=number], textarea {
  font: inherit;
  color: var(--aero-forest);
  background: #FFFFFF;
  border: 1px solid var(--aero-line);
  border-radius: var(--aero-radius-sm);
  min-height: 40px;
  padding: 6px 10px;
}
input[type=range], input[type=checkbox], input[type=radio], progress { accent-color: var(--aero-emerald); }
input[type=checkbox], input[type=radio] { width: 20px; height: 20px; }
label { cursor: pointer; }

/* ---------- chips & readouts ---------- */
.aero-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px;
  border-radius: 18px;
  background: rgba(255, 255, 255, .85);
  border: 1px solid var(--aero-line);
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}
.aero-chip-warn { background: #F8EDCB; border-color: var(--aero-gold); }

/* ---------- tables ---------- */
table { width: 100%; border-collapse: collapse; font-size: .9rem; }
th { text-align: right; font-weight: 600; color: var(--aero-muted); padding: 6px 10px; border-bottom: 1px solid var(--aero-line); background: #FFFFFF; }
td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--aero-line); }
tbody tr:hover td, tr.current td { background: var(--aero-mint); }

/* ---------- details / explainers ---------- */
details { border-top: 1px solid var(--aero-line); padding-top: 10px; }
summary { cursor: pointer; font-weight: 600; color: var(--aero-emerald); }

/* ---------- motion ---------- */
@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}

/* Layout: the sky fills the window, one control bar below. Single AeroLab look. */
:root{color-scheme:light}
html,body{height:100%}
body{overflow:hidden}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#stage{flex:1 1 auto;min-height:0;position:relative;border-radius:var(--aero-radius-sm)}
#sky{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#sky.drag{cursor:grabbing}
#sky:focus-visible{border-radius:0;box-shadow:none!important;outline:2px solid var(--aero-mint);outline-offset:-2px}
.aero-bar{flex:0 0 auto;padding:6px 12px;gap:6px 10px}
.aero-bar button{padding:6px 16px}
.group{display:flex;gap:4px}
.spacer{flex:1 1 auto}
#play{min-width:92px}
.aero-chip{white-space:nowrap}
#clock{min-width:108px;justify-content:center}
#dayn{min-width:96px;justify-content:center}

/* Layout: the sky fills the whole window and controls float over it.
   Controls drop the AeroLab gel look for a compact dark panel that suits a night sky, keeping its emerald and mint. */
html,body{background:#000}
#app{position:relative;padding:0!important;gap:0!important;display:block!important;height:100%}
#stage{position:relative;width:100%;height:100%!important;border-radius:0!important;box-shadow:none!important;background:#000!important}
.ctl{position:absolute;z-index:5;top:10px;left:max(10px,env(safe-area-inset-left,0px));width:150px;max-height:calc(100% - 20px);display:flex;flex-direction:column;gap:5px;padding:7px!important;
  background:rgba(12,24,19,.86)!important;border:1px solid rgba(210,232,221,.22)!important;border-radius:10px!important;box-shadow:none!important;color:#E6F1EB;
  overflow-y:auto;letter-spacing:0;word-spacing:0;font-family:Helvetica,Arial,sans-serif;font-size:13px}
.ctl button{width:100%;min-height:26px;padding:1px 6px;font:500 13px Helvetica,Arial,sans-serif;letter-spacing:0;word-spacing:0;color:#E6F1EB;text-shadow:none;
  background:rgba(255,255,255,.09);border:1px solid rgba(210,232,221,.2);border-radius:6px;box-shadow:none}
.ctl button:hover:not(:disabled){background:rgba(255,255,255,.17);border-color:rgba(210,232,221,.4);box-shadow:none}
.ctl button:active:not(:disabled){background:rgba(255,255,255,.05);box-shadow:none}
.ctl button[aria-pressed="true"],.ctl button.primary{background:#2E7357;border-color:#5FA084;color:#fff;box-shadow:none}
.ctl button[aria-pressed="true"]:hover:not(:disabled),.ctl button.primary:hover:not(:disabled){background:#3A8264;border-color:#5FA084;box-shadow:none}
.ctl button:disabled{background:transparent;border-color:rgba(210,232,221,.1);color:rgba(230,241,235,.32)}
.ctl .aero-chip{justify-content:center;padding:1px 4px;font:600 13px Helvetica,Arial,sans-serif;letter-spacing:0;word-spacing:0;min-width:0!important;width:100%;white-space:nowrap;background:transparent;border:0;color:#fff}
.ctl input[type=range]{flex:0 0 auto!important;width:100%;height:20px!important;margin:0;accent-color:#5FA084}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:3px}
.lbl{font-size:12px;font-weight:400;color:#A9C6B7;margin-top:3px}
.end{margin-top:5px}
/* one-row panel for the page where a column would cover the map */
.ctl.top{flex-direction:row;align-items:center;width:auto;flex-wrap:wrap;max-width:calc(100% - 20px);padding:5px 8px!important;gap:5px 8px}
.ctl.top .aero-chip{width:92px;flex:0 0 auto}
.ctl.top .lbl{margin-top:0}
.ctl.top .pair{flex:0 0 112px}
.ctl.top .pl{display:flex;gap:3px}
.ctl.top .pl button{width:82px}
/* Ptolemaic pages */
#view{position:absolute;inset:0;width:100%;height:100%;display:block}
.ctl.wide{width:auto;right:8px;top:8px;max-height:none;overflow:visible}
.row{display:flex;gap:6px;align-items:center}
.row>button{flex:1 1 0;min-width:0}
.row>.aero-chip{width:auto;flex:0 0 auto;padding:1px 6px}
.row>.lbl{margin-top:0}
.row>input[type=range]{flex:1 1 0!important;width:auto;min-width:60px}
.row>button[data-b]{padding:1px 2px}
@media (max-width:760px){.ctl.wide{left:10px!important;top:auto;bottom:6px}}
</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:wght@400;600&family=Source+Sans+3:wght@400;600&display=swap">
<style id="notebook">
/* Astronomer's Notebook panels over the black sky */
:root{--paper:#F3EAD3;--sheet:#FFFBEF;--ink:#2A2118;--soft:#574832;--faint:#C9B98F;--accent:#8C3B22;--accent-dark:#6F2D19;--on-accent:#FFF8E8;--tint:#E7DABB;--nb-sans:"Source Sans 3","Helvetica Neue",Helvetica,Arial,sans-serif;--nb-serif:"Source Serif 4",Georgia,serif}
.ctl,.ctl.aero-panel{background:var(--paper)!important;border:0!important;border-radius:14px!important;box-shadow:0 6px 18px rgba(0,0,0,.45)!important;color:var(--ink)!important;font-family:var(--nb-sans)!important;font-size:14px!important;padding:9px!important}
.ctl.top{padding:6px 10px!important}
.ctl button,.ctl button.primary{font:400 14px var(--nb-sans)!important;color:var(--ink)!important;background:transparent!important;border:1px solid var(--ink)!important;border-radius:8px!important;box-shadow:none!important;text-shadow:none!important}
.ctl button:hover:not(:disabled){background:var(--tint)!important;border-color:var(--ink)!important}
.ctl button[aria-pressed="true"],.ctl button.primary{background:var(--accent)!important;border-color:var(--accent)!important;color:var(--on-accent)!important;font-weight:600!important}
.ctl button[aria-pressed="true"]:hover:not(:disabled),.ctl button.primary:hover:not(:disabled){background:var(--accent-dark)!important;border-color:var(--accent-dark)!important}
.ctl button:disabled{background:transparent!important;border-color:var(--faint)!important;color:#8E7E62!important}
.ctl .aero-chip,.ctl .chip{font-family:var(--nb-serif)!important;font-weight:600!important;color:var(--ink)!important;font-size:15px;background:transparent!important}
.ctl.top .aero-chip{font-size:24px}
.ctl input[type=range]{accent-color:var(--accent)!important}
.ctl .lbl{color:var(--soft)!important;font-size:14px}
.ctl button{white-space:nowrap;padding:1px 4px!important}
.ctl.top .tm button{width:84px!important}
#sm{flex:0 0 158px!important}
.ctl,.ctl.aero-panel{top:auto!important;bottom:10px;left:10px;width:auto;max-width:calc(100% - 494px);flex-direction:row;flex-wrap:wrap;align-items:center;gap:6px 8px}
.ctl .aero-chip{width:auto!important;flex:0 0 auto}
.ctl input[type=range]{width:130px!important}
.ctl #hour{width:170px!important}
.ctl button{width:auto;padding:1px 10px!important;min-height:30px}
.ctl .pair{display:flex;gap:3px}
.ctl .lbl{margin:0}
.end{margin:0}
.ctl [hidden]{display:none!important}
.ctl.zod{max-width:370px}
.ctl.zod #hour{width:340px!important}
.ctl.zod #tspeed{width:190px!important}
.ctl.zod .pair,.ctl.zod #reset{display:none}
@media (max-width:1000px){.ctl,.ctl.aero-panel{max-width:calc(100% - 20px)}}
#bigdate{position:absolute;z-index:4;color:#fff;pointer-events:none;font:600 40px/1.1 "Source Serif 4",Georgia,serif;text-shadow:0 1px 4px #000;top:6px;left:0;right:0;text-align:center}
#bigdate small,#bigdate .tm2{display:inline;font:inherit;margin-left:.5em}
.ctl,.ctl.aero-panel{left:auto!important;right:24px!important;bottom:24px;max-width:calc(100% - 48px)}
.ctl.zod{left:24px!important;right:auto!important}
.ctl:not(.zod) #hour,.ctl #reset,#bigdate:not(.zod) #dayn{display:none!important}
</style>
</head>
<body>
<div id="app">
  <div id="bigdate"><span id="dayn"></span><span id="clock" class="tm2"></span></div>
  <div class="ctl aero-panel" role="toolbar" aria-label="Sky controls">
    
    
    <input type="range" id="hour" min="0" max="23.95" step="0.05" value="4.5" aria-label="Time of day">
    <button id="play" class="primary">Play</button><label class="lbl" for="tspeed">Speed</label><input type="range" id="tspeed" min="0" max="100" value="50"><span class="aero-chip" id="trate"></span>
    <div class="pair"><button id="vwWide" data-vw="wide" aria-pressed="true">Wide</button><button id="vwNormal" data-vw="normal" aria-pressed="false">Normal</button></div>
    <button id="con" aria-pressed="false" hidden>Constellations</button><button id="zbtn" hidden>Show the zodiac</button>
    <button id="reset" class="end">Start over</button>
    <div hidden><button id="spDay" data-sp="day" aria-pressed="true">Day</button><button id="spMonth" data-sp="month">Month</button><button id="spYear" data-sp="year">Year</button><button id="trail">t</button><button id="names" aria-pressed="true">n</button><button id="daylight" aria-pressed="true">d</button></div>
  </div>
  <div id="stage" class="aero-stage"><canvas id="sky" tabindex="0" aria-label="The sky seen from the ground. Drag to look around."></canvas></div>
</div>

    ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(Q[0],Q[1],70,0,6.3); ctx.fill();
    ctx.fillStyle="rgb("+sc+")"; ctx.beginPath(); ctx.arc(Q[0],Q[1],14,0,6.3); ctx.fill();
  }
  /* ground: everything outside the horizon circle (a true circle in this projection) */
  var ca=Math.max(0.6,st.camAlt)*rad, Yf=-Math.tan(ca/2)*s, Yb=s/Math.tan(ca/2);
  var yc=H*0.5-(Yf+Yb)/2, rr=(Yb-Yf)/2;
  var gc=mix([12,20,16],[64,104,70],Math.max(light,0.08));
  ctx.fillStyle=rgb(gc); ctx.beginPath(); ctx.rect(0,0,W,H);
  ctx.arc(W/2,yc,rr,0,6.2832,true); ctx.fill("evenodd");
  /* land: hazy far hills, nearer hills, then trees. Moonlight and day brighten it. */
  var mUp=Math.max(0,me[2]),c1=b.moon[0]*b.sun[0]+b.moon[1]*b.sun[1]+b.moon[2]*b.sun[2],lit=Math.max(light,.08)+.1*mUp*(1-c1)/2;
  var hc=[50+126*light,64+146*light,106+126*light],V=[0,0,0];
  function pt(az,alt){dirVec(az,alt,V);if(!proj(V,Q)) return null;return [Q[0],Q[1]];}
  var fc=mix([30,42,40],[150,176,170],lit),mc=mix([24,36,30],[98,132,104],lit),nc=mix([18,30,23],[36,62,42],lit);
  drawLand(pt,st.camAz,rgb(mix(fc,hc.map(Math.round),.25*light)),rgb(mc),rgb(nc));
  /* compass */
  [["N",0],["NE",45],["E",90],["SE",135],["S",180],["SW",225],["W",270],["NW",315]].forEach(function(c){
    dirVec(c[1],-1.5,V); if(proj(V,Q)&&Q[2]>-0.3&&Q[0]>0&&Q[0]<W){
      ctx.font="400 14px Helvetica, Arial, sans-serif";
      pill(c[0],Q[0]-ctx.measureText(c[0]).width/2-9,Q[1],true);
    }
  });
  if(st.con&&starA>0.02) CONN.forEach(function(c){enu(c.v,P);if(P[2]>0.06&&proj(P,Q)&&Q[0]>30&&Q[0]<W-30&&Q[1]>12&&Q[1]<H-12) skyText(c.n,Q[0],Q[1],"rgba(190,216,240,"+(0.85*starA)+")","center");});
  if(st.names) labels.forEach(function(l){ if(l[1]>-60&&l[1]<W&&l[2]>-40&&l[2]<H) skyText(l[0],l[1],l[2]+14,"#FFFFFF","left");});
}

function fmt(h){
  var m=Math.floor((h%1)*60/5)*5, H24=Math.floor(h)%24, ap=H24<12?"AM":"PM", H12=H24%12||12;
  return H12+":"+(m<10?"0":"")+m+" "+ap;
}
var dayEl=document.getElementById("dayn"),clockEl=document.getElementById("clock");
function readout(){ dayEl.textContent=new Date(Date.UTC(2026,10,1)+Math.floor(st.day)*864e5).toLocaleDateString("en-US",{month:"short",day:"numeric",year:"numeric",timeZone:"UTC"}); clockEl.textContent=fmt(st.hour); var h=document.getElementById("hour"); if(h&&document.activeElement!==h) h.value=st.zod?st.day:st.hour; }
function addTrail(){
  var d=Math.floor(st.day);
  if(d===lastTrailDay) return; lastTrailDay=d;
  var D=currentD(),T=D/36525,E=helio("Earth",T),h=helio("Mars",T);
  trail.push(toEq([h[0]-E[0],h[1]-E[1],h[2]-E[2]]));
}
function step(dt){
  if(st.zod){st.day+=zRate*dt;if(st.day>=365)st.day-=365;st.hour=0;}
  else if(st.speed==="day"){
    st.hour+=rate*dt;
    while(st.hour>=24){st.hour-=24;st.day+=1;}
  } else {
    st.hour=NIGHT_HOUR; st.day+=RATE[st.speed]*dt;
  }
  if(st.trailOn) addTrail();
}
var rate=24/DAY_SECONDS;   /* clock hours per real second */
var zAnim=null;
var last=0;
function loop(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  if(zAnim){zAnim.t=Math.min(1,zAnim.t+dt/2);var e=zAnim.t*zAnim.t*(3-2*zAnim.t);zt=zAnim.to?e:1-e;
    st.camAz=zAnim.az0+zAnim.daz*e;st.camAlt=zAnim.alt0+(zAnim.alt1-zAnim.alt0)*e;s=sNorm+(sAll-sNorm)*zt;draw();if(zAnim.t>=1)zAnim=null;}
  if(st.playing){ step(dt); draw(); readout(); }
  requestAnimationFrame(loop);
}

/* controls */
var $=function(id){return document.getElementById(id);};
function press(el,on){el.setAttribute("aria-pressed",on?"true":"false");}
function setPlay(on){st.playing=on; $("play").textContent=on?"Pause":"Play";}
function setSpeed(sp){
  st.speed=sp;
  document.querySelectorAll("[data-sp]").forEach(function(b){press(b,b.dataset.sp===sp);});
  if(sp!=="day"){st.hour=NIGHT_HOUR;}
  draw();readout();
}
$("play").addEventListener("click",function(){setPlay(!st.playing);});
document.querySelectorAll("[data-sp]").forEach(function(b){b.addEventListener("click",function(){setSpeed(b.dataset.sp);});});
function setView(vw){
  st.view=vw;
  document.querySelectorAll("[data-vw]").forEach(function(b){press(b,b.dataset.vw===vw);});
  resize();draw();
}
document.querySelectorAll("[data-vw]").forEach(function(b){b.addEventListener("click",function(){setView(b.dataset.vw);});});
$("trail").addEventListener("click",function(){
  st.trailOn=!st.trailOn; press(this,st.trailOn); trail=[]; lastTrailDay=-1; if(st.trailOn) addTrail(); draw();
});
$("con").addEventListener("click",function(){st.con=!st.con;press(this,st.con);draw();});
$("names").addEventListener("click",function(){st.names=!st.names;press(this,st.names);draw();});
$("daylight").addEventListener("click",function(){st.daylight=!st.daylight;press(this,st.daylight);draw();});
$("reset").addEventListener("click",function(){
  var nm=st.names,dl=st.daylight,vw=st.view,cn=st.con; st=Object.assign({},S0,{names:nm,daylight:dl,view:vw,con:cn}); trail=[]; lastTrailDay=-1;
  setPlay(false); press($("trail"),false); setSpeed("day");
});
var drag=null;
cv.addEventListener("pointerdown",function(e){if(st.zod)return;drag={x:e.clientX,y:e.clientY,az:st.camAz,alt:st.camAlt};cv.setPointerCapture(e.pointerId);cv.classList.add("drag");});
cv.addEventListener("pointermove",function(e){
  if(!drag) return;
  var k=2*Math.atan(1/s*1)*deg;
  st.camAz=((drag.az-(e.clientX-drag.x)*k)%360+360)%360;
  st.camAlt=Math.max(0,Math.min(85,drag.alt+(e.clientY-drag.y)*k));
  if(!st.playing) draw();
});
function endDrag(){drag=null;cv.classList.remove("drag");}
cv.addEventListener("pointerup",endDrag); cv.addEventListener("pointercancel",endDrag);
cv.addEventListener("keydown",function(e){
  var m={ArrowLeft:[-5,0],ArrowRight:[5,0],ArrowUp:[0,5],ArrowDown:[0,-5]}[e.key]; if(!m) return;
  e.preventDefault(); st.camAz=(st.camAz+m[0]+360)%360; st.camAlt=Math.max(0,Math.min(85,st.camAlt+m[1])); if(!st.playing) draw();
});
document.getElementById("hour").addEventListener("input",function(){if(st.zod){st.day=+this.value;draw();readout();return;}st.hour=+this.value;draw();clockEl.textContent=fmt(st.hour);});
function setRate(){if(st.zod){zRate=0.5*Math.pow(60,+$("tspeed").value/100);$("trate").textContent=(zRate<10?zRate.toFixed(1):Math.round(zRate))+" days per second";return;}rate=0.1*Math.pow(40,+$("tspeed").value/100);var m=rate*60;$("trate").textContent=(m<60?Math.round(m)+" min":(m/60).toFixed(1)+" hr")+" per second";}
$("tspeed").addEventListener("input",setRate);
function setZod(on){
  if(!!st.zod===on) return;
  var h=$("hour");setPlay(false);
  var az0=st.camAz,alt0=st.camAlt,az1,alt1;
  if(on){zSave={hour:st.hour,day:st.day,az:st.camAz,alt:st.camAlt};st.zod=true;st.con=true;st.hour=0;st.day=Math.floor(st.day);az1=180;alt1=55;h.min=0;h.max=365;h.step=1;h.value=st.day;}
  else{st.zod=false;st.con=false;st.hour=zSave.hour;st.day=zSave.day;az1=zSave.az;alt1=zSave.alt;h.min=0;h.max=23.95;h.step=.05;h.value=st.hour;}
  zAnim={t:0,to:on,az0:az0,daz:((az1-az0+540)%360)-180,alt0:alt0,alt1:alt1};
  document.querySelector(".ctl").classList.toggle("zod",on);$("bigdate").classList.toggle("zod",on);$("zbtn").textContent=on?"Back to the horizon":"Show the zodiac";
  setRate();draw();readout();
}
$("zbtn").addEventListener("click",function(){setZod(!st.zod);});
window.addEventListener("message",function(e){var m=e.data;if(!m||m.type!=="zodiac"||e.source!==window.parent)return;
  zFree=m.free;$("zbtn").hidden=!zFree;if(m.on!==lastZ){lastZ=m.on;setZod(!!m.on);}});
var lastZ=false;

function fit(){resize();draw();}
window.addEventListener("resize",fit);
if(window.ResizeObserver) new ResizeObserver(fit).observe(cv);
window._sky={get st(){return st;},bodies:bodies,draw:draw,readout:readout,step:step,enu:enu,setFrame:setFrame,trail:function(){return trail;},addTrail:addTrail,
  look:function(az,alt){st.camAz=az;st.camAlt=alt;draw();},jump:function(day,hour){st.day=day;st.hour=hour;draw();readout();}};
setRate(); fit(); readout();
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(draw);
requestAnimationFrame(function(n){last=n;loop(n);});
})();
</script>

<style>#bigdate{left:auto!important;top:auto!important;width:auto!important;text-align:right!important;white-space:nowrap}</style>
<script>
/* Date and time sit at the bottom right, just left of the controls (above them when the screen is narrow). */
(function(){var d=document.getElementById("bigdate"),c=document.querySelector(".ctl");if(!d||!c)return;
function place(){var p=d.offsetParent||document.body,pr=p.getBoundingClientRect(),cr=c.getBoundingClientRect(),dw=d.offsetWidth,dh=d.offsetHeight,g=16;
d.style.left="auto";d.style.top="auto";
if(cr.left-pr.left-g-dw>=10){d.style.right=(pr.right-cr.left+g)+"px";d.style.bottom=(pr.bottom-cr.bottom+(cr.height-dh)/2)+"px";}
else{d.style.right=(pr.right-cr.right)+"px";d.style.bottom=(pr.bottom-cr.top+8)+"px";}}
place();addEventListener("resize",place);if(window.ResizeObserver){var o=new ResizeObserver(place);o.observe(d);o.observe(c);}
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(place);})();
</script>
